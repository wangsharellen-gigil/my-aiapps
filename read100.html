The cumulative lesson of all this recollection is that, in commemorating the past, we may not like all that it calls attention to in the present.","There are other contexts worth considering at this moment. The semiquincentennial inherently underscores the comparative youth of the United States; Italy, Greece, China, and India count their historic legacies in millennia, not centuries. At the same time, the past two hundred and fifty years of popular self-government represent a global milestone: the Declaration of Independence marks the birth of the world’s oldest constitutional democracy. Those divergent truths point to the sober reality that the vast majority of people who have existed on this planet lived under some form of tyranny. The events of July 4, 1776, signalled a partial departure from a miserably well-worn path in human history. In that light, two hundred and fifty years seems like a very long time.","The meaning of the Declaration was not entirely clear at the outset, even to those who wrote or signed it. With the haphazard spelling of the era, the signers refer to themselves in the final paragraph of the document as “Representatives of the united States.” The use of the lowercase with the word “united” suggests that it is serving as an adjective, not as a herald of the new nation’s name. (A subsequent line refers to the confederation as “United Colonies”—there were still things to be ironed out.) Notably, it was not until after the end of the Civil War that American grammar reliably described the United States in the singular: “the United States is” rather than “the United States are.” Other editorial decisions in the founding document were less ambiguous. Jefferson’s first draft contained a hundred-and-sixty-eight-word denunciation of the transatlantic slave trade, which was excised from the final text. A seed of conflict was sown in that moment.","Donald Trump’s personal aversion to admitting fault suggests that we will not likely see commemorations that grapple with the nuanced, complicated nature of the country’s founding and subsequent history this Fourth of July. What is more likely is that, fifty years hence, Americans will observe that this anniversary took place during a polarizing time, but that such circumstances were not unprecedented. One version of the nation’s history anchors itself in the efforts to navigate those tempests, to better the imperfect tools bequeathed to us by imperfect men. This more mature approach to our past recognizes that national greatness does not exist without a simultaneous reckoning with national failure—and that this undertaking, rather than diminishing American standing, is the surest path toward a country where “united” is as much an aspiration as an adjective. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.05.16","day":41,"title":"Prepare for an AI jobs apocalypse","source":"The Economist","minutes":6,"tag":"Leaders","dek":"It is not here yet. But governments should lay a safety-net","note":"2026.05.16","paragraphs":["The launch of ChatGPT in 2022 ignited the artificial-intelligence boom—and elicited a chorus of warnings from AI bosses of an impending jobs apocalypse. Never mind that they have reason to talk up the disruptiveness of their products, or that rich-world employment is near all-time highs—the dark message has landed. Seven in ten Americans think AI will make it harder for people to find work; nearly a third fear for their own jobs. A dearth of openings for college graduates—especially computer programmers—amplifies the dread.","The past offers some solace for the anxious. Labour markets constantly change. Today’s offices would be unrecognisable to a worker from 50 years ago. Never in modern history has technological progress hurt the overall demand for human labour. Economic historians now play down the magnitude of “Engels’ pause”, the period during the Industrial Revolution in which working-class wages grew more slowly than the wider economy.","Yet history is not always a good guide to the future, as the Industrial Revolution itself showed. The top AI models are awesome. They can tackle much more complex coding tasks than people were predicting a year ago. The number of AI agents has exploded. Spending on AI by businesses is up dramatically. Annualised recurring revenue of Anthropic, a hot model-maker, is set to reach $50bn by the end of June. There is no evidence yet in the labour-market data of AI destroying many jobs. But given how fast it is improving, it would be rash to dismiss fears that it will. Society may be on the verge of a profound reallocation of resources, and political upheaval.","Economists’ prediction that work will stay plentiful is less reassuring than it looks, especially over a long horizon. Though the market will find uses for human labour even as models and robots become more capable, the quality of those jobs and the wages they pay are not guaranteed. Data centres will account for 8.5% of America’s peak power demand in 2027, up from 4.1% in 2025, predicts Goldman Sachs, a bank. As AI firms bid up the price of land and energy, the dollars people earn will go less far. Eventually humans could, like horses in the age of the car, become uneconomical. Income may go mostly or entirely to owners of capital, who then go on to spend it on things that are made by AI and robots using natural resources that they monopolise.","This dystopian possibility is behind Silicon Valley’s admonitions that state intervention, and perhaps a universal basic income, will be necessary. That remains a long way off, if it ever happens. But governments may have to act sooner, for you do not need a cataclysm to stoke popular fury. Perhaps 2m Americans lost their jobs between 1999 and 2011 owing to China’s entry into the global trading system. That is no worse than a typical month’s lay-offs in America’s churning labour market. Yet the “China shock” helped propel Donald Trump to office and led to the highest tariffs since the 1930s.","The white-collar employees threatened by AI have more political and social clout than factory workers hurt by Chinese competition. Even a small number of lay-offs could provoke a backlash against the technology; furious opposition to new data centres is a hint of what may be to come. Severe disruption to the security and status of many people could lead to widespread unrest, even revolution.","What should governments do? One set of ideas involves slowing down change. China has urged its companies to adopt AI, but not to lay off workers. Prominent economists around the world have proposed higher taxes on capital and lower ones on labour. Some campaigners want levies on data centres. Inhibiting technology is not, however, a wise path to choose. Humanity is likely to reap enormous benefits from AI: not just greater wealth, but progress fighting diseases and solving problems such as climate change and poverty. Had the Luddites stopped the automation of textile mills in early 19th-century England, the world would be far worse off today.","A second category of countermeasures would be better. If employment falls, income that once went to workers is likely to show up as high profits in AI firms, chipmakers, data centres or elsewhere in the supply chain. Clever tax reforms, such as levies on corporate profits that are above a normal return on capital, on land and on natural resources, could capture these rents. The case for inheritance taxes to prevent the entrenchment of a capital-owning elite looks even stronger than before.","At the same time governments could help workers adjust. Public wage-insurance, which smooths out falls in income after job losses, can help workers find better opportunities (and so can eventually pay for itself). Denmark’s active labour-market policies, in which the state helps people find and train for new occupations, have been proved to cut spells in unemployment.","These ideas would make the economy more efficient and fairer regardless of AI. Would they satisfy voters facing disruption and uncertainty? In a populist era technocratic reforms are a hard sell. Past efforts to help workers adjust to trade liberalisation failed to stop the “China shock” backlash. In an all-AI workforce, humans will need help surviving, not adjusting.","Hence a last set of radical ideas, such as the partial nationalisation of AI firms. This week a South Korean presidential adviser floated a citizens’ “dividend” from AI businesses, sending the local stockmarket down by 5%, before backtracking. In America politicians murmur about giving citizens shares in AI companies via “Trump accounts”. In economic terms there is little difference between a well-designed tax system and a government stake in the private sector—and countries without AI giants will have to rely on taxes rather than seizing shares in foreign companies. But America may find that some public ownership is the best way to make the social upside from the technology transparent.","Concentrations of rent must be confronted early, before the power of rentiers is too great. The jobs apocalypse is not yet here. But if governments wait for conclusive evidence before creating a safety-net, it will be too late. Better to start now. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/05/14/prepare-for-an-ai-jobs-apocalypse"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.05.18","day":42,"title":"The Very American, Very Intense World of High-School Debate","source":"The New Yorker","minutes":6,"tag":"Reporting & Essays","dek":"","note":"2026.05.18","paragraphs":["By Rachel Syme and Jessica Winter","On and Off the Avenue","Photograph by Sam Kweskin / Kintzing / Connected Archives","I live directly across the street from a remarkably well-appointed, lusciously air-conditioned, and shockingly affordable (for New York City, anyway) Y.M.C.A. in Brooklyn, which is all to say: I have absolutely no excuse not to go. The gym is practically an extension of my apartment—so close that when I open my kitchen window, I can feel the chilled, tangy air wafting out of the Y’s linoleum lobby. The window next to my desk overlooks the gym’s large communal exercise room, and throughout the day, I am taunted by the sight of gyrating bodies panting through a Zumba class or a kettlebell set. I tried, for years, to motivate myself to join in, but I could never maintain a consistent cardio groove. Then, one afternoon last summer, I was walking past the gym when I was hit with a sudden nostalgia-inducing whiff of chlorine. The pool! Why had I never thought of it? I’d assumed the Y’s basement lido was the domain of serious lappers and diehard aquarobics addicts—not the place for a fitness dilettante. But my curiosity proved stronger than my nay-saying. I signed up for an hour-long swimming refresher course (from the coach Dan Daly, of TrainDaly, who holds sessions at the John Jay pool, in midtown, and who has a warm if no-nonsense approach to instruction) and hopped into the slow lane. Now, I swim at least four days a week. My new hobby came, thrillingly, with the need to buy new gear. At first, I struggled. My two favorite one-pieces, a vintage-inspired bottle-green ruched suit from the Esther Williams line ($88), and a crinkly, scoop-backed number from Hunza G ($240), were made more for lounging than for working out, but I find most “athletic swimsuits” to be so dowdy as to feel punitive. I spent a few unhappy weeks wriggling into a sad navy Speedo, until I spotted a woman in the locker room wearing a bright-red training suit, printed all over with whimsical watermelon seeds. She was kind enough to share that it was by Sporti, and that she’d bought it for less than forty bucks at SwimOutlet.com, which has since become my go-to source for kooky novelty sports suits. I also splurged on a hot-pink one-piece from Left on Friday, which has become the cool swimwear brand du jour for a reason; the Sunday Suit ($200), as their best-selling, strappy style is known, is made of compressive fabric that holds up to exertion but also accentuates one’s curves. But the best purchase I’ve made by far, in my new life as a water nymph, is a pair of Suunto Aqua Lights ($149), magical headphones that work underwater via cheekbone vibration. I used to avoid crossing the street. Now I happily dive in.—Rachel Syme","What to Watch","Just in time for Mother’s Day, Jessica Winter shares some of her favorite movies featuring complicated moms.","Lana Turner (left) and Juanita Moore in “Imitation of Life.”Photograph from Everett","“The Reckless Moment” (1949)","After her rebellious daughter is implicated in a suspected homicide, Lucia Harper (Joan Bennett) must clean up the literal and figurative mess. She brings a grim determination to her matriarchal duties, whether she’s ordering this year’s Christmas tree, disposing of a corpse, or negotiating with the Irish bagman (a delightfully miscast James Mason) who tries to blackmail her and inevitably falls in love. Max Ophüls’s gorgeous SoCal melodrama is as brisk and economical as its heroine, and mordantly attentive to Lucia’s exhaustion and cognitive overload: “You don’t know,” she tells Mason’s character, “how a family can surround you at times.” Some of us know!","“Imitation of Life” (1959)","Like Ophüls, Douglas Sirk left his native Germany after the Nazis rose to power; the last film he made in Hollywood, before he returned to Europe, was “Imitation of Life.” Ostensibly, it’s a soapy tearjerker about two idealized single mothers, one a white actress (Lana Turner), the other her Black housekeeper and nanny (Juanita Moore), whose daughter passes for white. It’s also an extraordinary and enraged statement on race, class, identity, performance, bourgeois hypocrisy, and how a nation raises its children to hate themselves and those who love them most. The emotionally overwhelming finale, in which a bereaved young woman confesses to her society’s crimes as if they were hers alone, is the cinematic equivalent of Sirk taking a match and lighting his adopted country on fire. He never directed a feature again.","“News from Home” (1976)","Like much of Chantal Akerman’s work, this epistolary cine-essay is not as simple or austere as it might first appear. In voice-over, the filmmaker reads aloud from plaintive letters she writes to her mother back home in Brussels, accompanied by long takes of unglamorous and underpopulated patches of nineteen-seventies Manhattan: parking lots, tenement exteriors, graffiti-covered subway cars. The juxtapositions of text and image, which strongly suggest the widening distance between mother and daughter, build in emotional and intellectual power over the film’s ninety-minute duration. This is a uniquely lonely work of art, but one that maintains faith in the possibility of connection.","“The Brood” (1979)","Long before the trope of early motherhood as a horror movie became a cinematic cliché, the young director David Cronenberg blessed us with a gloriously disgusting movie about a woman (Samantha Eggar) whose past traumas become flesh—she literally gives birth to her suppressed rage in the form of hideous, murderous monster children. Lots of them! “The Brood” itself might be seen as a past trauma made flesh, as Cronenberg has said that the story was influenced by his own contentious divorce and custody battle. But the filmmaker’s imagination transfigures personal history into something not of this world, wholly original, and uniquely demented.","“Petite Maman” (2021)","In Céline Sciamma’s (slightly slept-on) follow-up to “Portrait of a Lady on Fire,” a young girl named Nelly meets her doppelgänger, who turns out to be Nelly’s mother as a child. (The girls are played by the twins Joséphine and Gabrielle Sanz.) In different hands, this setup might produce gimmicky results, but Sciamma regards this meeting of child and mother-child as an opportunity to simply be with these lovely girls as they play, pretend, and discover each other and themselves. It’s a movie that creates the most enchanting vertigo: How can something be at once so familiar, so comfortable, and yet so uncanny?","P.S. Good stuff on the internet:","An earlier version of this article included an incorrect photo for the film “Imitation of Life.”","Table of Contents","NewYorker.2026.05.18"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.05.23","day":43,"title":"SpaceX is capitalism on rocket fuel","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Make what you will of Elon Musk, his rocketry firm is a marvel of free markets","note":"2026.05.23","paragraphs":["TO CHANNEL ONE of Elon Musk’s favourite science-fiction authors, SpaceX is a product of infinite improbability. When Mr Musk began, few would have predicted that a startup could design a liquid-fuelled rocket and put it in orbit. Nor that an engineer would be able to get a rocket’s booster to return to Earth, land upright on its own tail and be re-used. And no one has yet recovered a rocket’s second stage, which must withstand 1,500°C or so during atmospheric re-entry.","Having pulled off the first unlikely feat in 2008, six short years after its founding, and the second in 2015, SpaceX will try to use a launch due on May 21st to show that it can carry off the third, too. If the test fails by the time you read this, SpaceX will try again—and again, until it succeeds or runs out of money.","Success will be vital if Mr Musk is to realise his vision of dominating artificial intelligence, apparently by using space-based computers launched by SpaceX to satisfy AI’s ravenous hunger for data-processing. To pay for his dream, on May 20th the company filed the prospectus that has started the countdown clock for an initial public offering next month worth about $75bn. This will be the biggest listing in history.","In two ways, the IPO is infinitely improbable, too. It is inspiring in that Mr Musk aims to carry off yet more seemingly impossible feats of engineering. And it is worrying in that he is asking investors to trust their savings to a lossmaking outfit with hardly credible financial plans over which he will have total control.","SpaceX’s colossal listing will shake stockmarkets as much as its giant Starship rocket’s Raptor engines now rattle the coastal plain beneath the launch site in Texas. SpaceX may instantly land among the world’s ten most valuable companies, with a market value of as much as $2trn. A fortnight later it is to be ushered into the NASDAQ index, ending up in countless tracker funds, pension pots and other stock portfolios. By then Mr Musk may have become Earth’s first trillionaire, worth as much as all households in his native South Africa combined.","In a populist age, many people will see the concentration of power in trillion-dollar companies—not to mention trillion-dollar men—as a failure of capitalism. Yet as a story of risk-taking, competition, the ability to mobilise resources and thereby turn the improbable into reality, SpaceX is in fact capitalism at its most remarkable.","Sometimes Mr Musk has harnessed the state’s resources, sometimes he has gone it alone. Government policy played a crucial role in getting SpaceX off the ground. But his drive has repeatedly solved problems that the state could not. He has already opened up space, and if he succeeds in his dream of cutting launch costs to $185 a kilogram, 1% of their historical average, he will have utterly transformed it.","Getting there will be hard. SpaceX’s business plan, as outlined in its regulatory filing on May 20th, has “risky” written all over it. The company is losing more than $1bn a month, much of it on its AI business, xAI, which spent $8bn in the first quarter and is still far behind the industry’s stars.","The plan says that over 90% of SpaceX’s potential sales, which it values at $28.5trn—almost the entire GDP of America today—will come from AI. It is unclear whether that will be from making a success of his own AI business using data centres in space powered directly by the sun (and untroubled by terrestrial NIMBYs), or from selling data-centre services to others. Throw in some stardust about interplanetary missions and asteroid mining and you can begin to grasp the scale of Mr Musk’s ambition.","Yet even if he doesn’t get all the way there, his fleet will open up new possibilities that he and other capitalists can exploit. The government encouraged William Boeing to do this after the first world war, using idle warplanes to ferry air mail. Jeff Bezos sold spare cloud-computing capacity when Amazon had built more of it than it needed for its e-emporium. Mr Musk himself has done it, too: Starlink was initially a way to fill up SpaceX’s workhorse rocket, the Falcon 9, when external custom could not keep up with its billowing launch capacity.","He is also spurring competition. Blue Origin, founded by Mr Bezos two years before SpaceX, is working on its own re-usable rocket. Both it and Amazon have plans for their own satellite constellations to rival Starlink. In December a private Chinese challenger, LandSpace, test-launched a re-usable rocket; another Chinese company, called Space Pioneer, tried in April.","If anyone has earned the right to aspire to seemingly unattainable engineering goals it is Mr Musk. The financial risks—and the control he demands—are another matter. No other firm has tried to use public markets to raise as much as SpaceX will. NTT in Japan and Saudi Aramco were partial privatisations of state-owned assets. The nearest private-sector competitor, Alibaba in 2014, raised a third of what SpaceX wants.","SpaceX could, like any capitalist enterprise, crash and burn. Its valuation—as much as 100 times annual revenue—compares with 16 for Tesla. Mr Musk has a record of creating lots of shareholder value but little cash. SpaceX is on the hook for the lossmaking xAI, and his social network, X, with which it merged earlier this year.","And by giving him and other insiders special shares to elect directors, SpaceX’s structure makes Mr Musk unsackable. Investors are therefore saddled with his future business decisions as well as his obnoxious politics. He may face a backlash under the next Democratic administration for his racism and the ravages of DOGE under Donald Trump.","The thing is that Mr Musk comes as a package. He has needed a galactic ego and a cosmic appetite for risk to succeed—as did Henry Ford and J.P. Morgan before him. SpaceX is an imperfect company and Mr Musk an imperfect man. The marvel of capitalism is that it can harness their talents to create something extraordinary. While his investors take the risk, the rest of humanity can strap in for the ride. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/05/21/spacex-is-capitalism-on-rocket-fuel"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.05.25","day":44,"title":"Can the Democrats Take Back the Senate?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.05.25","paragraphs":["Their electoral prospects are finally improving, but opportunities can quickly give way to divisions. Does the Party have a plan?","In a debate for the Democratic nomination for the Senate in Iowa this month, one of the moderators, Erin Murphy, asked the candidates, Josh Turek and Zach Wahls, both state legislators, a reasonable, if downbeat, question. They had proposed progressive policies to address the state’s affordability crisis: raising the federal minimum wage, restoring Obamacare subsidies, rolling back tariffs, fighting “corporate greed.” What “I didn’t hear,” Murphy said, was anything that could be done “with a Republican President, because that’s the reality of the next two years.” Turek, in response, countered that, if “we’re able to win this race here in Iowa, we’re looking at taking back Congress and taking back the U.S. Senate. And I think that gives us an amazing opportunity to be able to get a lot of these across the finish line.”","Iowa is a state where Donald Trump beat Kamala Harris by thirteen points, and where registered Republicans outnumber Democrats by nearly two hundred thousand. But Turek’s answer was a serious one. Something has changed lately in the dynamics of the Democrats’ drive to reclaim the Senate, or, at least, in the Party’s mood. Trump’s approval ratings have fallen to below forty per cent, the Iran war grinds on, and gas prices have been rising, as has inflation. More than that, there is a general sense of anger and suspicion about entrenched élites. A comment that Trump made last week about how much he considered Americans’ financial situation when negotiating with Iran—“not even a little bit”—encapsulates how recklessly he is willing to alienate even his own supporters.","Disillusionment with Trump, however, does not necessarily translate into enthusiasm for any given Democrat. The Party’s approval ratings are at forty per cent, about the same as the G.O.P.’s. Riding a wave of outrage in an era of MAGA-inflected conspiratorial thinking is a different task than, say, hoping that a blue drift in Texas could get Beto O’Rourke elected. (That said, Texas has a Senate race that Democrats think they can win this year; a runoff on May 26th will determine whether James Talarico, a progressive, will face the incumbent, John Cornyn, or Texas’s scandal-ridden attorney general, Ken Paxton.) Democrats are also fighting among themselves. In Michigan, a primary for the Senate seat left open by the retirement of Gary Peters, a Democrat, has been marked by disputes related to Gaza and economic populism. Opportunities can quickly give way to divisions.","The G.O.P.’s current margin in the House is so slim that Democrats may not need to go deep in red states to overcome it, even factoring in the current redistricting battles. In the Senate, though, Republicans will have to lose a net four seats for the Democrats to gain control, and so they need a plan. Assuming that the Democratic senator Jon Ossoff can hang on in Georgia, the main targets are Alaska, Iowa, North Carolina, Ohio, and Texas, all of which Trump won, plus purple Maine. Democrats can at least make a case for any of them, based on the polling.","In Iowa, for example, Wahls and Turek are vying for a seat that is open because the Republican senator Joni Ernst is retiring; the likely G.O.P. nominee, Representative Ashley Hinson, has based her campaign on unalloyed support for Trump. Wahls has been an object of liberal excitement since 2011, when, at the age of nineteen, he delivered a viral speech at the Iowa statehouse about marriage equality and his two mothers. He has since been elected to the state Senate twice, in one of Iowa’s bluest areas; both times, no Republican bothered to run. Senator Elizabeth Warren has endorsed him. Turek, his opponent, describes himself as a “prairie populist” but comes across as more tempered than Wahls. He was born with spina bifida, after his father was exposed to Agent Orange while serving in Vietnam, and he has won two wheelchair-basketball gold medals for the United States in the Paralympics. (His campaign logo includes a medal.) Pete Buttigieg, the former Transportation Secretary, has endorsed Turek.","During the primary debate, Turek emphasized that he had won his seat in a district that Trump carried, and was thus “battle-tested.” Wahls took the position that voters are so unhappy about the “corruption of our politics” that traditional calculations hardly matter—a stance that other Democrats may find tempting, but risks leaving more moderate voters behind. (In Maine, Graham Platner, a polarizing populist with a complex backstory, who will face the Republican Susan Collins, represents a similar gamble.) “I’m the only person on the stage here tonight who has said that I will not vote for Senator Schumer for leader,” Wahls said, and attacked Turek for not joining him in that pledge. (Turek was noncommittal.) Frustration with Senate Minority Leader Chuck Schumer, which many Democrats share, reflects a sense that the Party is factious and indecisive—even as its electoral prospects are finally improving.","In other states, the Democrats have opted for more familiar names: former Governor Roy Cooper and former Representative Mary Peltola are well positioned in North Carolina and Alaska, respectively. In Ohio, former Senator Sherrod Brown, who has a long record as a populist, easily won his primary. He is seventy-three, and lost his last Senate bid, in 2024, as Ohio turned a deeper shade of red. But the Cook Political Report now calls the race a tossup.","Still, this may be an election where some of the certainties of the two-party system are rewritten. In Nebraska, Dan Osborn, a veteran and a former union leader at a Kellogg’s plant, is running as an independent. Like Turek, he identifies as a prairie populist, though he has said that he will not caucus with either party, because both are caught in a “doom loop.” Nonetheless, a local Democrat, Cindy Burbank, won last week’s primary on the strength of an unusual campaign promise: to drop out and give Osborn a clear field in the general-election race against the incumbent Republican, Pete Ricketts, who is the son of the billionaire behind TD Ameritrade and is endorsed by Trump. Local Democrats were credited for their discipline, which might help to secure a majority.","Yet there is something unsettling about the fact that it might take such an act of self-erasure for the Party to win the Senate. The country’s discontent gives Democrats an opening to change the terrible trajectory of Trump’s Presidency. Control of the Senate, for example, would allow them to block an extreme Supreme Court nominee. Now might not seem the moment for Democrats to be quarrelling, but many of them believe that the only way to build the Party back up is to remake it. November will tell. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.05.30","day":45,"title":"Smart tech is making war a dumber choice","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Smaller, weaker countries can defend themselves more easily with cheap, deadly kit","note":"2026.05.30","paragraphs":["Bullets and bombs killed nearly three-quarters of a million people in wars between 2021 and 2024. Many more died from the indirect effects of conflict, such as hunger and disease. Combat deaths in the past four years have been the highest since the end of the cold war. And for what purpose? Not even the leaders who started recent wars can be pleased with the results. Russia’s invasion of Ukraine has become a humiliating quagmire for Vladimir Putin. President Donald Trump’s war on Iran has gone badly awry. These two wars of choice exemplify two new battlefield truths. Technology has made it harder for any army to advance on the ground. It has also made it easier for weaker powers, when attacked by stronger ones, to cause havoc.","In a valedictory essay this week, The Economist’s defence editor reflects on how war has changed over the past decade and how it might evolve in the future. The first big shift is that soldiers are more exposed on the battlefield. Sensors and satellites can see them; small, cheap drones can kill them. Armies have to work harder than before to hide, move and survive. Ukraine’s expanding front-line “kill zone”, where soldiers move in small groups and ground robots evacuate casualties and deliver supplies, embodies this shift.","Technology quickly spreads. Israeli soldiers in Lebanon now face the same kind of drones that were pioneered in Ukraine. Iranian missiles are far more accurate than the Iraqi Scuds fired during the first Gulf war. Were China to attempt to invade Taiwan, its landing forces would be met with a blizzard of drones. Air superiority is now harder to achieve and buys soldiers less protection than before, thanks to the new drone-saturated layer of airspace.","Some experts draw the lesson that manoeuvre—attacking an enemy’s soft spots through shock and rapid movement—is no longer possible. But war is a Darwinian environment, driving constant adaptation, and the battlefield is never frozen for long. The lesson from Ukraine is not that future wars will always involve wretched infantry moving only a few metres a day on long, static front lines. It is that armies will have to train and equip themselves properly to blind, disrupt and elude the cameras, sensors and munitions above and around them.","Western armies are woefully behind in this regard. They need far more jammers and counter-drone defences to avoid being seen and struck. They need realistic training to simulate those conditions, which is why NATO armies are getting help from drone-savvy Ukrainians during exercises. And they need to move more boldly in bringing unmanned systems into their forces for everything from reconnaissance to logistics.","They should not simply copy Ukraine. Though astonishingly innovative, its army has serious flaws. Soviet-trained generals still micromanage brigades at the front. Ukraine’s drone forces may be world-class, but they are not as synchronised with assault forces as they could be. And the drones now plying the skies of Donbas and the waters of the Black Sea are smaller, shorter-range and cheaper than those that would be needed in a war over the vast distances of the Pacific.","The second shift is that new technology has transformed targeting. AI-enabled software allows armies to find and strike targets at a previously unimaginable speed and scale. America’s blitz in Iran offers a foretaste of this. An army that can outpace its enemies in identifying and destroying command posts, depots and weapons can, in theory, paralyse them and force them to capitulate. In practice, this is fiendishly hard.","America and Israel could bomb Iran at will, yet Iran shows no sign of buckling. On the contrary, it kept launching drones and missiles through 39 days of conflict and has been able to cling on to its nuclear programme, close the Strait of Hormuz and cause global economic mayhem. Mr Trump celebrates the number of Iranian targets destroyed by superior American kit, but targeting should be a means to an end, not a substitute for strategy. What he expected would be a short, sharp war quickly started to exhaust America’s stocks of expensive munitions and exposed its limited tolerance for economic costs, let alone casualties. In previous wars, such as America’s in Vietnam and the Soviet Union’s in Afghanistan, the smaller, weaker side won because it was fighting on home terrain. Now the weaker side can afford precision-guided weaponry, too.","A third development, alongside these technological shifts, is that the laws of war are increasingly under strain. Mr Putin’s forces have subjected Ukrainian civilians to torture, indiscriminate bombing and systematic attacks on medical facilities. Hamas has gloried in the mass murder of Israeli women and children. True, past wars were vicious, too. What is new is that it is not just dictators, terrorists and rebels who openly flout norms. Some leaders of Western democracies do so, too. Israel has inflicted brutal collective punishment on civilians in Gaza. America’s secretary of war mocks “tepid legality” in military operations. Mr Trump has threatened to wipe out Iranian civilisation and joked that it is “fun” to torpedo ships full of sailors. The brazen violation of norms is not just immoral but unwise, because in future wars, involving long-range drones and missiles, Western civilians will not enjoy the sanctuary they have come to take for granted.","The coming years will surely bring new conflicts. Mr Trump, by making clear his scorn for allies, has weakened America’s power to deter aggressors. And political leaders everywhere will keep imagining that, under their brilliant leadership, the next war will be swift and painless. Yet the evidence shows that war is becoming harder and costlier; that it is easier for weaker states to hold off and bleed stronger ones; that it is easier to start wars than to end them. That is something for Mr Trump to ponder as he mulls whether to resume war on Iran, or wage one in Cuba; for Mr Putin, as he keeps incinerating lives and cash in Ukraine; and for Xi Jinping of China, as he decides whether to invade Taiwan. As military technology gets smarter, wars of choice are looking ever dumber. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/05/28/smart-tech-is-making-war-a-dumber-choice"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.06.01","day":46,"title":"How Prepared Are We for a Public-Health Emergency?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.06.01","paragraphs":["The outbreaks of hantavirus and Ebola expose the shortsightedness of America’s retreat, under the Trump Administration, from its role as a global-health leader.","Last November, Jay Bhattacharya, the director of the National Institutes of Health and an acting director of the Centers for Disease Control and Prevention—the man has had nearly as many jobs as Marco Rubio—wrote a short piece with the N.I.H.’s principal deputy director for the conservative publication City Journal. The piece argues that the country should largely stop trying to surveil for new pathogens, assess the risk they pose to humans, or develop vaccines and drugs to manage them. These activities, the authors suggest, mostly serve to keep scientists happy and funded. Instead, the public should be encouraged to become “metabolically healthy” by, for example, “eating nutritious food” and “getting up and walking more.” Bhattacharya has railed against the politicization of science, but the piece concludes that the best way to prepare for deadly pandemics is by “making America healthy again.”","At a time of escalating viral threats, this is a take better suited to online feuds than to biosecurity strategy from the apex of American public health. Last month, the ill-fated Dutch cruise ship M.V. Hondius left Argentina carrying around a hundred and seventy-five people from some two dozen countries. What followed is well documented: a seventy-year-old man developed fever, diarrhea, and severe respiratory distress; he died of what turned out to be a hantavirus infection. Soon afterward, two more passengers sickened and died, and at least eight others were infected. Dozens of people have since returned to their home countries to quarantine, but the process has been less than airtight. After disembarking, a Turkish travel influencer attended a wedding in Istanbul; a British man exposed to the virus was tracked down in a bar in Milan.","Hantaviruses are usually found in rodent droppings, and they spread when someone inhales aerosolized particles or eats foods contaminated by them. But the version of the virus on the ship, known as the Andes strain, can transmit directly from person to person through bodily fluids or the air. There are no specific vaccines or treatments for the virus, which can cause a life-threatening condition known as hantavirus cardiopulmonary syndrome, whereby fluid pours out of the capillaries and into the lungs. The death rate is as high as fifty per cent. Notably, the first known hantavirus death in the U.S., in 1993, was of a nineteen-year-old marathon runner. Metabolic health only gets you so far.","Health authorities have sought to ease concerns about the outbreak. Federal officials have avoided using the word “quarantine,” and the C.D.C. didn’t activate its Emergency Operations Center or issue an advisory to health departments until some American passengers of the ship had already returned to the U.S. The agency has indicated that the risk to the public remains low, because transmission requires “prolonged close contact,” but what, exactly, constitutes “prolonged” and “close” is a matter of some dispute.","According to a report in The New England Journal of Medicine, hantavirus has previously been implicated in superspreader events. In 2018, a person infected with the virus attended a birthday party in Epuyén, Argentina. At least five people sitting nearby developed symptoms, including a man with an “active social life,” who went on to infect half a dozen other people before dying, a few weeks later. The man’s wife is thought to have infected ten more people at his wake. All told, nearly three dozen people contracted the virus, and eleven died. The report’s authors estimated that, before mitigation measures such as patient isolation were initiated, the virus’s reproduction number was above two, meaning that each infected person spread the virus to more than two others. (The initial COVID strain had a reproduction number of around three.) Hantavirus can incubate for nearly two months before a person shows symptoms, and several dozen Americans are now being monitored at U.S. quarantine facilities or in their homes. The full extent of the outbreak may not become clear for weeks.","Then, last week, as the M.V. Hondius prepared to dock in Rotterdam, unloading the last of its crew, the World Health Organization declared an Ebola public-health emergency. At least seven hundred people have been infected and more than a hundred and seventy have died, mostly in a conflict-ridden region of the Democratic Republic of the Congo. On Tuesday, the W.H.O.’s director general said that he was “deeply concerned about the scale and speed” of the spread: by the time authorities learned of the outbreak, it was already unusually large, suggesting that many more people are probably infected or at risk. The Ebola strain currently circulating doesn’t respond to the vaccine or the antibody treatment that were developed for a different version of the virus, which caused a years-long outbreak a decade ago, killing more than eleven thousand people.","Neither Ebola nor hantavirus is likely to unleash a pandemic: Ebola usually spreads through direct contact with the bodily fluids of a person showing symptoms, and hantavirus hasn’t proved itself capable of sustained community transmission. Still, these outbreaks expose the shortsightedness of America’s retreat from its role as a global-health leader. This year, the U.S. formally withdrew from the W.H.O., which has since struggled to obtain sufficient funds to monitor and address infectious threats. The C.D.C. largely received information about the hantavirus outbreak secondhand—forced, as one expert put it, “to rely on the good will of international partners for data that it once would have helped generate.” (Even this is an improvement over last year, when the Trump Administration banned C.D.C. officials from communicating with their counterparts at the W.H.O.) Since Trump returned to office, the C.D.C. has lost roughly a third of its staff, and cuts to foreign aid have hampered on-the-ground programs intended to respond to Ebola and other diseases. According to a study in The Lancet, the shuttering of the U.S. Agency for International Development could result in millions of deaths around the world by the end of the decade. Bhattacharya and other officials have said that they are simply “restoring trust” in science, but polling suggests that faith in federal health agencies has plummeted.","All this is properly understood as a grave and avoidable loss—for the country’s standing and for the health and security of Americans. But, in the fog of the post-COVID culture wars, it’s easy to lose sight of the power we still possess. America’s public-health institutions helped subdue polio, eradicate smallpox, slash smoking rates, transform H.I.V. from a death sentence to a chronic condition—and save millions of lives during the coronavirus pandemic. This has been a story of great ambition and repeated success. It can be again. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.06.02","day":47,"title":"‘The Destruction of the Civil Service Is Our National Loss’","source":"The Atlantic","minutes":7,"tag":"The Atlantic","dek":"Readers respond to our February 2026 issue and more.","note":"2026.06.02","paragraphs":["Donald Trump’s destruction of the civil service is a tragedy not just for the roughly 300,000 workers who have been discarded, but for an entire nation, Franklin Foer wrote in the February issue.","I read Franklin Foer’s “The Purged” in one held breath. This is how to weigh the stakes of our political moment—one life at a time. No statistic can adequately describe America’s losses. Each of the 50 people profiled in Foer’s essay is so gifted and generous, so essential to what the United States means—or at least to what it used to mean. I salute Foer’s courage to tell the story head-on. His narrative journalism is letting us see one another whole.","Rita Charon New York, N.Y.","There but for the grace of God go I. I never worked directly for the federal government, but I did research and consulting as a contractor for the Department of Energy’s National Laboratories, the Environmental Protection Agency, and the National Center for Atmospheric Research. I am a meteorologist, an atmospheric physicist, and an environmental economist, now retired. I worked on significant problems, including air quality, acid deposition, and the safety of liquefied gases. I developed simulation techniques for the accidental release of toxic chemicals. I don’t know the people in the article personally, but I do know them—I know their value. Their individual loss is our national loss.","Daniel J. McNaughton Newport, R.I.","I worked in state government for 29 years. Franklin Foer’s 50 profiles are an important reminder that we’ll feel the consequences of Donald Trump’s purge for decades. I tend to think of government work as that of quiet competence. When we travel on interstate highways, we do not think about the work done to locate an appropriate site for a road, to build it, and then to maintain it. When we fly, we hope that the plane meets safety standards but spare little thought for the federal staff who developed those standards and enforce them for our benefit.","I was reminded of the importance of federal expertise last year, when the remnants of Hurricane Helene roared through the mountains and left astounding damage to public and private infrastructure. The Mitchell News-Journal, the local paper in rural Mitchell County, North Carolina, has on multiple occasions reported on confusion among employees of the Federal Emergency Management Agency over how to follow the agency’s own internal guidelines. I am sure that FEMA can and should be made more efficient. But destroying morale and stirring chaos with on-again, off-again layoffs is certainly not the way to do it.","John Dorney Durham, N.C.","I am a retired federal civil servant and a disabled veteran. I worked for the U.S. Postal Service for many years. I always took great pride in my desire to go above and beyond to help others get what they wanted or needed. On behalf of the millions of current and former federal civil-service employees, I am truly grateful for Franklin Foer’s research and reporting in this article.","In my 32-year career, the other civil-service employees and members of the military I worked alongside were dedicated, honest, and hardworking professionals. When I started to hear claims that federal employees were overpaid poor performers, or that they supported a particular political agenda that undermined the administration’s, or that they amounted to an unelected, overly partisan bureaucracy, I was shocked. These claims were so the opposite of my own experience that I thought surely anyone hearing them would disregard them as false.","Nyleen Mullally Rapid City, S.D.","I was very moved by the depth of reporting in Franklin Foer’s story on purged government employees. The profiles helped fill in the picture—that these are real people, and that their absence will be felt for a very long time. The damage to our culture and our progress as a nation is much larger than many people realize. Thank you for helping us keep that fact front of mind, now and into the future. I hope some of this strength can be rebuilt—but first we’ll need to rebuild the reputation of government.","Evelyn Luengas Fort Worth, Texas","from the archives","“I was holding myself together, but just barely,” Sherry Winfield confesses in “Dinah’s Hat,” a new short story by Stephen King. Sherry and her friend Morris have just ventured from their trailer park to a beach with Dinah, the mysterious child Morris cares for; there, they encounter a group of young bullies. “In time,” Sherry recalls thinking of the events that follow, “I’ll be able to convince myself that never happened.”","“Dinah’s Hat” isn’t the first work of fiction King has written for The Atlantic. In the magazine’s May 2011 issue, he published “Herman Wouk Is Still Alive,” a short story told from the perspective of two aging poets, Phil and Pauline, picnicking at a rest stop in Maine, and two mothers, Brenda and Jasmine, eager to take their children on a road trip up I-95. Compared with much of King’s other work, the horrors of “Herman Wouk Is Still Alive” are fairly quotidian—dead-end jobs and deadbeat dads, aging, depression. The story, nevertheless, builds to a haunting conclusion.","In a 2011 interview with The Atlantic’s James Parker, King explained that the story had emerged from a bet with his son Owen on that year’s NCAA basketball tournament: The winner would provide a title for a short story; the loser would have to write it. Owen, victorious, proffered the phrase “Herman Wouk Is Still Alive,” inspired by news coverage he’d read that Wouk, the Pulitzer Prize–winning author of War and Remembrance and The Caine Mutiny, was still writing well into his 90s. In King’s eventual story, Phil and Pauline read a fictionalized New York Times article testifying to Wouk’s longevity. “The ideas don’t stop just because one is old,” Wouk tells his interviewer. “The body weakens, but the words never do.” His sentiment inspires the two poets, both in their 70s—until, moments later, tragedy renders language powerless.","Wouk himself was asked about King’s story in a Q&A published with his 2012 novel, The Lawgiver. “I read Mr. King’s short story and enjoyed it,” Wouk said. “As for the longevity, I share his evident puzzlement, with boundless gratitude to my forebears and my Maker.” He continued, “It helps to have work I love, with much work yet to do by His grace.” Wouk died in 2019, just 10 days before his 104th birthday.","— Andrew Aoyama, Deputy Managing Editor","Behind the Cover","In this month’s cover story, “The Men Who Don’t Want Women to Vote,” Helen Lewis argues that “masculinism”—a movement seeking to counter the advances of feminism and place men back at the center of public life—has become the most important uniting force on the American right. Many men are drawn to masculinism, Lewis writes, because they feel that they have lost status to women. For the cover, we depicted the fear that undergirds their resentment: A rough silhouette of a man runs toward the viewer, looking over his shoulder at an imagined threat.","— Liz Hart, Art Director","This article appears in the June 2026 print edition with the headline “The Commons.” When you buy a book using a link on this page, we receive a commission. Thank you for supporting The Atlantic.","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/06/the-commons/686931/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.06.02","day":48,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.06.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.06.06","day":49,"title":"How to fight back against Gen-Z socialism","source":"The Economist","minutes":6,"tag":"Leaders","dek":"The me-first doctrine is a threat to prosperity","note":"2026.06.06","paragraphs":["Something new is stirring on the left. A fresh crop of socialists want to remake the economy with price controls, hefty wealth taxes and a spree of nationalisations. Supercharged by fury over Gaza, they are winning voters at a formidable pace. Many rose to prominence only recently, like Zack Polanski, who leads the Green Party in Britain, or Zohran Mamdani, the mayor of New York. Others are long-standing political fixtures: the septuagenarian Jean-Luc Mélenchon is on his fourth swing at the French presidency, but thumping support from the 20-somethings of “Generation Z” has put the Elysée back in his sights again.","Call it Gen-Z socialism. Not because all its adherents are young—or because it is new for young people to lean leftward—but because it is the brand of leftism, made for the TikTok era, that today’s young revolutionaries support.","Forget weighty collectivist ideals or seizing the means of production. Gen-Z socialism is a me-first doctrine. Climate change and race, preoccupations of the 2010s and early 2020s, are now much more peripheral concerns. So are social issues, barring Gaza. Angst about inflation, housing and artificial intelligence have replaced all that with something cruder. “This country is awash in wealth,” says Avi Lewis, freshly elected leader of the New Democratic Party in Canada, a country where productivity has been all but flat for a decade. “We can have nice things.” Saying that prices should be capped to keep your bills down while someone else pays for your public services is a seductive, shareable message.","Plenty of the grievances that animate Gen-Z socialists do stem from real issues. Inflation has been too high, rent in big cities is now often unaffordable and AI could upend the labour market. Dismissing these worries would be foolish. Yet Gen-Z socialism is wrong about how to fix the problems of capitalism. It must be resisted, because it is a profound threat to prosperity.","No country’s Gen-Z socialists are quite alike. The realities of power have forced some, like Mr Mamdani, to become more moderate. But they broadly agree on three core principles. First, that growth does little to help ordinary people. Theirs is a zero-sum mindset, where a better outcome comes not from creating but from taking—as they fear ai barons will soon do on a vast scale. Second, that spending can be paid for by the richest. Once the left wanted higher taxes for everyone; Gen-Z socialists demand handouts funded by billionaires. The third tenet is a remarkable hostility to private enterprise. Gen-Z socialists are uninterested in letting the market rip and redistributing the proceeds. They would have chunks of everyday life, from housing to groceries, governed by state diktat.","Politics has always had zany fringes. The far right is no less barmy—and more dangerous. But what is so worrying about the Gen-Z socialists is how deeply their ideas are bleeding into the centre-left. Desperate to compete, even mainstream Democrats in America now propose mad schemes like exempting over half of tax filers from federal income tax. In Britain the Labour Party, having won power on a centrist platform, has been spooked by the Greens and is rekindling its zeal for higher taxes and state control. Increasingly, the ideas of the Gen-Z socialists can win even when their candidates lose.","That is bad news. Rent controls would worsen housing shortages by crushing the incentive to build. The profit margins of big supermarket chains, demonised by Gen-Z socialists, are already wafer-thin after years of ruthless competition—a miracle of modern capitalism. Wealth taxes would become confiscatory and deter innovation. Do not assume that the failure of these policies, if implemented, would bring about an automatic course correction. Europe has struggled for decades to escape the low-growth funk left by its own over-regulation; the rise of statist “Peronists” in Argentina helps explain its century of relative decline.","Resisting Gen-Z socialism is therefore an urgent task. The first step is for free-market liberals to stop apologising. A series of popular criticisms of capitalism, each containing a grain of truth, has in aggregate obscured the fundamental wisdom that private enterprise is at the root of human prosperity. Yes, people aren’t always rational, as behavioural economics shows. True, inequality matters and growth is better when broad-based. Free trade and globalisation create losers as well as winners. But this is the best time in human history to be born, given record real incomes, high life expectancy and low rates of extreme poverty. A punchier defence of capitalism would work better in the social-media age than hand-wringing by uncharismatic centrists like Sir Keir Starmer.","Centrist governments must also solve the problems driving popular discontent. “Abundance” liberals are right to want to build cheap and plentiful housing and infrastructure. Politicians must stop saddling the young with the burden of funding excessive pensions. The tax system must ensure that meritocracy prevails over inheritocracy: broader-based inheritance taxes and levies on property would help. The hardest challenge will be the disruption caused by advances in AI. The Gen-Z leftists have set out their stall with calls for a moratorium on data centres and a government jobs guarantee. Liberals must be more positive and imaginative in their own prescriptions, using a mixture of taxes, distributed capital ownership and support for workers to make sure that the upsides of labour-market disruption are widely shared.","Populists have the wind in their sails; it can sometimes seem as though market liberalism is doomed to political failure. The Economist disagrees. A robust defence of the ideas that have brought unprecedented riches has barely been tried. Many of the problems that animate Gen-Z socialists, like high rents, are the result of markets that are insufficiently free, not excessively so. There is time yet for liberalism to once again produce results—and to win the argument. ■","Subscribers to The Economist can sign up to our Opinion newsletter, which brings together the best of our leaders, columns, guest essays and reader correspondence.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/06/04/how-to-fight-back-against-gen-z-socialism"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.06.08","day":50,"title":"The Knicks: The Only Game in Town","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.06.08","paragraphs":["The Knicks have made the N.B.A. Finals again and, as another home team instructs the city, “Ya gotta believe.”","At the risk of deepening the polarization that has rent our precarious democracy to the point of collapse, it must be said, categorically, that the most triumphant moment in the postwar history of New York sports came on the night of May 8, 1970, when the Knicks’ captain and center, Willis Reed, his injured right leg numbed with cortisone and Carbocaine, limped onto the court at Madison Square Garden and, with two precise yet floor-bound “jumpers,” ripped the heart out of the Los Angeles Lakers and propelled his team to victory in the deciding game of the N.B.A. Finals. Reed, who had been listed as “doubtful” for the contest by the medical authorities, drew reasonable comparison that glorious night to the fallen El Cid, the medieval Castilian warrior, whose corpse, according to legend, was strapped onto his steed by his soldiers as they rode into battle outside Valencia.","The Lakers, despite the presence of three immortals in the their lineup––Wilt Chamberlain, Jerry West, and Elgin Baylor––had been spiritually vanquished by Reed’s display of courage before they could break a sweat. And, as the Knicks widened their lead, Reed hobbled off the court, never to return, leaving the inevitabilities to the ball handler, ball thief, and sharpshooter Walt Frazier, who went on to register thirty-six points and nineteen assists. That championship team, which soon added yet another star, Earl (the Pearl) Monroe, to its roster, won a second title (against the Lakers, again) in 1973. The Knicks of that era also featured Bill Bradley, Dave DeBusschere, Dick (“Fall back, baby”) Barnett, Phil (Action) Jackson, Cazzie Russell, and a lunch-bucket guard named Mike Riordan, whose job it was to go into a game to commit a deliberate foul. (We all have our purpose in life.) Coached by the unflappable Red Holzman, it was a unit as exquisitely coördinated as a school of barracuda or the 1965 Miles Davis Quintet.","Now, it is well understood that some scholars partial to the ancients will attempt to elevate the 1927 Yankees, led by the stoical Lou Gehrig and the epicurean Babe Ruth, as the finest of all teams to play in the city. Gridiron-minded boomers will assert that, in 1969, Joe Namath’s Jets scored, in Super Bowl III, the greatest of all Gotham miracles. (Or maybe it was the Amazin’ Mets of 1969. Or the Bill Buckner-assisted Mets of 1986.) Surely, the two Ali-Frazier fights of the seventies at the Garden were the most glamorous of all New York sporting events––for the first bout, Life sent Norman Mailer to write and Frank Sinatra to be ringside photographer––but it was the decisive third, held in Manila, that was the most memorable. Millennials will propose the Jeter-Rivera-Williams Yankees teams as the best thing since Katz’s pastrami. Whatever. Basketball is the city game. The Garden is its Mecca. May 8, 1970, was the night of all sporting New York nights. Bliss it was in that dawn to be alive! So proclaimed the voices of the Knicks: John F. X. Condon at the Garden, Marv Albert on the air. Case closed.","For Knicks fans, the half century since those two titles has been a prolonged excruciation with intermittent periods of thwarted hope. Ask Spike Lee, who, as a kid, attended the radiant 1970 finale and signed up for season tickets when the Knicks drafted Patrick Ewing, in 1985. A number of stars have worn blue, orange, and white over the years––Ewing, Bernard King, Carmelo Anthony, to say nothing of the fleeting excitement of “Linsanity” more than a decade ago. But, despite the team’s trips to the Finals in 1994 (a seven-game tragedy against the Rockets) and 1999 (a five-game bust against the Spurs), the mind of the loyal fan is tortured by a string of agonizing images: among them, Reggie Miller, of the Pacers, burying threes in Spike Lee’s face, Larry Bird trash-talking all comers, and, well, Michael Jordan, always. The only time the Knicks beat the Jordan-era Bulls in the playoffs was when he went on his baseball Wanderjahr with the Birmingham Barons. The one unsullied triumph for New York pro-hoops fans came in 2024, when the Liberty prevailed over the Minnesota Lynx to win the W.N.B.A. title.","Here we are again, a season on the brink. The Knicks, fuelled by the magical play of their point guard, Jalen Brunson, have made the N.B.A. Finals. Brunson is six-two, diminutive in today’s league, and yet, night after night, he has played with ever greater flair, and with far more velocity and power, than Walt Frazier did. Scoring nearly twenty-seven points a game in the playoffs so far, he slashes and spins his way toward the basket, shooting from seemingly impossible angles to the rim. In Game One of the Eastern Conference Finals, he almost single-handedly erased a twenty-two-point lead in the fourth quarter to force the Cleveland Cavaliers into overtime and eventual defeat. Time and again, he went one-on-one against the rabbinically bearded Cavs star, James Harden, driving, shifting direction, then suddenly lofting the ball against the top of the backboard and through the hoop. On the rare occasions when Brunson could find no way to score, he sent screaming passes to the corners, where his teammates lasered three-pointers at will. That late-game run––forty-four points to the Cavs’ eleven––was as soul-crushing to Cleveland as the apparition of Willis Reed, hobbling to center court, had been to the Lakers fifty-six years ago.","Brunson is hardly a lonely talent. Karl-Anthony Towns, who seems to crash to the hardwood every time he scores on the drive, is a wildly determined presence. No less thrilling, OG Anunoby, Mikal Bridges, Josh Hart, Landry Shamet, and Miles (Deuce) McBride are all capable of lighting it up on a given night, and God bless Mitchell Robinson, who might not be able to make half his foul shots but throws his big body against his opponents with admirable will.","Jittery courtside kibbitzers, first-time-longtimers, and Vegas savants are guarded in their evaluation of the Knicks’ chances. The defending champions, the Oklahoma City Thunder, are, admittedly, a superior collection of athletes, and the very sight of the Spurs’ spindly and preternaturally composed and gifted center, Victor Nonga Wembanyama de Fautereau-Vassel (a.k.a. Wemby, a.k.a. the future of the N.B.A.), calmly sinking threes from mid-court will cast a shadow from San Antonio for years to come.","But, as another New York team instructs the city from its home in Flushing, “Ya gotta believe.” The Knicks are on an astonishing run. Unselfish and undaunted, they are putting on a magnificent show. This is what joy feels like. You remember joy, don’t you? ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.06.13","day":51,"title":"The World Cup paradox","source":"The Economist","minutes":6,"tag":"Leaders","dek":"How the rules of both entertainment and soft power are being rewritten","note":"2026.06.13","paragraphs":["WITH LYRICS in English, French, Spanish, Italian and Japanese, the theme tune of the men’s World Cup, performed at its opening ceremony on June 11th, exemplifies the contest’s claim to foster global unity. Nearly half the world is expected to tune in over the coming weeks as the tournament moves towards its final on the outskirts of New York. A viewer might come away with two conclusions. First, that entertainment culture is more globalised than ever. Second, that America remains the soft-power superpower at the centre of it all.","Both assumptions would be wrong. Mega-events like the World Cup still seize global attention. But the bigger picture is that entertainment is fragmenting. From music to television to social media and gaming, audiences are tuning out of American content and embracing alternatives from closer to home. There is an emerging paradox: even as the world becomes more connected, people are choosing more local forms of fun. Even as billions tune in to a single show in North America, the American-led monoculture is fading.","This local turn is the opposite of what many predicted. Global entertainment platforms such as Spotify, Netflix, YouTube, and the Apple and Google mobile-app stores give people everywhere access to the same music, video and games. The biggest winners have been a lopsidedly American elite of megastars and brands—think Taylor Swift, MrBeast or Roblox—which have gone global as never before. The biggest sports leagues have soared in value along with them.","But below the top tier, entertainment is fragmenting. Sport has always been a reluctant globaliser, because people prefer to watch their local team. America’s National Football League, the world’s highest-earning sports property, earns 98% of its media-rights revenue at home. The English Premier League is the only football league in Europe that makes more in media rights abroad than it does at home. Every four years the world comes together for the World Cup and the Olympics. Otherwise, fans are mainly engrossed in domestic contests. New Yorkers are far less excited about the football than they are about the Knicks.","Other kinds of culture have long been more globalised, often thanks to America; think of music from Motown or TV from Tinseltown. But now this seems to be reversing. Music charts are becoming more local: in Brazil, an extreme case, 96 of the 100 most-streamed artists last week were Brazilian. Video-streaming services like Netflix and Amazon are producing more shows abroad, to woo subscribers in fresh markets. North America’s share of new streaming commissions has halved in the past six years, from 70% to 36%.","New media are no more global. Yo
