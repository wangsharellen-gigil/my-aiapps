 to get their budgets in order before the ECB buys their debt, but in practice the guardrail against bail-outs is weaker than a decade ago. In a game of chicken with the ecb, a populist president would probably win; for without France, the European Union could not survive.","It would be a mistake for central banks to bail out governments which refuse point-blank to balance the books. Their job is to unblock financial plumbing, not to underwrite decades of reckless borrowing. If central banks become cash machines for finance ministries, not guarantors of stable prices, long-term bonds will sell off even more. Voters will exact revenge. The best path forward in France and elsewhere is for politicians to explain to their electorates that public debt must be under control, and that together they must do whatever it takes. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/10/08/will-bonds-blow-up"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.10.12","day":93,"title":"How to Fight Your Landlord, the Heel","source":"The New Yorker","minutes":5,"tag":"The Talk of the Town","dek":"","note":"2026.10.12","paragraphs":["In Williamsburg, wrestlers dressed like Zohran Mamdani and a cockroach take turns in the ring. Their opponent? The big, bad Slumlord.","Pro-wrestling narratives are often driven by the villain, or heel—what Roland Barthes called “the bastard.” This figure “takes refuge behind the law when he considers that it is in his favor,” Barthes wrote, “and breaks it when he finds it useful to do so.” The other evening, at the Brooklyn Monarch, an industrial space in East Williamsburg, a copywriter named Jacob Knight-Thomas was preparing a wrestling-based production with a familiar urban archetype as its Big Bad. The show’s name: “The Fight Against Slumlords.” “You know what my landlord’s name is in my phone?” Knight-Thomas, a renter, asked. “Lame Ass Fuck.”","Knight-Thomas, who wore a green T-shirt with a yin-yang symbol on the back, was sitting by the stage with a MacBook, reviewing a slide deck. He was a novice event planner (“I don’t even really throw myself birthday parties,” he said), but, as a wrestling fan reared on political satire and MTV’s “Celebrity Deathmatch,” he’d hatched an idea for a night of topical comedic combat, carried out by locals. His first show had been called “The Fight for the Epstein Files.” Among its matches: Redacted vs. Redacted—two grapplers outfitted in black Lycra. Another was a “Last Island Standing” battle royale between the files’ big names. “Trump kept showing up in there, so we had, like, five Trumps,” he said. “Two of them started making out. He loves himself.”","At his laptop, Knight-Thomas reviewed story beats. “The slumlord’s gonna start victim-blaming him,” he explained. In the first match, the good guy would prevail, before a run of villains’ victories. “I want the audience to feel the harsh reality,” he said.","Beside a sign reading “NO FIGHTING,” a woman with green hair fit a bald cap onto a wrestler known as Cheeseburger, who would be portraying Eric Adams. Knight-Thomas had bought a plastic trash can for an ersatz Oscar the Grouch. Someone asked what he would do with it afterward. “I have the receipt,” he said.","“Where’s Mamdani?” Knight-Thomas asked—meaning Abraham Khan, a bearded millennial of Pakistani descent who’d be wrestling as Hizzoner. Josh Alba, a comedian playing the titular Slumlord, shrugged. Alba wore a suit with an open-collared shirt and had slicked back his hair. As a kid in Brooklyn, he said, “eight hundred bucks was rent for an entire apartment.” He’d remained a New Yorker till two weeks earlier: he’d moved to Philadelphia to get more bang for his renting buck. “I still commute to Manhattan three days a week,” he said.","Khan strolled in with a roller bag and an iced coffee, shook a series of hands, and conferred with Alba. Khan said that he typically performs as an antagonist. “When I play heel, I’m always virtue-signalling,” he said.","The crowd trickled in; the vibe was thrifted, power-clashing, pierced. In the show, when a wrestler named Delightful Dan the God Damn Candy Man shooed away a woman in a cockroach costume, she accused him of gentrifying his new hood. “I thought this city was built on immigrants,” he answered. The crowd seemed torn. A tag-team match ensued, which the roach and a man in rat garb won, to cheers. In another clash, Cheeseburger’s Eric Adams, billed as “straight from Turkey,” paid off an official with a cash-filled potato-chip bag. Later, a spate of bids for one of the Slumlord’s listings escalated into a six-person “gentrification scramble.”","Lex Rountree, of the New York State Tenant Bloc, watched while distributing pamphlets to showgoers. She wore a leather skirt and a T-shirt that said “ASK ME ABOUT TENANT POWER.” Knight-Thomas had reached her through Hot Girls Organize, formerly Hot Girls 4 Zohran. It was her first wrestling show. “I’m learning a lot,” she said. “There’s a catharsis to it.”","During the main event, as Alba’s Slumlord got into it with Khan’s Mamdani—slacks, tie, white button-down with pushed-up sleeves—another wrestler, in a fleece vest, stepped in to reveal himself as the Slumlord’s puppet master: Private Equity. In the chaos, the Mayor was slammed by two nepo babies, then saved by a duo in blue “Tenants for Zohran” tees. (Rountree whooped.) Khan hit his finishing move; the announcer shouted, “Rent Freeze! Rent Freeze!” The Mayor won the match and an oversized key to the city. The audience chanted, “Block by block!” Khan punctuated a victory speech by shouting, “Free Palestine!” The crowd roared.","Afterward, Khan, who has a day job in finance, posed for photos. “I’m very neutral on Mamdani,” he confessed. “I’m a middle-of-the-road individual.” Knight-Thomas said there would be another show soon. The theme: dating. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.10.17","day":94,"title":"What if the machines take over science?","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Artificial intelligence will require scholars to reinvent their disciplines","note":"2026.10.17","paragraphs":["OCTOBER 6TH 2026 may be remembered as the biggest day in the history of mathematics. OpenAI, an American frontier lab, released more than 700 academic papers claiming progress or solutions for 372 problems that had baffled scholars for decades. Mathematicians are still struggling to digest what it means for their discipline.","The implications promise to go far beyond maths. It is time to grapple with how artificial intelligence (AI) will affect science as a whole. The maths results are, simultaneously, a leap forward for humanity; a marvel that underscores the breakneck progress of AI; and a warning of a future in which understanding of the universe could belong to machines that are impenetrable to human minds. The question is how to achieve progress without sacrificing understanding.","AIs have so vividly shown their scientific potential in maths because its proofs are derived from axioms, not evidence, and are therefore, in principle, verifiable mechanically. But as we report in our special Science & technology section this week, AI has also accelerated progress in the empirical sciences, partly because other fields use maths as a tool. AI has made weather forecasts better. It has proposed millions of possible useful new materials and helped control experiments with nuclear fusion. And it can predict the shapes of almost every known protein from its constituent amino acids, an advance that won a Nobel prize.","More remarkable AI-fuelled scientific advances are almost certain. The most exciting possibilities are in biology. Researchers are using AI to design drought-resistant crops, to search for new drugs and to create (we must hope) friendly viruses that attack harmful bacteria. There is an effort to use AI to build computer models of how cells work. Armed with life in silico, scientists may go on to achieve mastery of biology, gaining the ability to create entirely new organisms from scratch. If so, DNA would become just another form of computer code to be manipulated like a string of tokens in an AI model.","Like much that is related to AI, that prospect is giddying and terrifying in equal measure. The first reaction of many mathematicians is to be terrified. Since OpenAI’s breakthroughs, they have been up in arms at the lab’s encroachment into their discipline. The Association for Human Mathematics, a group of over 900 scholars, warns that “mathematicians did not ask for this work to be done.” They say that the pay-off in doing mathematics comes not from the proof, but from the toil, because that is what advances human understanding. Having AIs churn out incomprehensible but correct solutions is like giving students the answers to their homework: without effort, there is no learning.","These complaints contain an element of special pleading. Academics have no more right to dictate the production of knowledge than any other profession. Truth-seeking benefits everyone and cannot be reserved for a guild of scholars. The hierarchies of academics, climbed by proving things, are not sacred. If needs be, they must be remade for a world in which AI produces proofs and humans digest them. In science, understanding should not be fetishised over results. Every time you swallow a paracetamol pill to see off a headache, you rely on a mechanism that works but is not fully understood.","Yet the fear of handing over science to the machines is not an idle one. AI companies are ploughing resources into science not out of altruism but because, as with humans, solving problems can help make models more intelligent. Many researchers think that a model that gets better at solving scientific problems will get better at doing everything else, too. If so, then nobody will be able to compete with big AI labs, which will eventually control models that work on improving themselves and become, by some definitions, incomprehensibly intelligent. These genius AI scientists will connect to the physical world either through humanoid robots or by hooking up models to lab equipment, as Anthropic has already done.","The problem this future poses for science is much the same as the one it poses for society. People will have to provide resources to machines for them to continue to make progress. If no one understands what they are doing, simply writing the cheques would be reckless. Nobody could be sure that the models were operating in humanity’s best interests. Even if AI labs manage to “align” machines with the interests of humanity, so that they can be fully trusted, a society where people simply ask AIs what to do—in science, or more broadly—is one in which humans will become the machines’ pets.","Some people may be willing to accept that if it means, say, curing all diseases. But at least until there is unshakeable alignment between AIs and humans, science will always need a human in the loop. Labs should be able to use AIs to solve problems, but resources such as laboratories and computing power should be directed and monitored by people who can reach an informed judgment about what AIs are doing. This will, inevitably, slow progress. But it is necessary if AIs are to remain under human control.","In the meantime, human-guided machine-science will require scholars to reinvent their disciplines. Scientists will have to learn to love—and credit with status and career advancement—guiding models and studying, verifying and teaching their results. Governments will need to allocate research grants on the same basis. For their part, AI labs should seek to be good scientific citizens, submitting their work for peer review and publishing their methods and code.","Checking and digesting a computer’s results may seem like unglamorous work. Much human-produced science is error-strewn because scholars are not rewarded for policing the work of others. But a renewed emphasis on verification and scepticism would improve science. It is worth remembering the Royal Society’s motto, adopted in the 17th century: Nullius in verba, or “Take nobody’s word for it”. That same spirit now needs to apply to science made by the machines. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/10/15/what-if-the-machines-take-over-science"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.10.19","day":95,"title":"The First Candid","source":"The New Yorker","minutes":5,"tag":"The Talk of the Town","dek":"","note":"2026.10.19","paragraphs":["In 1838, Louis Daguerre snapped a photo of a Parisian street, empty but for a shoeshine boy and his client. Now that some sleuths have zeroed in on the location, the city is marking it with a plaque.","By Lauren Collins","Illustration by João Fazenda","Before August Sander and Diane Arbus and Olan Mills, before Facetune and duck face, there were two: a shoeshine boy and his client, captured by Louis Daguerre on the Boulevard du Temple in 1838, in what is thought to be the first photograph to depict human beings. The bootblack squats beside a chest containing the tools of his trade. The patron stands, hands clasped behind his back, with a foot perched on the box. We know it’s spring, because the leaves are coming in on the plane trees. The two were hardly the only people out that day on the bustling stretch of cabarets. But they were the only people who held still long enough to be captured by Daguerre’s curious new machine, which required an exposure time of up to ten minutes. The next year, presenting the daguerreotype to the Assemblée Nationale, the physicist François Arago noted, “In this genre, it’s the unforeseen that one must count upon.” Soon, the French state would buy the rights to the invention and offer it as a free gift “to the world.” The names of the boy and his client were never recorded, but they live on as the accidental embodiment of photography on the brink of conquering the world.","One night in 2024, Maximilien Van Aertryck went out for drinks with his colleagues Axel Danielson and Kalle Boman. Van Aertryck is a producer who works with the Swedish filmmaker Ruben Östlund and has co-directed a documentary about the history of image-making. In other words, he knows a lot about photography. He had always loved the Daguerre picture: “It’s so poetic, with those two lonely people on that huge frame.” As he and his friends drifted out of the café, they crossed the Boulevard du Temple. It was June. The trees were nearing lushness. “We were, like, ‘Wait a minute! It must have been taken somewhere around here!,’ ” Van Aertryck recalled, visiting the area the other day. They punched a few keywords into Google, and found some articles, “in pretty big newspapers,” surmising that the photograph might have been snapped near the Filles du Calvaire Métro stop. “We knew immediately that there was no way it was there,” Van Aertryck said. “If you look at the photo, it just doesn’t make sense. So we went home and went to bed, promising that we’d meet at the same place at eight the next morning, and we’d figure this out.”","“Just like a Cro-Mag to bring a club to a rock fight.”","Cartoon by P. C. Vey","Thus began an eighteen-month quest to pinpoint the exact location of the shot, involving everything from archival research to drones to very long measuring tapes. It wasn’t easy. For one thing, Baron Haussmann had demolished swaths of the neighborhood in the mid-eighteen-hundreds to create the Place de la République. Van Aertryck and his colleagues turned to prints, paintings, real-estate registers, and topographical maps to re-create Daguerre’s environs, but these pre-photographic renderings had their limits. “We kept just finding engravings of one particular building, because some emperor got shot there,” Van Aertryck recalled. Both Daguerre’s workshop, on what is now Rue Léon-Jouhaux, and a theatre that he owned, called the Diorama, burned in 1839. “No one, not even the biggest nerds who have researched this,” can agree on where, exactly, Daguerre took the photograph, Van Aertryck said, but he and his team were able to determine that three buildings from the era are still standing today. They brought their findings to an architectural firm, which used a 3-D scan of the entire square to triangulate the shoeshiner’s location. Another architectural firm, using the same data, homed in on a point just a few feet away. “We decided to split the difference,” Van Aertryck explained, scuffing his shoe over a red “X” that had been painted on one of the paving stones, not far from some wads of gum. “A colleague ran out to buy nail polish to mark the spot!” he explained.","For nearly a century, the Bavarian National Museum, in Munich, possessed a photographic plate of the image, which Daguerre had sent to King Ludwig I, but it was badly damaged by restoration efforts during the Second World War—the only remaining physical trace of “Boulevard du Temple” is a photo of the photo that the MoMA curator Beaumont Newhall took in the nineteen-thirties. On October 15th, however, the City of Paris will unveil a plaque commemorating the shoeshine pair—an “unforeseen” detail, the world’s first photographic portrait sitters and the original photobombers at the same time. “I hope people will make it theirs and embrace it as the starting point for something,” Van Aertryck said. May it spawn a million selfies. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.10.24","day":96,"title":"The agony of liberal Europe","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Centrist rulers have fallen dangerously short—and are now paying the price","note":"2026.10.24","paragraphs":["“The first steps into the Unrest seem straightforward enough—anger at the fall of real wages, at capitalist aggression, at the unwillingness of Parliament; anger fomented by agitators...reason wars with instinct.” Few of those who mobbed French cities this week would recognise those words. But many would agree with George Dangerfield, the British-American journalist who wrote them. The demonstrators were consumed by rage. Rage at the failure of the state and against the floundering centrist politicians who govern. Rage at high prices and economic dysfunction. And for some, rage against the idea of centrist politics at all.","Dangerfield wrote about “the strange death of liberal England” in the years before the first world war. Some predict a similarly grim fate for liberal Europe today. Arson, mob violence, looting and mass protests show how much citizens despair of their leaders. France has a long tradition of the manif, but the violence unleashed by hooded and masked rioters across the country over the past weekend was unusually severe. Protests also flared in Belgium, Italy and Portugal. In looming elections, first in Spain next month, then in France and Poland next year, voters are poised to punish moderate parties—and in Italy the far right is outflanking the populist Giorgia Meloni, who has governed from the centre. In the wings wait more charismatic figures from the extremes, including Marine Le Pen in France and Alice Weidel in Germany.","Many in America and in Europe say the centre has only itself to blame. Donald Trump crows that Europe is on fire because its leaders spurned his advice, left their borders open and let millions of immigrants rush in each year, from Afghanistan, Algeria and Syria. Those on the MAGA right, such as Elon Musk, say growing Muslim populations pose the greatest threat. Some talk, apocalyptically and absurdly, of “civilisational erasure” or civil war. Even in Germany the chancellor, Friedrich Merz, said this week that high rates of migration and a failure to integrate the foreign-born are partly behind the sudden, violent upheaval. So has Hungary’s newish prime minister, Peter Magyar.","Their analysis is either craven or self-serving. Undoubtedly, many European voters also wish to curb immigration and asylum. But when it comes to the violent protests, the diagnosis is plain wrong. Instead the problems facing Europe’s centrists are more complex—and less easy to fix.","Even if some young protesters in France wear Algerian football shirts or chant pro-Palestinian slogans, the upheaval in Europe today is not about race or religion. Over 500,000 people marched in France on Saturday and they were largely unmasked and white. They were fired up, as in other countries, by the cost of living and poor public services. They want more fuel subsidies, more spending on schools, more handouts. Perhaps the largest group are aligned with the populist-left Jean-Luc Mélenchon, an ageing rabble-rouser and one-time Trotskyist, more akin to Bernie Sanders than an emir of ISIS.","Real violence did follow. But blame that on other factors, none to do with race. Mobs struck at public buildings, police cars and more. They also smashed and grabbed from luxury retailers, like Louis Vuitton, and small stores run by immigrants. The police failed to keep order, having earlier been accused of brutality against student protesters. And much of the violence was incited and orchestrated by anarchists, who have a revolutionary political agenda. Typical among them is a man arrested after the burning of a 19th-century town hall in Limoges, a white French citizen in his mid-30s.","Although the critics are wrong, Europe’s centrists do face real problems—and France shows how serious they are. The first is the fiscal bind that makes effective political action so hard. When Emmanuel Macron, the president, faced huge protests by the gilets jaunes in 2018-19, he could deploy billions of euros to placate them. Today, that is no longer possible. France is spending too much and growing too slowly—by just over 1% a year under Mr Macron.","This autumn, lawmakers will struggle to pass a budget that cuts the deficit by a feeble 0.4 percentage points, to an unsustainable 5% of GDP. And still the government may fall. France is so overborrowed, and markets have so little faith in its politicians, that spreads of French government bonds over German ones have soared to levels last seen during the euro crisis.","Instead of rising to this challenge, the centrists seem out of ideas. The Economist once cheered Mr Macron as a bold new standard-bearer for radical centrism. Today, while centrists huddle together for protection, all the energy is at the extremes. Surveys say over 80% of the French are pessimistic about their future, especially about their economy. Mr Merz is deeply unpopular and may be forced from office. His anti-migrant sniping reflects his inability to find the words and ideas to see off Ms Weidel and her party, the Alternative for Germany.","No wonder the centrists face an electoral walloping. Polls show that Pedro Sánchez, the centre-left prime minister in Spain, will probably be turfed out soon to be replaced by a coalition of the centre- and populist right. In France the riots—and the myth that immigrants were to blame—may lift Ms Le Pen of the populist-right National Rally into the presidency in May. Polls show that the violence boosted her this week. While Mr Macron jetted off on a trip to the Gulf, Ms Le Pen gave a presidential-sounding speech calling for public order.","The violence in France should jolt head-in-the-sand centrists to confront the consequences of failure. If their countries descend into strife, they will lose power. If they lose power, the European Union will choke, as the rest of the world races ahead. If bond markets seize up, financial contagion could spread. If EU countries indulge Vladimir Putin of Russia, he will only become more aggressive. Dangerfield was writing about a time when most people were ignorant of the catastrophe that lay ahead. Today’s liberals have no such excuse. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/10/22/the-agony-of-liberal-europe"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.10.26","day":97,"title":"Briefly Noted","source":"The New Yorker","minutes":10,"tag":"The Critics","dek":"","note":"2026.10.26","paragraphs":["On and Off the Menu","Louise Glück’s Life in Restaurants","The Nobel Prize-winning poet made an art of being a regular.","By Hannah Goldfield","Glück was a fixture at Celeste, a tiny restaurant in Somerville, Massachusetts. “If anything was off—the salt, the lime, the fish—I would get a text,” the owner said affectionately.Photo illustration by Jason Fulford and Tamara Shopsin; Source photograph by Gerard Malanga","If Maria Rondeau and JuanMa Calderón were literalists, they might have put nasturtiums on the menu at Rosa y Marigold, the Peruvian restaurant they opened in April, in Boston. They took the name from the novella “Marigold and Rose,” the final book published by their friend Louise Glück, the Nobel Prize-winning poet, before she died, in 2023. The story is told from the perspective of infant twins with divergent personalities—Rose is unguardedly buoyant, whereas Marigold is watchful and introspective. “The garden relied on nasturtiums, which Mother and Father ate,” the narrator observes. “It was strange to see the grilled fish with nasturtium butter melting over it. . . . But once you try it, Mother said, the taste is magic. The twins knew what magic was. It made the sun rise. Now they knew it had a taste.”","Rondeau, who grew up in Guatemala, is an architect; Calderón, her partner in life and in restaurants, is a filmmaker and chef from Peru. In September, I sat at Rosa y Marigold’s sleek U-shaped bar with Rondeau and the poet Dan Chiasson, a regular contributor to this magazine and another close friend of Glück’s, sharing thin strips of charred beef heart, tendrils of squid blanketed in a silky, lavender-hued olive mayonnaise, and a formidable mound of chaufa de mariscos—Chinese Peruvian seafood fried rice. To drink, Chiasson ordered his usual, a gin Martini, recalling fondly how Glück would fish the olives out of his glass. As an epileptic, she abstained from hard liquor, but she loved the flavor.","“The whole book is about this idea of duality,” Rondeau said. “It’s an allusion to her two grandchildren”—Glück’s only child, Noah Dranow, is the father of twins—“but it’s also Louise. I think many people are two sides.” Rondeau designed Rosa y Marigold’s dining room to have two sections, each with a mirrored-steel slab hanging overhead, slightly angled to offer a glimpse of the other side.","That afternoon, we’d visited Celeste, the couple’s first restaurant, which they opened in the spring of 2018 in a tiny triangular storefront in Somerville. Glück, whose apartment was nearby, soon became a regular, with a regular order: a cold beer, the arugula salad with lime and Parmesan, and the ceviche, sometimes followed by the sudado de pescado, a Chinese Peruvian dish of steamed fish and vegetables. She always came with a friend, occasionally two, and often requested that the music be turned down.","The couple knew little about her until, one day, Glück left behind an envelope return-addressed to Yale, and Rondeau looked her up, to get it back to her. After that, Glück made her reservations with Rondeau directly. “If anything was off—the salt, the lime, the fish—I would get a text,” Rondeau said affectionately. “She had a perfect palate!” Chiasson added. “She was our in-house critic,” Rondeau continued. “And I would always be extremely grateful, because she kept it real.”","One evening, Rondeau and Calderón mentioned that they’d been approached about writing a cookbook. The next time they saw her, she handed them a typewritten foreword, detailing how she’d first encountered Celeste in Boston magazine, which had published a photo of the ceviche. “It was a summer day and I wanted that ceviche immediately,” she wrote, admiring how it was “not drowned by the chef’s noisy creativity in shards of coconut or a confetti of pomegranate seeds / A very pure looking dish of glistening blue cod.” At the restaurant, Glück became “more like a citizen” than a regular, she wrote. “And Celeste is a world. But a world so much more wonderful and reliable than our real world.” Glück ate dinner at Celeste on the day she won the Nobel, surrounded by friends of Rondeau’s and Calderón’s, whom they’d invited to insure her privacy.","I first learned about Glück’s passion for restaurants in the spring of 2020. At the time, I was this magazine’s weekly restaurant critic, and I had shifted, suddenly, from dining out all over New York City to chronicling the industry’s attempts to stay afloat during lockdown. Glück e-mailed me to commiserate, and to ask if I had ideas for how to help. “Among so many horrors, the collapse of these enchanted worlds seems somehow desperately poignant,” she wrote.","I was lightly shocked to hear from her. I knew and revered her as one of the great living poets, and imagined her as particularly godlike, too high-minded to care about something as earthly as food. There was also the fact that she had struggled with anorexia as a young woman, which she wrote about in her 1989 lecture “Education of the Poet.” We struck up a sporadic correspondence. “I love to cook and have been a terrific and fastidious home cook,” she wrote with refreshing candor, but she yearned for the ritual of dining out. (Later, I learned that she’d bought a heat lamp for Celeste so that she could eat there outdoors.)","In “Education of the Poet,” Glück, who was born to a wealthy family in New York, in 1943 (her father, a Hungarian Jewish immigrant, helped invent the X-Acto knife), described her anorexia as an attempt to “establish a self with clear boundaries.” “The conflict played itself out most fiercely with my mother,” she wrote, who “only wavered when I began to refuse food, when I claimed, through implicit threat, ownership of my body, which was her great accomplishment.” By all accounts, Glück’s mother, Beatrice, was a wonderful cook; Glück’s papers, archived at Yale’s Beinecke Library, make clear that she grew up among people who loved to eat. In one letter from summer camp, addressed to her younger sister, Tereze, Glück wrote, “I miss—sundaes, shrimp cocktails,” next to tiny sketches of each.","Glück recovered from anorexia through years of psychoanalysis—years during which she also studied poetry with Léonie Adams and Stanley Kunitz. She published “Firstborn,” her début collection, in 1968, when she was twenty-five. Later letters detailed lavish hotel meals in Europe with her first husband and dinner parties in Plainfield, Vermont, where she taught writing at Goddard College and worked part time at a café, baking pastries in exchange for child care. (Noah, her son, grew up to be a sommelier.)","In 1980, John Dranow, Glück’s second husband and the director of the writing program at Goddard, co-founded the New England Culinary Institute, a small cooking school that operated restaurants in Montpelier. Glück sat on the board of directors until the nineties, when they divorced and she moved to Cambridge. In one poem from “Meadowlands,” an unsparing, darkly funny collection from that time, an unidentified husband and wife argue over food. “I stopped liking artichokes when I stopped eating / butter. Fennel / I never liked,” he says. “Living with you is like living / at boarding school: / chicken Monday, fish Tuesday.”","“Why do you call it rigidity?” she retorts. “Can’t you call it a taste for ceremony? Or is your hunger for beauty / completely satisfied by your own person?” The husband has the last word, accusing her of joyless pleasure-seeking: “When you make artichokes, / make them for yourself.”","The word “poet,” Glück wrote, “must be used cautiously; it names an aspiration, not an occupation. In other words: not a noun for a passport.” She could go years without writing, though she rejected the notion of writer’s block, perceiving instead a liminal state of waiting for poems to arrive. During fallow periods, Glück occupied herself with teaching, which she loved, gardening (she claimed to have read nothing but catalogues for two years), and eating at restaurants. “Dinner takes a certain shape,” the poet Katie Peterson, who ate with her frequently at Chez Panisse when Glück taught at Stanford, observed. “A familiar menu is like a rosary.”","In Cambridge, Chiasson pointed out Koreana, the restaurant where he, as a worshipful Harvard grad student, had first spotted Glück, in 1997, having dinner with the poets Robert Pinsky and Frank Bidart. (Bidart, Chiasson’s mentor, eventually introduced them.) Chiasson showed me an unpublished poem that he’d written for Glück after she died: “back before anything happened / yet it was still the bitter end / three poets sat around a lazy susan / kimchi, Tsing Tao, bibimbap, gossip.”","Earlier that day, we’d dropped in on the poet Henri Cole, in Boston’s South End. The two men, who had each shared countless meals with Glück, but never together, delighted in comparing notes, remembering her habit of sampling several wines before inevitably choosing something crisp and dry; her insistence that no meal was complete without greens; and the decisiveness with which she could turn on a place she’d loved. She almost always ordered the fish. She almost never ordered dessert, but would happily pluck the raspberry off of someone else’s crème brûlée. She preferred to eat early, and would wait outside her home, ready to be picked up.","Chiasson and Cole had last seen each at La Royal, another of Rondeau and Calderón’s restaurants, at a memorial for Glück, packed with her dinner companions. When Rondeau first told Glück, in 2021, that she and Calderón were considering opening a new place, Glück advised against it, then immediately changed her mind on a visit to the empty storefront, in a beautiful brick building from 1910, facing Royal Avenue in Cambridge. Not long before she died, Glück weighed in on the menu—both the dishes served and the printed layout—and chose the restaurant’s name.","Chiasson theorized that his friend’s love for both restaurants and poetry stemmed from her interest in “primal urges.” “We build these institutions to contain them and express them,” he said. “Marriage, restaurants, homes—they’re frames for containing all this passion.” In 1999, Glück imagined a creation story of sorts, describing small worlds that appeared in the fissures of a larger, shattered one. “On Huron Avenue they became / a block of stores,” she wrote, “whatever / they were or sold, they were / alike in their function: they were / visions of safety. Like / a resting place.” She called the poem “Formaggio,” after her favorite cheese shop, in Cambridge. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.10.31","day":98,"title":"The Americans changing politics for the better","source":"The Economist","minutes":5,"tag":"Leaders","dek":"Hispanics and Asians have become their country’s most dynamic swing voters","note":"2026.10.31","paragraphs":["MIDTERM ELECTIONS are always a referendum on the sitting American president, but rarely has an incumbent so wilfully put himself in the spotlight in defiance of his own unpopularity. As the campaign ends, Donald Trump is commandeering rallies in Republican strongholds, a sign of his party’s vulnerability and his unwavering faith in his own star power. Away from the spotlight, however, something more surprising—and more important—has been happening: Hispanics and Asians have emerged as America’s most valuable voters.","The curse of American politics is its bitter partisanship. As voters have sorted themselves along racial, educational and geographical lines, the parties have spent less time trying to win converts from the other side and more whipping their own supporters into a permanent frenzy: 70% of Republicans are hostile towards Democrats and more than 80% of Democrats return the favour. The result is a style of politics that tugs public life towards the extremes, punishes compromise and puts getting people angry above getting things done.","Hispanic and Asian-American voters offer the best hope of arresting this baleful trend. They have become America’s crucial swing voters, with an outsize impact on races across the country. Compared with other blocs, their numbers are growing faster, their ideology is more fluid and their priorities are less divisive. That means they are likely to be good for America not just in these midterms, but also for many elections to come.","The biggest force on November 3rd will be Mr Trump’s unpopularity. His national net-approval rating stands at -27 points. The president is predicting victory in “record numbers”, but our forecast model suggests Democrats have a 95% chance of winning back the House and a 54% chance of taking the Senate. Polling puts Mr Trump underwater on every policy, from inflation to immigration. His great vulnerability is that voters blame higher bills on his fondness for tariffs and his choice to go to war with Iran.","The backlash has created openings for Democrats in states such as Kansas and Iowa, where even contemplating a blue victory would once have got Republican strategists sacked. Disenchanted rural voters who chose Mr Trump in 2024 may stay at home this time, as a protest against high diesel prices and poor markets for their crops. Polls say Democrats are winning back the young and peeling off working-class whites.","It would be good for America to have more battleground states. If Democrats win in places like Kansas and Texas, the power of incumbency could make them competitive in future elections, too. No group captures the potential for opening up politics as much as Hispanics and Asian-Americans.","One reason is demography. They are a growing fraction of the population—especially Hispanics, who are three times more numerous than Asian-Americans. Since 2006 their combined share of the electorate has increased by nine percentage points, to reach 21%. They are also highly diverse. The grandchildren of an immigrant from Ho Chi Minh City have a different outlook from a new arrival from Bangalore. Neither fits neatly into the familiar Democrat-Republican template.","And they are more likely to switch their votes. In 2012 Democrats thought they had a lock on Latinos and Asians. In 2024 the story was how they were becoming Trumpian. It has now become clear that they were swing voters all along.","White voters changed little between 2020 and 2024, while both Latinos and Asians lurched hard to the right. They were then the fastest to turn against Mr Trump in early 2025. The margin of support for Democrats has risen by 17 points among Latinos and 14 among Asians since 2024, compared with ten for whites and five for black voters. They are likely to help decide House races from suburban New York to Florida as well as Senate contests in Alaska, Kansas and Texas.","Part of the explanation for this is that these voters are the epitome of striving Americans who want to work hard and get ahead. Higher prices for food and fuel hit Hispanic voters particularly hard; housing costs affected Asian voters. Latinos are more than twice as likely to start businesses as white voters. Asians are likely to spend more time in education.","Many are recent arrivals or the children of immigrants, so their opinions have not yet hardened along party lines. In contrast to the rest of the voting population, if Hispanics and Asians hold one left-leaning position, they will not necessarily endorse others. Likewise, wanting a secure southern border does not equate to support for the hardline enforcement that has frightened Hispanic employees into staying away from work.","Instead, many are moderate. They have little truck with culture wars or polarisation. The economic policies they care about diverge from the tribal messages the parties use to stir up their bases. Whereas policies on abortion and trans rights are set at the extremes, economic management is suited to the swing voter’s pragmatic preference for the common good.","Almost anything that gives the parties a reason to appeal to the centre will benefit America, especially when it involves the virtues of hard work and prosperity. Democrats will need a winning economic message and a coherent plan for immigration. Republicans should reject their ferocious deportations and the ugly ultranationalism that denigrates Hispanic and Asian citizens for not being “heritage Americans”.","All Americans should therefore welcome these new swing voters. Thanks to them, fewer elections will be decided by hard-core party members in primaries, and more by the average voter in the general election. If politicians win more credit by accomplishing something in government, they will perhaps spend less of their time demonising the other side. If the economy seems to matter more and culture wars less, America will be more prosperous and better governed. Hispanic and Asian immigrants want the chance to thrive. Their votes will help ensure America thrives with them. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/10/29/the-americans-changing-politics-for-the-better"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.11.02","day":99,"title":"The Fragile Unions of “Possible Love”","source":"The New Yorker","minutes":9,"tag":"The Critics","dek":"","note":"2026.11.02","paragraphs":["By Justin Chang","The South Korean writer and director Lee Chang-dong makes beautiful films about terrible things. The question that haunts his stories, giving them a pulsing undertow of dread, is whether those things have already happened or not. In “Secret Sunshine” (2010), a young widow moves to a new town with her son; tragedy has scarred them both, but the film, relentless in its ability to surprise, has even graver ills in store. “Peppermint Candy,” which had its première in 1999, unspools a nightmare in reverse: it opens with a man’s suicide, then rewinds gradually, through two decades of accumulated agonies, to reveal how he got there. In Lee’s movies, time tends to flow inexorably in a single direction, sans flashbacks (or flash-forwards). We see the characters’ histories in their anxious posture, their stricken faces, their frustrated yearning for a glimmer of transcendence.","Time works a bit differently in “Possible Love,” Lee’s first feature since the masterly psychological drama “Burning” (2018). The pain of this story lies squarely in the past, and Lee, who wrote the script with Oh Jung-mi, proves more willing than usual to bridge the gap between then and now. The outset is linear enough. We are in an unnamed town where, two years earlier, a manufacturer named SP Heavy Industries laid off forty per cent of its workforce. The workers organized a strike, but their efforts were brutally suppressed. Among the terminated is a welder, Choi Ho-seok (Sul Kyung-gu), who wears a frown so implacable that it might have been etched in steel. He has since found another manufacturing job, and his sharp-witted, warm-spirited wife, Mi-ok (Jeon Do-yeon), works at a protective-face-mask factory. They have a young son, Cheol, an ordinary kid with a telltale core of solemnity. The Chois can’t shake their memories of more prosperous times, or of the profit-motivated culling that brought them to an end.","They are not alone in their trauma. We meet the Chois on their way to a memorial gathering for a former colleague of Ho-seok’s who took his own life. The grief of those in attendance goes beyond one death; they seem zombified by their anguish. One woman, though, stands calmly apart. Her name is Lee Ye-ji (Cho Yeo-jeong), and she’s shooting a documentary about laid-off workers. Ye-ji is an amateur but she has a muckraker’s instinct for drama. When Mi-ok whisks a cup of soju away from Ho-seok—he’s an alcoholic, and has promised never to drink in public—Yeji, anticipating an outburst, thrusts her lens into the fray. “Do we amuse you?” Ho-seok growls at her. She apologetically lowers her camera, though not for long. She knows there’s a story here, and Lee does, too.","Despite this inauspicious start, Mi-ok and Ye-ji become fast friends. So enlivened are they in each other’s company—and so gracefully does Jeon’s performance harmonize with Cho’s—that you’re tempted to forget Ye-ji’s ulterior motives. But Mi-ok is never blind to them, or to another complicating fact: her new friend is very wealthy. At one point, she calmly calls her out for wearing a pricey-looking shirt while interviewing people who’ve been laid off. Ye-ji has a hunky hedge-fund-type husband, Sang-woo (Zo In-sung), who condescendingly tolerates, but doesn’t finance, his wife’s cinematic caprices. Seeing her attempt to empathize with her subjects, Sang-woo extends the most backhanded of compliments. “You’re different from those people. But you yourself believe that you’re the same,” he says. “That’s great.”","Ye-ji blanches at that jab but only tightens her grip on her project: the Chois are to be the battered working-class foundation of her vérité masterpiece. Ho-seok wants no part of it. Inarticulate with self-loathing, he can scarcely drag himself to his ex-colleagues’ regular group-therapy sessions, let alone unburden himself on camera. But Mi-ok is game to be interviewed, and her words spring to life in wistfully lovely flashbacks. Here she is as a young girl, witnessing, for the first time, the depths of her mother’s working-class shame. And here she is as a teen-ager, catching the eye of a brashly confident Ho-seok, and sensing, with a thrill, that her sheltered world has finally burst open. The first time I saw “Possible Love,” these forays into the past, for all their dewy poignancy, felt like missteps—a rare concession to the backstory gods. Only on a subsequent viewing did I see the craftiness in Lee’s design: Are these Mi-ok’s tearily recalled flashbacks? Or are they being imagined by Ye-ji, eager to transform her subject’s every reverie into a reënactment?","All of which is to say that “Possible Love” is a multitasking marvel: a drama about the fragility of unions, in every sense, wrapped in a seminar on documentary ethics, but one with implications for the fiction realm, too. In an interview, Lee has said that it’s no coincidence he and Ye-ji share a surname, however common. He employs a lightly jostling handheld camera that insidiously mimics the formal syntax of Ye-ji’s documentary—and, in so doing, leaves the mere idea of authorial objectivity by the wayside. (The cinematographer is Kim Ji-yong.) Lee seems to be acknowledging his own potential for dramatic exploitation, if not of his characters, then of the events that inspired the story—an automaker’s restructuring in Korea in 2009 that threatened thousands of layoffs, leading to both a strike and a police crackdown. Lee knows that the liberties of fiction do not absolve him of a responsibility to tell the truth.","No wonder some of the film’s most piercing moments are on the periphery. One woman in a group-counselling session recalls the joyous early days of the strike, with their almost sacred spirit of community: “In all my life, I’ve never felt such happiness.” Another speaks of dreading the elevator in her building, lest she run into neighbors who still work at SP Heavy. Lee’s films have often zeroed in on misfits and outcasts, cut off from society’s embrace. What he evokes here is a different kind of alienation, suffused with bitterness and loss: a mass- casualty event that once brought people together must now be suffered in isolation. The boldest declarations of solidarity, Lee knows, often precede the quietest and cruellest of betrayals.","After the film’s première, at the Venice International Film Festival (where it won the Silver Lion Grand Jury Prize), more than a few observers invoked another class-conscious, double-decker marriage story from Korea: Bong Joon Ho’s “Parasite” (2019). (In both films, Cho Yeo-jeong, evidently cursed with resting rich face, plays the wealthier of two wives.) Lee’s contemplative realism could hardly be further removed from Bong’s blood-slicked flamboyance, but let’s indulge the reductive comparison. Like “Parasite,” “Possible Love” leads us into an enviable piece of real estate—Sang-woo’s family vacation home, a beachside paradise that was built for knotty third acts. But Lee, who has been known to gut his characters in the final stretch, doesn’t raise the body count to Bongian proportions. There is violence here, but it comes at us obliquely, with no inflection or exaggeration—in a sex scene that shivers with menace, or through a grimly mediated screen of documentary footage. Physical force has a hundred ways to shock and linger, but, crucially, it isn’t granted the last word.","The title asks whether love can survive what life throws at it: unemployment, depression, addiction, disappointment, poverty. A superficial glance would conclude that Ye-ji and Sang-woo are a dream couple, yet the more we see of them, the more glaring their lack of emotional capital. Miraculously, though, whenever the camera shifts to Ho-seok and Mi-ok—whether they’re bickering on their way home or scarfing down late-night snacks on the kitchen floor—love feels not just possible but plausible. Sul and Jeon have admittedly had plenty of practice; this is the third movie, after “I Wish I Had a Wife” and “Birthday,” in which they’ve played a couple. Both actors have also worked with Lee before, to tremendous effect. Sul was the suicidal protagonist of “Peppermint Candy,” and Jeon was the grieving heroine of “Secret Sunshine”—two performances that, for sustained emotional force, have few rivals in the acting annals of this century. They, too, are part of the past that haunts “Possible Love.”","Faced with such a high-stakes reunion, the actors, wisely, rise to the challenge with exacting understatement. You keep waiting for Sul to explode, but Ho-seok’s sadness lies beyond histrionics, and we realize that he isn’t angry or distant by nature; his decency cost him almost everything, and he now wields detachment as a shield against further harm. Without his wife to chide and console him, where would he be? Mi-ok feels her family’s losses acutely, but her impishly defiant spirit—watch as she tells her boss she’s starting a union, almost on a whim, like a goofball Norma Rae—has armored her against despair. And Jeon, in the most intricately detailed and emotionally liberated performance I’ve seen this year, gives flesh and definition to the character’s sardonic sense of mischief, her sudden spasms of grief, and her deep understanding that the most romantic gestures can be the most pragmatic. Hence the gorgeous moment when Mi-ok joins Ho-seok for a nightcap under the stars—secret moonshine—and affirms that, in the face of insurmountable problems, enduring them together is their only solution. “Drinking without you, it’s so bitter,” Ho-seok says. Solidarity forever. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.11.02","day":100,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.11.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true}]};
