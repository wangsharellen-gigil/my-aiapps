ses voters from all parties.","Yet policymakers should reconsider. The question of whether social media are causing mass harm is far from settled. Growing evidence suggests they are bad for at least some children. But, as we explain this week, the claim that social media cause great damage to the mental health of young people as a whole has only limited evidence. And even if you wanted to ban social media as a precaution pending conclusive findings, such measures threaten to be counterproductive.","One problem is that enforcing bans is hard; teenagers in Australia are finding ingenious ways to get round them, by scrunching up their faces to look older. Defining social media is hard, too. Australia has not banned young teenagers from messaging apps such as WhatsApp, or from multiplayer online games, because that would have seemed too draconian; scourges such as cyberbullying will doubtless continue on these. Kids barred from mainstream sites could flock to obscure ones, and fall victim to predators there. Children who evade the blocks may be less likely to tell adults if they find something horrid, for fear of being told off.","Higher age limits may just delay problems until youngsters are 16, when they will suddenly gain full access to social sites that they do not have much experience of using. And all the while, higher age limits for social media may provide a false sense of security. It is for all these reasons that bans are often opposed by child-protection groups.","Moreover, the proponents of bans ignore how they would deprive children of the benefits of social media. They are a blessing to children who feel isolated: perhaps because of their location, their sexuality, or because their brains work differently from those of others. Social media can broaden young minds, giving children from all backgrounds a window onto fresh places and people. Like it or not, social sites are now one of the main ways children obtain information (as well as misinformation) about current affairs. It used to be easy for youngsters to pick up their parents’ printed newspapers. They sat through news bulletins aired before or after their favourite shows. Those days are no more.","Teenagers who are turfed off TikTok will not instantly begin climbing trees or poring over books. Many will slump for longer in front of games consoles and streaming services. One reason they spend so many hours online is that parents long ago stopped letting them hang around outside with friends. Having chased them indoors, adults should now think twice about placing further prohibitions on their free time.","What to do? Rather than raise age limits, regulators should redouble efforts to make social sites more suitable for teens. Ideally they would force web firms to cough up more data on how teenagers use their products—the better to help researchers measure harms, and come up with ways to prevent them. They should tell tech giants to rethink features that are keeping kids online longer than is healthy, such as interfaces that permit endless scrolling and videos that play without prompting. They should demand sterner moderation of the content being served up to young users. This may require greater efforts to verify the age of social-media users, in order to work out which ones must surf with guardrails and which are adults who may go without.","Some observers find these ideas laughable. One reason people demand higher age limits is that they believe social apps cannot be made safer. That ignores the direction of travel. America is gearing up for a series of blockbuster trials—years in the making—that will finally give people who say they were harmed by sites as children a chance to make their case in court. The European Union has just issued a preliminary ruling that features of TikTok’s design are “addictive” and threatened fines if it doesn’t change. Lately, many of the big social apps have been cajoled into creating “teen” accounts that come with additional safeguards. These things will not solve every single worry. But all of them are progress of a sort.","Politicians say their social-media bans are the only responsible option. In fact, they look like a way of ducking the care children deserve. If regulators cannot find ways to tame social media—now over two decades old—what hope is there to let children use novel tools such as artificial intelligence? Youngsters have a right to share in new technologies. Adults must seek to make their time online as safe and as rewarding as possible. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/02/12/dont-ban-teenagers-from-social-media"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.02.16","day":10,"title":"Is There a Remedy for Presidential Profiteering?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.02.16","paragraphs":["Until now, Trump always seemed unembarrassed to crow about his side hustles. But, if the Emirati payment was kept secret, what else might be?","In some ways, “Melania,” the new documentary about Melania Trump, feels almost avant-garde. It rejects everything we normally associate with the commercial success of a bio-pic: narrative, suspense, authenticity, even one unguarded moment. But in another way it’s bracingly honest. President Donald Trump and his wife have made no effort to hide that, over a dinner at Mar-a-Lago shortly after the 2024 election, she personally pitched the project to Jeff Bezos, the founder of Amazon, who has vast financial interests in government contracts and antitrust policy. Nor have the Trumps dissembled about Amazon’s payment of forty million dollars for the rights to the film—more than twice as much as the second-highest bid—with twenty-eight million reportedly flowing directly to the First Lady.","President Trump has been less up front about a far larger payment—negotiated at about the same time that his wife was pitching “Melania” but revealed on its opening weekend—from the ruling family of the United Arab Emirates. That payment came through World Liberty Financial, a cryptocurrency business announced by Trump and Steve Witkoff, his friend and now his Middle East envoy, with five of their sons and two other executives, in September, 2024. (Trump and Witkoff are currently listed as “emeritus” co-founders.) World Liberty billed itself as “inspired by ‘Chief Crypto Advocate’ Donald J. Trump” with a mission “to leverage the global reach and recognition of the Trump brand” to get internet users into crypto. But its business plan was vague.","In October, 2024, World Liberty began selling digital tokens that gave owners a right to “vote on certain matters” about what the company might someday do, without conveying any ownership or share in potential profits. Before Trump won the election, the tokens predictably found very few buyers. The company did not yet have a track record, any revenue other than those token sales, or any apparent advantage (other than its Trump connection) over better-established competitors, so determining a fair market price for it would have been exceedingly difficult.","Yet World Liberty has now acknowledged that, four days before Trump’s second Inauguration, a company controlled by the U.A.E.’s ruling family agreed in secret to pay half a billion dollars for a forty-nine-per-cent stake in the nascent venture. According to the Wall Street Journal, which first reported the transaction, internal documents show that the Trump family immediately pocketed about a hundred and eighty-seven million dollars, the Witkoffs thirty-one million, and the two other executives another thirty-one million, with a second payment of two hundred and fifty million dollars expected six months later. (The Journal could not determine how the second payment may have been distributed.)","In May, between the two payments, Trump, overruling objections from his national-security advisers about Emirati ties to China, approved a huge sale of cutting-edge A.I. computer chips to the U.A.E. (A spokesman for World Liberty said that the President and Steve Witkoff had not had “any involvement whatsoever” since the election and that the Emirati deal had nothing to do with Trump’s decision about the chips. Trump told reporters that he does not know about the investment and that his sons “are handling that.”)","It is well documented that Trump and his immediate family have exploited the Presidency for personal profit on an unprecedented scale. Last summer, The New Yorker calculated that over the past decade those profits came to $3.4 billion. Six months later, at the end of his first year back in office, that tally had climbed to more than four billion. But the Emirati payment raises novel questions, beginning with the Constitution’s prohibition against officeholders accepting any “present” or “emolument” from a foreign state without congressional consent. In Trump’s first term, his lawyers contended that renting hotel rooms at Trump properties to foreign states was not the kind of “emolument” that the Founders had in mind. They argued that this was a “fair value” exchange and that, in any case, Trump donated the profits to the U.S. Treasury.","Trump did abstain from new business deals outside the U.S. in his first term. In his second, he has abandoned such scruples. Yet the Trump Organization maintains that it still avoids deals with foreign governments—a claim the Emirati payment appears to vitiate. Will Trump say that it, too, was a “fair value” exchange and donate the profits?","Then, there’s the secrecy. The sheer brazenness of the Trump family’s operations has been in some ways Trump’s strongest defense against charges of corruption. Because Presidents cannot be expected to jettison all their financial ties, government ethics rules rely mainly on public disclosure to allow voters, and their elected representatives, to judge whether a President puts personal interests ahead of the public’s. And, until now, Trump always seemed unembarrassed to crow about his side hustles. But, if the Emirati payment was kept secret, what else might be? Both World Liberty and Trump Media & Technology Group, the company behind Truth Social, have brought in hundreds of millions of dollars from unnamed investors over the past year. Neither the companies nor the President has disclosed the sources of that money.","In the run-up to the 2020 election, Bob Bauer, who was a lawyer in the Obama White House, and Jack Goldsmith, an Assistant Attorney General under President George W. Bush, published a book, “After Trump: Reconstructing the Presidency.” In it, they offered reforms to curtail the opportunities for the abuse of executive power that Trump’s first term had exposed—opportunities that his second term has taken to extremes. To address potential financial conflicts of interest, one proposal would require Presidents to certify that they have fully removed themselves from any role in any private businesses in which they own stakes, with no access to information about them that is not also available to the public. A second would force any such business to disclose its assets, liabilities, and other stakeholders (precluding a secret investment by a foreign government). A third would give teeth to the emoluments clause: any business connected to a President would be required to publicly report any expected payment or benefit from an arm of a foreign state. If Congress did not consent to it within sixty days, a President would be forced to sell off that interest.","Such measures are, of course, out of the question as long as Trump has a veto. But most of our current government ethics rules date back to a bipartisan backlash after the Watergate scandal. It is hardly impossible that Trump’s self-enrichment, at four billion dollars and counting, might yet trigger a similar wave. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.02.21","day":11,"title":"Don’t go after the rich to fix broken budgets","source":"The Economist","minutes":6,"tag":"Leaders","dek":"It will not work, and is wrong in principle","note":"2026.02.21","paragraphs":["America’s top 1% enjoy a fifth of the economy’s income and pay nearly a third of its federal taxes. Many politicians think they should cough up much more. Zohran Mamdani, New York’s mayor, wants a new 2% city levy on incomes over $1m. Virginia, Rhode Island and Washington state are weighing up similar measures; Californians are likely this year to vote on a “one time” 5% levy on billionaires’ wealth. In Europe, too, there is a similar clamour to target the wealthy. France has seen a popular campaign for a wealth tax. And with Sir Keir Starmer weakened or doomed as prime minister, the left wing of Britain’s Labour Party may implement one of its own.","The “Robin Hood” state, which takes from the rich to give to the poor, has obvious appeal. Governments across the developed world are strapped for cash. Budgets are burdened by legacy debts, ageing populations and the need to spend more on defence. But few politicians will countenance raising broad-based taxes at a time when voters, scarred by the high inflation of the early 2020s, are worried about affordability. Booming stockmarkets, meanwhile, have reinforced the idea that inequality is too high. And it always sounds good to say someone else will foot the bill.","Yet plans to fill budgetary gaps by raising levies on the rich are flawed. Taxes are one way governments can redistribute income from the rich to the poor. But that is not their only function: they must also raise revenue without distorting the economy. The system today is failing on all counts. Arguments that high earners do not pay their fair share are mostly empty. And squeezing the rich further will raise trifling sums of money, while causing real economic damage.","Consider revenues first. There are simply not enough fat cats to fund welfare states by themselves. The proposed wealth tax in California would raise about 2% of the state’s annual output—not much for a swingeing one-time levy in the place with one of the world’s greatest concentrations of billionaires. The figure for Mr Mamdani’s proposal is around 0.25% of output annually. The limited revenue-raising power of the rich is why European governments have to fund their big spending with broad-based levies, such as taxes on consumption. By contrast, America, with its low overall tax burden, can get by with one of the world’s most progressive tax systems.","Loopholes benefiting the very wealthy should certainly be closed. The biggest problem in the American tax system is at the very top. The resetting of the basis for capital-gains tax upon death allows billionaires who hold on to assets, borrowing against them to fund spending, to avoid the levy entirely. The dodge is outrageous. Yet ending it would yield only a tiny amount of money, probably less than 0.1% of GDP annually. The same goes for raising inheritance tax, a good tax that has never generated much money.","Another problem with increasing taxes on the rich is that it damages the economy. True, it would take a lot to stop bankers and lawyers turning up for work. Yet in New York they already face a combined federal, state and local top tax rate of 52%. And the cumulative impact of such levies on risk-taking, enterprise and innovation—the lifeblood of economic growth—may cause real harm. Recent research finds that facing a one-percentage-point higher income-tax rate reduces the likelihood that someone will file a patent in the following three years by 0.6 percentage points. This loss of entrepreneurial effort hurts society more than it hurts innovators, who by one estimate capture just 2% of the value they generate.","You might think that the one unassailable argument for taxing the rich would be fairness. But even that idea is dubious. The presumption that governments have failed to ensure taxes on the rich keep up with their income is mostly wrong. The rich world does more redistribution than ever. In Britain, France and Japan income inequality has fallen after taxes and spending. Since 1990, America has offset much of the rise in pre-tax inequality with more redistribution. Taxes on the top 1% are higher, and spending on the poor, such as on health care, has grown. Besides, fairness is not just about making incomes equal. A fair system would also respect property rights, be reasonably predictable and allow people to reap the rewards of their efforts and risk-taking.","Of all the proposals, California’s most dramatically fails these tests. It looks more like the arbitrary seizure of property than progressive taxation. No one should expect the promise that it is a one-off levy to be honoured. It is a safe bet that the left will raid the same billionaires again the next time they have a programme to fund.","Broad-based taxes do not only raise much more money. They are also politically healthier. A society where the many pay tax and benefit from spending is stronger than one where the few have to pay for the many. If progress on artificial intelligence concentrates incomes at the top, as almost everyone in Silicon Valley expects, then the tax system will require fresh thinking. But that world, if it comes at all, is some way off.","Today, polls and experiments show that voters pay woefully little attention to the nasty side-effects taxes have on the economy. Without a personal stake in keeping taxes low, they are less likely to keep hare-brained public schemes in check. Only by exposing voters to both sides of the ledger can you expect them to pay heed to the benefits and costs of government spending, rather than always favouring more handouts.","At a time of rising public spending, it is dangerous to suppose that the rich can always just pay a little bit more. Yet most left-wing governments would gladly embrace their inner Robin Hood and raid away. When pressures on the public purse are great, it is tempting for leaders to reach for ways to raise revenue that, in the short term at least, impose the least political cost. Taxing the rich will wreak economic and political damage in the long term, however—and will fail even to bring in the revenue that governments need. Emulating Robin Hood and his merry men might look tempting. But it is a trap. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/02/19/dont-go-after-the-rich-to-fix-broken-budgets"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.02.23","day":12,"title":"Why We Can’t Stop Reading—and Writing—Food Diaries","source":"The New Yorker","minutes":10,"tag":"The Critics","dek":"","note":"2026.02.23","paragraphs":["Spending a day in someone’s kitchen can tell us about their relationship to time, money, pleasure, and place.","By Hannah Goldfield","Nigel Slater, Ruth Reichl, and countless others have tried to measure their lives in meals.Photo illustration by Jason Fulford and Tamara Shopsin","On November 21, 2020, a young woman in Brooklyn named Tanya Bush began to keep a diary of sorts. On Instagram, under the handle @will.this.make.me.happy, she posted a photo of a craggy yellow pastry that fit perfectly in her palm. “No. Buttermilk scones with lemon zest do not alleviate anxiety,” she captioned it. On December 4th, she posted again, declaring, beneath an image of a sugar-ringed cookie perched between her thumb and forefinger, “No. Pecan shortbread did not help me reconcile my massive ego with my meager sense of self.” January 7, 2021: “No. Milk chocolate tart with hazelnut praline, devoured in the wee hours of the morning in a stress-induced panic, did not begin to ease my outrage at a congressional adjournment less than twenty-four hours after an attempted coup.”","Baked goods were not making Bush happy, she affirmed repeatedly in the following months, compiling a deadpan catalogue of tantalizing desserts. And yet, as she details in her forthcoming cookbook, “Will This Make You Happy: Stories & Recipes from a Year of Baking,” her commitment to baking, and to recording what she produced and ate, ultimately changed her life. “I was twenty-three, depressed, unemployed, and adrift. I just wanted to make something,” she writes. “Sometimes a single year can mark a sudden and definitive shift. In this one, I decided to become a baker.”","The book forfeits the puckish immediacy of Bush’s Instagram dispatches for more earnest, effortful prose. “I devoured slice after slice alone, feeling sticky, ethereal joy,” she writes, about baking banana bread during a spell of malaise. She charts her aspirations—and her romances, with characters she calls The Boyfriend and The Crush—through the seasons, as she moves from her home kitchen to an ill-fated internship in Italy to her first professional baking gig. (She is now the pastry chef at the Brooklyn restaurant Little Egg and married to The Boyfriend.) Recipes for dark-chocolate-and-toasted-coconut cake, soba-cha panna cotta, Concord-grape clafoutis, and other confections punctuate her drifting between listlessness and purpose.","The conceit of narrating a year in one’s life through the toils and sensations of the kitchen is one that many have taken up before. In the early two-thousands, the British cookbook author Nigel Slater set out to write a daily guide to seasonal eating; the resulting book, “The Kitchen Diaries” (2005), reads more like a travelogue, inviting the reader into the dulcet rhythms of Slater’s life in North London. “It is not unusual for the little stone terrace outside my kitchen doors to have a pall of smoke over it at supper time,” he writes in the entry for August 18th, introducing a recipe for whole chickens on the grill. “Smoke imbued with thyme, garlic and rosemary that wafts around the ripening tomato plants and pots of geraniums.”","Often, the year of cooking is undertaken as a quest for meaning, as it was for Julie Powell, a bored twenty-nine-year-old secretary who, in 2002, started a blog about trying to make all five hundred and twenty-four recipes in the first volume of Julia Child’s “Mastering the Art of French Cooking.” Powell was writing about a quarter-life crisis as much as she was writing about food, threading profane asides and meandering tangents between her experiments with flaming crêpes and butter-slicked calf liver. On day one hundred and eight, Powell, who married her high-school sweetheart, presented poulet en gelée à l’estragon to a friend who happened to be in the middle of a steamy office romance. “Gwen has a weekend of explosive sex, then comes over to my house depressed and complains about being served aspic,” Powell wrote. “This is a situation that Julia would no doubt handle with aplomb. But Julia doesn’t hate aspic as I do. And she probably gets more sex.” (Child, who died in 2004, was said to have been turned off by Powell’s salty language.)","When Ruth Reichl began recording a year of cooking, in 2009, she was despondent: Condé Nast had abruptly dissolved Gourmet, of which Reichl had been the editor-in-chief. Her cookbook, “My Kitchen Year: 136 Recipes That Saved My Life,” released in 2015, expanded on the melancholic, haiku-like tweets with which she’d chronicled her sudden glut of free time. “Chilly gray morning. Empty day looms. I will make ma po tofu sparked with the strange prickly heat of Szechuan peppercorns,” Reichl wrote, nine weeks after the magazine folded. The book illustrates how cooking, and writing about cooking, became therapeutic for her, how taking stock of tangible pleasures became an antidote to grief.","It was in a similar spirit that, in the fall of 2023, the food writer Tamar Adler, struggling with depression, began keeping a daily journal of things that delighted her: the “numbing bitterness” of a grapefruit, the “tongue tip” of a lit burner in a dark kitchen. Adler, a Chez Panisse-trained cook, is best known for her 2011 book “An Everlasting Meal: Cooking with Economy and Grace,” a reimagining of M. F. K. Fisher’s “How to Cook a Wolf,” from 1942, a manual for eating resourcefully during wartime shortages. Adler’s version, as elegant and lyrical as Fisher’s, enumerates ways to use every last scrap, bone, and core—and introduced her as a writer who made art out of the marginal.","Last December, Adler published her journal as “Feast on Your Life: Kitchen Meditations for Every Day.” The book’s vignettes are all food-related, but it contains few recipes; though it’s personal, it reads less like a memoir than like a gently philosophical prose poem—a model for invigorating one’s life with sustained and granular attention. “The sound of my little bone-handled knife scraping butter across brown toast this morning reminded me to listen,” she writes, in the entry for January 31st. “Sometimes I think bells and sirens are the only things grown-ups hear.” What we do in the contained, tactile environment of the kitchen, Adler suggests, can ground us in reality and give us a sense of place in the world. “Ants, bees, mites, flies, birds, squirrels are all in constant motion,” she writes on June 2nd. “Perhaps this is why cooking feels so primitive and vital when one is in the act—not worrying about something else, but inhabiting the act of cooking. It’s when we, like ants, bees, mites, flies, birds, and squirrels, are in natural timeless motion.”","At the dawn of Twitter and Instagram, when the internet was newly awash in photos of avocado toast and latte art, the Luddite rejoinder was “No one cares what you had for breakfast.” Nearly two decades later, this has been roundly disproved. For the past ten years at least, I have begun every Friday in eager anticipation of a new installment of “The Grub Street Diet,” one of New York’s most beloved columns, for which some person of note keeps a chatty, descriptive record of everything they’ve eaten in the course of a few days. We learn which celebrities are passionate cooks—Sarah Jessica Parker and Matthew Broderick save their Parmesan rinds and shrimp shells—and who eats solely to survive. (The novelist Jonathan Ames claims that vitamin gummies are enough to satisfy his sweet tooth.) Recently, I found myself moved to tears while reading an entry by the comedian Mary Beth Barone, whose contribution doubles as a disarming portrait of eating-disorder recovery. “I snack briefly on some chocolate-covered gluten-free pretzels from Brooklyn Harvest before I have to leave for soundcheck,” Barone writes, likening the challenge of eating “real meals” to “arm wrestling with myself. Either way, I lose.”","The food-diary form thrives on TikTok, where “what I eat in a day” is an extremely popular genre. There, you can ride along with a thirty-two-year-old stay-at-home mother sipping sugar-free Red Bull and making baked-potato casserole for five children, or a self- described “fat girl who isn’t succumbing to diet culture” enjoying a slice of vanilla-coconut cake topped with a jewellike smashed persimmon. (As her defiant framing suggests, “thinspo” and calorie counting are endemic to the genre.) One of my favorite accounts belongs to a grade-school teacher who eats lunch every day with an unfailingly cheerful group of colleagues, showcasing their foil-wrapped tuna sandwiches, Tupperwares of leftover chicken Marsala, and trays of pizza and fruit cups from the cafeteria. The videos sate a curiosity, held in amber from childhood, about what those figures of great and mysterious authority get up to when students aren’t around.","A colleague recently remarked that, while reading a “Grub Street Diet,” he thought about how horrible it would be to drop dead right then—if the last thing he ever read was someone logging a piece of toast. To me, this is exactly the appeal. We spend our lives in a cycle of having eaten and then needing to do it again; how we feed ourselves reflects our relationship to money, time, pleasure, place. If the food diary pushes its practitioners toward solipsism, or toward showing off, its popularity also evinces something encouraging: a curiosity about how other people live, the texture of their days.","In radio, it’s common for reporters to test sound levels—and break the ice—by asking their interview subjects what they had for breakfast. A segment that aired on “This American Life” last year documents a radio producer named Talia Augustidis posing the question to the same woman over several days.“The answer is probably I can’t remember,” the woman says the first time, in a tone of resignation. Then she brightens: “Oh, no—porridge, porridge. Porridge and blueberries.” “You always have the same thing for breakfast,” Augustidis replies, laughing. “It’s not hard to remember.”","The exchange repeats, the woman wrestling with her memory. “Porridge and delicious berries.” “Honestly, I can’t remember—oh, yes I can. It’s porridge, as usual.” We hear the scrape of a spoon against a bowl, the wet sound of food in her mouth. “It tastes absolutely delicious,” she says one morning, unable to summon what it’s called. “I’m flattered,” Augustidis says, laughing again. We never learn who the woman is or what happens to her—only that, one day, she barely touches her porridge, and she and Augustidis decide that it’s time to stop recording. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.02.28","day":13,"title":"America’s dangerous pursuit of critical-mineral dominance","source":"The Economist","minutes":6,"tag":"Leaders","dek":"With a more focused approach, it could break China’s chokehold","note":"2026.02.28","paragraphs":["IN 1973 a club of Arab petrostates held the world to ransom by halting crude-oil exports to countries they accused of supporting Israel. Petrol prices soared; Western economies buckled. Today the danger is that China will use its grip on other natural resources to achieve its aims, such as seizing Taiwan. It has already shown its power by choking off exports of rare-earth metals last year. That is why America is staging its biggest intervention in commodity markets in decades.","The battleground is the supply of “critical” metals, a group of minerals vital to making military, electrical and computing infrastructure—everything modern economies need to be safe, high-tech and green. China supplies most of these: it mines about 80% of the world’s tungsten, for instance, and refines 99% of its gallium. This is spurring America into an all-out campaign to diversify its sourcing of 60 minerals. It has pledged billions of dollars to dozens of mining projects at home and abroad, floated plans to create price floors and trade blocs, and announced a vast stockpile to cover months of national needs. The risk now is that America depends too much on its scattershot efforts—and that, in seeking control, it breaks the flexible and resilient system of market incentives that ensures the smooth functioning of the global economy.","China’s grip on critical minerals has exposed the West’s most serious strategic weakness in many years. Last April, during its trade war with America, China restricted exports of seven crucial rare earths; it targeted another five in October. Nearly a third of Pentagon procurement programmes faced the risk of shortages, as did industries from carmaking to renewable energy. The prospect of large-scale disruption prodded President Donald Trump into a trade truce with Xi Jinping, as well as a relaxation of American controls on some technology exports. Yet Mr Xi can deploy the weapon again whenever he chooses. Meanwhile, exports of rare earths for dual-use applications—the expanding grey zone between military and civilian uses—remain largely barred, sapping Western efforts to rearm.","It would be nice to say that the best defence against China’s tactics is to double down on global markets. They certainly have a part to play. The oil crises of the 1970s boosted the development of commodity trading—in which prices for key materials are set on exchanges by millions of buyers and sellers entering 40m derivatives contracts daily. Time and again, hit by wars, industrial strikes and natural disasters, markets have handled shocks better than government planners ever could.","However, America is right. China’s dominance over critical minerals means that continuing to place full faith in the invisible hand would be naive and unsafe. China has spent decades building control over minerals, bankrolling projects at home and acquiring assets abroad. Its producers have consolidated into behemoths that the state can control and which have the market power to deter would-be competitors by flooding global markets—even if that means taking temporary losses.","America’s task, therefore, is to strike a balance. On the one hand, it needs to insure against the risk that China cuts off exports again, and to deter it from doing so by raising the cost of further restrictions. On the other, it needs to nurture markets. Subsidies and stockpiles are expensive. State-to-state mineral agreements invite rent-seeking, side deals and corruption—a risk with the Trump administration. Dirigisme muffles the price signals that encourage conservation and innovation.","Unfortunately, America is mismanaging these trade-offs. Officials seem to deem almost any expense to be an acceptable price for security. Money is being spread wastefully thin, not focused where China’s grip is tightest, in refineries and smelters. From Delaware to the Democratic Republic of Congo, chancers are pitching the administration dud projects in the hope of easy money. In return for peace in Ukraine (on his terms), Vladimir Putin is promising Mr Trump a bogus $12trn in deals, including lots in energy and mining.","America’s campaign should instead follow three principles. The first is to narrow the scope. Not all 60 minerals it deems critical genuinely are. Aluminium, lead and zinc are abundant, recyclable and substitutable; China would struggle to corner vast industrial-metal markets like copper. America should therefore concentrate on niche, vital metals, such as some rare earths, where China can more easily restrict exports. Priority should go to critical industries—defence, and perhaps health care—leaving carmakers to fend for themselves. America should focus on projects near completion. Even keeping a small share of supply out of China’s control can break its chokehold, because Mr Xi will know that America has alternatives.","A second principle is to use all the tools at hand. America’s targeted stockpiles can cover immediate needs in a crisis, and its purchase contracts at pre-agreed prices can attract private investors and get projects off the ground. But it must also attend to refining and processing. Refiners that produce one main metal often leave critical by-products in waste rock, because processing costs too much. Conditional state backing could change their calculus.","Throughout, however, America must strive to ensure that price signals get through—the third principle. The economy will continue to adapt and innovate only if buyers and sellers face high prices when supply is limited. By contrast, low fixed prices will exacerbate dependence.","For the Trump administration, national security means America First. That is translating into a race to lock up scarce supplies at others’ expense, causing its allies to worry they will be left behind. But even an administration that doubts the utility of military alliances should work with others over natural resources. Europe has engineering expertise; Japan, an earlier victim of China’s mineral blackmail, has experience in securing supply chains. Together they bulk up the market. Against China’s geology, industriousness and political system, America’s ability to work with others is its greatest asset. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/02/26/americas-dangerous-pursuit-of-critical-mineral-dominance"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.03.02","day":14,"title":"Andrew Mountbatten-Windsor’s Life in Pictures","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.03.02","paragraphs":["Following his arrest last week, Andrew spent his first birthday as a commoner in circumstances as degraded as earlier celebrations had been grand.","When Queen Elizabeth II was delivered of a baby boy on February 19, 1960, the birth—the first to a reigning British monarch in more than a century—was marked by public celebration. The bells of Westminster Abbey pealed for an hour. The Royal Air Force performed a fighter-jet flyover of central London, as guns saluted from Hyde Park and the Tower. The ships in the Royal Navy fleet were notified of the arrival of a prince—his name, Andrew, had not yet been announced—with the injunction “Splice the mainbrace,” a euphemism for the distribution of a celebratory tot of rum.","Given such an entry into the world, any individual might get ideas above his station—particularly if, as was the case with young Andrew, the second in line to the throne after his brother Charles, there were only two positions in the social hierarchy that were actually above his station. Birthday celebrations in subsequent years seem hardly to have been calculated to kindle a sense of humility. On turning six, Andrew received a custom-made Aston Martin electric toy car. For his twenty-first, there was a party for about six hundred at Windsor Castle, and, for his thirtieth, a lavish “Dance of the Decades” at Buckingham Palace. When Andrew turned forty, he, along with his ex-wife, Sarah Ferguson, and their two daughters, commandeered a pod of the London Eye Ferris wheel—other riders complained bitterly about royal queue-jumping—then had a reportedly thirty-thousand-pound blowout at Sunninghill Park, the house they still shared in Berkshire. In advance of his fiftieth birthday, as Andrew Lownie recounts in his indispensable biography, “Entitled,” the Prince told a journalist he was doing “nothing big” to celebrate. Nothing big turned out to be a reception for some three hundred at Buckingham Palace, followed the next night by a bash at St. James’s Palace, with guests, Lownie reports, receiving a miniature album featuring photos of Andrew, as a party favor.","It was photographs, of course, that precipitated Andrew’s unravelling. In 2011, one day after his fifty-first birthday, a newspaper splashed an image of him walking alongside the convicted sex offender Jeffrey Epstein, headlined “Prince Andy and the Paedo.” Shortly after that, another paper published a snapshot from 2001 of Andrew with his arm around the waist of seventeen-year-old Virginia Giuffre, with a grinning Ghislaine Maxwell, Epstein’s sometime paramour—and, since 2021, a convicted sex-trafficker—in the background. That photo was taken less than a year after Maxwell and Epstein were guests at yet another birthday celebration for Andrew, a party at Windsor Castle.","Andrew has always maintained that he has no memory of ever meeting Giuffre, and that he committed no wrongdoing in any of his relations with Epstein, who died in New York’s Metropolitan Correctional Center in 2019, while awaiting trial on sex-trafficking charges. Nonetheless, in 2011, Andrew stepped down from his decade-long role as a U.K. international-trade envoy. In 2019, after a disastrous television interview in which he admitted that he had “let the side down” by his association with Epstein, Andrew stepped back from royal duties.","Just over two years later, Andrew was stripped of his royal patronages and military roles; soon afterward, he reached a reportedly multimillion-dollar settlement with Giuffre in a civil sexual-abuse suit, in which he admitted no liability. Last October, with the posthumous publication of Giuffre’s memoir, in which she alleged that she had had sex with Andrew on three occasions, he surrendered the use of his title Duke of York. Then—in what would once have seemed an impossible demotion—he was effectively stripped of his royal status altogether, and reborn as Mr. Andrew Mountbatten-Windsor. For a man whose identity was constituted around a sense of social superiority—according to Lownie’s book, if Andrew was met with insufficient deference upon entering a room he would loudly announce, “Let’s try that again,” before exiting and reëntering to hastily performed bows and curtsies—the reduction in status was surely a profound humiliation. Even Charles I, who was executed for treason in 1649, went to the scaffold as King.","Last week, Andrew spent his first birthday as a commoner in circumstances as degraded as earlier celebrations had been grand. At around eight in the morning, he was arrested at a farmhouse on the King’s Sandringham estate—not in relation to any sexual offenses but on suspicion of misconduct in public office. The arrest apparently resulted from documents recently disclosed by the United States Department of Justice suggesting that as trade envoy he had shared privileged information with Epstein. (Mountbatten-Windsor has, as of this writing, not been charged with any crime.) Identified by the police as “a man in his sixties from Norfolk,” Andrew, who is the first senior member of the Royal Family to be arrested since Charles I, spent about eleven hours in custody before being released under investigation. As the car carrying him departed the police station, a photographer captured another indelible image, of the former Prince slumped in the back seat, wide-eyed and slack-jawed—the boy for whom the chimes once pealed looking very much like a man for whom the bell now tolls.","Andrew is not the only highly placed member of the British establishment whose reputation, at the very least, has been destroyed by an association with Epstein. Peter Mandelson, the former Ambassador to the U.S., is under investigation for passing privileged information along to the financier. (Mandelson has not been arrested or charged, and a report by the BBC noted its understanding that “his position is that he has not acted in any way criminally.”) That scandal has shaken an already unsteady Prime Minister Keir Starmer, despite Starmer’s having never so much as encountered Epstein himself. “Nobody is above the law,” the Prime Minister said during a television interview, broadcast last week just as Andrew was being arrested.","In Britain, on the current evidence, that appears to be true: investigators have been promised the “wholehearted support” of the King, who issued a statement while his brother was still in custody that “the law must take its course.” It is striking that, by contrast, no authorities in the U.S. seem willing or able to seek comparable accountability from the powerful men who entered Epstein’s orbit. President Trump, when asked whether more former Epstein associates might face arrest, replied, “Well, you know, I’m the expert in a way, because I’ve been totally exonerated,” deflecting the question while allowing that events were “very, very sad” for the Royal Family, as if this were a parochial affair among posh Brits, free from implications for an American élite. Andrew Mountbatten-Windsor’s legal fate is still unfolding, but whatever the future holds, the party is over for him. When will it be over for the rest of them? ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.03.02","day":15,"title":"Seeing Ourselves in America’s Unfinished Revolution","source":"The Atlantic","minutes":8,"tag":"The Atlantic","dek":"Readers respond to our November 2025 issue.","note":"2026.03.02","paragraphs":["The Unfinished Revolution","The November 2025 issue examined the founding of the United States and brought the nation’s history to bear on its present—and its future.","I look forward to the cover of each issue of The Atlantic as much for the artistry as for the bold message it conveys. “The Unfinished Revolution,” however, struck me as, dare I say, revolutionary. I have the privilege of working with middle-school students, many of whom are learning about the American Revolution for the first time. Although we stress the importance of history’s “forgotten” heroes—in this case, the women, African Americans, and Native Americans without whom the efforts of the great men of the era would surely have failed—there are few, if any, images depicting them as equal to Washington or Jefferson. How inspiring for our young learners to see, in looking at Joe McKendry’s exquisite tableau, faces that reflect their own. I typically treasure old issues of The Atlantic, but this cover I’ll remove to display in a seventh-grade classroom.","Jenny Giessler Fairport, N.Y.","Rick Atkinson’s “The Myth of Mad King George” is a timely reminder that history is nuanced and rarely divides neatly between villain and victim. George III was not mad; he was methodical, conscientious, and tragically certain that duty and inflexibility were synonymous.","The American colonists’ decision to frame their rebellion as a quarrel with a man rather than a system was brilliant from a public-relations standpoint, if not exactly honest. By aiming their indictment at the King, the Founders converted constitutional disputes into a moral crusade. They could preserve their identity as Englishmen defending their rights even as they repudiated England itself. As Carl N. Degler wrote in Out of Our Past: The Forces That Shaped Modern America, the American Revolution was radical in its political outcome but socially moderate. It left intact many of the hierarchies it claimed to overthrow, because tyranny had been embodied in a single sovereign, not the structures that sustained him. Perhaps this helps explain why the Founders could prevent the radical promise of the Declaration from extending to African Americans and Native Americans.","Ethan S. Burger Washington, D.C.","I’ve long considered myself a patriotic progressive, so I greatly appreciated George Packer’s “America Needs Patriotism” and its lament over how many Americans have lost a love of their country. When I attended a recent “No Kings” march, I was surprised to see that by far the most ubiquitous symbol was the American flag. I saw big flags waving in the air, tiny lawn flags carried by moms and kids, flag bandannas, flags on T-shirts, and flags as capes, including one pinned with a sign that read This Flag is Anti-Fascist. Where was this constellation of red, white, and blue? San Francisco. This was quite a contrast to the 2003 peace marches against the U.S. invasion of Iraq, where an American flag among the protesters was as common as a necktie at a rock concert. Perhaps Donald Trump has had at least one salutary effect on American civic culture: He’s convinced even the left to embrace the Stars and Stripes.","Jason Dove Mark Bellingham, Wash.","George Packer implies that the left is as culpable as the Trumpian right for deep skepticism about expressions of patriotism. But he seems to conflate three different positions: (1) belief in core values such as liberty, equality, and democracy; (2) flag-waving support for, or loyalty to, one’s own country; and (3) a belief in America’s “essential decency.”","It is perfectly reasonable to be skeptical of nationalism—to be, as Thoreau put it, citizens of the world first, “and Americans only at a late and convenient hour.” You don’t have to believe America is decent; you can be critical of the disturbing and sometimes horrific qualities that America has represented over much of its history but still offer a full-throated defense of democracy, equality, and other values that should be aspirational for people everywhere.","Alfie Kohn Belmont, Mass.","As the president and CEO of the Colonial Williamsburg Foundation at the time of the 1994 slave auction, I took particular interest in Clint Smith’s article, “What Is Colonial Williamsburg For?”","The idea of reenacting a slave auction originated with Colonial Williamsburg’s African American Interpretation Department, whose director, Christy Coleman, approached the foundation’s leadership and said that her team was not only ready to put on the reenactment, but wanted to do it. Knowing that it would be controversial, we agreed that the reenactment would be based on records of actual slave auctions conducted in Virginia during the period, and that we would make it part of our educational programming. I gave her team my blessing.","On the morning of the program, after The New York Times published a story about our plans, representatives from the Virginia branches of the NAACP and the Southern Christian Leadership Conference, as well as local ministers and others who wanted the reenactment canceled, asked to meet with me. I listened carefully and told them that I appreciated that they had come. I explained that the reenactment was something that our African American–interpretive staff wanted to do, that we thought it was the right thing to do, and that we had committed to the staff and the public that we were going to do it. I reminded them that our mission was educational—we were doing this not to sell tickets, but to teach.","They listened but told me that they still planned to attend and protest. Several blocked the stage before the program began, but when the audience of 2,000 began to boo, all except one protester stepped down. Christy and her colleagues worked the program around him. The other protesters remained silent.","We did the slave auction only once; it was simply too emotional an experience for the staff. I fielded some complaints from donors, and lost a few, but never regretted the decision. It was the right thing to do.","Robert C. Wilburn Pittsburgh, Pa.","I was particularly interested in John Swansburg’s article on “Rip Van Winkle” because Cornelius S. Van Winkle—who originally published Washington Irving’s The Sketch Book of Geoffrey Crayon, Gent.—was the brother of my great-great-great-great-grandfather Peter Van Winkle.","Family lore has it that Irving got into some sort of heated disagreement with Cornelius, and got revenge by bestowing the Van Winkle name on his main character—a man unflatteringly described as having, among other things, an “insuperable aversion to all kinds of profitable labor.”","While I have no idea if there’s any truth to this hilarious tale, it’s worth noting that my Van Winkle ancestors were among the first Dutch settlers in this country, having arrived less than two decades after Henry Hudson sailed upriver in 1609. They came to live in present-day Albany, Rensselaer, and Hudson and Bergen Counties. I’ve always been proud to trace my roots directly back to the founding of our great nation, regardless of my connection to its founding folktale. In his article, Swansburg writes that, by the end of the story, Rip has “become a link to the past, a living connection to the history that predates the Revolution.” I look forward to rereading “Rip Van Winkle” and once again hearing what he has to say.","Christopher Pollock Brooktondale, N.Y.","Two days after we received the November issue, my wife, Cindy Whitman, a retired history teacher, completed a diorama version of Joe McKendry’s cover painting. She customizes Playmobil figures and found objects to make scenes to display in libraries and children’s museums.","Dave Whitman Queensbury, N.Y.","Behind the Cover","In this month’s cover story, “What’s the Worst That Could Happen?,” Josh Tyrangiel reports on how artificial intelligence will change the American job market. The new technology has the potential not just to make workers more efficient, Tyrangiel argues, but to render many of them obsolete. For our cover image, the artist Stephan Dybus evoked both the marvels of AI and a looming threat for which the American economy, and democracy, may not be prepared. — Paul Spella, Senior Art Director","This article appears in the March 2026 print edition with the headline “The Commons.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/03/the-commons/685765/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.03.02","day":16,"title":"China’s AI Boyfriend Business Is Taking On a Life of Its Own","source":"Wired","minutes":8,"tag":"Wired","dek":"","note":"2026.03.02","paragraphs":["Some otome players date multiple men simultaneously, but Gu fell for Charlie—a tall, confident character with silver hair. She found the game’s dialog system frustrating, though. She could interact with Charlie only through predetermined questions and answers. Then she came across an ad for a platform called Xingye (星野) that lets people customize an AI companion. Gu decided to try to re-create Charlie.","Xingye is owned by one of China’s AI unicorns, MiniMax; its chatbot app for the US market is called Talkie. The app touts its ability to help people find emotional connection and make new memories. Its tagline is “Suddenly finding oneself in a beautiful place, lingering here.”","Gu quickly discovered that other Xingye users—presumably other otome fans—had already created an “open source” Charlie avatar. She selected it and trained the model to respond according to her preferences through repeated, targeted prompts. And so began Gu’s complex relationship with a multimodal Charlie—one that would eventually include real-world dates with a person she hired to embody her digital boyfriend.","Gu was confident that she’d trained the chatbot to be “her Charlie,” distinct from what any other users might be dating. When given the chance to select an outfit, she says, her Charlie often chose wedding attire, unlike what other Charlies tend to go for. Now Gu spends an average of three hours a day texting with Charlie or chatting on the occasional phone call. Through the otome game, she has bought gifts and letters from Charlie. She receives them in the mail and displays them in her room and on her social media accounts.","Here are 23 ways China is rewiring the future.","In China, some women are openly embracing relationships with AI boyfriends. According to one Chinese media report, most of the 5 million users on another AI companion platform, Zhumengdao, are women. The tech giants Tencent and Baidu have launched AI companion apps, and according to a 2024 article in Chinese media, women dominate the AI companion market. Sun Zhaozhi, the founder of a robotics firm, told an interviewer that according to his company’s market research, the “heavy” users of AI companion apps in China are mostly Gen Z women—whom he plans to target for his robot companion products.","Zilan Qian, a program associate at the Oxford China Policy Lab, also combed through AI companion apps and found that the Chinese versions are “explicitly targeting women,” and tend to display male avatars more visibly than female options. That’s in contrast, she notes, to the trend that a web analytics company found across the rest of the world: Users of the top 55 global AI companion platforms are predominantly men, at an 8-to-2 ratio. Qian attributes Chinese companies’ strategy to “the economics of loneliness.” Features within the apps that might make users feel closer to their companions, such as voice customization and memory improvement, cost extra.","Through the otome game, Jade Gu has bought gifts and letters from digital boyfriend, Charlie.","Gu acknowledges that her AI version of Charlie isn’t perfect. Sometimes the chatbot’s responses seem watered down. Or the AI drifts out of character. In one recent interaction, Gu expressed her love to Charlie, and the chatbot replied, “I don’t love you.” So she edited the message to say “I love you too.” Charlie just needed the reminder, she says. When her attempts to steer the AI don’t work, she turns to other companion apps like Lovemo, where she has also created a Charlie avatar. Gu says this isn’t too big of a deal; longtime otome fans are accustomed to working around shifting platform policies.","According to its homepage, Lovemo provides “cute and adorable AI chat companions” that can bring “healing” to users. One can’t help but notice the difference between that marketing style and Grok AI’s default companion, Ani, a goth-chic anime girl who is eager to engage in sexually explicit dialog. Or a US-based erotic role-play chatbot app called Secret Desires, which allows users to create nonconsensual porn of real women by uploading photos of them.","Chinese apps, of course, face stricter regulations than their Western counterparts. China’s cyberspace regulator has launched a campaign to “clean up” the country’s AI platforms and services, including AI-generated “vulgar” content. A recent addition to the national AI safety framework warns of addiction and dependence on anthropomorphic interaction—words that appear to target AI companions. And just last month, the cyberspace regulator released draft rules targeting “human-like” AI products. The measures task platforms with intervening if users demonstrate emotional dependence or addiction to AI services, and they stipulate that companies “must not have design goals of replacing social interaction.”","At a glance, existing companion products seem good enough to replace human boyfriends. Many Chinese users describe AI boyfriends as emotionally responsive and nonjudgmental, according to Hong Shen, an assistant professor at the Human-Computer Interaction Institute at Carnegie Mellon University. Those traits “can be hard to find in real-life relationships, especially under gendered social norms,” Shen says. In China, these dynamics are exacerbated by a skewed gender ratio and an imbalanced gender distribution between urban and rural areas. Studies have found that Chinese women are increasingly moving to cities, either to find better jobs or for social reasons.","But assimilation doesn’t happen overnight, and that helps explain why recently relocated women might turn to AI, says Guligo Jia, a 36-year-old filmmaker based in Beijing who directed a documentary about Chinese women in AI relationships. Women dating AI have a strong urge to be listened to and accepted. But, Jia says, not all Chinese men are up to the task. Chatbots “are always there to listen to you, and they always have patience for you … Men don’t have patience,” Jia says.","As she put it, real boyfriends can cheat on you, lie to you, scam you out of money, and be physically violent. “It’s a little bit tragic,” Jia says. “Because the reality of dating is just too ugly.”","Jia tried to interview men in AI relationships for her documentary but says none agreed to speak to her. Her female subjects were vulnerable and forthcoming about their relationships. The men she approached, she says, expressed concern that people would assume they can’t find a human girlfriend and are vulnerable enough to want someone to talk to.","Women like Gu, though, are openly enjoying life with their companions. Gu brings a toy version of Charlie—a small stuffed figure that fits in the palm of her hand—on dates while talking to the chatbot on her phone. A few times a year, she hires a professional (human) cosplayer, or coser, to “play” her version of Charlie. They walk through the park, shop at a mall, and drink tea at cafés.","Gu goes on occasional dates with a cosplayer who plays the role of Charlie and other popular characters.","Gu says her most recent date with her coser “felt like destiny.” It turned out they had been riding on the same subway train, sitting in different cars, and when the doors opened they walked onto the platform at the same time. Gu immediately recognized Charlie. It felt, she says, “like a time machine bringing Charlie to me.”","While out on their date, the two saw another coser dressed as a character named Evan from the same otome game. Gu told her coser that she had dated Evan (the game character, not the coser) before she and Charlie got together. Gu’s coser acted sad and jealous—reactions Gu says perfectly match the personality of “her Charlie.”","When they saw Evan again later in the date, Charlie kissed her right in front of him. “That’s why it’s destiny,” Gu says. “She really reacted just how my Charlie would.”","Gu alternates between referring to the coser as “he” and “she” because the person cosplaying Charlie is actually a woman. Her height and looks make her a popular coser for women in heterosexual relationships, and she’s extremely in demand. (Her rates are relatively reasonable; for a date that lasts all day, she charges 720 RMB, or a little over $100.)","“I see myself as a medium,” says Gu’s coser, who asked to go by the nickname Li Bai. She’s a student who plays tennis and cosplays as a part-time gig. She usually meets with a client once per weekend for seven or eight hours. “Everyone’s interpretation and emotional investment differ; every individual perceives their character in a unique way,” she says.","The cosplayer's height and striking looks keep her in high demand.","A couple years ago, Gu was dating a human who was uncomfortable with her relationship with Charlie. Ultimately, she broke up with the human. While Gu is open to finding a human partner again, she says that person would be in addition to Charlie, not a replacement for her AI relationship. And she is not actively looking. Between the constant support of her AI Charlie and fate-filled dates with her coser, any future human suitor would have a high bar to clear.","What Say You?Let us know what you think about this article in the comments below. Alternatively, you can submit a letter to the editor at mail@wired.com.","This article was downloaded by calibre from https://www.wired.com/story/china-ai-boyfriends/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.03.07","day":17,"title":"Donald Trump must stop soon","source":"The Economist","minutes":6,"tag":"Leaders","dek":"His ill-considered conflict risks descending into chaos","note":"2026.03.07","paragraphs":["IT IS RARE for one head of government to order the death of another. Yet on February 28th America’s president and Israel’s prime minister did just that, killing Iran’s 86-year-old supreme leader, Ayatollah Ali Khamenei. The decapitation of the Iranian regime reflects the devastating operational success of “Operation Epic Fury”. But Mr Khamenei’s place was immediately taken by a triumvirate. The next supreme leader could be named soon—perhaps his own son unless he, too, is killed. That augurs something more subtle and worrying: that the operation is failing to achieve its political goals.","It is naive to say, as some of Mr Trump’s cheerleaders do, that because Mr Khamenei was wicked (and he surely was), any sort of war makes sense. When you command a machine as lethal and overwhelming as America’s armed forces, united in this operation with the battle-hardened Israel Defence Forces, you have a special responsibility to define what you want to achieve. That is not only an ethical requirement; it is a practical one, too. War aims direct the campaign; they define the sacrifices the state imposes on its own people and the enemy; and they determine when the fighting should end.","In this war, Israel’s aim is clear: to demolish the threat posed by Iran’s regime. By contrast, Mr Trump and his cabinet have offered a mess of shifting assertions—about Iran’s missiles, nuclear weapons, regime change, following Israel’s lead, a “feeling” Iran was about to attack and settling scores after decades of enmity. Politically, vagueness gives Mr Trump room for manoeuvre. Strategically, his failure to say what Epic Fury is for is its biggest vulnerability.","The result is a split-personality war. One face is operational. America and Israel have destroyed Iran’s navy and grounded its air force. They are wrecking its missile capability and its arms industry and targeting the regime and its brutal enforcers. Dominance of the skies means that America and Israel can fight on at will. Interceptor missiles are meanwhile defending bases and cities in Israel and the Gulf countries, even as Iran strikes at more targets than it did during the conflict last June. So far, at least, there are enough interceptors to keep going.","The other face of this war is political, and it emerges from Iran’s strategy, which is about sowing doubt and confusion. To survive would count as victory for Iran’s regime. So far, it is succeeding. Far from falling apart, it is rushing to escalate horizontally—a fancy way of saying it is lashing out in all directions. This has a number of consequences.","One is that other countries are being sucked in. Iran has attacked the Gulf states, which have bet their future on being havens from the chaos gripping the rest of the Middle East. Fighting has also erupted in Lebanon as Israel smashes Hizbullah, Iran’s main proxy. France and Britain will defend their bases from attack. On March 4th NATO air defences shot down an Iranian missile bound for Turkey.","Another consequence is economic. Iran has tried to shut the Strait of Hormuz, cutting off perhaps 20% of global oil supplies. It has also struck energy infrastructure, including the world’s biggest gas-liquefaction complex and Saudi Arabia’s largest refinery. The price of Brent crude is up by 14% since February 27th, to $83 a barrel. A megawatt-hour of natural gas in Europe costs €54 ($63), over 70% more than last week. As Asian buyers scramble for supplies, prices could go higher. The global economy could yet suffer a hit. If oil reaches $100 a barrel, GDP growth could be lowered by 0.4 percentage points and inflation raised by 1.2 points.","The third potential consequence is chaos inside Iran. Roughly 40% of its 90m people belong to ethnic minorities, including Arabs, Azeris, Baluchis, Kurds and Lurs. The Arab spring showed how countries can fall apart. America and Israel are putting pressure on the regime by backing Kurdish insurgents—a reckless idea that could end up stoking Persian nationalism or civil war. Mr Trump may not care about this, but he could not ignore the effects spilling over Iran’s borders into the Gulf states, Iraq, Syria and Turkey.","The risk is that Mr Trump cannot bear to quit so long as the markets and polls deny him the acclamation he craves—and that may last for as long as Iran can release even sporadic missiles and drones. Today barely a third of Americans favour the battle in Iran (90% backed invading Afghanistan in 2001). America may be an energy exporter, but its voters detest costly petrol. He may be tempted to seek an undeniable win by bombing the regime out of existence. But even with America’s military clout, he might not succeed. Meanwhile all those risks would continue to harm the region and the world economy.","Mr Trump would do better to narrow his war aims. His goal should be to degrade Iran’s military capabilities and then stop. He is almost there.","Some will argue that the job would be only half-done. Obviously, leaving the regime as a wounded beast would be heartbreak for the oppressed Iranian people. Even if Mr Trump wants peace, Iran could continue to lash out for a while, at least, revelling in its status as a symbol of anti-American resistance. The surviving regime may reject a nuclear deal—indeed, like North Korea, it may think a bomb is its only protection. If it rebuilds its nuclear programme, Mr Trump may have to strike again in months’ or years’ time. It is a bleak prospect. But it would be better for America to declare victory early than limp out of an unpopular war because of exhaustion.","These are the fruits of Mr Trump’s impulsive approach. Before this war, Iran’s regime was weaker than at any time in its 47-year history: it could have fallen without a single American bomb. Mr Trump may get lucky, but he is more likely to end up having to deal with regional chaos or a new hardliner. Surrounded by sycophantic courtiers, Mr Trump has become rash in his second term. His opportunistic grabs for power whenever he sees weakness are dangerous. America needs a strategy in Iran, just as it needs one in the world. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/03/05/donald-trump-must-stop-soon"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.03.09","day":18,"title":"Can the Democrats Get It Together?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.03.09","paragraphs":["The fight over the 2028 primary calendar is one of several proxies for a broader battle about the future of the Party—and the search for the best nominee.","In December, 2022, President Joe Biden sent a letter to the Democratic National Committee’s Rules and Bylaws Committee full of soaring language about how the Presidential-primary calendar should reflect the Party’s highest principles. Democrats needed to make sure that “voters of color have a voice in choosing our nominee much earlier in the process,” and they had to pay attention to the country’s “overall diversity”—geographic, economic, and demographic. Too many candidates, Biden wrote, had faltered early in the small, relatively nondiverse states that voted first (traditionally, New Hampshire and Iowa), leading them to drop out. The Democrats ought to be dedicated to “removing barriers to political participation.”","Those fine sentiments aside, Biden wanted to reward South Carolina, which had changed his fortunes in the 2020 primaries, by moving it from the fourth spot on the calendar to the first. And his team discouraged the participation of any Democratic candidate not named Biden, while being far from forthright about his striking decline. To an extent, the process did what the people around the President designed it to do: nationwide, Biden got eighty-seven per cent of the primary vote. Then, six weeks after the last contest, he was forced to drop out.","Now the Party is again looking at the Presidential-primary calendar. On January 31st, the Rules and Bylaws Committee met in San Juan, Puerto Rico, to begin considering twelve states for what will be four regional “early window” primary slots: the East (the choices are Delaware or New Hampshire), the Midwest (Illinois, Iowa, Michigan), the South (Georgia, North Carolina, South Carolina, Tennessee, Virginia), and the West (Nevada, New Mexico), with room for a possible fifth at-large state. In the next few months, the states will be making presentations to the committee members, as if they were potential Olympic host cities. Minyon Moore, a former adviser to Hillary Clinton who co-chairs the committee, spoke, as Biden had, about the Party’s values. But she added that the goal this time was a schedule that yielded a candidate who could win. “I want to repeat that,” Moore said. “The strongest possible Democratic nominee for President.”","A good number of elected officials seem to think that Moore means them. California’s governor, Gavin Newsom; Pennsylvania’s governor, Josh Shapiro; and, yes, former Vice-President Kamala Harris are all on the road promoting books. Last week, both Harris and Vice-President J. D. Vance, a top prospect on the Republican side (Secretary of State Marco Rubio, who might be another, has said that the nomination is Vance’s for the taking), held events in Wisconsin, a key swing state. Governor Andy Beshear, of Kentucky, has a book coming out, too. Representative Alexandria Ocasio-Cortez and Governor Gretchen Whitmer, of Michigan, showed up at the Munich Security Conference. Meanwhile, Senator Mark Kelly, of Arizona, a decorated Navy pilot, has been in court fighting the Pentagon’s efforts to reduce his retirement rank in retaliation for his public statement that troops don’t have to follow illegal orders—a reminder of the stakes in this contest.","Because some early states would favor certain candidates—J. B. Pritzker is the governor of Illinois; Jon Ossoff and Raphael Warnock are Georgia senators; former Transportation Secretary Pete Buttigieg has a following in New Hampshire—the fight over the primary calendar is one of several proxies for a broader battle about the future of the Party. Democrats are still testing their responses to Trump, both stylistically and in terms of substance, and watching and evaluating one another. (At last week’s State of the Union, some Democrats who chose to attend sat in quiet protest, some heckled, and others walked out.) The midterm primaries offer a parallel set of choices: A mild-mannered seminarian or a confrontation-ready congresswoman in Texas? A seasoned governor or a populist oyster farmer in Maine?","In San Juan, such calculations ran through the committee members’ discussion. What state might showcase a candidate’s appeal to young Latino men, to union members, to gun owners? Was the local media market too expensive for grassroots candidates? Was having a red state in the mix an advantage, or might a G.O.P.-controlled legislature sabotage any attempts to move the primary date? New Mexico has the southern border; Tennessee, a committee member said, “doesn’t touch water,” and thus might keep the Party from being too “coastal.”","One danger of this exercise is that the Democrats will overlearn the lessons of 2024. For example, Biden wasn’t wrong to emphasize the importance of diversity. When the committee member André Washington asked his colleagues in San Juan how he should assess a would-be early state that was small and affordable but whose population doesn’t “look like America,” the answer was that no single state had to do it all; put together, they would form “a story that we’re telling.” But the Democrats not only have to tell a story—they have to listen to the one that the country, in all its diversity, is telling them. The Party commissioned an “autopsy” of the 2024 loss, but the D.N.C. chair, Ken Martin, has declined to release it. “Getting into the granular detail doesn’t help us,” he told the Miami Herald, raising the question of why there had been a report. Better to focus on the price of television time in northern Virginia, perhaps.","There are other risks. The San Juan meeting took place three days after the F.B.I. raided an election facility in Fulton County, Georgia, seizing records from the 2020 race. What is extraordinary about this moment is that election-security concerns extend beyond matters such as hacking to a pending Supreme Court decision that could further gut the Voting Rights Act, and even to the prospect of unlawful actions by the federal government. Some of the talk in San Juan was about safety plans. Trump is not eligible to run in 2028, but his incessant staging of crises makes elections more fragile—and the primary results less predictable. It is hard to know how any given Democratic candidate, in responding to an emergency, might help the Party find its voice.","This is a cycle, in other words, in which there is not necessarily a benefit to locking in a front-runner early on. The Democrats need to be ready for anything, including a nominee who is very different from one they expect. Devising the best possible calendar is laudable. But a victory in 2028 can’t be engineered. It will have to be hard fought. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.03.14","day":19,"title":"An attack on the world economy","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Whatever happens in the Strait of Hormuz, energy markets have been changed for ever","note":"2026.03.14","paragraphs":["Having DISCOVERED the costs of tariffs, President Donald Trump has now discovered the costs of war. On March 9th he declared that his campaign against Iran would be over “very soon”, sending oil prices, which had peaked at nearly $120 a barrel the day before, crashing to nearly $80 (before the war they had been $70). Iran’s de facto closure of the Strait of Hormuz has blocked roughly 15% of global oil supply. Mr Trump, facing midterm elections and voters weary of inflation, is signalling that he cannot bear those costs—just as he retreated from his trade war after markets buckled last spring.","Yet Mr Trump is as chaotic in matters of war and peace as he is in economic policy. As we published this, the strait remained all but closed after Iran had struck shipping there. The oil price had rebounded to around $100. Meanwhile, American rhetoric remained belligerent, as Pete Hegseth, the secretary of war, promised to fight on harder than ever.","The confusion betrays the president’s lack of good options. Whereas de-escalating the trade war is more or less in his gift, he cannot restore the old energy market. Whatever happens, the world is entering a new era of energy insecurity.","The shock the war has unleashed could be huge. True, the world depends less on oil than it did in 1973, when an Arab embargo caused crude prices to quadruple, or 1979-80, when the Iranian revolution and the Iran-Iraq war hit supply. Then, it was still common to burn oil to produce electricity. Today it is used less widely, mainly to power transport and make petrochemicals.","Yet this evolution is double-edged. Today’s oil demand is stubborn, so prices have to rise more for a given disruption of supply. And this one is extreme: the loss of supply is greater than in either 1970s shock. Even at the worst moments of the crisis, traders have not come close to pricing in an indefinite closure of the strait. The oil price required to bring demand into line with supply in such a scenario could be over $150 per barrel.","Members of the International Energy Agency can draw on 1.8bn barrels of emergency stocks and they are releasing 400m. But access is often throttled by pipelines or other constraints. Even China, which has built up a separate vast stockpile, has seen the need to stop exports of some refined products. The fact that transport is a key input to so much of the world economy means that bottlenecks could cause grave harm.","And the shock is not limited to oil. Qatar’s main liquefied natural gas (LNG) export facility remains closed after a drone strike, taking nearly a fifth of global supply off the market. An expansion of its output has also been postponed. The loss of Qatar’s exports has set off a scramble in Asia. In Europe, where gas storage-tanks are unusually empty for the time of year, prices are up by more than half. America could export more LNG, but its demand for natural gas is rising, because of the boom in energy-hungry data centres.","Iran could drag the war out to try to suggest that it and not Uncle Sam is calling the shots. On March 11th Iran hit three cargo ships in the Strait of Hormuz and, later, two tankers near Iraq. Like Yemen’s Houthi rebels, who have successfully attacked shipping in the Red Sea with low-tech weaponry despite NATO members’ high-tech efforts to stop it, the Iranian regime has learned that it can lob drones at ships and energy infrastructure while being flattened by bombs.","Even when the war ends the world will have changed. Iran’s new hardline supreme leader, Mojtaba Khamenei, now knows that energy prices are America’s weak spot. In Ukraine, which has tested drone defences, some Iranian-style machines still get through. American troops are not about to occupy Iran to stop the launches. America does not have the capacity to defend every tanker, even if it provides them with cheap insurance. Disruption to energy markets will therefore come and go with geopolitical tensions, especially if Iran concludes that it needs a nuclear weapon to be safe.","That is the new
