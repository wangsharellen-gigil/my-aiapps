 Russia, Ukraine and Europe. Left unsaid is that, if ordinary Russians become alarmed by the war and more resentful because of a broad mobilisation and political repression, that will only exacerbate Mr Putin’s problems at home—leading to the next round of escalation.","These gloomy thoughts take Mr Melnichenko to the heart of his argument. He sets out his thesis in a series of long-term scenarios for Russia, all of which, he says, would be dangerous for Russia and the world.","Most alarmingly, Russia could collapse into anarchy, as warlords struggle for control of resources and nuclear weapons. That fear was real enough to lead the Biden administration to seek to avoid Russia being humiliated in Ukraine.","Or Russia could come under the thumb of foreign powers. It may be dominated by China, which could use it to supply raw materials and serve as a buffer against America. Or, after a war of attrition, maybe Russia will exist on the periphery of Europe, an impoverished dependant. Both outcomes would breed resentment and discontent, he predicts, incubating a violent nationalism that may one day explode into conflict.","In the last scenario Russia would turn inward, like North Korea, a closed fortress under siege, starved of growth and capital. This is apparently being actively discussed in the bowels of the Kremlin. Yet, like North Korea, Russia would be in a state of permanent war against the world.","Mr Melnichenko is enigmatic about how precisely to avoid these outcomes. Self-servingly, he urges Western countries to resist the temptation to push the war to its limits. Instead, they and Russia must find a way to live in peace. To this end, he calls on them to grant Russia “sovereignty”—an immunity that sounds a lot like China’s demand for non-interference. About reform in Russia, he is elusive. The country must be predictable to the outside world and must win over its people without resorting to coercion. Implicitly, he wants Mr Putin to relinquish one-man rule and devolve power. But he does not talk about democracy.","Even that will run up against the securocrats, top dogs since Mr Putin banished the original post-Soviet oligarchs from politics over two decades ago. If Russia becomes a more normal country, they will be the losers. Perhaps, though, technocrats and moguls fearful for Russia will take Mr Melnichenko’s side. Mr Putin may refuse to yield. But he is in a bind. Grinding on, escalation and reform would each carry costs.","Reform has a precedent. In 1905 Russia lost a 19-month war to Japan. Industrialists and technocrats blamed the dictatorial Nicholas II. It showed, they said, that one-man rule doomed Russia to be behind the rest of Europe. That year, after an uprising, they forced the tsar to accept the October Manifesto, which proposed civil liberties and a legislative assembly.","By mid-1907 Nicholas had crushed the reforms; a decade later he was toppled in the revolution. The hope must be that Russia learns this lesson: it needs reforms that last. ■","Subscribers to The Economist can sign up to our Opinion newsletter, which brings together the best of our leaders, columns, guest essays and reader correspondence.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/07/09/the-man-who-would-change-russia"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.07.13","day":62,"title":"At Pacha New York, an Infamous Night Club Is Reborn","source":"The New Yorker","minutes":8,"tag":"The Critics","dek":"","note":"2026.07.13","paragraphs":["By Kelefa Sanneh","Last month, a businessman named Kabir Mulchandani appeared in front of the New York State Liquor Authority (S.L.A.) seeking permission to sell alcohol at the open-air Brooklyn night club that his company had recently taken over. There was a lot to consider. Residents had written in with concerns about safety and noise, and the local community board had voted, twenty-two to fourteen, with one abstention, against approving the venue’s application. In its previous incarnation, the night club—the biggest of a handful of venues situated in an industrial zone near the edge of East Williamsburg—was known as the Brooklyn Mirage, and its reputation was not uniformly good. Three people died of drug overdoses after attending events there, and in recent years a number of dead bodies were retrieved from the nearby Newtown Creek. In 2025, the Mirage announced a grand renovation, but it failed to get approval from the city’s Department of Buildings and was demolished earlier this year. A private-equity firm took control of the site and made an agreement with Mulchandani, the head of a Dubai-based company that owns Pacha, a venerable and glamorous night club on the Mediterranean resort island of Ibiza. With Mulchandani’s company as the operator, the Brooklyn club was being reinvented as Pacha New York.","Lily Fan, the chair of the S.L.A., seemed to understand the significance of the place and to be impressed by the improvements that Mulchandani promised: tighter security, a less noisy sound system, shuttle buses to bring patrons to subway stations, and even a new cell tower nearby, so that, when the club closed at 4 a.m., revellers would not find themselves wandering the neighborhood in search of a signal. She indicated that the S.L.A. would approve the application for Pacha New York so long as the club promised to eschew the M-word in all its promotional material. “No Mirage mention anywhere, please,” she said.","There was a time when New York City was the night-club capital of the world. In the nineteen-seventies, the city was the cradle of disco and home to a wide range of influential dance parties: the Loft, a downtown institution, helped invent the underground dance club; Studio 54, a short-lived tabloid sensation, helped create the idea of the night club as a celebrity stage. (Bianca Jagger was memorably photographed there astride a white horse.) But, in the decades that followed, other cities caught up and eventually surpassed New York; one of them was Ibiza, where clubs like Pacha showed vacationing Europeans how to rave all night.","In New York, night clubs were sometimes regarded as a civic nuisance; one obstacle was the city’s cabaret law, from 1926, which required bars to obtain a special permit if patrons were dancing and was not fully repealed until 2017. The unmentionable predecessor of Pacha New York was a rather whimsical, castlelike structure with a balcony from which the skyline of a faraway borough was visible: Manhattan. (For about a decade, beginning in 2005, Pacha operated a different club there, in Hell’s Kitchen.) The new club is simpler and more functional, with a legal capacity of fifty-three hundred patrons—at the hearing, Mulchandani testified that, though the previous operators had routinely exceeded capacity, he would not. The dance floor is an expanse of blacktop, surrounded by black shipping containers that serve as bars; the wide stage has a d.j. booth in the middle, flanked by V.I.P. areas and backed by an enormous video screen. On Saturday, June 13th, which was opening night, the V.I.P.s included the rappers Travis Scott and Quavo, as well as Mulchandani himself, wearing a black T-shirt that said “Brooklyn,” with the “o”s rendered as a pair of red cherries—Pacha’s trademark.","People sometimes use the term “electronic dance music” to refer to the wide range of club-oriented genres that proliferated in the post-disco years, but Pacha concentrates more narrowly on house music, which emerged from Chicago night clubs in the nineteen-eighties and now occupies the more traditionalist end of the dance-music spectrum. For opening weekend, the club hired Rampa, a popular producer and d.j. from the fertile Berlin club scene, who excels at folding the sounds of Afro-pop into warm, rippling house tracks. Because he was inaugurating a New York venue, Rampa put together a lineup stocked with local favorites, including Danny Tenaglia, who built his reputation in the nineteen-nineties with marathon sets at Twilo, in Chelsea. “Such an honor to be here for the grand opening,” Tenaglia said. “I hope you’re enjoying the game, but I hope you’re enjoying the music more.” The screen behind him was showing a certain local basketball team, which was in the process of ending more than half a century of frustration; when the job was done, the crowd roared, and Tenaglia played a bit of “New York, New York,” before bringing in “Du Du Dum,” a clattering house track that turned the watch party back into a dance party.","By the time Rampa arrived on the decks, a bit before 1 a.m., the crowd was congealing into a congenial blur: serious dancers with their eyes closed, celebratory guys in basketball jerseys, swaying couples, groups of friends interested more in one another than in the guy in the booth. He had brought with him Prospa, an English duo known for a series of club hits that evoke the hedonistic spirit of nineties house music. Everyone knew that Rampa would eventually play “Say What,” a 2024 hit he helped produce, which has a joyful bass line and a refrain that is equally indecipherable to dancers across the world, since it’s in a made-up language. People raised their hands and sang along, but only for a few minutes. Rampa told me that he tries to make sure his d.j. sets don’t devolve into concerts; he wants people to feel as if they’re at a party, not a performance.","This is not always easy to do, especially for anyone who appears, as Rampa often does, on lists of the world’s most popular d.j.s. He told me that he had fond memories of his time in Berlin’s underground scene, playing gigs in cramped venues that were often at risk of being shut down. “There were no permissions and licenses, so it was very pure and honest,” he said. He knows, though, that the outlaw approach tends to lose its charm as the crowds grow and the likelihood of disaster increases. On the dance floor, as elsewhere, people tend to want to feel both free and safe; in that sense, every night club is a compromise, and part of the job of a d.j. is to help people forget that. At a scrappier venue, there might be someone at the door, deciding who will or won’t contribute to a great night. But at a big corporate club like Pacha anyone with money can buy a ticket. In that sense, at least, Pacha is more inclusive than some of its smaller competitors. Prices for shows this summer range from forty-five dollars, for general admission, to hundreds or thousands of dollars.","For Sunday of opening weekend, Rampa planned a kind of New York carnival: he put a skate ramp in one of the warehouse-like buildings on the property and organized an appearance by two members of the Wu-Tang Clan, Ghostface Killah and Raekwon. Around ten o’clock, the local d.j. Kitty Ca$h played one of the weekend’s best sets, starting gently, with remixes of Aretha Franklin and Nina Simone, and then pushing into tougher, more percussive tracks, creating an immersive music-history lesson. It began to rain, softly at first. “This rain ain’t stopping shit, y’all,” she said, as employees erected a portable tent above the d.j. booth and distributed ponchos to the audience. But the rain grew heavier and was soon accompanied by thunder and lightning, which meant that the party was officially and Clan-lessly over. (Rampa later announced that he was waiving his Sunday fee, and Pacha offered attendees a choice between a refund and free admission to a makeup party.) Some people headed for the exits, while others piled into the room with the half-pipe, where Rampa played a couple of tracks, briefly turning a rained-out club night into an old-fashioned warehouse party. At least some of the revellers seemed to enjoy this impromptu set. On TikTok, one of them offered high praise: “Felt like an og rave.” ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.07.18","day":63,"title":"Donald Trump’s gutting of the Department of Justice","source":"The Economist","minutes":6,"tag":"Leaders","dek":"What the degraded institution means for America","note":"2026.07.18","paragraphs":["THE PURsUIT of enemies grabs all the attention, and for good reason. Markets were shocked to see President Donald Trump set the Department of Justice (DoJ) on Jerome Powell when he was still the chairman of the Federal Reserve. Champions of press freedom cried foul last week when the department issued subpoenas to New York Times journalists for explaining the truth about Qatar’s gift of a jet to the president. But Mr Trump’s grievance agenda isn’t the half of it.","In a sign of how much he treats the department as his own personal law firm, he wants his actual lawyer to become attorney-general. Senate hearings begin this week for Todd Blanche, who is currently the acting attorney-general. Those on Mr Trump’s enemies list are not the only ones who should be worried. The president is also inflicting less-noticed harms on the DoJ that are as bad as the attention-grabbing ones. The damage is likely to be profound.","The DoJ is the government’s lawyer, but it also serves as the guardian of the law, especially since Watergate. In 2019 Bill Barr, then Mr Trump’s pick for attorney-general, said that Americans “have to know that there are places in the government where the rule of law—not politics—holds sway” and that the Department of Justice “must be such a place”. Mr Trump has no time for that. Less than halfway through his second term, he has turned the DoJ from an arm of the law into a muscular limb of the presidency.","For a start, he has dramatically redefined the department’s priorities, which is legitimate, often by setting goals that blur policy and politics, which is not. Health-care fraud is being chased with particular zeal in states run by Democrats, such as California and Minnesota, where it can be used to discredit Mr Trump’s opponents, including the states’ governors, Gavin Newsom and Tim Walz.","The DoJ is also an effective tool for pursuing his political agenda. Election fraud is consuming ever more of its resources—not because it is a real problem, but because it is a presidential obsession. The DoJ has sued states for access to their voter rolls. In January the FBI seized hundreds of boxes filled with ballots and other documents in Georgia’s most populous county, part of an investigation of the presidential election in 2020. More recently, some 260 FBI analysts were dispatched to pore over Georgia’s files, with a deadline to review records by July 17th. At the very least, this will shake voters’ faith that elections are trustworthy—indeed, that may be its sinister design.","Matters of genuine public interest are left to languish. About a quarter of the DoJ’s lawyers have left. Divisions that investigated cryptocurrency fraud and public corruption have withered. Financial-fraud indictments by prosecutors at DoJ headquarters and in Manhattan are down by 30% from the ten-year average. About 300 special agents who specialise in national security have quit the FBI, taking decades of experience in counterterrorism and cyber-warfare with them.","The department has also become more chaotic. Too often, cases encounter problems in court, though it is hard to distinguish sloppiness by DoJ staff from deliberate ill-intent. Nearly 100 times in Mr Trump’s first 14 months, the DoJ supplied courts with inaccurate information. It is quite something for the state to lose the benefit of the doubt in its own courtrooms.","More than 61,000 petitions from detained immigrants have bogged down courts and frustrated judges and federal prosecutors, who have moved lawyers from criminal divisions to help. By September last year, about a fifth of FBI agents had been diverted to immigration enforcement.","Meanwhile, the president’s powers are increasing. In Trump v Slaughter last month the Supreme Court ruled that the president could sack leaders of semi-independent agencies, such as the Federal Trade Commission (FTC) and the Securities and Exchange Commission (SEC). That gives the president the capacity to force agencies to work in league with the DoJ. Imagine a co-ordinated campaign of pressure, in which the DoJ opens an antitrust inquiry, the FTC explores consumer fraud and the SEC investigates corporate disclosures.","Unfortunately, the permanent appointment of Mr Blanche is unlikely to mark an improvement. He has done as much as anyone to advance Mr Trump’s agenda of prosecuting his enemies and protecting his friends—a powerful combination for encouraging people to comply with Mr Trump’s wishes. Under Mr Blanche, the DoJ has recently threatened state election officials with criminal prosecution if they knowingly let non-citizens remain on voting rolls.","Democrats and more than 1,200 former DoJ lawyers have demanded that the Senate reject Mr Blanche’s nomination. The Senate now has the choice of confirming him, and thereby seeming to endorse Mr Trump’s broader agenda, or blocking him in a rare rebuke to the president. Unfortunately, a rejection may not accomplish all that much. Mr Trump can retain Mr Blanche as acting attorney-general for months or nominate someone just as pliable.","The best Americans can hope for, in the next two years, is that courts stand firm. So far they have generally checked the DoJ’s worst impulses. On July 7th a federal judge blocked the department’s effort to subpoena the names of election workers in Georgia. On July 13th another federal judge nullified a settlement organised by the DoJ in response to a civil case brought by Mr Trump that would have protected the president and his family from tax audits.","Even if Americans elect a president who wants to restore the DoJ, the damage will be hard to reverse. Mr Trump’s acolytes would see the ejection of his partisan lawyers as a witch hunt that justifies the next purge when they take back power. Once the arrival of any new administration routinely entails a fresh round of sackings, professionals who care about the rule of law will think twice about signing up. After Watergate, statesmanship and a bipartisan effort were needed to create the modern DoJ. Today the stakes are as high, and the task is harder. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/07/16/donald-trumps-gutting-of-the-department-of-justice"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.07.20","day":64,"title":"An O.M.B. Plan to Defund Science—and Anything Trump Doesn’t Like","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.07.20","paragraphs":["Under a new proposal, Administration officials could deny government grants to any group or project on the ground that it didn’t fit the President’s agenda.","The list of tactics the Trump White House has used against its perceived enemies is nasty and brutish but certainly not short. It includes indicting them (James Comey, John Bolton), investigating them (Jerome Powell, Lisa Cook, Gavin Newsom), threatening to investigate them (Chris Christie, Bruce Springsteen), and threatening to prosecute them (top election officials in all fifty states). The Administration has dispatched troops to cities the President doesn’t care for (Chicago, Los Angeles, Portland); sued universities that ticked him off (Harvard, U.C.L.A.); and withheld billions of dollars’ worth of funding from groups and projects that it deems “woke” or wasteful or not in line with Donald Trump’s priorities, whatever those at the moment happen to be.","Recently, the White House announced plans to codify its campaign of retribution. The proposal, which would dramatically increase the President’s power over how federal funds are given out, would hand Trump a “new cudgel” to “advance his partisan agenda and punish political rivals,” a letter signed by all the Democrats in the Senate charged. “The stakes could not be higher” is how the legal website Lexology put it.","The proposal in question comes, not surprisingly, out of the Office of Management and Budget, headed by Russell Vought, the architect of Project 2025. Titled, innocuously enough, “Regulation for Federal Financial Assistance,” it would replace the current guidance for signing off on government grants, which generally leaves the task to civil servants and peer-review panels. Instead, the final say would go to political appointees. All discretionary awards from the federal government would have to be assessed by senior Administration officials, who could deny them on the ground that they didn’t fit the President’s agenda. Grants could also be terminated at any time for the same reason.","The rules would affect hundreds of billions of dollars in funding disbursed by agencies ranging from the National Endowment for the Arts to the Transportation Department, to pay for everything from local dance performances to massive infrastructure projects. As Elizabeth Ginexi, a former program director at the National Institutes of Health, noted in a recent Substack post, “Federal grants are not peripheral to how states and communities function. They represent, on average, 36 cents of every dollar a state spends.” The proposal, she added, would put the “entire financial partnership between the federal government and the states under political control, without an act of Congress.”","The O.M.B.’s stated rationale for the new rules is to “improve transparency, accountability and oversight for Federal awards.” But no one—and this includes Trump appointees—seems to be buying it. Trump’s nominee to be the O.M.B.’s deputy director, Hal Duncan, noted at his confirmation hearing last month that the proposal would enable the Administration to prevent federal money from supporting “divisive D.E.I. ideologies.” At the same hearing, Senator Patty Murray, Democrat of Washington, accused the White House of trying “to turn the entire federal government into this one big slush fund to reward those aligned with the Administration and punish everyone else.” Among the many groups that have expressed concern about the changes are the National League of Cities, the School Superintendents Association, and the National Council of Nonprofits.","Research organizations have been particularly outspoken in their opposition to the O.M.B. proposal. “This latest move is a brazen power grab by the Director of the Office of Management and Budget to buck the will of Congress and the American people and will make future discoveries less likely,” Sudip Parikh, the head of the American Association for the Advancement of Science, wrote recently. Among the proposed rules’ many provisions is one that would prohibit federal money from being used to support collaborations between researchers in the United States and their colleagues in many other countries. “By this guidance, America would not be allowed to be included in the International Space Station,” Colette Delawalla, who founded and heads the group Stand Up for Science, said in an interview. “The same goes for every type of weather monitoring and pandemic monitoring.”","Of course, even before the O.M.B. proposal was published, on the Friday after Memorial Day, the White House was finding plenty of ways to undermine science. Last year, the Administration terminated or froze nearly eight thousand research grants. Federal judges have ordered many of them to be reinstated; still, roughly a third, totalling some 1.4 billion dollars, have yet to be released, and may be gone for good.","For the current fiscal year, Trump proposed slashing the budget for the National Science Foundation by more than half. Congress rejected the cuts and essentially held N.S.F. funding flat; the Administration has responded by simply refusing to disburse the funds. According to the website Grant Witness, this year the N.S.F. is on track to make the lowest number of grants in more than half a century—roughly seventeen hundred. Meanwhile, the agency has been operating without a director for the past fifteen months. (Trump has nominated a financier with no scientific expertise to lead it, but the Senate has yet to confirm him.) And, in April, the President abruptly fired all twenty-two members of the N.S.F.’s science advisory board. It was dismantled just as it was working to finish an analysis showing that China has overtaken the U.S. as the leader in key scientific fields. The turmoil at the agency has affected scientists—and budding scientists—across the disciplines: recently, M.I.T.’s president, Sally Kornbluth, reported that the school’s graduate enrollment has declined by about twenty per cent. “It’s a loss for the nation,” Kornbluth said in a videotaped message to the campus. “When you shrink the pipeline of basic discovery research, you choke off the flow of future solutions, innovations, and cures.”","The O.M.B. is aiming to finalize the new regulations by October 1st. (This is the case even though the office has already received more than ninety thousand comments on them and, under the law, is supposed to respond to all significant points before they can take effect.) It’s no accident that Vought wants the proposal enacted before the midterms; this would allow the Administration to continue to terrorize grant recipients even if Democrats gain control of Congress and start to exercise real oversight. As the late Donella Meadows, a professor at Dartmouth and the author of “Thinking in Systems,” once observed, “Power over the rules is real power.” ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.07.25","day":65,"title":"When a president stops pretending that voters count, disaster beckons","source":"The Economist","minutes":5,"tag":"Leaders","dek":"Tiny Nicaragua offers a cautionary tale for democrats everywhere","note":"2026.07.25","paragraphs":["“Hypocrisy is the homage that vice pays to virtue,” wrote François de la Rochefoucauld, a French moralist. This is especially true in politics. Autocrats usually put on a big show of holding elections. These may be phoney, as in Russia or Iran, but they allow rulers to claim to govern by popular consent, which lends them at least the appearance of legitimacy at home and abroad.","So it is highly unusual for the leader of a country that holds elections to say: no more. Yet that is what Daniel Ortega, Nicaragua’s co-president, did on July 19th. “There will never be elections here again,” he announced, while the world’s attention was on the football World Cup final. He complained that opposition parties wanted to use elections “to seize power”. That is indeed what elections are for.","Nicaragua is a small country, but this rhetorical rubicon matters. Globally, democracy has been in retreat for two decades or so. The worst deterioration has been in places that were free or partly free and have gradually become less so, as power-hungry leaders have squeezed the media, nobbled the courts and persecuted the opposition. According to Freedom House, an American watchdog, Nicaragua is the second-worst backslider of the past 20 years, after Mali. Mr Ortega was freely elected in 2006, but then set about dismantling every institution that could challenge him. He locked up and sometimes tortured his rivals. He forced the media to praise the awful poetry of his wife and co-president, Rosario Murillo. Roughly a tenth of the population fled.","Until now, however, Mr Ortega has allowed elections, albeit fake ones. In this he has behaved like other strongmen, who typically rig elections rather than scrap them. Even coup leaders with guns on their hips typically say they will hold a ballot “as soon as circumstances allow”.","Now Mr Ortega has “taken off the mask”, says Félix Maradiaga, a former presidential candidate who was stripped of his citizenship and deported. He has made explicit what other autocrats feel compelled to hide: that they will not submit to the will of the people. Presumably he has done so on the assumption that this will not provoke a forceful response from the United States, which once cared about democracy in its backyard. If Nicaragua formally becomes a one-party state and suffers no diplomatic blowback, others may follow. Marco Rubio, America’s secretary of state, condemned Mr Ortega’s words, but spelled out no serious consequences.","Nicaragua highlights two further problems that the global decline of democracy is likely to aggravate. First, leaders who cannot be removed will age in office. Mr Ortega is 80. Perhaps mental infirmity contributed to his latest bombshell. Second, succession. The peaceful transfer of power is tricky in a dictatorship. Mr Ortega wants his unpopular wife to take charge when he dies, and then his equally odious son.","This is a toxic combination. Ageing rulers-for-life seldom improve with each passing decade, and dynasties foisted on unwilling citizens are rarely a recipe for good government. Just ask the people of Uganda, where the 81-year-old strongman’s son, army chief and presumed heir has threatened to muzzle the press and castrate the main opposition leader. Or, depending on where you live, you may be able to think of an example closer to home.","The difference between rigging elections and abolishing them may sound trivial, but is not. So long as rulers pay lip service to democratic norms, dissidents can try to hold them to their own professed standards, and embarrass them when they fall short. So long as elections are held, there is a chance the strongman will miscalculate and lose. Sometimes the popular will prevails despite a tilted playing field, as Viktor Orban discovered in Hungary this year—and Mr Ortega discovered when a free election ended his first spell in office, in 1990.","So the precedent being set in Managua is troubling. A world where autocrats no longer pretend to care what the people think would be worse than today’s. All the more reason for democrats everywhere to insist on the most basic of rights: to choose their own rulers. ■"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.07.27","day":66,"title":"Trump’s War on Journalists","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.07.27","paragraphs":["The recent subpoenas of reporters make clear that the President is trying to threaten the press. Few protections are in place to stop him.","For years now, in office and out, Donald Trump has been unabashed about his desire to see reporters behind bars. The President’s fantasies can, at times, take on a lurid tone. Campaigning for Republican candidates during the 2022 midterms, Trump assailed the leak of the Supreme Court’s draft opinion in Dobbs, the landmark abortion case, and outlined his preferred approach to identifying the source: “The reporter goes to jail. When the reporter learns that he’s going to be married in two days to a certain prisoner that’s extremely strong, tough, and mean, he will say, he or she, ‘I think I’m going to give you the information. Here’s the leaker, get me the hell out of here.’ ” This April, after it was reported that a crew member was missing from an American fighter jet that had been shot down in Iran, Trump vowed that the person who had spoken to the press would be quickly outed: “We’re going to go to the media company that released it, and we’re going to say, ‘National security. Give it up or go to jail.’ ”","No one went to jail, but Trump has seized on another opportunity to threaten journalists. Earlier this month, the Times reported that he was forced to ditch his new Air Force One, given to him by the Qataris, for part of the ride home from the NATO summit in Turkey; the plane allegedly lacked anti-missile capabilities. (Trump had claimed that he was taking a last spin in the previous Air Force One “for old time’s sake.”) According to the Times, a senior F.B.I. official asked the newspaper to hold the story, citing national security. The Times declined to comply. Two days later, three journalists received subpoenas to appear before a federal grand jury in Manhattan. The Times later reported that the White House had instructed the director of the F.B.I., Kash Patel, to oversee an investigation into the leak, and that Patel had spent the day the subpoenas were issued holed up at the White House—not the ordinary locus for a law-enforcement operation. The Times, in a sealed filing that it sought to have publicly released, moved to quash the subpoenas, saying that they were “brought in bad faith to punish The Times for its coverage.”","The Justice Department has depicted the subpoenas as a benign move. “We’re not targeting reporters. They’re material witnesses, just like a reporter would be a material witness to a car crash,” Todd Blanche, the acting Attorney General, said at his confirmation hearing Wednesday. “The question we want to ask them is who provided them with classified national-security information.” That is scant comfort. Journalists’ access to information will evaporate if they cannot assure their sources of confidentiality. This risk is omnipresent, but it is heightened in the current moment, when reporting about the inner workings of government is more crucial than ever, and when Administration officials appear determined to close off any channels of information that are not officially sanctioned. As the Times’ executive editor, Joseph Kahn, explained, in a video, “There’s nothing more important that an independent news media does in a democracy than reporting fully and fairly on the way public officials protect national security and use taxpayer dollars.” Was Trump, reportedly livid over the Air Force One leak, concerned about the risk to security—or about the prospect of personal embarrassment due to the failings of a questionable gift that had cost taxpayers tens of millions of dollars to upgrade?","When it comes to the media, Trump appears to be moving from the unsettling rhetoric that began during the 2016 election (“scum,” “enemy of the American people”) to his long-promised assault. He has continued to file a barrage of defamation lawsuits—with some news organizations choosing to capitulate rather than risk harm to planned mergers or broadcast licenses. Trump is also now harnessing the processes of criminal law to intimidate and punish. In the early-morning hours of January 14th, F.B.I. agents arrived at the home of the Washington Post reporter Hannah Natanson and seized her computers and phones, as part of an investigation into a government contractor charged with retaining classified information. So far, judges have blocked the Justice Department’s efforts to gain unsupervised access to Natanson’s devices. In recent months, the department subpoenaed reporters from the Washington Post and the Wall Street Journal in national-security cases. The subpoenas were withdrawn after the news organizations challenged them. Media lawyers fear that the Administration could deploy a nuclear option: using the Espionage Act to prosecute journalists themselves for publishing classified information. Bruce Brown, the president of the Reporters Committee for Freedom of the Press, told me, “Short of prosecuting a reporter under the Espionage Act, the word ‘escalates’ doesn’t mean anything anymore. It’s just open season now.”","Administrations of both political parties have subpoenaed reporters to testify before a grand jury in past cases involving national-security leaks, but rarely, and as a last resort. Gabe Rottman, of the Reporters Committee, told me he counted just three such instances since 2000. Justice Department regulations, first formulated in 1970, stipulate that reporters are to be subpoenaed only when the government is seeking information that is “essential,” and it has made “all reasonable attempts” to obtain that information elsewhere. But these protections are illusory in the hands of an Administration determined to ignore them; they are not enforceable in court. Court rulings on reporter’s privilege have not been favorable. “Newsmen are not exempt from the normal duty of appearing before a grand jury and answering questions relevant to a criminal investigation,” the Supreme Court said in a 1972 ruling, though it left open the possibility of protection in cases where the government was engaged in harassment or bad faith, as the Times now claims it is.","There seems little chance that Times reporters will be in jail cells anytime soon; judges are unlikely to order that extreme step this early in the legal process. But it’s not clear what will happen if the Administration insists that forcing reporters to testify is its only option. Just as worrisome, though the Times has the resources and fortitude to withstand this pressure, the same may not be true of other news organizations. Such outlets may become wary of pursuing stories that could put them in the Administration’s crosshairs. That chilling effect, of course, is precisely what Trump is after. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.08.01","day":67,"title":"What the Big Mac index reveals about a global currency beef","source":"The Economist","minutes":6,"tag":"Leaders","dek":"It highlights economic problems—and helps explain how to solve them","note":"2026.08.01","paragraphs":["LOCKED IN A vault near Paris, ensconced in three bell jars, sits a small cylinder of platinum alloy, forged in London in 1879. Known as Le Grand K, it long served as the definitive standard for measuring the kilogram. There is no universal standard for measuring the monetary heft or purchasing power of currencies. But The Economist has a favourite candidate. It weighs up to 240g. It is ensconced in a cardboard box. And you can find it under two Golden Arches. Our version of Le Grand K is the McDonald’s Big Mac.","The Big Mac index we forged in London in 1986 will be 40 years old in September. What began as a playful thought experiment has taken on a life of its own. It has amused readers, intrigued currency traders and irritated central banks. It has also attracted critics who think fast food has nothing to say about global economics. It was born in an era of high monetary diplomacy, when policymakers fretted that the world’s most important currencies were horribly misaligned, inviting financial calamity or trade protectionism. Forty years on, similar debates are raging once again, this time about the dollar, yuan and yen. In a world of currency tumult and controversy, our palatable guide to exchange rates is as valuable as ever.","Fast food may seem an eccentric choice as a standard of value. But the Big Mac has unique advantages. You can buy it almost anywhere and it tastes much the same everywhere. McDonald’s calibrates its appearance, texture, flavour and smell with the same diligence that scientists lavished on that 1kg cylinder in Paris. Wherever you purchase your Big Mac, you are buying much the same thing.","That makes it a good measure of the bang you can get for your buck. In America $100 buys about 16 Big Macs. That is roughly the same burger-buying power as 100 euros, 426 Chinese yuan, or 8,039 Japanese yen. Yet $100 in fact buys about €87 in the foreign-exchange markets, or 677 yuan, or over ¥16,000, showing how far from their purchasing power the world’s currencies have strayed.","The index does not satisfy everyone. Some think it’s too narrow—what could one product possibly say about an entire economy? Others think it’s too broad—by some estimates, inputs that cannot be traded easily across borders, such as labour and retail space, account for over half the Big Mac’s cost. Some doubt its predictive value for exchange rates, others doubt its descriptive value as an indicator of a currency’s true worth, and a third camp doubt its prescriptive value as a guide to where exchange rates ought to be. Some just hate the puns.","To judge the oomph of currencies, it is obviously better to compare the price of thousands of products, rather than just one. But the elaborate measures of purchasing power assembled by organisations like the World Bank also have their flaws. Those global figures appear only once every three years and with a long lag—for example, 2021’s numbers came out only in 2024. Compiling them is one of the largest statistical initiatives in the world. They are also hard to verify and understand. The Big Mac index is quicker, fresher and easier to digest. And yet despite that, our results line up reasonably well with theirs. Of the 54 economies that appear in both our index and the World Bank’s database, only seven were deemed cheap in one but expensive in the other.","That is because the Big Mac, though a single product, has over 60 distinct ingredients, from beef to xanthan gum. It also draws on labour and property markets wherever it is made and served. The Big Mac index’s predictive record is admittedly mixed. But it showed correctly, for example, that the euro was overvalued when it came into being in 1999.","What to make of the index now once again finding that the euro, yuan and yen are out of kilter? Earlier this year, the IMF suggested China’s currency was 16% weaker than economic fundamentals implied. This competitive edge has helped the country rack up enormous trade surpluses in goods, which reached almost $1.2trn last year. President Emmanuel Macron of France has described these imbalances as “unbearable” and a mortal threat to European industry. He has threatened strong measures if China does not relent.","Donald Trump, America’s president, has often been the world’s most strident critic of cheap Asian currencies. In January he described how he “used to fight like hell” with China and Japan, which “always wanted to…devalue, devalue, devalue”. Such talk from the White House has ebbed lately. But currency traders are abuzz every few months with rumours of a new Plaza Accord, the 1980s pact to devalue the dollar—despite the extreme unlikelihood that such an agreement could work today.","The Big Mac index can play a role in this high-stakes debate. It makes clear that a cheap real exchange rate means a dollar price of burgers below America’s price. This imbalance goes along with low domestic consumption on China and a yawning budget deficit in America—and the flows of capital needed to sustain them. For the yuan to improve its standing in our index, it has two paths. Either the currency must strengthen or China’s Big Macs must rise in price, faster than they rise in America.","A sharp rise in China’s yuan could undermine the country’s growth and worsen its deflationary tendencies). It might bring about a relevelling of global trade, but it would be a levelling-down. Better for China’s policymakers to stimulate the economy so that wages and prices rise more quickly. That would make the yuan less undervalued, even if its exchange rate remained steady. Economists would call it a rise in the “real”, price-adjusted exchange rate.","About 10km from the Elysée Palace, Le Grand K still sits in its vault. It was retired in 2019 after 130 years of service. If currencies did ever move into close alignment with their purchasing power, the Big Mac index might also become redundant. But for as long as currencies remain unmoored, and the Big Mac remains consistent, our index will serve a useful purpose—however distasteful its critics may find it. ■","This article was downloaded by zlibrary from https://www.economist.com/interactive/leaders/2026/07/30/what-the-big-mac-index-reveals-about-a-global-currency-beef"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.08.02","day":68,"title":"The ‘Consumer Socialism’ Trap","source":"The Atlantic","minutes":10,"tag":"The Atlantic","dek":"The wrong way to solve the affordability crisis","note":"2026.08.02","paragraphs":["by Idrees Kahloon","This past January, in his inaugural address, Zohran Mamdani memorably promised to “replace the frigidity of rugged individualism with the warmth of collectivism.” In the parlance of the Democratic Socialists of America, of which Mamdani is a member, collectivism is a good thing. It is not meant to recall Stalin’s seizure of farms, which resulted in mass famine, or Mao’s Great Leap Forward, which also resulted in mass famine. American socialism today is different. The DSA still formally aspires to “popular control of resources and production,” otherwise known as seizing the means of production. Yet the New York City mayor’s attention-grabbing policy proposals—to freeze rents, establish city-run grocery stores, and pay for universal child care—are aimed at a more modest goal: socializing the cost of consumption.","“Consumer socialism” does not liberate workers from the exploitation of owners; it liberates consumers from the burden of prices. Although its advocates may claim inspiration from both the Great Society tradition of the Democratic Party and Nordic-style democratic socialism, consumer socialism is really a muddle of the two. The Great Society emphasized poverty reduction through means-tested programs such as Medicaid and Head Start; consumer socialism is meant for all. And unlike the Nordic welfare states, which are supported by high levels of taxation for all workers, Mamdani’s approach aims to raise sufficient revenue from corporations and the rich. Consumer socialism tries to have it all: universal social provisions without universally steep taxes. It retains, like other forms of socialism, a supreme optimism in the ability of state planners to shape markets. Where the old central planners failed, the new ones think they will succeed.","Mamdani is only one of consumer socialism’s proponents. The newly elected mayor of Seattle, Katie Wilson, is a former transit organizer who campaigned on both universal child care and spending $1 billion to pay for union-built public housing. The leading candidate for mayor of Washington, D.C., is DSA-backed Janeese Lewis George, who also calls for universal child care and massive production of below-market-rate housing. (She is open to the idea of government-run grocery stores as well.) Mamdani, Wilson, and Lewis George have claimed the mantle not of Stalinists or Maoists, but of a different subspecies of socialist—the “sewer socialists” who ran Milwaukee for decades starting in 1910. They made peace with the capitalist superstructure and devoted themselves to good, incorruptible governance and reliable public infrastructure—sewage systems, yes, but also parks, libraries, and fire departments. In their time, they were skewered for practicing “slowcialism.” In a speech he gave to mark his 100th day in office, Mamdani labeled “our 2026 answer to sewer socialism” as “pothole politics”—doing mundane jobs, such as filling more than 100,000 potholes, because “government is not too busy, not too self-important, not too mired in paperwork to fix the problems of this city.”","Sewer socialism is attracting renewed interest in America because it is too boring to threaten capitalism. Lenin despised its predecessor, municipal socialism, for much the same reason. In the late 19th century in English and German cities, socialist administrators operated public utilities such as gasworks, electric trams, and even city-owned slaughterhouses. This variation of socialism aimed to blunt the rapacity of capitalism rather than sharpen its contradictions and hasten the coming revolution. Under municipal socialism, Lenin wrote in 1907, “attention is diverted to the sphere of minor local questions, being directed not to the question of the class rule of the bourgeoisie, nor to the question of the chief instruments of that rule, but to the question of distributing the crumbs thrown by the rich bourgeoisie for the ‘needs of the population.’ ”","Lenin’s ghost would be similarly unimpressed with contemporary American socialism—too much democracy, too little murder. Still, there’s nothing small-bore about consumer socialists’ desire to overhaul the economy. In their view, high prices are not market failures but moral ones, the result of greed and corruption, which can be vanquished with the right intention. The ideal state is a kind of Lake Wobegon, where every price is below average.","Michael Powell: What Mamdani doesn’t know about tenants","One irony of consumer socialism is that it is better tailored to the laptop classes—which now form the backbone of the Democratic Party—than to the American left’s traditional working-class base. The upper classes disproportionately use child-care centers, while lower-income households rely more on stay-at-home parents and relatives. This is partly because wealthier people can more easily afford formal care services. But not every community may even want to send their kids to a child-care center. Some evidence suggests that Latina mothers prefer to have a relative look after their children, even when cost is no issue. Rent stabilization and controls apply to units, not occupants—which in New York has sometimes meant showering benefits on celebrities and on politicians, such as former Governor David Paterson and the late Representative Charles Rangel. Upper-middle-class meritocrats are generally not exhausted by capitalism. They are exhausted by the costs of rent and child care in desirable neighborhoods—bills that the preexisting means-tested welfare state would never have covered.","Mamdani will probably fall short of implementing his vision: Budget constraints mean that buses are unlikely to be free, as he promised; his child-care proposal received funds to last for just two years so far; and New York, a city of more than 8 million people, will have, at most, five city-run grocery stores by the end of his first term. Despite his pledges to tax the rich, he is limited in his ability to do so, and although his recently passed pied-à-terre tax might raise $500 million a year, universal child care would, according to his own campaign, cost $6 billion a year.","The natural habitat of consumer socialism—solidly left-wing American cities—imposes serious limits on its ambitions. Unlike the federal government, cities typically cannot run huge deficits year after year, and must quickly reckon with promises that cannot be paid for. In 2018, New York City officials rolled out a voucher program with an unwieldy name, CityFHEPS, and the laudable goal of decreasing homelessness by subsidizing housing. In 2019, the annual cost of the program was budgeted at $25 million; its projected cost last fiscal year reached $1.7 billion, as the number of recipients and the cost per voucher increased simultaneously. Faced with the city’s daunting budget deficit, Mamdani reversed his campaign pledge to expand CityFHEPS and has instead scrambled for ways to hold costs down.","Many risks lurk in consumer socialism’s promises of cheap goods and services. If New York City or Washington, D.C., rapidly increases subsidies for child care, for instance, without expanding the number of approved providers, the existing ones will charge more to meet excessive demand. Another complication is that the more generous any city benefits are, the more people will move across municipal limits to use them—creating a cost spiral.","The sewer socialists chose their targets carefully. Milwaukee’s mayors had a strong economic rationale for pursuing public ownership of utilities: avoiding the massive, duplicative costs of rival water networks without letting a private monopoly gouge consumers. In contrast, publicly run grocery stores are interventions in a low-margin, highly competitive industry. In his 100-days speech, Mamdani pledged, “At our stores, eggs will be cheaper. Bread will be cheaper. Grocery shopping will no longer be an unsolvable equation.” But the mathematics of running retail outlets might prove more flummoxing than he realizes. Many aspects of life in the Soviet Union have come to be retroactively romanticized; its grocery stores are not among them.","Optimists think—or hope—that Mamdani-style socialists have a greater awareness of economic constraints than they let on. My colleague Derek Thompson recently said that Mamdani may be sporting “the abundance mullet, which is to say, economic populism in the front and abundance in the back.” Abundance is a term that Thompson coined in this magazine to describe policies that expand supply through public and private investment and deregulation—essentially supply-side economics for liberals. The idea is that Mamdani would win popular support by freezing rents—an idea almost unanimously derided by economists—while simultaneously boosting home-building. But the second half of this bargain may never materialize. Although New York’s Rent Guidelines Board has approved a promised freeze for nearly 1 million rent-stabilized apartments, Mamdani’s efforts to permit more home-building have been plodding by comparison. Absent new supply, restrictions on rent increases will limit mobility for those who receive the benefit, and increase costs for those who do not.","Derek Thompson: A simple plan to solve all of America’s problems","Plans are already afoot to scale consumer socialism across America. National Democrats have realized that the high cost of living makes for a powerful midterm-election theme, and some in the party prefer to address it with subsidies and price controls rather than measures that increase personal incomes and economic growth. The Congressional Progressive Caucus recently released its “New Affordability Agenda,” which includes plans to make child care a nationwide entitlement—staffed by day-care workers paid as much as teachers—and to create a new set of housing subsidies for rent and down payments. Progressives also argue that this can be financed without tax hikes on ordinary people, but through targeted taxes on plutocrats and corporations. Enacting any such changes nationwide would require many more votes than the caucus currently has. And the problem with implementing such plans at the local level is that the rich can always decamp to Austin or Miami, as some of California’s billionaires are threatening to do over a ballot measure that would take 5 percent of their wealth.","Perhaps cities like New York will refine a functional version of consumer socialism, in which subsidies are balanced with enormous supply-side expansions in the number of homes and child-care centers, leaving everyone better off. Perhaps capitalism can be appropriately fettered within the confines of a select few cities, inspiring a nonviolent, nationwide socialist revolution. That would be a remarkable triumph for Mamdani’s consumerist ideology, which wears the transgressive label of socialism but is born primarily out of anger over prices (and an innate American antipathy toward taxes). American collectivism may be, as Mamdani promised, warmer than rugged individualism. It will certainly be warmer than Soviet or Maoist collectivism. It could also be just as unworkable. And it will certainly be extraordinarily expensive.","This article appears in the August 2026 print edition with the headline “The ‘Consumer Socialism’ Trap.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/08/mamdani-affordability-crisis-consumer-socialism/687603/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.08.02","day":69,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.08.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.08.03","day":70,"title":"Which Way Should the Democratic Party Go Now?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.08.03","paragraphs":["It’s been a tumultuous primary season, but is this the Democrats’ Tea Party moment? Or is something more pragmatic emerging?","At seven-fifteen in the morning on Monday, July 13th, when Democrats in Maine were in the midst of a hastily created process to find a replacement for Graham Platner, who had just withdrawn as their nominee for the U.S. Senate race, a security camera in the city of Biddeford captured a white Kia circling slowly through an intersection. The driver, a twenty-five-year-old immigrant from Colombia named Joan Sebastián Durán Guerrero, had been shot and killed by an ICE agent. This winter, after federal agents killed two people during an immigration crackdown in Minneapolis, Democrats were able to say that the mass protests they supported in response had forced ICE to retreat. Now, as the prospective candidates in Maine rushed to express their outrage at Guerrero’s death, it was obvious that the retreat had been temporary.","The fast-approaching 2026 midterm elections present the Democrats with both an opportunity and a crisis. The opportunity exists because President Donald Trump is unpopular, has failed to stop the rise in consumer prices that helped doom his predecessor, and seems unable to end the aimless war in Iran that he started. Americans now tell pollsters that they are more likely to vote for Democrats than for Republicans this fall. The crisis is that a narrow victory may not be sufficient to dislodge Trumpism, which is now deeply entrenched in government. And, though the Democratic leadership is looking to recapture the resistance spirit of 2018, its defining problem is a long-standing one in the Party of how to manage the movement that Senator Bernie Sanders started a decade ago, whose populist appeal and generational momentum it needs in this anti-institutional moment but whose principles it does not fully share.","That tension has been most vividly on view in Maine, where the Republican senator Susan Collins is now seeking a sixth term in a state that Kamala Harris won by more than six points in 2024. Platner’s emergence there last year had the quality of myth. A couple of left-wing political operatives saw Platner, an oyster farmer, in a local video opposing the development of a corporate salmon farm in Frenchman Bay, and matched his name to records of donors to Sanders’s campaigns. Platner, they learned, was also a harbormaster and a veteran of two Marine combat tours in Iraq and an Army tour in Afghanistan. One of the operatives reportedly e-mailed colleagues that Platner was “one of the most talented politicians of our time. Maybe any time”; both Sanders and Senator Elizabeth Warren endorsed him. He did turn out to be a commanding barnstormer, a foul-mouthed and fluent denouncer of wealth and corruption, whose appeal drove the sitting governor of Maine, Janet Mills, out of the race. But his candidacy collapsed in a series of scandals, involving first a Nazi-associated tattoo and offensive posts, then allegations of bad behavior toward women, and, finally, untenably, an accusation of rape. Platner denied it, but he dropped out.","One theory heard often in politics is that the Democrats are repeating, in ideological inverse, the experience of the Republicans in 2010, when the Tea Party overtook the G.O.P., eventually clearing the way for Trump. (“Warning for Democrats’ Future Is Lurking in GOP’s Past,” a USA Today headline put it, with impressive concision.) Such takes refer to a parallel not just in the rise of populists like Platner but also in primary upsets of powerful incumbents by radical newcomers affiliated with the Democratic Socialists of America. The chair of the Congressional Hispanic Caucus, Representative Adriano Espaillat, of New York City, and Representative Diana DeGette, of Denver, a progressive stalwart, were defeated by young insurgents, Darializa Avila Chevalier and Melat Kiros, respectively, who came out of the Gaza protest movement and the D.S.A., and who took some positions far outside the mainstream. (During an interview with the online publication The New York Editorial Board, Chevalier declined to specify whether her support of prison abolition meant that a man who randomly killed another man should not be sent to prison.) A columnist for The Atlantic wrote, “The D.S.A. is a parasite.”","That reaction perhaps suggests that there have been more of these upsets than is the case. In races where an incumbent congressional Democrat has lost this year, anger over Gaza has played a role, and in each of them the issue has drawn both donations and attention. But across the country only five Democratic incumbents have lost primaries—two of them because of redistricting—which does not really add up to a revolution. An alternative theory to the Tea Party one is that the general sense of emergency in 2026 has led Democrats, and especially the rising young figures hoping to lead the Party, to embrace political pragmatism.","This summer, two politicians have caught the attention of the Party’s base, both of whom are under forty. On the left, Representative Alexandria Ocasio-Cortez, of New York, pointedly declined to endorse Platner—even before the rape accusation, she called the mounting claims against him “hard to stomach”—and has been favorably cited by David Axelrod, Barack Obama’s political guru, for echoing the former President’s themes of hope and change. From the center, Jon Ossoff, running for reëlection to the Senate in Georgia, spoke critically of the Gaza war early on, and has focussed a controlled campaign on the President’s corruption, a traditional populist theme. These approaches seem to be working: in an Emerson 2028 Presidential-primary poll, Ocasio-Cortez and Ossoff were tied for third place, just behind Pete Buttigieg and Gavin Newsom.","Such political talent is rare. In Maine, to replace Platner, the Democrats eventually settled on Troy Jackson, the most organized of the prospects. A former logger who finished third in this year’s gubernatorial primary, Jackson lacked Platner’s ability to excite the public, but he was preferred by supporters of Sanders, who had endorsed him for governor. (Collins called Jackson a “Bernie bro.”) And, having spent six years as the president of the state Senate, he was palatable to the Party establishment. Last week, Jackson tweeted that Collins had “helped destroy Roe v. Wade, she advanced Trump’s $990 billion Medicaid cuts, and she gave ICE $70 billion to continue its rogue terror campaigns.” Political pabulum, yes, but maybe also a preview of what the Democrats’ campaigns this fall will offer: not exactly transformation, not even resolution, just a dogged and prosaic insistence that things in the country are going very badly. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.08.08","day":71,"title":"Why AI is a risk to Communist China","source":"The Economist","minutes":6,"tag":"Leaders","dek":"It is not as well placed to take advantage of the technology as many people think","note":"2026.08.08","paragraphs":["JUST AS FRONTIER artificial-intelligence models are benchmarked against each other, so AI will itself benchmark the rival political systems of America and China. The technology will test which is better at creating AI tools and diffusing them through the economy. And that will in turn depend partly on their very different ideas of how societies should be run.","Even in a field changing as rapidly as AI, the results of that contest may not become clear for some years. But as we report from inside China, the country is already adopting AI fast—and its government is preparing for the dramatic economic and social change this heralds. As an autocracy, China has some advantages in harnessing the 21st century’s most promising technology. It also has plenty of problems.","Start with the calibre of China’s models. The common perception is that they are cheap and that even the best persistently lag behind America’s. In fact, the two countries’ AI models are converging. Innovative Chinese models are getting bigger and cleverer. Within the past few weeks Chinese labs have released Qwen3.8-Max and Kimi K3, which almost match the most advanced American AIs such as Anthropic’s Fable 5. Chinese models will be just as likely to break loose from their test beds as American ones.","Although Chinese models are cheaper, American models are often better value. Artificial Analysis, an American firm, finds that for most trade-offs between cost and intelligence, an American model outperforms Chinese ones.","The convergence is likely to continue. Although China is building only a tenth as much data-centre capacity as America, that deficit is unlikely to last. As a semi-planned economy, it is good at creating infrastructure. While American opinion turns against data centres, South-East Asia is hosting huge Chinese facilities. China’s open-weight models can run on anyone’s servers, meaning that compute is less of a problem than the headline numbers suggest. China also has almost three times as much installed electricity-generating capacity as America, and its lead is growing.","China is learning to cope with sanctions. It smuggles in cutting-edge Nvidia chips and rents them in foreign data centres. And Huawei, its best chip-designer, is rapidly increasing the output of its (inferior) chips. Chinese-made lithography tools are now using deep UV light to print chips, though the best technology, using extreme UV, remains out of reach.","Model-building is only half the story. To make the economy dynamic, AI must also be deployed—the focus of Chinese AI policy. For as long as China was behind America in model-making, leaders saw diffusion as the best way to compete. But they may also believe that, as with other broad technologies such as electricity, adoption brings greater rewards than discovery. China’s working-age population is due to shrink by 25% by 2050; for machines to replace people requires diffusion, too.","So far, the use of AI has yet to show up in the economic statistics of either America or China. But change in some industries has already been sweeping. AI-assisted lorries will need 30% fewer drivers, going by one large firm’s experience, as crews slim from two drivers to one and from four to three. AI was used to generate 95% of the 128,000 wildly popular one- or two-minute-long microdramas released in the first quarter of 2026, replacing many actors and film crews.","China is also rapidly increasing the use of robots. In June leaders told local governments and state-owned enterprises to have 10,000 humanoid robots doing real work by the end of 2026. Morgan Stanley, a bank, expects humanoid sales in China to reach 446,000 by 2030, nine times this year’s total. Workers are being paid to train robots in huge warehouses by repeatedly folding clothes and sorting and stacking objects.","China has a lower share of white-collar workers than America, so AI is likely to have the greatest effect in consumer markets and blue-collar work. That could easily lead to discontent. Youth unemployment is already around 15%, and over 300m people work in the gig economy. Job destruction could be much faster than China’s demographic decline.","You might think that the Communist Party’s grip on power is so strong that it can ignore the blowback. However, dictators fear being brittle. Although Chinese firms want to roll out AI fast, the government will be desperate to avoid instability.","That is why AI will be a test of the system—and why China’s options are limited. As in America, there is plenty of talk about retraining. However, retraining has a poor record and even the most successful countries, like Denmark and Singapore, struggle to equip workers for entirely new careers. There is no reason to think that China will be any more successful, especially as it already has too many graduates.","Prominent economists and advisers suggest extending the social contract by, say, taxing AI firms or creating a universal basic income. Their work has appeared in party journals, an official expression of interest. But President Xi Jinping has long been against handouts, saying they can lead to laziness.","Political leaders are pressing companies to redeploy staff rather than sack them. They may also ask state-owned companies to mop up surplus labour. Yet, although that is politically possible, it will cancel out some of the benefits of rapid diffusion at a time when domestic growth is already anaemic.","So the government may improvise, letting AI rip until there is trouble, when it will step in. That is what happened with tutoring and gaming, industries thrown into confusion overnight when the party decided that they were causing too much harm. Cautious officials recently slowed robotaxi experiments after more than 100 malfunctioned in Wuhan, leaving passengers stranded. However, stop-start AI may impair the ability to innovate. If so, China’s leaders ma
