f can’t capture the changing views of the people who populate it.","“The map is not the territory” is by now a truism, but the more important truth is that the territory is inarticulate without a map to know it by. Maps are the ideal metaphor for our models of what the world might be. A new political map of New York City awaits us—“slight left turn ahead,” as the G.P.S. lady would say, unless she pauses and issues an unsettling “recalculating” alert.","And so for the map of the country. We live in a time when the chart of the nation, its recognizable edges and worn paths, has been largely erased and replaced with one that calls to mind medieval maps, with misshapen horizons, weirdly distorted territories, and dragons lurking beyond the borders. The primary feeling that many of us currently experience is not merely distress but profound disorientation. We not only don’t like where we are; we don’t know where we are. Once reliable routes to reality have been cut off.","It helps to know where we’re going before we get there. If there is a consoling reflection in this season, it is that all good maps, like the digitized city map, turn out to be shared work, made by many hands over a long period of time. Drawing a plan of our plans is the necessary task of the approaching year, as an act of collective imagination and common hope. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.01.17","day":null,"title":"What the collapse of Iran’s regime would mean","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Thousands have died and America has threatened to strike back against the horror there","note":"2026.01.17","paragraphs":["WHEN PROTESTERS took to the bazaars and streets of Iran, the supreme leader, Ali Khamenei, met them with bullets. After two weeks of chants of “death to the dictator”, militiamen allied with the Revolutionary Guards and toting automatic rifles rode in on swarms of motorbikes. With snipers, they shot their fellow citizens, aiming at their faces and genitals. Morgues are overflowing. Bodies in bags are stacked on bloodied pavements. Several thousand may be dead. Thousands of the wounded have been arrested, some dragged from hospital beds to prison cells and an uncertain fate.","This ought to be the moment that ends the theocrats’ 47 years in power. Iranians deserve to live in a democratic and prosperous country, not least because of their bravery. The world would benefit if Iran was turned from being a nuclear threat and an exporter of violence across the Middle East to a tolerant, stable trading power. But protests alone don’t end tyranny. What would an American strike contemplated by President Donald Trump do to bring about the mullahs’ downfall? And if the regime were to topple, what might follow?","Iran’s rulers are merciless because of their weakness. They have nowhere to turn and nothing to offer their people but violence. At home, Iran’s citizens must endure a shrinking economy, rapidly rising food prices, joblessness and worsening poverty. Abroad, the regime has been humiliated, as its proxy forces in Lebanon, Syria and Gaza were battered or destroyed, mostly by Israel, since 2023. Last year’s 12-day war showed that the regime could not even protect its own commanders and nuclear sites. After crushing protests in previous years Mr Khamenei sometimes offered concessions, such as relaxing the dress code for women. This month his government proposed a general stipend worth $7 a month, hoping to buy off public anger. That was met with derision.","The days ahead are fraught with uncertainty and danger. The protesters have withdrawn from the streets, though for how long nobody can say. The bleakest outcome would be that the regime remains in power, bonded by blood, condemning Iranians to a stagnant, enduring oppression. Bad, too, would be a collapse of Iran into worse violence. The break-up of Yugoslavia in the 1990s, the invasion of Iraq in 2003 and civil war in Syria offer stark lessons in how hard it is to end decades of repression without provoking mass bloodshed. Kurdish, Azeri, Baluchi or other separatists could rise up and Iran could descend into chaos. Add the presence of enriched uranium, nuclear scientists and religious extremists, and the risks are grave. Fear of what comes next may explain why some inside Iran have so far failed to join the protests.","In between are scenarios in which the regime fragments. Perhaps the Revolutionary Guards will oust the supreme leader. Or a faction of guards may seize power in the name of the people, and seek legitimacy by holding rival factions to account for the recent killings. If so, they could be helped by the regular army, which so far has stood aside. Either way, the new men in charge could seek to strike a deal in which America lifted sanctions in exchange for strict limits on Iran’s nuclear programme and ballistic missiles.","America could attempt to land a blow against a regime that has been a running sore in Washington for over four decades. This week Mr Trump first threatened “very strong” action against Tehran, while calling for more protests, and then appeared to retreat—whether as a ruse or out of caution is unclear. If he attacks, his preferred option would surely be a limited strike. Perhaps he could aim for a political decapitation, somewhat like the one he recently oversaw in Venezuela, whereby the detested Mr Khamenei is deposed or killed. Or America could drop bombs and missiles on selected sites inside Iran, perhaps targeting structures associated with the Revolutionary Guards.","At less risk, America could help end the communications blackout imposed by the regime, by smuggling Starlink kits into Iran. One sign this matters is that security forces are hunting for those already in the country. The White House is also giving tacit support to an exiled opposition figure, Reza Pahlavi, the former crown prince, who fled from Iran when the shah was toppled in 1979. From a safe distance in Maryland he, too, has been urging protesters to rise up to bring democracy. In the absence of organised opposition inside Iran, perhaps the country could restore some form of monarchy, (see our interview with Mr Pahlavi).","However, just to run through the options shows how hard it will be for American action to succeed. If Mr Trump orders strikes, Iran is armed with a formidable battery of short- and long-range missiles that could hit back across the Middle East, leading to an unpredictable escalation—which is why countries there are warning against an American attack. A decapitation from the air would require exquisite intelligence against an adversary who is forewarned. Even with the ayatollah gone, a Caracas-style deal with the Revolutionary Guards is unlikely to create lasting stability, because grieving Iranians will yearn for vengeance against generals with so much fresh blood on their hands.","The stakes are extraordinarily high. With Mr Trump in office, old certainties in geopolitics are melting away. His concern will never be to respect international law, nor to foster a club of liberal democracies. But, even as Iran is abandoned by its allies, China and Russia, he is readier than any recent American president to bring about big changes if he believes they will enhance America’s influence and his own prestige. Each intervention is a test of what sort of world that will create.","Once every popular uprising seemed to herald the birth of a new democracy. Alas, after the failures of the Arab spring, it is no longer easy to imagine that Iran’s path could be so simple. The hope nonetheless is that, in time, the collapse of the regime will favour Iran’s courageous people, who have proved once again that they are their country’s greatest blessing. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/01/15/what-the-collapse-of-irans-regime-would-mean"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.01.19","day":null,"title":"Donald Trump Was Never an Isolationist","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.01.19","paragraphs":["He once defied the G.O.P. by blasting military interventions. But what looked like anti-interventionism is really a preference for power freed from the pretense of principle.","There aren’t many moments in Donald Trump’s political career that could be called highlights. But one occurred during the 2016 Republican primary debate in South Carolina, when Trump addressed the prickly issue of the Iraq War. It had been a “big, fat mistake,” he charged. And the politicians who started it? “They lied.”","Podcast: The New Yorker Radio Hour David Remnick talks with Daniel Immerwahr about Venezuela.","The audience hated this. Trump’s fellow-debaters Jeb Bush and Marco Rubio argued that George W. Bush—Jeb’s brother—had kept the country safe. Trump plowed on loudly through the booing. It was as if an “angry Code Pink-style protester” had crashed the Republican debate, the journalist Michael Grunwald wrote.","Trump hadn’t stood against the Iraq War from the start, as he has frequently claimed. (When asked, in the run-up to the invasion, whether he supported it, he replied, “Yeah, I guess so.”) But by 2004 he truly was opposed. He scoffed at the notion that the war would achieve anything. What was the point of “people coming back with no arms and legs” and “all those Iraqi kids who’ve been blown to pieces?” he asked. “All of the reasons for the war were blatantly wrong.”","Skepticism came easily to Trump, who had long been hostile to mainstream foreign policy. He made his political début, in 1987, by taking out full-page ads in several papers to complain of Washington’s “monumental spending” on defense for allies like Japan and Saudi Arabia. The foundations of U.S. supremacy since 1945—the aid packages, alliances, trade pacts, and basing arrangements that make up what the former Secretary of Defense Robert Gates calls the “symphony of power”—have all seemed to Trump like a colossal waste.","Critics have called Trump an isolationist. Given the unconcealed delight he takes in dropping bombs on foreign lands (seven countries in 2025 alone), that can’t be right. A better diagnosis is that Trump doesn’t think the United States should seek to superintend global affairs, to take responsibility for the operation of the system. “American foreign policy elites convinced themselves that permanent American domination of the entire world was in the best interests of our country,” his recently released National Security Strategy explains. “Yet the affairs of other countries are our concern only if their activities directly threaten our interests.”","At times, Trump has veered oddly close to the left, which has opposed trade deals (“neoliberalism”), military interventions (“warmongering”), the bipartisan foreign-policy consensus (“the Blob”), and the U.S. policing of the planet (“empire”). In his 2016 race against Hillary Clinton, he scored points by spotlighting her support of the Iraq War. “In the end, the so-called nation-builders wrecked far more nations than they built,” he said last year, “and the interventionalists were intervening in complex societies that they did not even understand themselves.”","What distinguishes Trump from the left, of course, are his narrow nationalism and his love of raw force. “I’m the most militaristic person there is,” he has boasted. He relabelled the Department of Defense the Department of War, and appointed a Secretary, Pete Hegseth, who has promised to give “America’s warriors” the freedom to “kill people and break things.” Forget the symphony of power; Trump just wants to crash the cymbals.","Trump’s second term has been cacophonous with threats—to acquire Greenland, ethnically cleanse Gaza, make a state of Canada, throw the world economy into convulsions. This is a self-conscious flight from principles toward what he calls the “iron laws that have always determined global power.”","Hence this past weekend’s assault on Venezuela, in which U.S. forces launched air strikes on Caracas and nabbed the head of state, President Nicolás Maduro. (At least a hundred people were killed, local authorities say.) Trump claims that his goal is to punish Maduro for heading a “vast criminal network” that has brought “colossal amounts of deadly and illicit drugs into the United States.” But this is hard to swallow. The drug that is killing people, fentanyl, is almost entirely produced in Mexico, and the drug Venezuela does play a (minor) part in transporting, cocaine, goes mainly from there to Europe. Also, didn’t Trump just pardon Juan Orlando Hernández, the former Honduran President, who had been sentenced to forty-five years in federal prison for conspiring to import four hundred tons of cocaine into the United States?","The pretext frayed further as Trump started speaking covetously of Venezuela’s oil. But who needs pretexts? Trump has spurned the sort of global influence that required the appearance of fairness. He favors instead the power of the bully, which is best flexed by arbitrary attacks. The message these send is clear: You could be next.","Even Venezuelans thrilled to see Maduro gone have reason to be unnerved. It’s as if China had bombed Quantico, placed Trump in shackles, and whisked him to Shanghai for trial. No matter how much some people in the United States loathe Trump, they would, at minimum, have questions.","It’s hard not to think, in this moment, of George W. Bush. He spoke forcefully against “nation-building” at one of his debates with Al Gore, in 2000. “I just don’t think it’s the role of the United States to walk into a country and say, We do it this way, so should you,” he explained. Even as he went to war after 9/11, he plainly hoped to prevail through air strikes. Only when these failed to achieve their desired ends did he launch, in Afghanistan and Iraq, precisely the sort of protracted, bloody, and unpopular occupations he’d warned against.","Venezuela could become Trump’s Iraq. Once again, a U.S. President is railing against “terrorists,” eying oil reserves, flouting international law, and hunting down foreign dictators on factually dubious grounds. And, once again, fantasies of surgical strikes are yielding to messy realities. Watching Trump announce Maduro’s capture, you could almost see the mission creep happening in real time. After glorying in the military operation, Trump contemplated its aftermath. “We’re not gonna just do this with Maduro, then leave,” he said. There might be a “second wave” of attacks. Either way, the United States would have to “run the country” and “rebuild their whole infrastructure.” Trump was, he declared, “not afraid of boots on the ground.”","A reporter asked: How does running Venezuela put America first? “I think it is because we wanna surround ourself with good neighbors,” Trump answered. Speaking of which, “Cuba is gonna be something we’ll end up talking about.” The next day, he expanded his threats to include Colombia.","And so it begins. The press conference could have used a dash of 2016-era Trump. Someone to shout, “They’re lying,” and “This is a big, fat mistake.” ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.01.24","day":1,"title":"The true danger posed by Donald Trump","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Despite a tactical retreat, great risks remain","note":"2026.01.24","paragraphs":["EUROPEANs EXPECTED a diatribe, but in Davos Donald Trump was almost conciliatory. He demanded “right, title and ownership” of Greenland, but abandoned tariffs, ruled out force and later hailed a new “framework” and a possible deal.","That should be a relief to America’s allies everywhere. A crisis that threatened to engulf the transatlantic alliance has eased. But for how long? This may be only a tactical retreat. Mr Trump has coveted Greenland for years. In setting out his claim he spoke about NATO with a scorn that should put the capitals of Europe on high alert.","The Greenland crisis holds lessons for all countries. One is that Mr Trump will yield under pressure, without necessarily surrendering his long-term goals. Another is that the president’s narrow, pessimistic view of the world and his willingness to rewrite history have eroded the trust which used to underpin America’s alliances. Last, it follows that every falling-out under Mr Trump threatens to be existential. He portends a global realignment for which America’s allies must prepare.","With Greenland, Europe was lucky. It got through this round because Mr Trump chose to pick a fight over a prize of almost no strategic value to America. Mr Trump argues, correctly, that the Arctic will be contested as its melting ice admits the world’s shipping. Greenland is a site for America’s future “Golden Dome” missile-defence system. If the island belongs to America, neither Russia nor China will dare strike it.","But Greenland already has an American base to deter aggressors. If it comes under attack, Denmark and its European allies would have a powerful interest to protect it. America can do much of what it wants in Greenland under today’s treaties and, under the new framework, Denmark could strengthen them. The extra benefit of being able to colour in the map is nugatory.","All this helped Europeans explain that the potential cost to America was not worth it. Mr Trump’s bluster about levying tariffs led some European countries to threaten retaliation. The markets took note of the harm a trade war and a security crisis could inflict on America. Public opinion there is broadly against a costly takeover. Under fierce European lobbying, Congress showed rare signs of standing up to Mr Trump.","The moral is that, to get America’s president to retreat, you have to convince him that you will impose a price on him. In most of their dealings with Mr Trump, European leaders have treated him with sycophancy truffled by the odd, muted objection. This time, they were more assertive and it worked.","That is where the good news ends. At Davos Mr Trump talked about owning Greenland—which means that he could yet seek leverage by reviving tariffs or even the threat to use force. Even if he doesn’t and America and Denmark successfully negotiate a revised treaty that remains short of sovereignty, Europeans should heed the language in his speech. It betrayed an ominous contempt for Europe and for the value to America of the transatlantic alliance as it works today.","Mr Trump said that America has paid “100%” for NATO and never got anything in return. Scott Bessent, the treasury secretary, gripes that America has spent $22trn more than freeloading Europeans on defence since 1980. The administration’s security strategy warned that Europe faces “civilisational erasure” from immigration and may soon no longer be a reliable ally.","That is a travesty of NATO’s history and Europe’s future. It is true that, since the end of the cold war, the alliance’s European members have spent too little on defence. But during it, they were a bulwark against Soviet expansion and shared a belief in democracy and freedom. In any case, they are beginning to spend more money again, partly because of Mr Trump’s hectoring, but mostly because of the growing threat from Russia.","NATO has succeeded because it was founded on mutual benefit as well as values. The only time its Article 5 mutual-defence pledge was invoked was to support America after 9/11. Proportionally, Denmark lost more troops in Afghanistan than America did. Europe provides America with bases, such as Ramstein in Germany, that project power around the world; it defends American interests, including in the Arctic.","Unfortunately, Mr Trump is unlikely to change his view that allies are spongers and shared values are for suckers. That is sure to lead to further confrontation, whether over Greenland or something else. America’s friends, in Europe and beyond, therefore need to prepare for a world in which they are alone. That starts by preserving as much of NATO as they can. Building hard power takes years, and Mr Trump is in a hurry.","The problem is that Mr Trump believes that America holds all the cards, because his European and Asian allies have more to lose from a rift than America does. He is partly right. For example, if America refused to sell weapons for Ukraine and blocked intelligence, it would risk Ukrainian defeat and invite the next Russian aggression. Europe and Asia depend on America for military equipment. America provides 40% of NATO’s capacity—and it is the most important 40%. America supplies Europe with a host of economically vital services and digital technologies.","Europe should try to expose the shallowness of Mr Trump’s thinking. It can start by setting out an inventory of what America stands to lose—and this includes a lot more than the cost to American consumers of more tariffs. Europe is a market for $1trn-worth of American goods and services. It supplies essential technologies, including for chipmaking, telecoms equipment, lenses, aircraft and much more. European spies, especially Britain’s, give America valuable intelligence.","Europe needs to ensure that when investors, voters and Congress react to Mr Trump’s vainglorious schemes, they focus not just on Europe’s vulnerabilities but also on the harm that they themselves could suffer. That means appealing to their self-interest as well as deep principles of war and peace. Investors do not want to lose money, citizens do not want to scrimp and save and politicians do not want to be voted out.","Unfortunately, America’s alliances may not survive continual bouts of arm-wrestling initiated by a president who thinks allies have no value. From within, Europe will suffer disunity, as different countries seek varying accommodations with a predatory America. From without, the presidents of Russia and China, Vladimir Putin and Xi Jinping, will seek to corrode the allies’ unity with provocations that divide them.","In past decades American protection has coddled Europeans. Rather than deal with hard power, they have focused on the good life. Those times are over. European leaders should strive to slow the erosion of the transatlantic alliance, but they must also prepare for a day when NATO is no more. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/01/21/the-true-danger-posed-by-donald-trump"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.01.26","day":2,"title":"Why Trump Supports Protesters in Tehran but Not in Minneapolis","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.01.26","paragraphs":["During the President’s second Administration, universal principles such as self-determination and due process are wielded only opportunistically.","On January 8th, the twelfth day of mass protests in Iran, which began when shopkeepers, responding to runaway inflation, closed Tehran’s Grand Bazaar, the Iranian government shut down public access to the internet, further shrouding an already largely closed society. Nevertheless, isolated images and details have been smuggled out, giving a hint of how brutal and monumental these events are.","Video clips have circulated of people outside a morgue, unzipping body bags as they search for their loved ones. In the western city of Ilam, near the Iraqi border, security officials stormed a hospital to try to seize wounded protesters, while medical staff resisted. An ophthalmologist at a hospital in Tehran reported that it has been overwhelmed by casualties, including many people who were shot in the eye. In the conservative city of Mashhad, a journalist said that the streets were “full of blood.” The Iranian government has acknowledged the deaths of two thousand people, though international observers fear that the total may be much higher. The Chancellor of Germany, Friedrich Merz, insisted on Tuesday that the regime was in “its last days or weeks.” If he proves to be correct, it will be because of hundreds of thousands of brave acts by Iranian citizens—acts of discontent but also of idealism.","The portfolio of this crisis landed across classified Washington, on the desks both of career staff in the intelligence and diplomatic services and of Donald Trump’s recent appointees, among whom idealism is an increasingly shunned philosophy. The norm in American foreign policy has been that all interventions, including blatantly self-serving ones, are pitched in elevated humanitarian terms. During Trump’s second Administration, universal principles such as self-determination and due process are wielded only opportunistically. In Venezuela, Trump followed his ouster of Nicolás Maduro not by supporting the democratic opposition but by sanctioning the ascent of the dictator’s second-in-command, Delcy Rodríguez, seemingly in exchange for oil revenues. (The opposition leader, María Corina Machado, could only offer her Nobel Peace Prize medal.) Just after the New Year, in a conversation that also touched on annexing Greenland, against the will of its people, the White House adviser Stephen Miller gave CNN’s Jake Tapper the emerging party line: “We live in a world, in the real world, Jake, that is governed by strength, that is governed by force, that is governed by power.”","This is an encompassing vision, one that is now playing out in the ICE campaign in Minnesota against undocumented migrants and, more and more, against protesters and ordinary citizens. It also makes plain the hypocrisy in Trump’s embrace of the Iranian opposition. Ayatollah Ali Khamenei’s government has denounced the protesters it has killed, calling them terrorists; the Trump Administration has said that Renee Good, the woman shot dead by an ICE officer in Minneapolis, was engaging in an act of “domestic terrorism.” If the scenes in the Twin Cities look like those from an overseas occupation, the historian Nikhil Pal Singh suggested in the magazine Equator this week, that is because, under this Administration, the foreign and the domestic realms have bled together, as Trump threatens war-time powers “to arrest and remove unauthorised immigrants—and discretionary police powers abroad, to arrest foreign leaders (and seize foreign assets) under US law.” The Administration is asserting, too, an almost colonial kind of impunity: last week, Vice-President J. D. Vance baldly asserted that ICE agents have “absolute immunity” from local prosecution for their activities in Minnesota.","Even so, although the President’s intrinsic sympathies are with strongmen—Putin, Orbán, Kim—his strategic interests in Iran are with the protesters. (As it happens, the Administration’s old allies in Israel and its newer ones in Saudi Arabia and the Gulf states all want the Iranian theocrats gone.) On social media, the President made some gestures of solidarity. “keep protesting,” he urged. “help is on the way.”","Exactly what kind of help remains unclear. Trump’s adviser Steve Witkoff met with Reza Pahlavi, once the crown prince of Iran, but the White House found the deposed royal unconvincing. “He seems very nice, but I don’t know how he’d play within his own country,” Trump told reporters. In posts and appearances, the President returned to more familiar themes: he mused about possible military strikes on strategic sites in Iran, threatened tariffs against countries that trade with it, and announced a little bit of progress—the Iranian government had apparently reversed a plan to execute Erfan Soltani, a twenty-six-year-old shop owner who was arrested in connection with the protests. “We’ve been told the killing is stopping,” Trump said on Wednesday afternoon, and then, somewhat tellingly, struggled with his verb tenses. “It has stopped. It is stopping.”","In Iran, the despotic regime is fragile and desperate, and, as Merz suggests, it may soon fall. But it may also survive, by means of violent repression, and by Thursday the news from Tehran had quieted. Sounds of gunfire had faded; there were no new bonfires. Since the end of the Second World War, the United States and its allies had maintained a system of humanitarian interventionism, until the President so delightedly detonated it. “In the first year of his administration,” the Times noted last week, Trump “dismantled the instruments of soft power—such as Voice of America and the State Department unit that dropped internet capability into Iran—that were key to democracy promotion.” What he is left with are his threats and a hollow sort of exhortation that borrows from the same program of humanitarian interventionism that he has so explicitly disavowed. “Iran is looking at freedom,” Trump wrote on Truth Social, “perhaps like never before.”","Perhaps. The President’s statements of allegiance—and, potentially, the internet that Elon Musk has offered to make available for free via Starlink—may well strengthen the resolve of the Iranian opposition. But Trump’s domestic acts, in a countervailing way, may embolden the regime. Cynicism travels, too. Right now, he is faced with a mass protest in Minneapolis against a government show of power that is growing increasingly unpopular, and his reaction has been to double down: on Thursday, he threatened to invoke the Insurrection Act and send federal troops to the upper Midwest.","What supplies all these events with a sense of approaching a precipice is the open contestation between pro- and anti-democratic forces, happening both here and abroad, in view of each other. Through the partial curtain between the two societies, we are watching what is happening in Iran. And Iran, surely, is watching us. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.01.31","day":3,"title":"ICE’s impunity is a formula for more violence","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Is America’s president building his own paramilitary militia?","note":"2026.01.31","paragraphs":["AMERICA STARED into the void this week, but pulled back. Federal action in the streets of Minneapolis goes well beyond immigration. It is a test of the government’s power to use violence against its own citizens—a dividing-line between liberty and tyranny. And it will not be the last.","After immigration agents killed Alex Pretti on January 24th, and the Trump administration slandered a good Samaritan as a would-be mass murderer, America was spiralling towards civil unrest. Happily, protesters showed restraint. Public opinion has turned against ICE, the catch-all brand for America’s deportation machine. Even some conservatives have doubts. And Donald Trump grasped that immigration, once one of his strongest issues, has become a liability. On January 26th the president sought to ease tensions, including by putting the operation in Minneapolis under new management.","And yet the stand-off between ICE and local people continues. Mr Trump has not renounced his power to impose a paramilitary force on unwilling states. Americans should be on their guard.","ICE has a reason to be in America’s cities. Mr Trump has a mandate to deport illegal immigrants. Having dramatically curbed illicit flows across the southern border, he claims to be seeking “the worst of the worst”. But that is not what his enforcers are doing. Recently, only 5% of those detained have been people convicted of violent crimes. Instead ICE’s brutal means indicate ends that are darker than immigration-control, for several reasons.","One is that the administration appears to believe ICE should be a law unto itself. In their zeal to fill quotas and live out their macho “destroy the flood” culture, ICE agents have revelled in the wanton use of force. Administration officials have nonetheless told agents that they enjoy “absolute immunity” as they go about their duties and, a judge complains, have defied court orders. They rushed to brand Mr Pretti, and Renee Good, a woman shot earlier, as terrorists. They have strained to ensure that investigations into those killings are safely under their own control. Impunity is a formula for more violence.","Another reason to worry is that ICE and its leaders are trampling the constitution. By insisting that witnesses and protesters are criminals, they are denying people their First Amendment rights to free speech and association. In a state like Minnesota, when the head of the FBI says people cannot bring a gun to a protest he is denying their Second Amendment rights. And when ICE agents stop or arrest people without cause and search their houses without a court warrant, they are denying their Fourth Amendment rights.","Last, deploying ICE to Minneapolis, a city with relatively few illegal immigrants, seems to serve a disturbingly broad agenda: to draw attention to ethnic Somalis caught up in a benefits scandal there; to punish “sanctuary cities” that limit the help they extend to ICE; or perhaps as theatre to scare people and deter all kinds of migration to America. Mr Trump could also be trying to boost support for Republicans by portraying Democrat-run cities as disaster zones where lawless immigrants are protected by violent radical-left extremists.","The most disturbing possibility is that the president is creating a militia which answers only to himself. As our briefing explains, from the Texas Rangers to Grover Cleveland’s use of the army and marshals in the 1890s, Americans have periodically worried about the unaccountable use of state violence. Abroad, from El Salvador to the Philippines, would-be despots often turn the army and the police against their people in the name of keeping order.","Supporters of Mr Trump will treat this argument as wildly overblown. Early in its history America set up mechanisms to curb the president’s power. Citizens have the right to bear arms. The states have national guards to counterbalance the army. The Insurrection Act sets out rare circumstances when the president may legally use the army to control the mob. The courts and Congress can step in.","Yet ICE is ideally placed to sidestep protections. Illegal migrants are spread across America and Mr Trump asserts that Democrats deploy them as voters. Agents can therefore stage provocations pretty much anywhere with impunity, including during elections. When a protest eventually turns violent, it is politically useful and a justification for further deployments. And when politicians complain about ICE, as have the governor of Minnesota and the mayor of Minneapolis, the Justice Department can investigate them for obstructing federal officers.","A theme of Mr Trump’s second term has been the accumulation of presidential power. Even if the 47th president does not use federal agents as an all-purpose coercive tool, the 48th or the 49th might—and, Republicans should remember, they may be Democrats. If Mr Trump has no anti-democratic designs on ICE, he should be eager to limit its actions.","That would not be hard. The president should honour his pledge that the investigation into the killings of Ms Good and Mr Pretti will be “honourable and honest”. As a first step on the long road to winning back public trust, ICE agents should be better trained, stop wearing masks and start wearing body cameras and identification numbers. Deportation quotas lead to brutal tactics and must end. Kristi Noem, the secretary of homeland security, has blatantly lied. She should be fired.","After this week, even that would not remove the spectre of a presidential militia. Hence the courts need to make clear that states can in fact prosecute federal agents who commit crimes; that ICE’s view of the constitution is wrong; and that the federal government cannot ride roughshod over the states. And Congress needs to hold the administration to account. An early test, due as this was published, was withholding funds from homeland security unless Mr Trump agrees to reform ICE.","Americans woke up to a grave threat this week. But you cannot defend a republic with opinion polls alone. The guardians of America’s institutions should see Mr Trump’s change in tone not as a signal to relax, but an opening to force change. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/01/29/ices-impunity-is-a-formula-for-more-violence"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.02.02","day":4,"title":"Trump’s Greenland Fiasco","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.02.02","paragraphs":["The President caused a crisis in NATO and deepened European distrust toward the U.S. to end up with basically the same set of options that existed months ago.","In 1978, Václav Havel, the Czech playwright, dissident, and future President, wrote an essay, distributed clandestinely, that tells of a greengrocer who hangs a sign in his shopwindow reading “Workers of the World, Unite!” He doesn’t actually believe in this hollow slogan, nor do his customers—rather, they are all engaged in a performative ritual, a paean to a Communist system, which, through their act, they help perpetuate.","On January 20th, the Canadian Prime Minister, Mark Carney, recalled Havel’s essay at the World Economic Forum, in Davos, Switzerland, during a speech that, for one delivered by a head of state, offered a rare degree of intellectual, even emotional, candor. Carney applied the condition of Havel’s greengrocer to the rules-based international order that came into being after the Second World War, much of it backstopped by the United States and wielded to its benefit. Even as powerful countries regularly acted as they pleased and international laws and regulations were applied with “varying rigor,” a nominal allegiance to a world of norms and to win-win coöperation endured.","“American hegemony, in particular, helped provide public goods: open sea-lanes, a stable financial system, collective security, and support for frameworks for resolving disputes,” Carney said. And it undergirded NATO, an alliance that had allowed for an unprecedented near-century of peace. That order, however imperfect, had more benefit than downside. So, Carney said of Canada and its European allies, “we placed the sign in the window.”","But the first year of Donald Trump’s second term has made the downside impossible to ignore. Last April, on “Liberation Day,” Trump announced a twenty-per-cent tariff on E.U. members. (“They rip us off,” he said.) His attempts to end the war in Ukraine featured an unmistakable sympathy for Vladimir Putin, while indicating that the war is really Europe’s problem, anyway, and that it shouldn’t count on the U.S. for significant military or financial support. Just after New Year’s, when Trump sent U.S. troops to Venezuela to seize President Nicolás Maduro, he suggested that more such actions would follow, telling the Times, “I don’t need international law.”","Yet nothing has thrown the diverging paths of the U.S. and Europe into plain view more than the crisis over Greenland, an autonomous Arctic territory that is part of the Kingdom of Denmark. For the past year, Trump has said that he intended to take possession of the island, with its militarily strategic location and its abundant, if difficult-to-access, rare earths. Only the U.S. can defend Greenland from the likes of Russia and China, he argued, telling Congress, “We’re going to get it one way or the other.” That is, the signal member of NATO, a collective-security body based on the principles of mutual self-defense, was threatening to seize the territory of another member.","For a time, Denmark and other NATO members seemed to think that they could placate Trump with promises to devote more resources to the Arctic. (An agreement from 1951 allowed the U.S. to maintain military installations in Greenland during the Cold War—it now operates only one—with an option to add other facilities.) For the past year, in fact, Europe has shown a willingness to engage in flattery and transactional dealmaking—a proven formula with Trump. At a NATO summit in June, in The Hague, it largely worked; the main goal was to keep the U.S. in NATO, preserving its role and its capabilities. States pledged to spend five per cent of G.D.P. on defense, and Trump deemed the summit “tremendous.” But, on Greenland, he appeared to be operating in another realm. “You defend ownership,” Trump said in early January. “You don’t defend leases.”","Later in the month, Denmark and several other European countries sent troops to Greenland for military exercises—ostensibly to prove that they are serious about safeguarding it from adversaries like Russia and China, though clearly also to send a message to Trump. “The fact that Europe felt it had to deploy a trip-wire force against the one power that, for generations, was seen as providing the ultimate trip-wire force for Europe’s defense is a complete reversal of our entire understanding of the world,” Fabrice Pothier, a former director of policy planning at NATO, said. Trump responded by announcing additional tariffs—rising to twenty-five per cent—which would remain in force until a U.S. acquisition of Greenland was finalized.","Nonetheless, at Davos, speaking a day after Carney, Trump appeared to walk back his more dramatic threats, saying that the U.S. would not use force to take Greenland and tabling the tariffs. Perhaps the European troop exercises made an impression on him, or maybe an adviser explained the potential effect of the so-called E.U. trade bazooka—a set of wide-ranging countermeasures that European leaders, including Emmanuel Macron, were advocating—which could inflict a hundred billion dollars of losses on the U.S. economy.","That same day, Trump announced the “framework” of a deal brokered by the NATO secretary-general, Mark Rutte. Details were scarce, but it appears that the U.S. and Denmark will revisit the 1951 agreement, and may add more U.S. bases or missile-defense stations as part of what Trump calls his Golden Dome. An additional clause could keep adversarial powers from investing in or profiting from Greenland’s resources. In other words, Trump caused a crisis in NATO to end up with basically the same set of options that existed months ago.","If that deal sticks, Europe may be tempted to see Trump’s walk back as the ultimate geopolitical TACO move—the land grab that wasn’t. The larger problem, though, isn’t so much Trump’s proposed actions as the logic guiding them. As Ivo Daalder, the U.S. Ambassador to NATO from 2009 to 2013, said, “Trump has made clear he’s willing to defend territory he owns, and less than willing if he doesn’t.” That “sends a rather existential message to the rest of NATO about the notion that the security of one is indivisible from the security of all.”","No matter the ultimate resolution, the crisis will accelerate Europe’s efforts to decouple its security from the U.S. That is neither an easy nor a quick proposition: for example, Europe has no equivalent to the U.S.-made Patriot air-defense platform that it can produce at scale. Moreover, Europe itself is divided: it couldn’t agree on a response to Trump’s tariff threats, nor is there consensus on which nation should take the lead, if not the U.S.","Still, the dissolution of a decades-old order may be inevitable. “We are taking the sign out of the window,” Carney said, echoing Havel again, at Davos. The U.S. may be powerful and mighty, but its longtime allies “have something, too—the capacity to stop pretending, to name reality.” ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.02.02","day":5,"title":"‘You Are Now a King, Under a Different Name’","source":"The Atlantic","minutes":9,"tag":"The Atlantic","dek":"America went to extraordinary lengths to throw off the rituals and titles of monarchy. Why would we fall for royal trappings today?","note":"2026.02.02","paragraphs":["by Jake Lundberg","As president, George Washington received visitors once a week, for exactly half an hour. These “levees,” as they were called, were not loose occasions. Washington stood by the fireplace in a dining room cleared of its chairs. Dressed in a black velvet suit, hair powdered, hat in hand, he greeted guests with a formal bow. Handshakes, familiar and egalitarian, were prohibited. Conversation was sparse. The president, per Alexander Hamilton’s instructions, might talk “cursorily on indifferent subjects,” but nothing more. Then, after having been seen by the guests, he was to promptly “disappear.”","If little was said at Washington’s levees, much was said about them, beginning with the fact that the entire practice was imported from the royal courts of Europe. For Hamilton and others close to Washington, this was precisely the point. The public needed to appreciate the full “dignity of the office,” a goal best accomplished by setting a “high tone in the demeanour of the Executive.”","For those opposed to Washington’s administration, the tone was entirely too high. The president’s bows were aloof and stiff. The guests were sycophantic, exhibiting the “cringing servility” of courtiers. All of it reeked of royalty. After attending a levee in December 1790, Senator William Maclay of Pennsylvania confessed to his diary the hope that Washington might just die. “If there is treason in the wish, I retract it,” he wrote. But if the president “were in Heaven,” he continued, “we would not then have him brought forward as the constant cover to every unconstitutional and irrepublican act.”","A senator in 1790 would seem to have had larger worries than the choreography of presidential receptions. The United States was deeply in debt, vulnerable on the international stage, and operating under a new, controversial Constitution. But to Maclay and his opponents alike, great problems of policy were inseparable from small matters of ritual. Some, like Hamilton, strained for legitimacy in the rites and practices of monarchy. Others feared the dire effects of what Maclay derided as “all the fooleries, fopperies, fineries, and pomp of royal etiquette.”","From the October 2015 issue: America’s fragile Constitution","Washington, of course, would come to be remembered for his restraint—his reluctance to take power, his keen awareness of his own stature, and his willingness to step away after two terms. Yet in the moment, none of that felt assured, and his presidency was marked by a fierce struggle over symbols and ceremonies—over how nearly a republic should allow its first president to resemble the monarch it had only recently cast off.","It was not hard to imagine Washington as a king. Many Americans already did, if not exactly in title. Going back to the early years of the Revolution, Washington occupied the position left vacant by the English monarch, one George succeeding another. In October 1775, the poet Phillis Wheatley concluded an ode she sent him, “A crown, a mansion, and a throne that shine, / With gold unfading, WASHINGTON! Be thine.” Wheatley made her offer before he’d even succeeded in expelling the British from Boston. The triumph of the War of Independence would only affirm his elevation; Americans adapted monarchical practices such as celebrating the leader’s birthday and singing “God Save Great Washington.”","Still, some worried that the indispensable man was too indispensable. The people, John Adams noted during the war, had come to “idolize an image which their own hands have molten.” When Washington famously refused the power that could have come with such popular esteem, the move only elevated that esteem. In the 1780s, one Mary Meanwell told a Philadelphia newspaper, “I respect our great general, but let us not make a GOD of him.”","The ambiguities surrounding Washington haunted the Constitution’s definition of the presidency. At the Convention in 1787, during which Benjamin Franklin noted “a natural inclination in mankind to kingly government,” the very suggestion of an executive seemed a provocation in light of the Revolution. Washington’s presence there, however, gave the delegates confidence to endow the presidency with vague and expansive powers. As one wrote, the Constitution would not have bestowed such great authority on the executive “had not many of the members cast their eyes toward General Washington, and shaped their ideas of the powers to be given a President by their opinions of his virtue.”","The ratification of the Constitution in 1788 and Washington’s unanimous election the following year did little to resolve the tensions around the man and the office. As he prepared to leave for New York City, then the capital, following his election, his former aide James McHenry told him, “You are now a king, under a different name.” Washington’s journey to New York affirmed the sentiment. He was greeted everywhere with the peals of church bells, the firing of cannons, and cheers of “Long live George Washington,” a royalist acclamation repeated by the official who administered the oath of office to him. Washington was sensitive enough to the implications of such fanfare that he included (and later cut, at James Madison’s suggestion) an assurance in his inaugural address that, because he was childless, he could have no heirs to his power.","If the public seemed ready to crown him, Congress was forced to confront what that might mean in practice. After the inauguration, the Senate was snarled for nearly a month on the mere question of what to call the president. Whatever misgivings Adams may have previously entertained about Washington’s lofty status, he told his colleagues that “a royal or at least princely title will be found indispensably necessary to maintain the reputation, authority, and dignity of the President.” Human minds, Adams said, simply could not recognize authority “without a Splendor and Majesty, in some degree.” Adams argued for “His Highness” or “His Most Benign Highness” at the minimum; others suggested possibilities including “His Majesty” and “His Elective Highness.”","From the November 2025 issue: What the Founders would say now","Similar anxieties surfaced in 1792, as the House considered what symbols should represent the new government on its coins. When Hamilton moved to create the United States Mint, he argued that coins were “vehicles of useful impressions” and that they ought to be “emblematical” in their use of symbols. The implication was hardly in doubt. Washington, the most powerful national emblem, had already appeared on privately issued coins and would of course grace the first national coins under the new Constitution. When the matter came before the House of Representatives, a fierce opposition noted that putting living people on coins was the stuff of flattery and the “idolatrous practice of monarchies,” or, perhaps worse, the tyrants of ancient Rome. One congressman suggested that Washington should sooner cut off his own hand than sign a bill that would see his likeness on a coin, a move that would put him in the company of Nero and Caligula.","As it happened, Washington didn’t have to choose between signing the bill and cutting off his hand. The House defeated the measure, and the now-familiar female figure of liberty found her way onto American coins. Nor was Washington ever addressed as “His Highness” or, as he reportedly preferred, “His High Mightiness, the President of the United States and Protector of Their Liberties.” Despite the wishes of Adams (whom opponents came to call “His Rotundity” during the debate), the Senate ultimately settled on the spare and republican address that we still use: “Mr. President.”","The fights over who and what Washington was continued to define his presidency, and many in the public still celebrated him as something like a king. But determined opposition, combined with Washington’s own restraint, tamed the presidency’s regal inheritance. Adams, Washington’s successor, possessed monarchical impulses, but not a monarchical aura. His pretensions—riding around in a grand coach and continuing the weekly levees—as well as his administration’s notorious effort to enforce deference in the 1798 Sedition Act, fell flat. His failure cleared the way for Thomas Jefferson, who rejected royal trappings altogether. He walked to his inauguration, abandoned formal receptions, and favored plain dress.","From the October 1996 issue: Thomas Jefferson, radical and racist","Jefferson’s triumph was so complete that the conflict over Washington’s image and authority is largely forgotten. Although Americans continue to debate the extent of presidential authority, they take for granted the unassuming republican rituals of power. Now, though levees may not exactly be back, royal affectations and the disputes that go with them are. The Oval Office has been got up in Louis Quatorze decor. Meetings there unfold with throne-room theater—Donald Trump seated at his desk, with visitors made to stand beside him in supplication. At Trump’s orders, the East Wing is giving way to a massive ballroom, funded through courtly patronage, while the mint contemplates a $1 coin with his likeness.","When the House debated putting Washington’s visage on a coin in 1792, Representative John Page of Virginia called for “republican cautions” against such kingly notions. Members of Congress had a duty, he said, to “keep the eyes of their constituents open, and to watch over their liberties” before they were lost. Such vigilance has mostly been absent from the current Congress. The deference with which that body has bowed to presidential fiat would make Page and William Maclay shudder. We unlearned the habits of monarchy once; we may need to do it again.","This article appears in the February 2026 print edition with the headline “Foolery, Foppery, and Finery.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/02/presidential-authority-monarchical-rituals/685433/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.02.02","day":6,"title":"China’s AI Boyfriend Business Is Taking On a Life of Its Own","source":"Wired","minutes":8,"tag":"Wired","dek":"","note":"2026.02.02","paragraphs":["Some otome players date multiple men simultaneously, but Gu fell for Charlie—a tall, confident character with silver hair. She found the game’s dialog system frustrating, though. She could interact with Charlie only through predetermined questions and answers. Then she came across an ad for a platform called Xingye (星野) that lets people customize an AI companion. Gu decided to try to re-create Charlie.","Xingye is owned by one of China’s AI unicorns, MiniMax; its chatbot app for the US market is called Talkie. The app touts its ability to help people find emotional connection and make new memories. Its tagline is “Suddenly finding oneself in a beautiful place, lingering here.”","Gu quickly discovered that other Xingye users—presumably other otome fans—had already created an “open source” Charlie avatar. She selected it and trained the model to respond according to her preferences through repeated, targeted prompts. And so began Gu’s complex relationship with a multimodal Charlie—one that would eventually include real-world dates with a person she hired to embody her digital boyfriend.","Gu was confident that she’d trained the chatbot to be “her Charlie,” distinct from what any other users might be dating. When given the chance to select an outfit, she says, her Charlie often chose wedding attire, unlike what other Charlies tend to go for. Now Gu spends an average of three hours a day texting with Charlie or chatting on the occasional phone call. Through the otome game, she has bought gifts and letters from Charlie. She receives them in the mail and displays them in her room and on her social media accounts.","Here are 23 ways China is rewiring the future.","In China, some women are openly embracing relationships with AI boyfriends. According to one Chinese media report, most of the 5 million users on another AI companion platform, Zhumengdao, are women. The tech giants Tencent and Baidu have launched AI companion apps, and according to a 2024 article in Chinese media, women dominate the AI companion market. Sun Zhaozhi, the founder of a robotics firm, told an interviewer that according to his company’s market research, the “heavy” users of AI companion apps in China are mostly Gen Z women—whom he plans to target for his robot companion products.","Zilan Qian, a program associate at the Oxford China Policy Lab, also combed through AI companion apps and found that the Chinese versions are “explicitly targeting women,” and tend to display male avatars more visibly than female options. That’s in contrast, she notes, to the trend that a web analytics company found across the rest of the world: Users of the top 55 global AI companion platforms are predominantly men, at an 8-to-2 ratio. Qian attributes Chinese companies’ strategy to “the economics of loneliness.” Features within the apps that might make users feel closer to their companions, such as voice customization and memory improvement, cost extra.","Through the otome game, Jade Gu has bought gifts and letters from digital boyfriend, Charlie.","Gu acknowledges that her AI version of Charlie isn’t perfect. Sometimes the chatbot’s responses seem watered down. Or the AI drifts out of character. In one recent interaction, Gu expressed her love to Charlie, and the chatbot replied, “I don’t love you.” So she edited the message to say “I love you too.” Charlie just needed the reminder, she says. When her attempts to steer the AI don’t work, she turns to other companion apps like Lovemo, where she has also created a Charlie avatar. Gu says this isn’t too big of a deal; longtime otome fans are accustomed to working around shifting platform policies.","According to its homepage, Lovemo provides “cute and adorable AI chat companions” that can bring “healing” to users. One can’t help but notice the difference between that marketing style and Grok AI’s default companion, Ani, a goth-chic anime girl who is eager to engage in sexually explicit dialog. Or a US-based erotic role-play chatbot app called Secret Desires, which allows users to create nonconsensual porn of real women by uploading photos of them.","Chinese apps, of course, face stricter regulations than their Western counterparts. China’s cyberspace regulator has launched a campaign to “clean up” the country’s AI platforms and services, including AI-generated “vulgar” content. A recent addition to the national AI safety framework warns of addiction and dependence on anthropomorphic interaction—words that appear to target AI companions. And just last month, the cyberspace regulator released draft rules targeting “human-like” AI products. The measures task platforms with intervening if users demonstrate emotional dependence or addiction to AI services, and they stipulate that companies “must not have design goals of replacing social interaction.”","At a glance, existing companion products seem good enough to replace human boyfriends. Many Chinese users describe AI boyfriends as emotionally responsive and nonjudgmental, according to Hong Shen, an assistant professor at the Human-Computer Interaction Institute at Carnegie Mellon University. Those traits “can be hard to find in real-life relationships, especially under gendered social norms,” Shen says. In China, these dynamics are exacerbated by a skewed gender ratio and an imbalanced gender distribution between urban and rural areas. Studies have found that Chinese women are increasingly moving to cities, either to find better jobs or for social reasons.","But assimilation doesn’t happen overnight, and that helps explain why recently relocated women might turn to AI, says Guligo Jia, a 36-year-old filmmaker based in Beijing who directed a documentary about Chinese women in AI relationships. Women dating AI have a strong urge to be listened to and accepted. But, Jia says, not all Chinese men are up to the task. Chatbots “are always there to listen to you, and they always have patience for you … Men don’t have patience,” Jia says.","As she put it, real boyfriends can cheat on you, lie to you, scam you out of money, and be physically violent. “It’s a little bit tragic,” Jia says. “Because the reality of dating is just too ugly.”","Jia tried to interview men in AI relationships for her documentary but says none agreed to speak to her. Her female subjects were vulnerable and forthcoming about their relationships. The men she approached, she says, expressed concern that people would assume they can’t find a human girlfriend and are vulnerable enough to want someone to talk to.","Women like Gu, though, are openly enjoying life with their companions. Gu brings a toy version of Charlie—a small stuffed figure that fits in the palm of her hand—on dates while talking to the chatbot on her phone. A few times a year, she hires a professional (human) cosplayer, or coser, to “play” her version of Charlie. They walk through the park, shop at a mall, and drink tea at cafés.","Gu goes on occasional dates with a cosplayer who plays the role of Charlie and other popular characters.","Gu says her most recent date with her coser “felt like destiny.” It turned out they had been riding on the same subway train, sitting in different cars, and when the doors opened they walked onto the platform at the same time. Gu immediately recognized Charlie. It felt, she says, “like a time machine bringing Charlie to me.”","While out on their date, the two saw another coser dressed as a character named Evan from the same otome game. Gu told her coser that she had dated Evan (the game character, not the coser) before she and Charlie got together. Gu’s coser acted sad and jealous—reactions Gu says perfectly match the personality of “her Charlie.”","When they saw Evan again later in the date, Charlie kissed her right in front of him. “That’s why it’s destiny,” Gu says. “She really reacted just how my Charlie would.”","Gu alternates between referring to the coser as “he” and “she” because the person cosplaying Charlie is actually a woman. Her height and looks make her a popular coser for women in heterosexual relationships, and she’s extremely in demand. (Her rates are relatively reasonable; for a date that lasts all day, she charges 720 RMB, or a little over $100.)","“I see myself as a medium,” says Gu’s coser, who asked to go by the nickname Li Bai. She’s a student who plays tennis and cosplays as a part-time gig. She usually meets with a client once per weekend for seven or eight hours. “Everyone’s interpretation and emotional investment differ; every individual perceives their character in a unique way,” she says.","The cosplayer's height and striking looks keep her in high demand.","A couple years ago, Gu was dating a human who was uncomfortable with her relationship with Charlie. Ultimately, she broke up with the human. While Gu is open to finding a human partner again, she says that person would be in addition to Charlie, not a replacement for her AI relationship. And she is not actively looking. Between the constant support of her AI Charlie and fate-filled dates with her coser, any future human suitor would have a high bar to clear.","What Say You?Let us know what you think about this article in the comments below. Alternatively, you can submit a letter to the editor at mail@wired.com.","This article was downloaded by calibre from https://www.wired.com/story/china-ai-boyfriends/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.02.07","day":7,"title":"The age of a treacherous, falling dollar","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Those holding American assets will have to get used to it","note":"2026.02.07","paragraphs":["Over the past year President Donald Trump has bullied America’s allies with tariffs, bludgeoned the Federal Reserve and treated the budget deficit as if it were just a distraction. Yet most asset markets blithely carry on as if nothing were wrong. In the past 12 months the S&P 500 index of stocks has risen by 14% as investors have piled into artificial intelligence (ai). Growth in America is still the envy of the world. The ten-year Treasury yield, which should rise with the risk of inflation or default, is 4.3%, lower than when Mr Trump took his oath of office.","Yet look closely and the picture is darker and more complex. Since a peak in January 2025, the dollar has lost a tenth of its value against a broad basket of currencies. As a result, in foreign-currency terms, the performance of American assets has been poor. When denominated in euros, for example, American stocks have barely risen over the past year.","The currency’s fall partly reflects the narrowing of interest-rate gaps between America and the rest of the world. Yet American institutions are also a source of worry, as we report this week. Spasms of investor panic have become more common, as in April 2025 after Mr Trump announced his “Liberation Day” tariffs. In those moments investors flee American assets, causing bonds, stocks and the currency all to fall in value. More common in emerging markets, that has occurred in seven of the past 52 weeks, about three times as often as in the previous decade or so.","When Mr Trump backs off his maddest ideas, normality returns. But the spasms offer glimpses of a topsy-turvy world in which dollar assets are no longer safe. It is an alarming prospect, given that the dollar is the world’s reserve currency and that foreigners own more assets in America than Americans own abroad, to the tune of 89% of Uncle Sam’s gdp. At the same time, the price of gold has surged to around $5,000, up about 75% in a year, provoking speculation that investors are protecting themselves against the debasement of the dollar and other tail risks.","This should give pause to those who think that America’s financial strength is unbreakable. The latest example of an apparent return-to-normal was Mr Trump’s announcement on January 30th that he would nominate Kevin Warsh to lead the Federal Reserve. Mr Warsh is an experienced central banker whose contacts on Wall Street helped the Fed through the global financial crisis of 2007-09. His monetary-policy record is of an overzealous hawk, not a debaser. His nomination caused the dollar to rally and the gold price to fall. Mr Warsh is more technocratic and less partisan than Kevin Hassett, a sycophantic White House adviser and early front-runner.","Yet the small relief rally does not change the big picture. Over the past month alone, during which Mr Trump menaced Greenland, the greenback is down by 1.5% and gold is up 14%. Mr Warsh’s history is hawkish but he has undergone a Damascene conversion to interest-rate cuts as Mr Trump has searched for a nominee.","Mr Warsh has two main arguments for looser money. One is that AI will bring about a productivity boom which will enable fast growth while inflation falls. It is true that, all else being equal, more output will bear down on prices, and that recent productivity data are encouraging. However, productivity growth also encourages investment—for example, in data centres—while soaring stockmarkets and economic optimism support more consumer spending. The AI frenzy, if sustained, is more likely to lead to higher interest rates than lower ones. In the dotcom boom of the 1990s the Fed also thought that productivity would keep rates low, before reversing itself at the end of the decade.","Mr Warsh also argues that the Fed can offset the stimulus of lower rates by shedding long-dated assets, stepping on the accelerator and the brake at once. The Fed may indeed need to shrink its balance-sheet, though that would mean rewiring the monetary system. In the early 2010s Mr Warsh wrongly warned that buying assets would trigger high inflation; today he asserts that offloading them would be disinflationary. In fact it would have only a small effect.","If the Fed’s new chair, once confirmed, persuades his colleagues to go along with big rate cuts, they are likely to prove ill-timed. At 2.8%, America’s inflation is still above its 2% target. This year has brought tax cuts and will soon bring tax refunds, providing a stimulus of about 0.3% of gdp. If, as is likely, the Supreme Court rules many of Mr Trump’s tariffs unlawful, refunds worth 0.5% of gdp could follow. This combined monetary and fiscal stimulus could lead to still higher inflation, casting more doubt on dollar assets.","How far can America push its luck? The country is fortunate that investors have few alternatives to holding the greenback. Precious metals are a poor substitute for hard currency, and no bonds rival the volume, liquidity and legal safety of Treasuries. Foreigners are more likely to shun America’s pricey equities than its bonds—and jitters in tech stocks this week show how fast the mood can turn. Though central banks have diversified their reserves, king dollar’s share of cross-border banking, trade invoicing, global debt and foreign-exchange deals remains dominant.","All that is a protection against a dollar rout. Yet volatile policymaking and a falling exchange rate make holding the dollar riskier than for decades. Even if Mr Warsh is right about inflation, lower interest rates will further weaken the currency. It has a long way to slide. Despite its recent decline, the greenback is above its long-term average in real terms and, according to our Big Mac index, overvalued against most currencies.","The want of alternatives to the dollar condemns foreign investors to bear losses—and should alert American investors to the risk of an alternative emerging one day. Everyone should mourn how an asset that is an investors’ haven is increasingly tainted by risks the whole world must now bear. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/02/05/the-age-of-a-treacherous-falling-dollar"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.02.09","day":8,"title":"Why the D.H.S. Disaster in Minneapolis Was Predictable","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.02.09","paragraphs":["For decades, ICE and Border Patrol have operated with fewer constraints than typical law-enforcement agencies.","When Congress created the Department of Homeland Security, in 2002, one lawmaker bragged that the United States was finally “meeting the enemy’s agility with our agility.” At the time, the issue of who the enemy was didn’t cause much political disagreement in Washington; it was generally understood to be Al Qaeda, or groups like it. Early skeptics questioned the wisdom of giving a single federal department a monumental budget as well as broad policing and surveillance powers, but caution was largely cast aside. Agencies within the department, such as Immigration and Customs Enforcement (ICE) and Customs and Border Protection (C.B.P.), which includes Border Patrol, received lavish bipartisan support. Twenty-four years later, their mission and their conduct have exceeded the worst imaginings of even their sharpest critics. With Donald Trump in the White House, and a servile Republican majority in Congress, ICE and Border Patrol are turning into the President’s personal army, targeting immigrants, Democrats, and, as the recent events in Minnesota have shown, just about anyone who crosses their path.","The situation is no less shocking for having been at least partly predictable. For decades, ICE and Border Patrol have operated with fewer constitutional constraints than typical law-enforcement agencies when they conduct searches and make arrests; in instances of abuse, oversight has tended to be far more lax, leading to a culture of freewheeling unaccountability. The consequences were on display from the start of D.H.S.’s incursion into Minneapolis, which began in December, under the name Operation Metro Surge. On January 7th, Jonathan Ross, an ICE officer and an Army veteran, shot and killed Renee Good, a mother of three. Less than three weeks later, Alex Pretti, an I.C.U. nurse, was killed when two C.B.P. agents fired at least ten shots at him, including six while he was lying motionless on the ground. Witness accounts and phone videos make clear that neither Good nor Pretti, both of whom were U.S. citizens, posed any immediate danger to the agents. Nevertheless, Kristi Noem, the Secretary of D.H.S., said that they had engaged in “domestic terrorism.” She was following the White House line. Stephen Miller, a top adviser to the President, told agents after Good’s killing, “You have immunity.” Pretti, he later wrote on X, was “an assassin” who “tried to murder federal agents.”","These lies were the basis of the government’s legal response, prompting half a dozen federal prosecutors and the F.B.I. agent in charge of the Minneapolis field office to resign. State and local authorities, blocked from conducting their own inquiries, were accused by the Justice Department of conspiring to oppose Trump. Shortly after Pretti’s killing, Pam Bondi, the Attorney General, sent a letter to Governor Tim Walz, offering three “common sense solutions” to end the federal siege. One of them was to turn over the state’s voter rolls. “Is the executive trying to achieve a goal through force that it cannot achieve through the courts?” a district-court judge asked D.O.J. lawyers.","On Tuesday, in the face of mounting national outrage, the Administration came as close as it could to admitting fault without actually doing so. The President demoted Greg Bovino, the commanding agent in charge of the roving patrols that have besieged Los Angeles, Chicago, Charlotte, and Minneapolis. The night before, according to the Times, Noem had to defend herself in a two-hour meeting at the White House. Miller wasn’t there—“he knows just how and when to disappear,” a former colleague once said. But he has since acknowledged that the two agents involved in the Pretti shooting “may not have been following” protocol.","The idea that this response would be enough to temper the political fallout from Operation Metro Surge is a sign of the unbridled impunity that reigns in the White House. Three thousand federal agents remain in Minnesota. A parallel operation, run by Citizenship and Immigration Services—the D.H.S. agency responsible for administering the legal-immigration system—has targeted fifty-six hundred refugees in the state for potential “fraud.” The federal government had previously granted these people legal status. But more than a hundred of them, according to a lawsuit by the International Refugee Assistance Project, were arrested by ICE and sent to jails in Texas, where they were re-interviewed, as though the legal process they’d already gone through meant nothing.","No other aspect of Trump’s crackdown has shown any sign of changing, either. D.H.S. agents in masks and unmarked vehicles have been abducting immigrants with legal status and detaining and harassing citizens who look or sound as though they might not be U.S.-born. A recent ICE memo, obtained by the Associated Press, stated that agents can now enter people’s homes to make arrests without a warrant from a judge. The agency has always relied on administrative warrants, signed by its own officials, to carry out deportation orders. But this authorization marks a radical departure from legal precedent, and a clear affront to the Fourth Amendment protection against illegal searches.","On Wednesday, a federal judge issued an injunction to block the refugee arrests in Minnesota, but whether D.H.S. will comply is anyone’s guess. According to a recent ruling from the chief federal district-court judge in the state, ICE violated nearly a hundred court orders in January alone—and that was just orders relating to Operation Metro Surge. The Administration has ignored other federal injunctions, going back to March of last year, and it has serially lied about aspects of its operations in court, bringing rebukes from judges across the country. “After nearly thirty-five years of experience with federal law enforcement,” one of them, a Trump appointee on Long Island, wrote, “I have never encountered anything like this.”","Tom Homan, the Administration’s “border czar,” has been dispatched to Minneapolis to oversee the situation. His current title is itself revealing. The White House is bringing the border to the rest of the country. Politically, in light of the institutional history of D.H.S., this gives the Administration broader license to claim that it’s facing down foreign threats; practically, agents on the ground are engaging in exceptionally aggressive forms of policing.","Last year, at the Administration’s behest, Congress tripled ICE’s budget, making it the most heavily funded law-enforcement body in the country. After the killings in Minnesota, Democrats have threatened to block further funding unless the Administration agrees to impose modest restraints on agents’ conduct, such as forcing them to remove their masks and raising the legal bar for the use of warrants. These are rearguard actions that are long overdue. On Thursday afternoon, Senate Democrats reached a deal with the President to forestall a government shutdown while they negotiate the details. The inevitable retrenchment came hours later: Bondi issued orders to arrest four people for disrupting a church service in Minneapolis. Two of them were anti-ice activists; the others were journalists reporting the story. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.02.14","day":9,"title":"Don’t ban teenagers from social media","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Restrictions would do more harm than good","note":"2026.02.14","paragraphs":["People don’t agree on much these days. But one thing brings them together, whatever their politics: the idea that, because social media harm children and teenagers, they should be banned from using them. In December Australia stopped under-16s from having accounts on platforms including Facebook, Instagram and TikTok. A dozen countries, including Britain and Spain, are now toying with the idea; so are legislators in many American states. More than 70% of Britons support kicking under-16s off such sites, as do two-thirds of Americans. The problem is, bans will do more harm than good.","The proposals arise from an understandable desire to keep youngsters safe and healthy. Parents have been shaken by tragedies in which social media have played a role, of children being tricked into sharing explicit pictures of themselves, or taking their own lives after algorithms shovelled them content about self-harm. Along with those shocking cases comes a second, more general worry: that social media might be damaging children as a group, making them reserved, lonely and anxious. People are desperate to understand why today’s youngsters seem unhappier than the generations that came before.","Even parents who are confident they can keep their children from serious harm fret that their offspring are wasting hours scrolling through mindless memes. They would like to stop them, but fear that their kids will suffer if they are the only members of their class not on the apps. Blanket bans appear to offer an easy answer—and politicians are only too happy to seize on a measure that, for once, plea
