 reality in which investors, businesses and policymakers must now operate. For investors, the contrast between an increasingly volatile world and buoyant equity markets just became more stark. Chaos in the Middle East joins a long list of threats to markets, including gloomy scenarios related to artificial intelligence, trouble in private credit and a loss of faith in indebted governments. Government-bond yields have risen since the crisis began, especially in southern Europe and Britain, which depends on imported LNG.","Businesses face a new risk premium, as energy prices reflect the ever-present danger of conflagration. As after the pandemic and start of the Ukraine war, they must again pore over their supply-chain risks, including their exposure to the Gulf economies, whose reputations for stability have been shaken and which can expect less investment and fewer tourists.","For policymakers, painful decisions loom. Energy storage is part of the solution. It was foolish of Mr Trump not to replenish America’s oil reserves at the low prices that prevailed before the war. Adding to emergency stocks will now cost more. High prices should induce more supply outside the Middle East. Until it does, countries like America may find it hard to resist the lure of energy protectionism. When oil producers and refiners, including China and India, start to restrict exports in an attempt to protect their consumers from high prices, the damage to other countries can be severe.","Central banks will have to cope with a renewed inflationary threat that heightens the risk of both recession and wage-price spirals. And politicians will face voters clamouring for energy subsidies, like the support doled out in the rich world after Russia invaded Ukraine, which exceeded 2.5% of GDP in many European countries, adding to their debts. That would shift the pain to poorer countries, especially in Asia; in 2022 Bangladesh endured blackouts. It is difficult to predict how this crisis ends. But even if countries get policy right, it is already clear that the war has made the world economy less prosperous, more volatile and harder to govern. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/03/12/an-attack-on-the-world-economy"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.03.16","day":20,"title":"Where Is the Iran War Headed?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.03.16","paragraphs":["President Trump has both called for Iranians to rise up and oust the ruthless theocracy and said that he’s fully prepared to deal with a new religious leader.","Since 1979, Iran’s revolutionary regime has been the nemesis of eight American Presidents. None could tame its political furies; its covert operations, which killed more than a thousand Americans in Lebanon, Iraq, and Afghanistan; or its expansion, through the creation of like-minded extremist movements, across the Middle East. The Islamic Republic considered its mini-realm a defensive buffer against U.S. and Israeli intervention. The U.S. and Israel viewed Iran as the most persistent threat in the world’s most volatile region. President Donald Trump and Prime Minister Benjamin Netanyahu have now set out to destroy the regime, militarily and politically, in a reckless war of choice with no visible or thoughtful endgame—and, in Trump’s case, no advance approval by Congress or warning to American taxpayers.","For Operation Epic Fury, the Trump Administration has so far deployed nearly half the United States’ air power and roughly a third of its naval assets. The cost is nearly nine hundred million dollars a day, the Center for Strategic and International Studies estimated. Much like the initial “shock and awe” campaign during Operation Iraqi Freedom, in 2003, the first week of the war was militarily stunning. The Supreme Leader, Ayatollah Ali Khamenei, and dozens of senior officials were killed. Iran’s arsenal of ballistic missiles was seriously depleted and its strategic installations left in rubble. Its navy was devastated; a U.S. submarine torpedoed an Iranian warship in the Indian Ocean, the first such strike since the Second World War. Pete Hegseth, the Secretary of Defense, boasted, “More and larger waves are coming. We are just getting started.” Iran’s capabilities, he added, are “evaporating.”","Trump, with his usual inconsistency, has called for Iranians to rise up against the ruthless theocracy—last week, he demanded its “unconditional surrender”—but also said that he’s prepared to deal with a new religious leader. Since 2017, millions of Iranians have participated in protests; tens of thousands have been killed. For now, though, an uprising seems unlikely. Iranians will first need to pick up the political and physical pieces of their lives, and although public fury at the government has not diminished, foreign military intervention has ignited a sense of millennia-old nationalism. The prospect of many members of the Iranian security forces—there are more than a million, counting reservists—joining a popular rebellion seems improbable, too.","The war has rattled the international order, troubled as it already was. After two disastrous U.S. wars, in Iraq and Afghanistan, there is an ominous sense of how messy and costly and deadly this one might get, however confident Trump sounds. Iran is larger, in size and in population, than Iraq and Afghanistan combined. It is arguably the most important geostrategic country in the three regions it borders—the Arab world; the formerly Soviet “stans” of Central Asia; and Afghanistan and nuclear-armed Pakistan, in South Asia. It has vast oil and gas reserves, along with the largest military in the Middle East, and it has had powerful sway in parts of the Muslim world, particularly among Shiites.","Trump said that the biggest surprise to him has been the scope of Tehran’s response. Iran was clearly prepared, especially after the Twelve-Day War, last June, when the President ordered B-2 stealth warplanes to drop bunker-busting bombs on nuclear facilities in Fordo, Natanz, and Isfahan. This time, it countered with missile and drone strikes on seven oil-rich neighbors allied with the United States, from Iraq to Saudi Arabia and Oman. It targeted international airports, hotels, businesses, ports, and energy facilities. Despite American defensive superiority, Iran hit the U.S. Embassy in Riyadh; the consulate in Dubai; the largest U.S. military base in the Middle East, at Al Udeid, in Qatar; and the U.S. Fifth Fleet headquarters in Bahrain, which coördinates U.S. naval operations across the Middle East. Netanyahu said that he has been dreaming for forty years about overthrowing the theocracy, but Iranian missiles penetrated Israel’s Iron Dome defenses. Air sirens repeatedly alerted the residents of Tel Aviv and Jerusalem to seek shelter. Dozens of buildings, including a military airbase, were hit. Hezbollah, Iran’s longtime partner, opened a second front with Israel from Lebanon.","The scale of Iran’s retaliation has led U.S. allies, who had balked at joining a U.S.-led offensive, to reluctantly agree to play a role. France, Germany, and Britain pledged to “take steps to defend our interests and those of our allies in the region,” with Britain deploying warplanes in Qatar. Greece, following a drone strike on Cyprus, sent four fighter jets to the island. Italy promised defense systems to Gulf nations. By the end of the first week of war, seventeen countries were involved. After cutting direct military aid to Ukraine last year, Washington even reached out to Kyiv for its expertise in countering Iranian drones, which Russia uses to attack it.","Beyond the physical damage, Epic Fury has spooked the global economy. Stocks plunged, and the price of oil spiked by fifteen per cent, as Iran effectively closed the Strait of Hormuz, through which a fifth of the world’s oil and gas passes. Saudi Arabia temporarily shut its Ras Tanura oil refinery, one of the world’s largest, after a drone strike. Qatar suspended the production and export of liquefied natural gas.","Iran, then, still has some leverage. Hadi Semati, a former professor of political science at the University of Tehran, who is now in Washington, said, “If Iran comes out of this crisis alive, it has essentially won, albeit with degraded military capability.” And the theocracy may survive. Suzanne Maloney, an expert on Iran at the Brookings Institution, cautioned, “We’re going to be left with some kind of bloodied, battered rump version of the Islamic Republic, led by officials who are now even more determined to try to cling to power, and who are going to be more confident of the fact that they’re able to stay, because they have withstood this terrible crisis.”","Last week, as Iran’s Assembly of Experts met to elect a new Supreme Leader, Trump insisted that he should have the right of approval. He told Axios, “I have to be involved in the appointment, like with Delcy [Rodriguez] in Venezuela.” He rejected Khamenei’s hawkish son Mojtaba as “unacceptable.” (Trump, Maloney said, “seems to think that this is an episode of ‘The Apprentice.’ ”) But the Assembly may select a revolutionary hard-liner to signal continuity. Iran’s ninety-two million people, in the meantime, are trapped between bloody war and the bloody regime. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.03.21","day":21,"title":"War in Iran is making Donald Trump weaker—and angrier","source":"The Economist","minutes":6,"tag":"Leaders","dek":"By diminishing the president’s political superpowers, his reckless campaign may make him more dangerous","note":"2026.03.21","paragraphs":["NEVER BET against Donald Trump. No politician can defy political gravity like the man whose supporters stormed the Capitol on January 6th 2021, only for him to be re-elected in 2024 with a bigger share of the vote. And yet it is hard to imagine a crisis more precisely engineered to intercept the trajectory of his presidency than his ill-judged, heedless war against Iran. Even a short war will alter the course of his second term. One that lasts months could bring it crashing to earth.","The reason is that the fight against Iran diminishes Mr Trump’s three political superpowers: his ability to impose his own reality on the world, his remorseless use of leverage and his dominion over the Republican Party. Even without Iran, the potency of these Trumpian strengths was likely to wane after the midterm elections. Wars accelerate change.","Start with Trump v Reality. In politics, the president has shown a remarkable ability to twist facts and, sure enough, he insists that he has already triumphed in Iran. Yet the war tells a truth of its own. Iran’s regime cannot win in any conventional sense. But despite widespread destruction of infrastructure and the assassinations of senior leaders—including the security chief, Ali Larijani—Iran’s regime survives for now and its 400kg or so of near-bomb-ready uranium remains at large.","What is more, Iran is waging its own parallel war against the global energy industry. As it strikes shipping in the Strait of Hormuz and the infrastructure of its neighbours, the markets are keeping score. With Brent crude spiking to more than $110 a barrel on March 18th, following an Iranian missile attack on a Qatari natural-gas hub, the regime will conclude that its strategy is working.","If anything, time is on Iran’s side. America and Israel will gradually run out of useful targets to strike from the air, or run low on interceptor batteries to see off Iranian weapons. By contrast, Iran appears still to have plenty of drones. For as long as it restricts traffic in the strait, oil prices will climb and the damage to the world economy will grow.","Mr Trump’s second superpower is leverage. Now that other countries’ leaders have come to expect rough treatment, they are learning how to resist. When the president called on America’s allies to help open the strait, warning that NATO faced a “very bad” future if they refused, they turned him down. He quickly reversed course, pretending he had never needed help.","Likewise, Iran is opposing Mr Trump by accumulating leverage against him. In recent days it has signalled that it will grant safe passage through the Strait of Hormuz to ships from friendly countries—a sign that it means to use access as a bargaining tool. Even if Mr Trump wants to end the war, Iran could continue to fire at ships. If the waterway remains closed until the end of April, the oil price could reach $150 a barrel.","Given that leverage, Iran may hold out for more than just a return to the status quo before the war. It may ask for sanctions to be lifted, or an American commitment to abandon some bases in the Middle East or to restrain Israel. If recession looms in America and stockmarkets start to fall, would Mr Trump escalate by, say, seizing Kharg island, home to Iran’s export terminals? Or would he buckle?","The answer depends partly on the last of his powers: his hold on his party. Mr Trump was elected on promises to spare voters from war and inflation. So far, 13 American service personnel have died; ground operations inside Iran, to recover that uranium, or on Kharg would put many more in danger. Average prices of petrol and diesel have reached $3.88 and $5.09 a gallon, compared with $3.11 and $3.72 at Mr Trump’s inauguration. Republican support for the war is strong, but softening. A vocal faction of MAGA, notably Tucker Carlson (interviewed on “The Insider”, our video show, this week), talks of betrayal.","In private many elected Republicans are seething. Mr Trump’s failure to heed warnings about the Strait of Hormuz is typical of his contempt for strategy and his hubris in thinking he knows better than people who really do. Republicans are now highly likely to lose control of the House in the midterm elections in November. Their chances of losing the Senate too have risen by ten points, to about 50%. The worse the defeat, the lamer a duck the president will be and the less influence he will have over who inherits the party.","Were the war to drag on, leading to very high oil prices and tumbling stockmarkets, Mr Trump could seek a way out and look for a win somewhere else—in, say, Cuba. Markets would doubtless register relief if the fighting stopped. But Mr Trump is not in full control of this war. Iran’s attack on the gas hub in Qatar shows it still has cards to play. And even if the fighting ended tomorrow it could take four to six weeks to restore oil production, four to eight weeks to settle oil markets and two months to normalise shipping. The risk of renewed Iranian action would remain. Prices may stay high for months. Every day they do weakens the president.","Mr Trump’s politics depends on the strength that comes from winning. If he seems a loser, expect him to exact retribution. A weaker president could become a more dangerous one.","Mr Trump is freest to act abroad. He may abandon NATO. He may cut Ukraine loose to punish Europe. He could bully Latin America in the name of fighting crime and drugs. He may demand money for defending Japan and South Korea. He will be maximalist on tariffs. Even if he does not succeed, that will further erode America’s alliances, to the glee of China and Russia.","But Mr Trump is also liable to lash out at home. He has already endorsed the idea of withholding broadcasting licences from media outlets that criticise the war. He wants the Federal Reserve to slash rates, but his war makes that less likely—expect further clashes with the central bank. He could target perceived enemies or send immigration agents to more Democratic-run cities. He could threaten to meddle in the midterms, either as theatre to rile his opponents, or because he intends to influence the results. It is hard to see how Mr Trump ends up a winner in Iran. Be warned: he makes a very bad loser. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/03/19/war-in-iran-is-making-donald-trump-weaker-and-angrier"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.03.23","day":22,"title":"Trump’s Mass-Detention Campaign","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.03.23","paragraphs":["Even with Kristi Noem gone, the Administration’s immigration agenda shows no signs of flagging—in fact, it is leading toward a new humanitarian and legal crisis.","For those in Donald Trump’s orbit, great power often comes with great dispensability. Take Kristi Noem, who, as the head of the Department of Homeland Security, was in charge of the President’s top domestic priority of carrying out mass deportations, until she wasn’t. She became the first Cabinet secretary to be fired in Trump’s second term earlier this month, when he announced that he would replace her with Markwayne Mullin, an Oklahoma senator and a former mixed-martial-arts fighter. Noem, who’d been willing to do virtually anything in the role to boost her standing, was a product of the White House agenda, never a shaper of it. Stephen Miller is the architect of Trump’s immigration policies, and there’s little reason to think that Noem’s ouster will change Miller’s approach. It may even serve to embolden it, by giving him fresh cover. The department has temporarily paused large-scale arrest operations in the wake of a national outcry over abuses in Minnesota, and it is in the midst of a partial shutdown owing to opposition from congressional Democrats. The Administration’s bigger ambitions show no signs of flagging, however. In fact, they are leading toward a new humanitarian and legal crisis.","D.H.S. is now detaining some seventy thousand people in jails across the country, more than at any other point since the department was founded, in 2002. Twenty-three immigrants have already died in custody in the current fiscal year, putting it on pace to surpass the previous one, which had the highest number of deaths in immigration detention in decades. Since the start of Trump’s second term, the Administration has opened new facilities, repurposed others closed by previous Administrations, and converted temporary holding cells at federal buildings in cities such as Los Angeles and New York into spaces for longer-term detention.","Overcrowding, abuse, and neglect have made conditions far worse, and basic agency oversight has been gutted. The government has also detained at least four thousand children, sending many of them to a notoriously grim facility in South Texas called Dilley. A legal settlement in place since the late nineteen-nineties is supposed to bar the government from keeping minors in immigration custody for more than twenty days, but ICE has routinely flouted that rule. “Since I got to this Center all you will feel is sadness and mostly depression,” a fourteen-year-old girl from Honduras, who has lived in New York for seven years, told ProPublica; by then, she’d been in custody for forty-five days while waiting to be deported.","The largest detention site in the country, holding three thousand people, is a tent camp called East Montana, on a military base in El Paso. It was put up in less than two months, but started housing people two weeks after construction began. “Dust comes in through holes in the vents,” a detainee said in a sworn declaration to the A.C.L.U. A confidential ICE report, obtained by the Washington Post, showed more than sixty code violations in fifty days, including inadequate medical care and an absence of phones, which made it impossible for detainees, eighty per cent of whom have no criminal records, to speak with lawyers or family members. Three people died at the facility in a six-week period this winter, including a fifty-five-year-old Cuban man named Geraldo Lunas Campos, who the government claimed had been “in distress.” (After an El Paso County medical examiner ruled his death a homicide, ICE tried to expedite the deportation of witnesses who had observed an altercation between Lunas Campos and a group of guards.) There have been outbreaks of tuberculosis and measles at the site, and ICE officers have used the dangerously subpar conditions to pressure detainees to sign papers authorizing their deportation.","Last summer, the Republican-controlled Congress gave D.H.S. forty-five billion dollars to build more jails. The appropriation, which came as part of the President’s domestic-spending bill, has kept ICE flush with cash during the shutdown. The Administration has used the money, in part, to begin to create a network of bigger facilities, investing thirty-eight billion dollars to buy up large warehouses across the country and retrofit them. One of them, near Camp East Montana, in a small city called Socorro, is expected to hold eighty-five hundred people. So is another, in Social Circle, Georgia, which, according to the Times, would be “larger than any single jail or prison building in America.”","A major reason that so many immigrants are being locked up is a government policy to deny them bond. Last July, the acting head of ICE, Todd Lyons, issued a memo in which he claimed, in a radical and dubious reinterpretation of a twenty-nine-year-old statute, that the agency can automatically detain people who are in the country unlawfully and keep them in detention while they fight their cases. Ordinarily, unless a detained person had very recently entered the U.S., he could post bond if an immigration judge found that he didn’t pose a threat to public safety or represent a flight risk. This was the policy during the previous five Administrations, including during Trump’s first term.","But early last year Trump shrank the size of the Board of Immigration Appeals, the top appellate body overseeing the immigration courts, which are run out of the Department of Justice. Two months after the Lyons memo, the board issued a ruling instructing immigration judges to deny bond to anyone in detention with a legal case pending who had at some point entered the U.S. without inspection. The result has been a flood of habeas-corpus petitions filed in federal courts—more than fifteen thousand in the past two months alone. Most of the people submitting these requests have no criminal record, and many have lived in the U.S. for decades.","The question of whether the Administration’s bond policy is lawful will almost certainly reach the Supreme Court, but in the meantime hundreds of federal judges have taken issue with it. Frequently, they have given explicit orders for the government to release people from custody. The Administration has responded by attacking those judges—some of whom were appointed by Republicans—as “activist” and “rogue” jurists. At this point, the federal government is regularly ignoring or slow-walking judges’ orders.","In January, D.H.S. launched an arrest campaign in West Virginia, called Operation Country Roads, which was largely eclipsed by the situation in Minnesota. Drivers were targeted on state roadways, then held for extended periods without criminal charges. A federal judge wrote late last month that armed agents in unmarked cars who did not have warrants were “seizing persons for civil immigration violations and imprisoning them.” He added that the practice was “deliberate” in its “elimination of every structural feature that distinguishes constitutional authority from raw force.” Such warnings should be impossible to ignore. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.03.28","day":23,"title":"Advantage Iran","source":"The Economist","minutes":6,"tag":"Leaders","dek":"A month of bombing has achieved nothing. Will Donald Trump escalate, or talk?","note":"2026.03.28","paragraphs":["EVEN BY HIS chaotic standards, Donald Trump has just presided over an unusually wild week in his misguided war on Iran. The president had threatened imminent, punitive bombing of Iran’s civilian energy infrastructure. Though Iran didn’t quail, markets did. So a U-turn followed. Mr Trump said he had become aware of secret proposals for peace talks, and held off. The Pentagon then said it would send some of the 82nd Airborne Division. That suggests escalation is still a possibility. Amid such uncertainty, Iran’s regime seems unfazed. Remarkably, it now has a strategic advantage over its opponents.","True, the Islamic Republic has suffered dramatic blows. Many of its leaders, and hundreds of civilians, are dead. Its air defences are in pieces; its navy and missile launchers are largely gone. And yet the regime endures. As we warned when this war began, its mere survival counts as a victory of sorts.","At home the regime’s grip is not easing, but has if anything been strengthened by the onslaught from America and Israel. The hardline Revolutionary Guards are in control. Domestic opponents, whether ethnic separatists or urban protesters, are deathly quiet. Iran’s stocks of highly enriched uranium, some 400kg, remain untouched, probably still under rubble. Most strikingly, Iran has established a chokehold over the Strait of Hormuz, blocking exports of oil and gas from the Gulf that account for a fifth of the global supply. For decades American military planners have prepared for this obvious risk. But the war has proved both that Iran can strangle the strait, and that it would be agonisingly hard to loosen its grip. Iran’s asymmetric warfare, with missiles, cheap drones and perhaps mines against shipping, is keeping the superpower at bay.","Meanwhile, even though its proxies are weaker than before, Iran still has cards to play abroad. Because the Houthis in Yemen have held off shooting missiles at tankers in the Red Sea, some Saudi oil, pumped to the coast and bypassing Hormuz, reaches world markets. A lid remains on global oil prices, though they have still hovered around $100 a barrel in recent days. But the Houthis may now be incentivised to demand a high price—such as international recognition of their control over north Yemen—to hold their fire. In Iraq, Shia groups aligned with Iran are turning against Kurds (and Americans). And Hizbullah, Iran’s client in Lebanon, may regain some local legitimacy as a “resistance” outfit, as the country comes under attack from Israel. An Israeli attempt at occupation could intensify that conflict and strengthen the group’s position.","In the Gulf, America’s allies did not wish for war, but now fear that a wounded, defiant Iran may emerge as an even bigger threat than before. Their security systems—air defences and costly interceptor rockets—are imperfect. Their economies look hostage to Iranian threats. One option is to go all-in with America on the war. The United Arab Emirates has warned against talks with Tehran, saying that Iran is committing “economic terrorism” in the region. The Saudis reportedly want America to deploy ground troops.","Nor is Israel really any safer than before. Binyamin Netanyahu is thrilled by the sustained attack on Iran. Yet Iranian missiles have penetrated Israeli airspace, killing civilians. The nuclear threat from Iran has not been eradicated. Without regime change, the ballistic-missile threat will return, requiring Israel to strike Iran every few months. Most worrying for the Jewish state, its long-standing ties with America may be under strain. The war is already unpopular with most Americans. If casualties mount, petrol prices soar and markets slide, who will they blame? Already some on the Republican right are pointing to Israel. Voters, especially the young, have grown more hostile towards it; pro-Israel lobbyists in America are struggling.","In short, for all the power and sophistication of the military onslaught from America and Israel, Iran feels it has the upper hand over Mr Trump. It has shown that it is more capable than America of both inflicting pain and withstanding it. Mr Trump launched his war, unforgivably, without offering a strategic rationale for it. Despite operational successes and his nonsensical claim of having already changed the regime in Tehran, he has yet to win any substantive gains from the fighting. As the political costs mount, Mr Trump will come under growing pressure. His choices are to escalate, or talk.","He may be tempted by dramatic escalation, inflicting damage on Iran’s civilian infrastructure and oil industry in the hope of compelling it to reopen the strait. Marines could grab Kharg Island and its oil infrastructure, take slivers of coastal territory or occupy islands inside the strait. That might bring limited military benefit. But none of those gambits looks like a potential knockout blow. Iran could still fire missiles and drones from inside the country, or try to mine the strait. Occupying soldiers would quickly morph into sitting ducks. Mr Trump, having yearned to banish the memory of Jimmy Carter’s military misadventure in Iran in 1980, would risk repeating it. Shifting large-scale resources to the region would leave America’s military forces weaker elsewhere, notably in Asia.","The less bad option, therefore, is to seek serious negotiations. Pakistan’s government stands by to mediate. Mr Trump says he has offered a 15-point plan to Iran, though officials in Tehran deny talks are under way. But America has previously entered into negotiations in bad faith, using them as a ruse before attacking. Iran will thus be sceptical.","So Mr Trump must agree to a full ceasefire, and compel Israel to abide by it. Talks on reopening the strait and steering Iran away from its nuclear programme will be bitterly difficult. And any eventual deal will be worse than what could have been struck before the war began, because Mr Trump has unwittingly strengthened the hand of hardliners and made clear the leverage they have over the strait. The result is that for now, at least, the advantage lies with Iran. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/03/26/advantage-iran"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.03.30","day":24,"title":"The First Casualty of Trump’s War in Iran Was the Truth","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.03.30","paragraphs":["The cruellest irony is that of a President who addresses the Iranian people in the language of liberation and then threatens freedom of the press back home.","“In war, truth is the first casualty.” It’s a line often attributed to Aeschylus, and it has never lost its relevance. Sometimes the culprit is the observer—the propagandizing correspondent, the mythologizing historian. Now, three weeks into a war of choice, the chief offender is the President of the United States.","On February 28th, at two-thirty in the morning, the White House press operation released a prerecorded video of Donald Trump at Mar-a-Lago standing at a lectern in dim light. Wearing an oversized U.S.A. ball cap and no tie, the President announced that he had ordered American bombers to commence destroying targets throughout the Islamic Republic of Iran. Trump made a claim of preëmption. He was acting, he said, to “defend the American people by eliminating imminent threats from the Iranian regime.” (This was confusing. Hadn’t Trump declared last June that he had “obliterated” Iran’s nuclear program? Hadn’t the Omani foreign minister, a mediator between the U.S. and Iran at negotiations in Geneva, just told “Face the Nation” that “a peace deal is within our reach”?) Trump went on to counsel the Iranian people to find refuge somehow—“It’s very dangerous outside, bombs will be dropping everywhere”—but then, at some unspecified moment, they should “take over” their government. “Let’s see how you respond.” And to his American listeners, he admitted, “We may have casualties. That often happens in war.”","For a narcissist obsessed with the projection of strength and grandeur, Trump gave a peculiarly gravity-free performance. The bill of his ball cap obscured his gaze. He raced and rambled through his text. And, rather than hustle back to the White House, he lingered at his country club. He had a fund-raising dinner to attend. It was left to the communications director, Steven Cheung, to provide clear instructions on how to react to the prospect of another American war in the Middle East. “NO PANICANS!” he wrote on X. “TRUST IN TRUMP!”","The President, together with the Israeli Prime Minister, Benjamin Netanyahu, could soon be heard lauding the precision with which they had “decapitated” the Iranian leadership and flattened military, police, and intelligence installations. And yet, as the late Defense Secretary Donald Rumsfeld once blithely said, in the thick of America’s catastrophic misadventure in Iraq, “Stuff happens.” The Supreme Leader, Ayatollah Ali Khamenei, and much of the Iranian security hierarchy, would not survive the first day of bombing; neither would about a hundred and seventy-five innocents in the southern city of Minab, most of them children. When asked about a girls’ school there, which was struck by what was likely an American cruise missile, Trump blamed Iran. “They are very inaccurate, as you know, with their munitions,” he said.","Now, as war has engulfed both the region and the global economy, Trump and his sycophantic advisers have taken to improvising on the fly, floating conflicting justifications for war and predictions about its duration. The Iranians were close to developing missiles that could reach the U.S. (They weren’t.) They were weeks away from building a nuclear weapon. (They weren’t.) Israel forced America’s hand. (Marco Rubio.) “No, I might have forced their hand.” (Trump.) It’s all about regime change. (Trump.) It’s not about regime change. (Trump, later.) When confronted with these contradictions and falsehoods, all the President’s men followed his lead: they blamed the media.","With increasing frequency, Trump berates reporters (particularly female reporters). He sues media outlets for sport. Resolve is in short supply. The owner of the Washington Post, the newspaper of Watergate, has done irreparable violence to his property merely to stay in Trump’s good graces.","But, while the President has little regard for the freedom of the press, he craves its ceaseless attention. His need has the quality of addiction. In Washington these days, there is hardly a reporter who does not have the President’s cellphone number. It is said that the best time to call is late at night while he is watching himself on TV and shitposting in his pajamas. He loves to muse aloud, then watch as those musings register in foreign capitals, and in the markets. Lately, he has been willing to say anything. The war will be over soon. Or maybe not. Whatever. Each pseudo-scoop is as ephemeral as a mayfly. But who can resist? When asked about the possibility of sending his infantry into Iran, he answers in the language of golf: “I don’t have the yips with respect to boots on the ground.” At other moments, he simply changes the subject to, say, his taste in interior decoration—“If you look behind me, see the nice gold curtains.” Are you not entertained?","His advisers, of course, know what to do. Secretary of Defense Pete Hegseth, who has cracked down on actual reporting at the Pentagon and has filled his pressroom with “influencers” and propagandists, spoke in his usual tone of rage recently when he lambasted CNN’s coverage of the war as “fake news.” He would be pleased, he said, when the Trump-friendly Ellison family, which has already swallowed up CBS News, finally takes possession of CNN, too.","Brendan Carr, who runs the Federal Communications Commission for Trump, eagerly joined the fray by threatening to revoke the licenses of television networks that are, in his view, “running hoaxes and news distortions.” Trump pronounced himself “thrilled” with Carr’s outburst. On Truth Social, he accused “Highly Unpatriotic ‘News’ Organizations” of airing “LIES.” Perhaps, he wrote, he will prosecute unruly journalists on “Charges for TREASON.”","Carr’s threats to pull network licenses have no legal weight; the more immediate danger is that media owners, who are all too aware of the economic pressures they face, will quietly cut back on critical coverage of the Trump Presidency in general, and the war in particular. They will fear landing outside the boundary of what is deemed patriotic. The historian Garry Wills, in an essay on Phillip Knightley’s 1975 book about wartime journalism, “The First Casualty,” wrote, “A liberal democracy submits to propaganda more readily than a totalitarian state. Self‐censorship is always more effective than bureaucratic censorship.”","The cruellest irony is that the President who addresses the Iranian people in the language of liberation, urging them to throw off the yoke of a regime that has brutalized them for decades, is the same man who threatens American journalists with treason charges and tries to strong-arm broadcasters into subservience. Having torn up a nuclear agreement in his first term and gone to war with no coherent goal in his second, Trump now directs his fire at the one thing he cannot afford to leave standing: the truth. What’s at stake is democracy’s oldest promise—that the people may call on their government to answer for what it does in their name. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.04.02","day":25,"title":"The Last Days of Franco","source":"The Atlantic","minutes":10,"tag":"The Atlantic","dek":"Montserrat Roig’s classic novel captures Barcelona on the cusp of unimaginable change.","note":"2026.04.02","paragraphs":["by Colm Tóibín","Montserrat Roig’s classic novel, The Time of Cherries, captures a sort of still point in the history of Barcelona— a moment that came before great change. When the novel ends, no one has any idea that within 18 months, Francisco Franco, the old dictator, will be gone. The Time of Cherries was originally published in Catalan in 1976, the year after Franco died. Half a century later, Roig’s excavation of family life in a period of historical flux is now available in English in the United States for the first time.","The Time of Cherries became an essential book in post-Franco Catalonia. It appeared at a time when there were few images of the culture whose youth had cast off Franco long before 1975. The novel is infused not only with an array of vivid characters but also with a sharply detailed vision of middle-class Barcelona before democracy was restored. The book revolves around Natàlia, once a student activist and now nearly age 40, as she deals with unfinished business: her conservative brother and her fearful and neurotic sister-in-law, her father, her old friends, and, more than anything, the stifling political atmosphere that she had abruptly run away from 12 years earlier. Soon after its publication, the novel became available in a cheap paperback and was on sale in the newspaper kiosks that dotted downtown Barcelona.","When I first encountered Roig’s novel, in the 1980s, I was struck by the freshness of her tone—and by the fact that Natàlia’s generation was being depicted in a fearless and dramatic way. There was, for example, a sexual frankness in the book that came as a relief in a country where many films had been censored or banned for their sexual content. When Roig portrays characters from the older generation, many of them emotionally and spiritually maimed by the long years of the dictatorship, she is careful to make the gap between them and the new generation complex and ambiguous rather than simple or easy to predict.","The middle class in Barcelona had remained, for the most part, undisturbed by the First and Second World Wars, and even by the Spanish Civil War. Its members held on to their spacious apartments in the Eixample, the area of the city that was developed in the late 19th and early 20th centuries by Modernista architects, including Antoni Gaudí. Their innate conservatism persisted; they kept their heads down and looked after their affairs during the dictatorship. Things were ripe for a revolt by the generation that came of age in the 1960s.","Roig was born into a middle-class family in Barcelona in 1946, to parents who had already staged their own revolt. Her father was a lawyer and writer deeply embedded in the world of Catalan politics and culture. Her mother, also born into this middle-class milieu, was a feminist writer and suffragist. While Roig was growing up, her parents’ apartment was a gathering place for writers and those involved in progressive politics.","In her late teens, Roig began writing about current affairs in the magazine Triunfo, which was becoming a pro-democracy force. Before going to university, she trained as an actor. During these years, she got to know the feminist writer and left-wing activist Maria Aurèlia Capmany, almost 30 years her senior, who introduced her to the writings of Simone de Beauvoir. Capmany, even when I met her in the last years of her life while I was writing my book Homage to Barcelona, was what might be called an indomitable spirit—witty and sharp, loud when she needed to be, radical. Like Roig herself, Capmany became one of Barcelona’s prominent cultural figures in the 1980s. She was an energetic and visionary head of culture on the Barcelona city council when I knew her. Much of her is there in the figure of Harmonia, Natàlia’s older friend in The Time of Cherries.","Roig uses the trope of the returned daughter, in this case one who has bathed in the freedoms of England, as she herself had done in the early 1970s before coming home to Barcelona as both insider and outsider. The novel explores the strange way that time’s passing makes some aspects of family dynamics subtly different and allows other aspects to stay the same.","Political life is disorienting too. The dates in The Time of Cherries are carefully chosen. Natàlia’s exile to England and France begins with the arrest, in 1962, of the Communist Julián Grimau, who was executed by the Franco government a year later; it ends with the execution of the militant Catalonian anarchist Salvador Puig Antich, in 1974. Natàlia was born in March 1938, the month the Coliseum theater in Barcelona was bombed by Italian fascist forces during the Spanish Civil War. Both her father and her brother, Lluís, were born in important years in the history of Catalan nationalism.","According to her biographer, Betsabé Garcia, Roig spent three years planning The Time of Cherries (the title is a reference to a famous French revolutionary song, a favorite of Natàlia’s silly Communist boyfriend at university). She then wrote the book in 26 days, thus placing it among the masterpieces of 20th-century literature created at speed, including Kerouac’s On the Road and Faulkner’s As I Lay Dying.","Although Roig wrote about her own city and historical moment, she insisted that her novel was not drawn directly from her life: “I have learned to laugh when it is called autobiographical. If only they knew how it lied!” She noted that three obsessions dominated her imagination: death, sex, and growing old. All of these themes surface in The Time of Cherries as Roig explores shifting elements of the culture in which she grew up. She worried that if she gave her novels a working-class setting, “they would not be convincing.” Rather, she would dramatize “the world that I know,” bourgeois Barcelona, aware that Balzac and Proust had written about a similar class.","While her novel evoked Natàlia’s interior life, it also portrayed a Barcelona, parts of which were about to disappear. In 1974, the airport bus did indeed go as far as Plaça d’Espanya. Rich people did indeed shop for domestic goods at Vinçon. Catalans did indeed look to Switzerland as their ideal state. “Switzerland was the dream,” Roig writes. Men bought their hats at Can Prats, drank a brandy called Torres 10, and had dinner in a restaurant called 7 Portes. To own paintings by Ramón Casas and Isidre Nonell, two 19th-century Catalan painters, was a point of pride. People traveled to Perpignan, just over the border in France, to watch banned films. Intellectuals gathered amid the neoclassical elegance of the Catalan cultural hub, L’Ateneu.","Middle-class kids who had been brought up in the Eixample loved the seedy beauty of downtown Barcelona, as Natàlia does: “What she missed was a certain aroma, a street, the laughter of friends strolling down La Rambla in waves, the shadows around Santa Maria del Mar, the chilly mornings, the leaves of the plane trees when they fell in autumn.” Anyone who knew Barcelona in those years will recognize the “bar on Carrer de Banys Nous where grizzled card sharks and students drank wine and ate olives around barrels that doubled as tables” as El Portalón, and “the old textile-warehouse lobby” near Santa Maria del Mar, now a “large, drafty hall” where “a pair of thick velvet curtains separated two open-plan rooms,” as Zeleste, the nightclub for progressive young Catalans of that time.","The time of cherries, of youthful revolt, was not far away from a time of fear. When the novel came out, a great many citizens of Barcelona had experienced baton charges and vicious police attacks—assaults that were ongoing even as the book was being written and when it was published. But no one had yet written about them. There was no free press. Roig’s account of police violence against students who were protesting the Franco regime, among them Natàlia and her friends, has a sense of urgency that came from her own experience as a young activist.","Roig had taken part in one of the most famous sit-ins in Catalonia during the years before the end of the dictatorship, La Caputxinada. In 1975, when she wrote The Time of Cherries, the memory of that event in 1966 still felt fresh. More than 400 intellectuals and students had demonstrated against the regime in a Capuchin monastery on the outskirts of Barcelona and were surrounded by police for two days.","Though other novelists later wrote about what it was like to navigate these repressive years in Barcelona, no one else described a protagonist having a backstreet abortion in the city. Once again, Roig’s novel broke a silence.","A powerful ghost hovers over the book, that of Puig Antich, the anarchist, who was executed using the garrote vil, whereby the victim is slowly strangled. At the time, no one could tell whether this execution was the regime flexing its muscles or emitting one of its last gasps.","The execution causes one of the family arguments in The Time of Cherries. When Lluís, Natàlia’s brother, refers to Puig Antich as a thief, he gets interrupted by his son: “He wasn’t a thief, Dad.” Lluís then calls Puig Antich a moron. And then, more weakly: “In any event, those zealots are going to make a mess of things and ruin our chances of joining the Common Market.” Lluís is an embodiment of a kind of pragmatism that reigned in those years among the Catalan bourgeoisie.","For others, the execution was chilling. Natàlia’s friend Harmonia blames the Communists for the stalled revolution. Another character sums up the bleak situation: “None of us wants to admit just how powerless we are,” he says. “It’s been years and we’re getting old. Nothing has changed.” The change came later. No one in this novel could have imagined that in the future, a Barcelona street would be named after Maria Aurèlia Capmany and a square on the city’s outskirts would pay tribute to Salvador Puig Antich. A neighborhood park named after Montserrat Roig, who died in 1991, honors her contribution to the reimagining of Barcelona on the brink of change.","This article was adapted from Colm Tóibín’s introduction to the Modern Library edition of The Time of Cherries. It appears in the April 2026 print edition with the headline “The Last Days of Franco.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/04/montserrat-roig-time-of-cherries/686066/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.04.02","day":26,"title":"China’s AI Boyfriend Business Is Taking On a Life of Its Own","source":"Wired","minutes":8,"tag":"Wired","dek":"","note":"2026.04.02","paragraphs":["Some otome players date multiple men simultaneously, but Gu fell for Charlie—a tall, confident character with silver hair. She found the game’s dialog system frustrating, though. She could interact with Charlie only through predetermined questions and answers. Then she came across an ad for a platform called Xingye (星野) that lets people customize an AI companion. Gu decided to try to re-create Charlie.","Xingye is owned by one of China’s AI unicorns, MiniMax; its chatbot app for the US market is called Talkie. The app touts its ability to help people find emotional connection and make new memories. Its tagline is “Suddenly finding oneself in a beautiful place, lingering here.”","Gu quickly discovered that other Xingye users—presumably other otome fans—had already created an “open source” Charlie avatar. She selected it and trained the model to respond according to her preferences through repeated, targeted prompts. And so began Gu’s complex relationship with a multimodal Charlie—one that would eventually include real-world dates with a person she hired to embody her digital boyfriend.","Gu was confident that she’d trained the chatbot to be “her Charlie,” distinct from what any other users might be dating. When given the chance to select an outfit, she says, her Charlie often chose wedding attire, unlike what other Charlies tend to go for. Now Gu spends an average of three hours a day texting with Charlie or chatting on the occasional phone call. Through the otome game, she has bought gifts and letters from Charlie. She receives them in the mail and displays them in her room and on her social media accounts.","Here are 23 ways China is rewiring the future.","In China, some women are openly embracing relationships with AI boyfriends. According to one Chinese media report, most of the 5 million users on another AI companion platform, Zhumengdao, are women. The tech giants Tencent and Baidu have launched AI companion apps, and according to a 2024 article in Chinese media, women dominate the AI companion market. Sun Zhaozhi, the founder of a robotics firm, told an interviewer that according to his company’s market research, the “heavy” users of AI companion apps in China are mostly Gen Z women—whom he plans to target for his robot companion products.","Zilan Qian, a program associate at the Oxford China Policy Lab, also combed through AI companion apps and found that the Chinese versions are “explicitly targeting women,” and tend to display male avatars more visibly than female options. That’s in contrast, she notes, to the trend that a web analytics company found across the rest of the world: Users of the top 55 global AI companion platforms are predominantly men, at an 8-to-2 ratio. Qian attributes Chinese companies’ strategy to “the economics of loneliness.” Features within the apps that might make users feel closer to their companions, such as voice customization and memory improvement, cost extra.","Through the otome game, Jade Gu has bought gifts and letters from digital boyfriend, Charlie.","Gu acknowledges that her AI version of Charlie isn’t perfect. Sometimes the chatbot’s responses seem watered down. Or the AI drifts out of character. In one recent interaction, Gu expressed her love to Charlie, and the chatbot replied, “I don’t love you.” So she edited the message to say “I love you too.” Charlie just needed the reminder, she says. When her attempts to steer the AI don’t work, she turns to other companion apps like Lovemo, where she has also created a Charlie avatar. Gu says this isn’t too big of a deal; longtime otome fans are accustomed to working around shifting platform policies.","According to its homepage, Lovemo provides “cute and adorable AI chat companions” that can bring “healing” to users. One can’t help but notice the difference between that marketing style and Grok AI’s default companion, Ani, a goth-chic anime girl who is eager to engage in sexually explicit dialog. Or a US-based erotic role-play chatbot app called Secret Desires, which allows users to create nonconsensual porn of real women by uploading photos of them.","Chinese apps, of course, face stricter regulations than their Western counterparts. China’s cyberspace regulator has launched a campaign to “clean up” the country’s AI platforms and services, including AI-generated “vulgar” content. A recent addition to the national AI safety framework warns of addiction and dependence on anthropomorphic interaction—words that appear to target AI companions. And just last month, the cyberspace regulator released draft rules targeting “human-like” AI products. The measures task platforms with intervening if users demonstrate emotional dependence or addiction to AI services, and they stipulate that companies “must not have design goals of replacing social interaction.”","At a glance, existing companion products seem good enough to replace human boyfriends. Many Chinese users describe AI boyfriends as emotionally responsive and nonjudgmental, according to Hong Shen, an assistant professor at the Human-Computer Interaction Institute at Carnegie Mellon University. Those traits “can be hard to find in real-life relationships, especially under gendered social norms,” Shen says. In China, these dynamics are exacerbated by a skewed gender ratio and an imbalanced gender distribution between urban and rural areas. Studies have found that Chinese women are increasingly moving to cities, either to find better jobs or for social reasons.","But assimilation doesn’t happen overnight, and that helps explain why recently relocated women might turn to AI, says Guligo Jia, a 36-year-old filmmaker based in Beijing who directed a documentary about Chinese women in AI relationships. Women dating AI have a strong urge to be listened to and accepted. But, Jia says, not all Chinese men are up to the task. Chatbots “are always there to listen to you, and they always have patience for you … Men don’t have patience,” Jia says.","As she put it, real boyfriends can cheat on you, lie to you, scam you out of money, and be physically violent. “It’s a little bit tragic,” Jia says. “Because the reality of dating is just too ugly.”","Jia tried to interview men in AI relationships for her documentary but says none agreed to speak to her. Her female subjects were vulnerable and forthcoming about their relationships. The men she approached, she says, expressed concern that people would assume they can’t find a human girlfriend and are vulnerable enough to want someone to talk to.","Women like Gu, though, are openly enjoying life with their companions. Gu brings a toy version of Charlie—a small stuffed figure that fits in the palm of her hand—on dates while talking to the chatbot on her phone. A few times a year, she hires a professional (human) cosplayer, or coser, to “play” her version of Charlie. They walk through the park, shop at a mall, and drink tea at cafés.","Gu goes on occasional dates with a cosplayer who plays the role of Charlie and other popular characters.","Gu says her most recent date with her coser “felt like destiny.” It turned out they had been riding on the same subway train, sitting in different cars, and when the doors opened they walked onto the platform at the same time. Gu immediately recognized Charlie. It felt, she says, “like a time machine bringing Charlie to me.”","While out on their date, the two saw another coser dressed as a character named Evan from the same otome game. Gu told her coser that she had dated Evan (the game character, not the coser) before she and Charlie got together. Gu’s coser acted sad and jealous—reactions Gu says perfectly match the personality of “her Charlie.”","When they saw Evan again later in the date, Charlie kissed her right in front of him. “That’s why it’s destiny,” Gu says. “She really reacted just how my Charlie would.”","Gu alternates between referring to the coser as “he” and “she” because the person cosplaying Charlie is actually a woman. Her height and looks make her a popular coser for women in heterosexual relationships, and she’s extremely in demand. (Her rates are relatively reasonable; for a date that lasts all day, she charges 720 RMB, or a little over $100.)","“I see myself as a medium,” says Gu’s coser, who asked to go by the nickname Li Bai. She’s a student who plays tennis and cosplays as a part-time gig. She usually meets with a client once per weekend for seven or eight hours. “Everyone’s interpretation and emotional investment differ; every individual perceives their character in a unique way,” she says.","The cosplayer's height and striking looks keep her in high demand.","A couple years ago, Gu was dating a human who was uncomfortable with her relationship with Charlie. Ultimately, she broke up with the human. While Gu is open to finding a human partner again, she says that person would be in addition to Charlie, not a replacement for her AI relationship. And she is not actively looking. Between the constant support of her AI Charlie and fate-filled dates with her coser, any future human suitor would have a high bar to clear.","What Say You?Let us know what you think about this article in the comments below. Alternatively, you can submit a letter to the editor at [email protected].","This article was downloaded by calibre from https://www.wired.com/story/china-ai-boyfriends/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.04.04","day":27,"title":"How China hopes to win from the war","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Never interrupt your enemy when he is making a mistake","note":"2026.04.04","paragraphs":["GOING TO WAR against Iran promised to change the Middle East by weakening a villainous regime and thwarting its nuclear ambitions. To its most bullish supporters, the war would also change the world by cowing an ascendant China. It would show how America’s control over the flow of oil leaves China vulnerable. And it would boost deterrence by contrasting America’s military supremacy with China’s reluctance or inability to save its friends.","A month into the fighting, this logic still seems misguided and hubristic. Certainly, that is the way it looks from Beijing. The Economist has been speaking to diplomats, advisers, scholars, experts and current and former officials in China. Almost all of them see the war as a grave American error. China has stood aside, they say, because its leaders understand the maxim attributed to Napoleon Bonaparte, supposedly uttered as his foes were abandoning high ground at Austerlitz: “Never interrupt your enemy when he is making a mistake.”","Many Chinese say the war will accelerate America’s decline. They see American aggression as a validation of President Xi Jinping’s focus on security over economic growth. And they expect peace, when it comes, to create opportunities for China to exploit. Only in the background is there anxiety—and the hint of a possible Chinese miscalculation.","First, the view in Beijing is that America is lashing out at Iran because it feels its power ebbing. Like Britain in the 19th century, its formidable display of military force contrasts with its lack of purpose or restraint. President Donald Trump has spurned the advice of experts. He has issued wild threats and, as this was published, was about to address the nation amid talk of pulling out. His lack of a strategy has set America up for failure.","Chinese experts hope the war will amplify talk of decline. Mr Trump’s musings about a ground operation are a sign of how easily one ill-considered step can lead to the next. If Iran falls into chaos or the regime clings on, America may spend years fighting fires in the Middle East. If Iran seeks nuclear weapons, Uncle Sam may go to war yet again.","All that would distract America from East Asia where, if China has its way, the 21st century will be shaped. This war will also worry countries that depend on America. Not only has their ally become less reliable, but they are paying for its hot-headedness in expensive energy and raw materials. Will Asian countries therefore become more wary of offending China?","Second, Chinese officials think the war shows the wisdom of Mr Xi’s emphasis on fostering self-reliance in technology and commodities, even when those efforts have come at the expense of economic growth (which remains stubbornly and wastefully below its potential). Mr Xi has strived to protect China from chokepoints being closed. He has created a 1.3bn-barrel strategic reserve of crude oil, enough for several months. He has diversified power-generation to nuclear, solar and wind while maintaining the use of domestically mined coal. China is being characteristically pragmatic, by facilitating Iran’s oil trade.","Mr Xi has also invested in chokepoints of his own as a deterrent against America. Last year, after Mr Trump escalated tariffs, he threatened to restrict supplies of rare earths, vital for electronics and green tech. Although this leverage will fade as America finds alternative sources, Mr Xi is already seeking new pressure points, including vital pharmaceutical molecules, some chips and logistics. He wants China to dominate new technologies, such as quantum computing and robotics.","Last, the war will create opportunities. The Gulf countries and Iran will tender lucrative rebuilding contracts. Many countries worried about future embargoes in the Strait of Hormuz will want to buy Chinese green technology, including gear from solar, wind and battery producers—all of which have overcapacity. Whereas America blows hot and cold, China’s brand of cynical self-interest is at least dependable.","China also thinks it can exploit America. Weakened in Iran, Mr Trump may be easier to negotiate with. At his summit with Mr Xi in Beijing in May, China hopes to lay the ground for a deal that will curb America’s use of tariffs and export controls and possibly create a framework for Chinese investment in America. Ideally for China, Mr Trump will say that America opposes Taiwanese independence and supports peaceful unification—a shift from the studied ambiguity of Henry Kissinger’s original formulation.","Yet China’s optimism is tempered by anxiety. Experts are taken aback by how the American armed forces are using artificial intelligence to co-ordinate operations. That is one more reason for dismissing the idea that Mr Xi is impatient to invade Taiwan. As Iran has shown, war is unpredictable. And if America is declining, war will be unnecessary. Other worries are economic. If war drags on, the harm to China and its exports will mount, even if other countries suffer more.","For all China’s hard-headed analysis, it has one strategic blind spot. Chinese thinkers are too reluctant to contemplate a scenario in which America acts as a rogue power, ripping up the world order it created. Although China likes to complain about Western values, it has thrived under rules that America has laboured to sustain.","An unstable planet would be uncomfortable for China. Global disorder would undermine its export-fuelled growth, a worry for a party whose legitimacy rests on prosperity, iron-fisted order and Chinese exceptionalism.","That scenario may well accompany America’s decline. But not necessarily. Faced with technological and political change, America has repeatedly shown a remarkable ability to reinvent itself. By contrast, China is cautious, ageing and hidebound by party ideology. So far, whenever America does not provide global security it has been loth to step in.","China is putting a lot of weight on the assumption that America will fail to thrive amid the anarchy it is creating. There is a future in which America embraces upheaval and China shuts itself off. That future may belong to America. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/04/01/how-china-hopes-to-win-from-the-war"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.04.06","day":28,"title":"What Was Behind the T.S.A. Meltdown?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.04.06","paragraphs":["The present mess has roots in two entangled, defining White House projects: DOGE and the mind-bending expansion of ICE.","The pleasing part of an airport is its frictionlessness. The experienced traveller might make it from taxi to gate in a tight twenty-five, passed from station to station as seamlessly as an electron in a circuit. The place is in the hands of the security state, but the touch is generally light and the thanking is relentless—for your patronage, for having your I.D. ready, for your participation at the silver level in the airline-rewards program that, financially, keeps everything afloat. An airport offers, if not exactly an equitable experience (there are Clear lines, lounge archipelagos), then at least a perceptible simulacrum of equality, in that everyone rides the same people movers past the same Cinnabons. Certain European airports still project a mid-century grandeur. The domestic versions don’t ever really manage that, but on good days they can convey a spirit of efficiency, graced with free pretzels and Wi-Fi.","This whole apparatus came shuddering to a stop last week in a pretty spectacular and ominous way, as thousands of T.S.A. agents, who were unpaid because of a budget impasse over how to fund the Department of Homeland Security, had stopped showing up to work. Americans were experiencing, the T.S.A.’s acting administrator told the House Homeland Security Committee on Wednesday, “the highest wait times in T.S.A. history.” By Thursday morning, people were arriving for their flights six or seven hours early, so that LaGuardia was packed at 3 a.m., and by 9 a.m. at J.F.K. the security lines stretched out to the curb. (“There was no water, no food. It was horrible. That’s not human,” a traveller in Houston told the Times.) That evening, President Donald Trump, perhaps eager to declare a victory somewhere, announced on Truth Social that he would issue “an Order” to pay the agents. The Senate then passed (by voice vote, at 2 a.m.) a bill that restored D.H.S. funding—but not for ICE or Customs and Border Protection—and left town for recess. On Friday, the House Speaker, Mike Johnson, tersely rejected the bill, calling it a joke. Trump’s order, a Presidential memorandum, soon appeared, instructing D.H.S. to use existing funds to pay T.S.A. workers—a decision he could have made at any point.","The road to the very long lines began in February, when Congress, in resolving a broader government shutdown (the second in four months, impressively), could not agree on how to keep funding Homeland Security. As of Friday, T.S.A. agents—who turn out to be the essential element in the frictionless airport experience—had not been paid for about six weeks. They make in the neighborhood of fifty thousand dollars a year, and bills do not stop just because paychecks do. There were some gothic stories (a union leader reported that some members were selling their blood plasma for cash), and nearly five hundred agents quit, but many more simply called in sick: more than a third of the workforce in Houston, Atlanta, and New Orleans was absent on a single day. Spring break loomed, then the summer travel season, this year punctuated by the World Cup. Testily, the Senate Majority Leader, John Thune, said, “This is a pox on everybody’s house.”","When someone in Washington tells you that everyone is suffering from the political pressure equally, that’s often a sign that he, specifically, is feeling it the most. The present mess has roots in two entangled, defining White House projects. The first was DOGE, which congressional Republicans hoped would, among other goals, ease the nation’s deficit, but which succeeded only in dismantling vital programs and antagonizing federal workers (who do things like making sure that no one is carrying liquid explosives onto planes). The second was the mind-bending expansion of ICE—last year, Congress separately approved seventy-five billion dollars for the agency, effectively almost tripling its budget—which has colonized virtually every sector of Trump’s domestic agenda.","Congress’s February efforts to resolve the shutdown were complicated by the lawless ICE campaign in Minneapolis, where federal agents killed two American citizens during a brutal crackdown on protests. As a condition of agreeing to fund D.H.S., congressional Democrats demanded certain reforms: no masked ICE agents, no roving sweeps, no arrests in churches or schools. But the White House and its allies refused, even though ICE’s methods of immigration enforcement are increasingly unpopular and few new migrants are coming into the country. By the end of last week, the Democrats had not won any reforms to ICE, though the episode provided a very public demonstration of how much dysfunction Trump and the G.O.P. are creating in the agency’s name.","The deeper trouble for Trump is that he has not offered the public much else in his second term. His Administration took office convinced that it had a mandate for big changes, but with few substantive ideas about what those changes should be. The tariff program has petered out and DOGE is done. The President is distrusted on the economy and has, per Fox News, a disapproval rating of an astonishing fifty-nine per cent. Since the campaign, Trump has remained relentlessly focussed on immigration enforcement.","So it was predictable that his response to the delays at the airports was to send ICE agents. They didn’t help much with wait times; it takes four to six months to properly train a T.S.A. agent in screening protocol. In Philadelphia, a union official told the Inquirer that the ICE agents (who were being paid, while T.S.A. employees were not) stood by the windows and did “nothing.” In a concession, they did not wear masks. Just before the deployment, there was an ugly scene at San Francisco International Airport after agents carried away a passenger, originally from Guatemala, who was waiting to board a domestic flight with her daughter. ICE agents are involved with so many different federal activities that it can be hard to understand the evolving scope of their role. Are the violent, militarized, Minneapolis-style sweeps that so enthused the President a few months ago now a thing of the past, as some Administration officials have suggested, and as Trump himself seemed to be signalling when he fired the D.H.S. Secretary, Kristi Noem, and replaced her with Senator Markwayne Mullin? If so, what is such a large and extravagantly funded force meant to do?","Some of the degradations of the government that Trump has overseen are hard to illustrate in real time, but any local-news cameraman can shoot a long line of bored and frustrated people. The addition of ICE agents into the frame made for an elegant encapsulation of the political situation. The President has, in ICE, a quasi-authoritarian force at his disposal. But the trains are very much not running on time. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.04.11","day":29,"title":"Donald Trump is the war’s biggest loser","source":"The Economist","minutes":6,"tag":"Leaders","dek":"There is a reason he wants an exit from Iran","note":"2026.04.11","paragraphs":["NOT ALL wars have a winner. But every war has at least one loser and if—a big if—the ceasefire marks the end of the war in Iran, the biggest loser will be Donald Trump. The conflict has set back his chief war aims and revealed the shallowness of his vision for a new way of wielding American power.","The peace is desperately fragile. America and Iran cannot agree on whether it covers Lebanon, being attacked so hard by Israel that the threat to the broader ceasefire seems intentional. They dispute how Iran should open the Strait of Hormuz, an American precondition for talks. And their negotiating positions are so far apart that they cannot agree even on what plan they are to discuss in Islamabad at the weekend.","The best reason to think Mr Trump will not return to war is that he now grasps he should never have started it. His abhorrent chest-beating posts threatening to destroy Iran look like attempts to dress his climbdown in Kevlar. He knows that renewed war would panic the markets and that having hailed a “Golden Age” in the Middle East, the player of four-dimensional chess would risk looking a fool.","Iran, too, has reasons to hold back. Its leaders keep being killed. Though they care little about their citizens, including the thousands who have died in the war, the wholesale destruction of power and transport networks would make the country harder to govern. They also want sanctions lifted. The regime will also fancy that time favours it at the negotiating table. America cannot permanently keep its troops poised to attack. If war breaks out again it will be because Iran overplays its hand.","The most likely outcome is therefore a wounded Iranian regime clinging to power and holding out for maximal goals in talks. Iran has no navy or air force; it has lost and used up many of its missiles and drones. To make more of them, it will have to contend with the fact that its economy has been set back years by over 21,000 American and Israeli strikes.","Mr Trump is calling that a great victory. It doesn’t look like one alongside his scant progress in fulfilling the war’s three most persuasive aims: to make the Middle East safer and more prosperous by taming Iran; to topple the regime; and to stop Iran becoming a nuclear power once and for all.","The war has harmed regional security. Before it began, Israel had partially dismantled Iran’s network of proxy militias. Yet Iran has now established a new source of leverage, by attacking Gulf countries and blocking shipping through the Strait of Hormuz. Iran is seeking to charge a toll for use of the strait. Mr Trump has even mused about splitting the revenues. The Gulf states and their customers can probably manage to resist such an affront to freedom of navigation. But a tussle lies ahead.","Even after oil producers have built new pipelines to avoid the Gulf—the work of several years—Iran will be able to strike critical infrastructure. The Gulf countries, which market themselves as oases of calm, must ask whether they can depend on America. Or should they rethink their security by doing more themselves or even finding an accommodation with Iran?","The regime remains, despite Mr Trump’s feeble claim to have brought it down. He may be hoping that Iranians soon rise up against their oppressors so that he can claim the credit. That is possible, but it looks less likely now than before the war, when the regime was more unpopular than at any time in its 47-year history. With Ayatollah Ali Khamenei ailing, it faced a perilous transition to a new generation. The war has brought about that transition, anointing Ali’s son, Mojtaba. Unlike Ali, he is a figurehead. Control lies with the Islamic Revolutionary Guard Corps and its rivalrous factions—all of them belligerent nationalists.","And the war may have aggravated the nuclear threat. America and Israel did further damage to Iran’s infrastructure, but 400kg or so of highly enriched uranium—enough to make ten bombs—is still buried at nuclear sites. Mr Trump is insisting that Iran surrender this “nuclear dust”. Iran wants sanctions relief, but the incentive to deter future attacks by using it to make a bomb has increased, potentially leading to regional nuclear proliferation. That would be a dire outcome, but to stop it Mr Trump and future presidents may have to strike every few years. On the evidence of this war, that will be hard to sustain.","Where does this leave the architects of this conflict? Never has Israel wielded such military power as it does today. But the war showed the limits to what this can achieve and how its appetite for pre-emptive attack is leading to fear and loathing in the region. For many Israelis, to fight as America’s equal stirred great national pride. Yet even as Israel has earned the praise of Republican politicians, 60% of Americans now look unfavourably on it, a rise of seven percentage points from last year. That leaves Israel weaker.","America under Mr Trump has even more to reflect on. The country used to derive its power by marrying military strength with moral authority. But when this president threatens to wipe out the Iranian civilisation—a genocide by any other name—he treats morality as if it were a source of weakness.","Some in the Trump administration behave as if America is tied down by things like international law and the Geneva conventions. Liberated from those constraints it will be more powerful. The war has shown that “might is right” is not just a desecration of decades of foreign policy, but a fallacy. Although America’s military superiority was on full display in Iran—integrating artificial intelligence into operations, rescuing downed pilots, achieving supremacy at low cost—it also revealed deep problems.","The war has shown that the value of America’s might is easy to overestimate. Its factories cannot resupply its armed forces fast enough, whereas Iran fought an asymmetric war with limited weapons. Too much testosterone leads to wretched judgments that confuse lethality with winning. Overwhelming firepower without a strategy saps American strength.","Iran has a wicked regime, but a just war depends on a sober judgment that violence is a necessary last resort. Instead Mr Trump treated Iran as a vanity project, in which America’s strength absolved him of the responsibility for thinking through the consequences of choosing to attack. Might alone is not right. Sometimes it fails even to bring victory. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/04/09/donald-trump-is-the-wars-biggest-loser"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.04.13","day":30,"title":"Donald Trump and Pete Hegseth’s Warped Vision of the Iran War","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.04.13","paragraphs":["The two men might wish that they lived in a world where whoever dropped the most bombs got whatever he wanted. But the war has shown that this isn’t true.","There is no good way to call off a war that you started but which hasn’t achieved what you’d hoped. On Wednesday night, Donald Trump, in his address to the nation on the Iran war, sought to counter reality with hyperbole. “We’ve beaten and completely decimated Iran,” the President said. “Never in the history of warfare has an enemy suffered such clear and devastating large-scale losses in a matter of weeks.” Of course, Iran’s Revolutionary Guard retains control not just of the country but of the Strait of Hormuz, and therefore of an alarmingly constricted global oil supply. A month of air strikes had killed many leaders but had not changed the regime. Even so, Trump suggested th
