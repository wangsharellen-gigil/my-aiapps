(function(){
  try{
    var EMBED={"imported":[{"id":"bee_economist_2025.11.22","day":null,"title":"Welcome to Anything Goes America","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Where the loosening of rules and tolerance of corruption will lead","note":"2025.11.22","paragraphs":["WHEN HARRY TRUMAN left office he had many opportunities to get rich. He turned them down. “I could never lend myself to any transaction, however respectable, that would commercialise the prestige and dignity of the office of the presidency,” he said. The man who had given the order to drop two atom bombs lived on income from his memoirs and an army pension worth $1,350 a month in today’s money.","What a sucker! Had he been president in the 21st century, Truman could now be flying private to paid speaking engagements, soliciting donations to his foundation from foreign governments and watching his daughter serve on company boards and his former staffers run their own lobbying shops. Presidents reflect the mores of their times. Truman’s instinct to follow self-imposed rules was characteristic of 1950s America. What, then, are America’s rules in 2025, when the president has accepted a Boeing 747 from one country seeking his favour and a $130,000 gold bar from another, and when his family has struck cryptocurrency partnerships with foreign governments?","This is the Anything Goes Era in America. It did not start with Donald Trump, but he has upped the tempo and removed constraints that once held others back. Skirting the rules is all right if you have political protection. Wealthy individuals may rest easy knowing that their tax returns will not be audited. The Department of Justice has dropped prosecutions of politicians for corruption. Its public-integrity unit has been gutted; the Foreign Corrupt Practices Act, a post-Watergate piece of good-government reform, has in effect been shelved. Past presidents have pardoned donors and relatives, but only on the eve of leaving office. Recipients of Mr Trump’s clemency this year include a cryptocurrency mogul jailed for money-laundering and the son of someone who gave his political movement $1m.","The way the president’s family members have enriched themselves in his second term would have astonished Truman, but it is small print in a $30trn economy. That is not true of tariffs, export controls and mergers, where Mr Trump’s power and personality make it almost a fiduciary duty for company bosses to seek his good graces. Donors to the new White House ballroom, where the East Wing once stood, include firms whose main business is government contracting and those seeking regulatory approval for mergers.","When there is one decision-maker and he often changes his mind, it is worth spending a lot to win his favour. Washington lobbyists used to focus on Congress. Now many of them ignore lawmakers and instead sell to clients the impression that they can influence the president or his political movement. All this eats away at the rule of law. Did the administration approve a merger, or grant an export licence, because it was in the national interest? Or because the company bought the president’s goodwill? When anything goes, nobody knows.","It is easy for Mr Trump’s opponents to be shocked—shocked!—at the discovery that people love money and power, and that when mixed together they are intoxicating. And his supporters are right that there can be economic benefits when governments refrain from aggressively enforcing some rules. It may make it easier for companies to operate and foreigners to invest, without worrying that an overzealous bureaucrat will nail them for some petty infraction.","Yet this argument can lead somewhere dismal. All advanced economies have strong laws and expectations that they will be applied impartially. There is no example of a big, mature, wealthy democracy smiling on public corruption and treating rules as arbitrary. So although the eventual costs are uncertain, it is plainly harder for an economy to thrive in the long run when the most important question for a boss is: “Do you know the president?”","The best parallels are found in some emerging markets, where big men rule by whim and companies must suck up to succeed. Or in America’s past, before the rules and habits that until recently promoted clean government were set out. But the Anything Goes Era is different from the Gilded Age or the 1920s, both moments when a dash of political corruption went along with technological innovation and economic growth. Then, politicians stole or skimmed money off contracts to buy political support. That is not how it works now. Outright theft from government appears to be rare. The president does not need to buy his party’s loyalty, since the rank and file love him and Republican lawmakers fear him.","There are other differences, too. In the 1920s federal, state and local government spending amounted to just 5% of GDP, compared with 36% now. In the Gilded Age the presidency was even more marginal to the lives of Americans. The republic has had florid political corruption scandals before. What is new is the mix of a bossy, gargantuan state with the perception that it can be bought.","Surprisingly, the president appears to pay a puny political price for his self-dealing, or the loosening of rules that accompanies it. Partisanship means that if Democrats say something is crooked, MAGA types conclude that it must be fine. The other side has enough examples of grubbiness—think of how President Joe Biden’s family took advantage of his position, or the Clinton Foundation received money from Qatar—to make what Mr Trump is doing seem different only in degree.","That is mistaken. And to assume partisanship gives unlimited permission to abuse or suspend rules is too pessimistic. Good-governance reforms have followed each era of excess: the Federal Corrupt Practices Act after the Gilded Age, the Ethics in Government Act after Watergate. Ten years ago a man ran for president denouncing Washington insiders and promising to drain the swamp. That is still one of the great themes in American politics, much more persuasive than warning that liberal democracy is under threat. The president has given his opponents a solid-gold opportunity to use it. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/11/20/welcome-to-anything-goes-america"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2025.11.29","day":null,"title":"What China will dominate next","source":"The Economist","minutes":5,"tag":"Leaders","dek":"The country’s high-speed innovation holds lessons for the world","note":"2025.11.29","paragraphs":["ThOSE WHO worry about how to cope with China’s leadership in technology—and there are plenty of them—think hard about electric vehicles (EVs), solar panels and open-source artificial intelligence. For such people, we have some bad news. This week we report how China is rapidly pressing ahead in two other frontier technologies, autonomous vehicles and new drugs. As these industries spread around the world, they will exemplify the power of Chinese innovation.","China’s progress in each of these important areas has been staggering. A robotaxi revolution is gathering pace, which could reshape transport, logistics and everyday urban life. The country’s autonomous taxis, constructed for a third of the cost of Waymo’s in America, are racking up millions of kilometres of driving and are forging partnerships in Europe and the Middle East. In medicine, meanwhile, China has turned itself from a copycat maker of generics into the world’s second-largest developer of new drugs, including those tackling cancer. Western rivals are licensing its firms’ wares. The day when a pharma giant emerges from China no longer seems so remote.","The rise of both industries says much about how Chinese innovation works. A deep pool of talent, a broad manufacturing base and huge scale combine to propel it rapidly up the value chain. The production of robotaxis has piggybacked on mass ev manufacturing and a dominance in the supply of lidars and the other sensors needed for self-driving; scale has also helped bring down costs. Armies of patients enlisted in clinical trials and profits from generic drugmaking have speeded up pharma innovation.","A more surprising ingredient of China’s success is its nimble and permissive regulators. As in other industries, local governments have offered firms cheap credit and other help. But it is agile rulemaking that has really turbo-charged progress. Soon after political leaders set out their ambition for China to become a “biotechnology superpower” in 2016, the country implemented a number of reforms. The drug regulator’s workforce quadrupled between 2015 and 2018, and a backlog of 20,000 new drug applications was cleared in just two years. The time taken to secure approval for human trials shrank from 501 days to 87. Last year firms in the country ran a third of the world’s clinical trials.","Likewise, China was early to experiment with robotaxis. Local officials, keen to attract talent and investment, approved pilots at a rapid clip and installed sensors and other digital infrastructure to help guide self-driving vehicles; trials have run in over 50 cities. Many have experimented, too, with laws on liabilities and guidelines for testing. Though accidents have sometimes caused a hiatus, pilot schemes have helped engineers and policymakers understand the new technology.","Cut-throat competition at home imposes harsh conditions on individual companies, but the survivors are conditioned into becoming hypercompetitive export champions. China’s robotaxi operators compete with each other and with cheap human-driven taxis in an economy gripped by deflation. New technologies receive subsidies that ultimately come out of the pockets of its underpaid people. Many lossmaking enterprises will not survive the resulting price wars. But those that do will look overseas to make money.","A new wave of Chinese low-cost innovation will therefore wash around the world. It will do so in different ways. China’s cheap medicines could bring benefits, and particularly to the developing world. But for its companies America’s lucrative market, which is the source of 70% of global pharma profits, is the juiciest prize. And China’s importance for the pipelines of Western drugmakers means that the relationship could even be symbiotic. Robotaxis, by contrast, are likely to follow the more usual path for China’s tech exports. They are blocked by America, which has its own industry and acute security concerns, but will probably gain a foothold in other places, where domestic efforts at autonomy lag far behind.","How should the rest of the world respond? The competition risks hollowing out Western economies. Where there is evidence of Chinese dumping and subsidies, counter-measures against Chinese exports are justified and necessary. Where there are security risks action is justified, too. The data collected by robotaxis could pose a surveillance threat; Chinese pharma has suffered corruption scandals. Yet knee-jerk protectionism in the name of security or safety would be a mistake. Blocking or limiting the fruits of Chinese innovation would deprive consumers of the benefits of cheaper and better drugs and transport at a time when voters worry about affordability.","That is why it would be better for Western economies to rethink how innovation works at home. It is tempting to be fatalistic about China’s rise—to conclude that its dominance over the technologies of the future can be achieved only through authoritarian diktats and wasteful handouts, and that democracies therefore cannot follow in its footsteps. But the inventiveness of China’s private sector and agility of its regulators have been crucial ingredients, too. Here, alas, the West is going in the wrong direction.","America has scale and the deep pockets to compete. But in many states, particularly Democratic ones, regulators are blocking or stalling autonomous vehicles. The government is waging war on universities and cutting funding for basic research. As in other Western countries, it is hostile to immigrants, including gifted ones. In drugs, as China’s share of clinical trials has risen, Europe is losing ground. Its economies desperately need to integrate further so that they can finance and develop new technologies. There too, regulators often prize safety at the expense of risk-taking and experiment.","Nothing says that China must own the future. But if the West wants to compete in self-driving cars and medicine, let alone EVs, solar power and other vital technologies, it must learn the right lessons from China’s rise. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/11/27/what-china-will-dominate-next"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2025.12.06","day":null,"title":"How AI is rewiring childhood","source":"The Economist","minutes":6,"tag":"Leaders","dek":"The technology presents dazzling opportunities—and ominous risks","note":"2025.12.06","paragraphs":["CHRISTMAS STOCKINGS may contain more surprises than usual this year, as children open presents that can talk back. Toymakers in China have declared 2025 the year of artificial intelligence (AI) and are producing robots and teddies that can teach, play and tell stories. Older children, meanwhile, are glued to viral AI videos and AI-enhanced games. At school, many are being taught with materials created with tools like ChatGPT. Some are even learning alongside chatbot-tutors.","In work and play, AI is rewiring childhood. It promises every child the kind of upbringing previously available only to the rich, with private tutors, personalised syllabuses and bespoke entertainment. Children can listen to songs composed about them, read stories in which they star, play video games that adapt to their skill level and have an entourage of chatbot friends cheering them on. A childhood fit for a king could become universal.","It is a future filled with opportunities—and hidden traps. As real kings often discover, a bespoke upbringing can also be a lonely and atomised one. What’s more, as their subjects often find out, it can create adults who are ill-equipped for real life. As AI changes childhood for better and for worse, society must rethink the business of growing up.","Being reared by robots has advantages. Tech firms are already showing how AI can enhance learning, especially where teachers and materials are scarce. Literacy and language-learning have been boosted in early trials. The dream is that, with an AI tutor, children can be saved from classes pitched to the median, in which bright pupils are bored and dim ones are lost. If you want a version of this leader for an eight-year-old Hindi-speaker, AI can rewrite it; if they would prefer it as a cartoon strip or a song, no problem.","Technology is creating new forms of fun, too. Hollywood may dismiss AI videos as “slop”, but young people are devouring them and making their own. Old toys are being upgraded: an AI-powered edition of “Trivial Pursuit” can pose questions on any topic. Video games are creating novel experiences, such as chatting to Darth Vader in “Fortnite”. Any child can meet their heroes (and shoot them).","There are well-publicised risks in letting children loose on an evolving technology. AI tutors may hallucinate wrong answers. Toys can go off the rails: parents should check stockings for the AI teddy that was recently found to have spiced up its chat with talk of kinky sex. Children can easily misuse AI, to cheat at homework or harass each other with “deepfake” videos. Chatbots can coax vulnerable adolescents into harming themselves. Tech firms insist these stumbling blocks can be fixed; ChatGPT is only three years old.","Yet childhood may be disrupted most radically by things that AI does when it is behaving as intended. The technology quickly learns what its master likes—and shows more of it. Social-media feeds have already created echo chambers where people see only views they agree with (or love to hate). AI threatens to strengthen these echo chambers and lock children into them at an early age. The child who likes football may be told football stories by his teddy and given footballing examples by his AI tutor. Not only does this stamp out serendipity. A favourites-only diet means a child need never learn to tolerate something unfamiliar.","One-sided relationships with chatbots present a similar risk. AI companions that never criticise, nor share feelings of their own, are a poor preparation for dealing with imperfect humans. A third of American teenagers say they find chatting to an AI companion at least as satisfying as talking to a friend, and easier than talking to their parents. Yes-bots threaten to create children not used to taking turns, who grow up into colleagues unable to compromise and partners unfamiliar with the give-and-take required in a relationship.","Other trends are pushing in the same direction. As birth rates crash, fewer children are growing up with siblings to smooth their sharp edges. Rising numbers of young adults are deciding that long-term romantic relationships are not worth the hassle. Remote work means that people who grow up in a personalised, asocial world can slip into jobs where they interact with colleagues only through screens—a chore they may soon delegate to an AI agent.","Some basic counter-measures are urgent. Parents should think twice before entrusting their child to a word-regurgitation machine, whether it is sewn into a bear or not. Chatbots should have age restrictions that are properly enforced; governments should not give ai firms the leeway they gave social networks, which are only now being cajoled into age-gating. Teachers are kidding themselves if they think essays written at home can any longer be trusted. In the age of AI, more in-school assessment is essential.","The longer-term challenge is to think deeply about how to preserve the socialisation that AI could rub out of children’s lives. Schools, where much of childhood plays out, are the best place to do this. They should take advantage of personalised tuition where it is proven to work. But they must also redouble efforts to teach things that a robot can’t: to debate, to disagree and to get along with—perhaps even to appreciate—people who are not as sycophantic as a chatbot.","Schools should also enhance their role as centres of discovery. If AI is giving children more of what they want, it is more important that schools provide chances to meet people and encounter ideas that lie outside their experience. Algorithmic personalisation threatens to be a powerful barrier to social mobility if it nudges people to stay in the lane in which they start out. Inequality could widen if poor schools merely embrace chatbots as cheap substitutes for human teachers.","AI shows undeniable potential to improve education and enrich entertainment. It may one day let every child live like royalty. But the truly privileged may be those whose parents and teachers know when to turn it off. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/12/04/how-ai-is-rewiring-childhood"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2025.12.13","day":null,"title":"Can anyone stop Europe’s populist right?","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Apocalyptic warnings by mainstream politicians are doomed to fail","note":"2025.12.13","paragraphs":["FOR THE respectable men running western Europe’s three biggest countries, misery is heaped upon misery. All are presiding over stagnant living standards and declining global influence. In Britain and France their rivals from the populist right are itching to take power (even the Alternative for Germany, or the AfD, may win a couple of state elections next year). And America, their key ally, has just accused them of hastening Europe towards what it calls “civilisational erasure”.","Those three leaders also warn of a catastrophe—if the parties of the populist right should triumph. Friedrich Merz, Germany’s chancellor, describes his government as centrism’s last chance. After his coalition lost European elections last year, Emmanuel Macron, the French president, spoke about the danger of civil war. This month Britain’s prime minister, Sir Keir Starmer, told The Economist that Reform UK was a challenge to “the very essence of who we are as a nation”.","The doctrines of the populist right do indeed contain much to condemn. Yet talking about them in apocalyptic terms is doomed to fail. For their own sake, and for the good of their countries, mainstream politicians and their supporters urgently need a different approach.","For one thing, all this doom-mongering smacks of an attempt to draw attention away from their own failures. In Britain, after 14 stagnant years under the Conservatives, Sir Keir’s Labour government is spending more on welfare and will impose record taxes even as rapid growth eludes it. In France Mr Macron’s law raising the state pension age has been ditched, as his fifth prime minister in three years inches a budget through the National Assembly. In Germany Mr Merz’s plan for an “autumn of reforms” came to almost nothing. If the fate of Europe is at stake, why aren’t its leaders getting more done?","For another thing, their threats are not credible. Some populist-right administrations are dangerous, others are not. Giorgia Meloni has run Italy much as a conventional politician would. Reform councillors in Britain have so far been fairly normal. True, Viktor Orban’s party captured and milked Hungary’s institutions, but it may soon be booted out. That doesn’t sound like the death of democracy.","No wonder that predicting calamity is not working. As the populists’ strength in opinion polls makes clear, a huge number of European voters simply do not believe what they are being told. Meanwhile the elites, alive to the ebb and flow of power, are cosying up to the populists they once shunned. Jordan Bardella of National Rally has been quietly meeting French business leaders. Tory politicians are defecting to Reform, bringing Nigel Farage badly needed legislative and ministerial experience. Only in Germany does the mainstream rule out working with the AfD. Its MPs, the second-largest group in parliament, are even banned from Bundestag vice-presidencies.","All this helps explain why the strategy of demonisation is self-defeating. Mainstream politicians say they defend tolerance and working people, but when they dismiss a large part of the electorate as bigots, they come across as intolerant and smug. And when they warn that populism will destroy their vision of what Europe should be, it encourages those voters who are desperate to shake things up.","If demonisation is failing, what is the alternative? The answer starts with that impatience for change which the populist right harnesses so successfully—and which this newspaper shares. The next step is to scrutinise how likely the populists are to jolt Europe out of its complacency. Engagement can improve bad policies if populists are willing to change them—and if they refuse, it exposes their folly.","The most promising populist project is the economy. When National Rally, Reform and the AfD speak to businesses, they focus on deregulation at both the national level and, for France and Germany, in Brussels. They say they want leaner government and lower taxes. They look to the power of technology. And they complain that the state penalises initiative and risk-taking while spending too much on welfare.","All that is welcome, but it is only half the story. For Britain, France and Germany, European economic integration is the most obvious source of growth. Yet the populists are set on a collision course with the European Union, which would lead to growth-destroying degradation of the single market. The fiasco of Elon Musk’s DOGE shows how hard it is to shrink the state well. Mr Bardella wants a wealth tax and was opposed to raising the pension age. After criticism for fantastical spending pledges, Mr Farage now promises more realistic budgeting, but details remain elusive.","On other issues, populists latch onto discontent, but propose solutions that are foolish. Many Europeans worry about immigration, fearing that it will harm public services and change national cultures. But populists, and America’s warnings, are out of date: legal immigration has peaked and, with the exception of Britain, illegal immigration into Europe is half what it was in 2023. The populists are also cruel. Talk of mass deportation or language designed to make immigrants feel despised is xenophobic.","Most Europeans do not worry about geopolitics, but they should. At a time when America is ever-less willing to lead the collective defence of Europe, populists echo Donald Trump’s dangerous belief that the continent will be safer if it is less united, and if each state pursues its national interests. They also show a blinkered weakness for the autocrats in Russia and China. Vladimir Putin must be cheering them on.","National elections are 18 months away in France, due in March 2029 in Germany and as late as August 2029 in Britain. Much can change in that time. If mainstream politicians spend it shrilly demonising populists, they will doubtless make themselves feel better, but they will not help their countries. They would be wiser to subject governments-in-waiting to the democratic scrutiny they deserve. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/12/11/can-anyone-stop-europes-populist-right"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2025.12.20","day":null,"title":"China proved its strengths in 2025—and Donald Trump helped","source":"The Economist","minutes":5,"tag":"Leaders","dek":"It was a good year for Xi Jinping","note":"2025.12.20","paragraphs":["THE BIG noise in 2025 has been President Donald Trump. Launching a barrage of executive orders, he directed his fire at target after target. With the aid of Elon Musk, he attempted to dismantle the federal bureaucracy. On “Liberation Day” he rewrote the rules of trade. Around the world he imposed peace and threatened war.","However, the big beneficiary has been President Xi Jinping. This year China defied Mr Trump’s attempt to use tariffs to force a show of submission. By turning the tables, Mr Xi revealed just how much America actually depends on his policies. In this round of the superpowers’ fight for 21st-century supremacy, it was a victory for China.","This year showed the power of China’s industrial chokeholds. China’s share of the world’s manufacturing value added exceeds one-third, giving it the power to disrupt global supply chains overnight. In green technology, Chinese firms supply the materials, components and finished goods for 60-80% of solar panels, wind turbines and electric vehicles. DeepSeek showed what China can do in artificial intelligence, despite America’s best efforts to hobble it. China’s drug firms now run nearly as many clinical trials as their American peers—and do them faster. Two decades ago Western firms invested in China to take advantage of its cheap producers and huge market. Today they build laboratories there.","In 2025 Mr Xi showed he is willing to use China’s dominance as not just a source of wealth, but of power. His restrictions on rare-earth exports are one example of how China can use other countries’ dependency as a weapon. Findings this month from the Australian Strategic Policy Institute show that China leads in research in 66 of 74 fields, measured by its share of key scientific papers. These include over two dozen areas, such as computer vision and grid integration, where it has a chokehold.","The extraordinary thing is that Mr Trump has played into Mr Xi’s hands, both with his tariffs abroad and his wrecking-ball at home. Choosing bilateral tariffs as a way to inflict pain on China was a mistake. Partly because Chinese firms are used to harsh conditions and partly because China is not a democracy, its economy is better at enduring pain than America’s. Mr Trump could instead have co-ordinated a commercial encirclement of China by integrating more deeply with America’s allies. Foolishly, he preferred to alienate them with tariffs.","Likewise, Mr Trump’s attack on science will impede American innovation. He has targeted researchers, cancelling grants and withholding billions of dollars in funding to institutions that he does not like. Framed as an effort to eliminate inefficiency and woke ideology, his efforts have curbed financing for vital research. His hostility to foreign scientists, especially ethnic Chinese ones, is part of a more general assault on immigration. Talented people will either leave America or choose not to move there. China has already benefited.","The question is where this leaves the superpowers. In the short run, the advantage is surely with China. America and its allies cannot soon deprive it of its chokeholds. Should Mr Xi choose to throttle Taiwan, America and its allies may find that sanctions intended to force China to back off will trigger reprisals that cause more harm than their industries and citizens are willing to bear. That would have grave implications for East Asian security, and for America’s role in the western Pacific.","In the longer run, China’s dynamism could be stifled by its rigid politics. To see why, consider its economy. Factory-gate prices were 2.2% lower in November than a year earlier, and have declined for 38 months in a row. Property prices in the secondary market are more than 20% below their peak and still falling. Although the party has pledged to stimulate domestic demand next year, it will also double down on strategic manufacturing—the very thinking that has mired it in overcapacity.","By the end of 2026 that may seem like hubris. As provinces and cities struggle to pay down debt, stagnation could become even more entrenched, a bit like Japan’s lost decades. Deflation could worsen if countries unwilling to lose their own industries block more of China’s cut-price exports. Yet as Mr Xi prepares to start a fourth term in charge in 2027, his underlings seemingly cannot or will not challenge him.","In China the bigger the mistake, the less willing the party is to change course. By contrast, America has change built in—indeed MAGA’s bent for deregulation and its impatience with the suffocating effects of elite political correctness were examples of that principle in action. Whereas China is an ethno-nationalist state in which people who are not Han Chinese struggle to be accepted, America is founded on universal values that speak to every race and creed. These values have long made America a magnet for talent and enhanced its global influence. In the past they have also bound together its alliances.","In theory, all that should be the basis for renewal. However, Mr Trump scorns universal values as gimmicks exploited by cynical foreigners. Oppression does not shock him: he admires iron-fisted rulers, especially when they are also rich. As his recent National Security Strategy showed, MAGA sees ethnic and religious diversity as a threat, not a source of strength. If America is just one more ethno-nationalist project like Russia or China it will squander its greatest advantage.","Ideally, this would mean that the hopes of renewal will burn bright. The question is how much Mr Trump’s corruption of public life, his administration’s vindictiveness towards those in public service and his diminishment of Congress will dim America’s prospects. Mr Xi will be watching. ■","Subscribers to The Economist can sign up to our Opinion newsletter, which brings together the best of our leaders, columns, guest essays and reader correspondence.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/12/18/china-proved-its-strengths-in-2025-and-donald-trump-helped"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2025.12.27","day":null,"title":"China proved its strengths in 2025—and Donald Trump helped","source":"The Economist","minutes":5,"tag":"Leaders","dek":"It was a good year for Xi Jinping","note":"2025.12.27","paragraphs":["THE BIG noise in 2025 has been President Donald Trump. Launching a barrage of executive orders, he directed his fire at target after target. With the aid of Elon Musk, he attempted to dismantle the federal bureaucracy. On “Liberation Day” he rewrote the rules of trade. Around the world he imposed peace and threatened war.","However, the big beneficiary has been President Xi Jinping. This year China defied Mr Trump’s attempt to use tariffs to force a show of submission. By turning the tables, Mr Xi revealed just how much America actually depends on his policies. In this round of the superpowers’ fight for 21st-century supremacy, it was a victory for China.","This year showed the power of China’s industrial chokeholds. China’s share of the world’s manufacturing value added exceeds one-third, giving it the power to disrupt global supply chains overnight. In green technology, Chinese firms supply the materials, components and finished goods for 60-80% of solar panels, wind turbines and electric vehicles. DeepSeek showed what China can do in artificial intelligence, despite America micks exploited by cynical foreigners. Oppression does not shock him: he admires iron-fisted rulers, especially when they are also rich. As his recent National Security Strategy showed, MAGA sees ethnic and religious diversity as a threat, not a source of strength. If America is just one more ethno-nationalist project like Russia or China it will squander its greatest advantage.","Ideally, this would mean that the hopes of renewal will burn bright. The question is how much Mr Trump’s corruption of public life, his administration’s vindictiveness towards those in public service and his diminishment of Congress will dim America’s prospects. Mr Xi will be watching. ■","Subscribers to The Economist can sign up to our Opinion newsletter, which brings together the best of our leaders, columns, guest essays and reader correspondence.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/12/18/china-proved-its-strengths-in-2025-and-donald-trump-helped"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.01.02","day":null,"title":"The Great Mystery of Drumming","source":"The Atlantic","minutes":8,"tag":"The Atlantic","dek":"It’s about the flow of Time, not just keeping the beat.","note":"2026.01.02","paragraphs":["by James Parker","Dave Grohl of Nirvana and Foo Fighters, one of the few drummers to become a real rock star (Illustration by Liz Hart*)","Full disclosure: I play the drums. I play them every chance I get. Although my drumming career has served mainly as a steady education in my own shining mediocrity as a drummer, a reminder that I was put on this Earth for other things, I love hitting the goddamn drums. Left foot on the hi-hat pedal, right foot on the kick-drum pedal, left hand on the snare, right hand on the ride cymbal. When it starts to flow, you’re like da Vinci’s Vitruvian Man: You’re in a holy circle of equilibrium, blissfully distributed, with consciousness diffused to your extremities.","How do you get better as a drummer? Well, you practice: You do the same thing over and over, slowly building muscle fiber while also experiencing, in your brain, the painless, clueless ache of a synapse trying to form. You get better by being in a band, by entering music as part of a volatile, multi-person, multi-addiction organism. And you get better, lastly, via the drummer’s version of the grace of God—which is the jolt, the volt, the heavenly bolt, the electromotive impulse that flashes out from the playing of another, much greater drummer, and claims you.","John Lingan’s superb Backbeats: A History of Rock and Roll in Fifteen Drummers is full of such moments. Moments of transmission—often via vinyl, occasionally in performance—when the creative spark zips and snaps across the pre-artistic darkness and some young drummer somewhere realizes that he’s going to have to change his life. Dave Lombardo, pre-Slayer, listening in awe to Phil “Philthy Animal” Taylor pummeling through a relentless double-kick-drum pattern on the title track of Motörhead’s Overkill. Jody Stephens, pre–Big Star, in the 17th row at a Led Zeppelin show in Memphis: John Bonham was “like a rocket, everyone else was just holding on.” Tony Thompson, pre-Chic, watching the Mahavishnu Orchestra: “I saw Billy Cobham for the first time—and saw God … It’s still embedded in my soul seeing him play like that.”","The drummer James Osterberg, before he became Iggy Pop, was infatuated with the bluesy playing of Sam Lay. (You can hear Lay’s ghostly snare taps on Howlin’ Wolf’s “Little Red Rooster”; you can also hear him, four years later, tearing through the anarchic-ironic shuffle of Bob Dylan’s “Highway 61 Revisited.”) Osterberg made a young man’s picaresque pilgrimage from Ann Arbor to Lay’s house in Chicago. “His wife was very surprised that I was looking for him,” he tells Legs McNeil and Gillian McCain in Please Kill Me: The Uncensored Oral History of Punk. “She said, ‘Well, he’s not here, but would you like some fried chicken?’ ”","My own little drum crisis/awakening came at the hands (and feet) of Dave Grohl, pre-Nirvana, when I saw him playing with the Washington, D.C., hardcore-punk band Scream. Grohl—skinny, 19 years old—was all attack, all emphasis. He drummed in italics. Simultaneously, there was something subliminal and almost unspeakable about his playing; as devastatingly correct as it was, he also seemed to be pulling information from a rhythmic grid more profound, more capacious, than the mere ticktocking of accurate time.","Because this is the great mystery of drumming: Time. Not just tempo, not just keeping the beat—the guitarist and the bassist can do that—but the drummer’s musical relationship to the flow of Time itself. To the passing of all things, to the universe’s rumble toward infinity. John Bonham’s left foot on the hi-hat pedal—shick-shick-shick—has the cadence of Deep Time. It’s Bonham’s neurological signature: a lilt, an inflection, a swing that microscopically delays or distends the beat while also fulfilling it. Listen to “Whole Lotta Love,” around 1:18, the start of the freak-out section. Listen to that hi-hat going up and down, up and down. Bonham, steady as he is, is not keeping time. He’s releasing it.","John Bonham and Jimmy Page of the New Yardbirds perform in Denmark in September 1968, a month before the group was reborn as Led Zeppelin. (Jorgen Angel / Redferns)","His own rumble toward infinity was brief, fiery, and pocked with shadow. Lingan pairs him with the Who’s Keith Moon: “Their drumming was an accurate reflection of each of their personalities—they were loud, they were destructive, they hurt and endangered people, and they both died young and violently from self-abuse.” Here I think I might respectfully disagree. In both cases, the drumming, the art, transcended the personality.","Grohl and Bonham get a chapter each in Backbeats, as does—to my great delight—Earl Hudson from Bad Brains, a low-key powerhouse whose playing steered the shamanic flights of his brother, the band’s front man, H.R., through the ether. The great session man Hal Blaine is also featured, and Clyde Stubblefield from James Brown’s the J.B.’s, the author of the “Funky Drummer” beat that’s since been looped through a thousand hip-hop tracks.","To nondrummers, many of these figures will be obscure. (One main counterexample is Grohl, who made himself a real rock star as the guitarist-vocalist of Foo Fighters.) This is largely the drummer’s fate: to be felt but not seen. And this is the ambition of Lingan’s book—to tell a story of rock-and-roll evolution from the back, from the bowels, from the under-realm of the creator-drummers. How have drummers responded to the increasing power and complexity of the music? How have they themselves increased that power and complexity? By the time we get to Dave Lombardo and Slayer’s Reign in Blood, we are in a zone of Darwinian mutation, as Lombardo pulls off feats of speed and dexterity unimaginable—and probably terrifying—to his drumming forebears.","The sole female among Lingan’s 15 selected drummers is Moe Tucker, of the Velvet Underground. Self-taught, self-willed—“I consciously, purposely, didn’t learn more about drums because I didn’t want to sound like anybody else”—Tucker fused steely minimalism with raw, repetitive impact. If any rock-and-roll drummer could be said to have made their drums drone, it’s her. No crashing cymbals for Moe Tucker: not for her, the big-top vulgarity of those metallic exclamation points. And sometimes no downbeat—the ferocious shuffle she plays on “Run Run Run” is on the snare alone, its clattering, unmoored momentum working like a propellant on Lou Reed’s storytelling. Ka-chunk-a-CHUNK-a-chunk-a-CHUNK … The addicts are fiending around New York City, looking for a fix, a drag, a taste, anything. Maybe this was Tucker’s special compact with Time—Time as narrative; Time as unfolding drama.","Moe Tucker of the Velvet Underground, known for fusing steely minimalism with raw impact to produce her signature drone (Gijsbert Hanekroot / Redferns)","And one last thing about Time: Of all the members of the band, it comes for the drummer first. Guitars get heavier as you get older, high notes harder to hit, but the drummer pays a private tax to mortality. The drummer’s strength goes faster. Exactly how fast depends, to a degree, on the music. Metal drumming is famously punishing, and high-speed punk rock, as Lingan writes, “has always survived on heroic drumming. Someone has to sustain that pulse.” But even the mid-tempo drummer will have their moments of naked endurance. A 2008 study of Blondie’s Clem Burke revealed that, during live sets, he played with the stamina of an athlete, burning about 600 calories over the course of an 82-minute show. Many bands, when they re-form for their 20th- or 30th-anniversary tours, have a new man, younger and stronger, on drums.","From the November 2015 issue: James Parker on the twilight of the headbangers","So what’s a jowly old superannuated drummer to do? How do you stay on that drum stool and keep playing that funky/punky/heavy/wicky-wacky whatever-it-is? Well, you stop thrashing. You move more precisely; you breathe more deeply; you manage your force more shrewdly. You measure the dosage of power in every stroke. You use, in a word, technique. It’s like life.","* Lead-image source: Kevin Nixon / Classic Rock Magazine / Future Publishing / Getty","This article appears in the January 2026 print edition with the headline “Respect the Drummer.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/01/rock-music-history-drummers/684955/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.01.02","day":null,"title":"Shop Like a Supervillain","source":"Wired","minutes":7,"tag":"Wired","dek":"","note":"2026.01.02","paragraphs":["Dry Ager","Shop at","Dry Ager","While Buffalo Bill liked to “store” his victims for later in the bottom of a well, Hannibal generally preferred to dig in right then and there (just ask Paul Krendler). But when he demands the most tender possible cuts for his guests, we expect only dry aging will do. This high-class meat store combines ancient dry-aging methods with state-of-the-art humidity-controlled technology to take the effort, risk, and odor from hanging meats, all from a plug-and-go appliance. The result is a blackened steak with thick crust—but cut away the exterior and you’ll be rewarded with the most tender, buttery piece of meat imaginable. Price on request.","Dragon Riot","Amazon","Whether you’re looking to spatchcock a chicken, debone a carcass, or neatly remove your own polydactyly finger, these poultry shears will effortlessly cut through gristle and bone. With non-slip micro-serrated German stainless steel blades they’re easy to wield, the non-slip ergonomic grip and lockable blades prevent unwanted accidents, and while they’re dishwasher safe, keep in mind that blood stains are easier to remove with cold water.","Bialetti","Amazon","WIRED is fully aware that Mads Mikkelsen’s Lecter used a gloriously expensive $22,000 Royal Coffee Maker. Sadly, it doesn’t come in red, so here’s a beautifully simple, hugely effective stovetop espresso maker from alternative coffee royalty Bialetti. It works just like the classic Moka Express, but the collector is replaced by a plate with room enough for two espresso cups. Although in Lecter’s kitchen, you’re doing well if you make it past dessert…","Riedel","Amazon","Williams Sonoma","Sur La Table","If you’ve gone to the trouble of cooking liver and fava beans, that nice chianti had better be aired to perfection. Launched in 2006 to celebrate the 250th anniversary of both Riedel and Mozart, this hand-blown decanter is shaped like a lyre—a lute-style stringed instrument—and pours deliciously. Handmade using the finest clear crystal glass, it holds a single bottle of wine within a curved shape that helps to naturally capture any sediment without the need to add filtration.","Wüsthof","Amazon","Williams Sonoma","Sur La Table","Dr. Lecter enjoyed the versatility of his unserrated Spyderco Harpy knife, but when the guests arrive he’s going to want something a little less murderous on the kitchen counter. Now available in a red wine-inspired shade of Tasty Sumac, this classic knife set and oiled ash block from Wüsthof features riveted handles, full-forged stainless steel blades with a Rockwell Hardness Scale rating of 58, and classic precision-cut focused blade grind-angle of 29 degrees.","Sirman","ACityDiscount","When you “prefer to eat the rude” nothing prepares them for the plate as elegantly as this 132-pound example of flesh-slicing perfection. Sirman’s polished and painted aluminium manual flywheel slicer has a 12-inch blade and patented motion system that has no visible mechanical parts, while its double-articulating arm holds your victim cured meat securely in place. It’s easy to clean, disassembles without the need for tools and, despite the retro aesthetic, is an all-modern design for demanding, precision butchery.","Pro-Ject","Turntable Lab (Pre-order)","Few people realise that the $640 million in negotiable bearer bonds Hans so desperately wanted was needed to fund his vinyl addiction. It’s a financial pain analog enthusiasts know only too well, but turntable stalwarts Pro-Ject have at least found a way to keep, and restore, a priceless collection. This dedicated vinyl-flattening machine features two 12-inch sized hot plates that heat and press any precious-but-warped long players back into shape. It maintains a temperature of 136.4°F (58°C) and gently irons out those unwanted wobbles.","écoute","écoute","In 1988, George Michael’s album Faith ruled the US charts, but something tells us Hans Gruber wasn’t about to be whistling “I want your sex” in a Nakatomi Plaza elevator. It’s classical all the way—”Ode to Joy” in this case—and to make the most of Beethoven’s final symphony, he’ll be wanting a pair of headphones with a rich, traditional playback. These stylish ANC-enabled hybrid Bluetooth cans feature the latest voice control and digital wizardry, but sonic duties are handled deftly through a built-in vacuum tube preamp that offers traditional analog warmth and rich midrange.","Vicoustic","B&H","With Bach’s Brandenburg Concerto No. 3. on heavy rotation—that and a proclivity for semi-automatic weapons—Gruber’s tastefully decorated apartment would benefit from a little audio control. This bi-dimensional diffusion panel provides audio multi-reflection on both vertical and horizontal planes, and works especially well on mid and high frequencies, helping to enhance musical definition. Each panel measures 23.4 x 23.4 x 5.8 inches and can be installed easily by any blond henchman.","T+A","House of Stereo (Turntable)","House of Stereo (Receiver)","Hailing from precision German audio engineers T+A, we consider this slick setup the perfect cold-steel color-match for Hans' (and Arafat’s) John Phillips suit. The belt-driven turntable has an MC-2 moving coil cartridge and a crystal-controlled synchronous motor for exceptional stability, while the decidedly retro-modern all-in-one features a precision CD drive, FM/DAB/internet radio, a 25-watts-per-channel AB amplifier, and comprehensive G3 streamer with native DSD playback and a quadruple PCM DAC with eight 32-bit Burr-Brown chips, ensuring exceptional sound quality.","Cassina","Design Within Reach","As an iconic Euro Villain, Hans Gruber’s choice of chair would be of equally high standing, and as utterly uncompromising as the man himself. Designed by Le Corbusier, Pierre Jeanneret, and Charlotte Perriand in 1928, the LC2 Armchair combines generously proportioned cushions and a tubular chrome frame to create an instantly recognizable piece of furniture. Shown here in classic black Scozia leather, the chair is said to embody the principles of rationalism, which rather aptly deal with order, structure, proportionality, and symmetry, while rejecting unnecessary detail or overly emotional design. That’s so Hans!","Transparent","Transparent","Weighing a hefty 26.5 pounds and standing at more than 23 inches tall, this Brutalist architecture-inspired speaker is made from 70 percent post-consumer recycled aluminum. Inside, there’s a 6.5-inch side-mounted woofer and dual 3-inch tweeters, placed rather strikingly at elevated 90-degree angles. It’s a bold audio offering, but with up to 24-bit/192-kHz hi-res, Wi-Fi, Bluetooth 5.3, AirPlay 2, Tidal Connect, and Spotify support it would have made the perfect farewell gift for Hans, when he was kindly asked to leave Volksfrei, his old West German terrorist group.","Alpacka","Shop at","Alpacka","Bouncing down rapids in a 5.5-pound inflatable packraft might not compare to a “dance with the devil in the pale moonlight,” but if he needs a distraction from taunting Batman, maybe the Joker could take a paddle. We’re not sure if Gotham River has any white water, but at least he’ll be prepared with this nylon-hulled craft designed for beginner and intermediate paddlers and rated for up to Class III waters. And, even if he does fall out, the self-bailer automatically drains any water that gets in, so he won’t need to come ashore. Price varies.","Shop at","H Henriksen","The Joker loves his razor-sharp playing cards, acid flowers, and cyanide pies—but he secretly craves just a few of Batman’s toys. Now he can join in the wall-scaling fun with the Grapnel Launcher, which can shoot a rope and grappling hook up to 115 feet, or 53 feet with a rope ladder. This device for first responders isn’t sold to the public, so he’ll have to pull some strings. Price on request.","iStyles","When you really need to get a message out of Arkham Asylum and you can’t find a convict willing to have a phone stitched inside them, try a drone like the virtually uncrashable DJI Mavic 3. The Joker can dress up his stock quadcopter with a set of laser-cut, color-matched, UV-resistant, and goo-free stickers from iStyles.","Muc-Off"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.01.03","day":null,"title":"The truth about affordability","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Voters in rich countries are angry about prices. Politicians could make things worse","note":"2026.01.03","paragraphs":["SLOP, PARASOCIAL and rage bait were contenders for word of the year in 2025. In 2026 an early favourite for that title, at least among pollsters and election strategists, is “affordability”, often paired with the word “crisis”. Having at last found a slogan that seems to work against the spell of Trumpism, Democrats will talk of little else between now and the midterms in November. In Europe, which is better at reposting American memes than coming up with fresh ones, there is talk of a cost-of-living crisis. A transatlantic consensus is forming that prices are out of whack. But are they?","Affordability is a fuzzy term that can mean whatever feels true. Telling people to stop complaining and be happy with their lot—the Marie Antoinette strategy—is not working for a White House where the tone and decor increasingly resemble Versailles. Maddeningly, voters want contradictory things: low prices when they shop, high wages for themselves; not many immigrants but lots of cheap labour; rising house prices when they own and lower ones when their children want to buy.","Successful economies are filled with tensions like these. Politicians will naturally say what polls well to win elections. If the only downside of the affordability story were that voters punished incumbents for high prices, that would not be so bad. Yet if the problem is misdiagnosed, the risk is greater that harmful policies will be introduced to “fix” it.","That is because talk of an affordability crisis mixes phantom concerns with real ones. Start with the imagined problems. People are sensitive to the prices of things they buy all the time. A gallon of milk cost $3 in American stores in January 2019 and now costs $4. Food prices have shot up in Europe too, as have energy prices. However, wages are growing faster than prices up and down the income spectrum on both sides of the Atlantic. In this sense there is no affordability crisis. Besides, nobody should really want prices to return to 2019 levels. If that were the goal, policymakers should seek to imitate Greece after its debt crisis, when it suffered depression and deflation.","There is more to the affordability story than the price of milk or electricity, though. As societies grow richer, the share of spending on goods shrinks and spending on services increases. When Donald Trump was born, 60% of America’s household consumption went on goods. Now the share is below 40%, while that spent on services has risen. Many people have forgotten how long their parents once had to save to buy a tv, and so do not appreciate the globalised supply chains that have made goods so much better and cheaper.","Meanwhile they are shocked by how expensive a haircut is now, let alone child care. Although both goods and services are included in inflation numbers, services remain stubbornly resistant to the huge productivity gains seen in manufacturing. In the euro zone the affordability conundrum in services presents itself in a different way. Because the prices of services such as health care and home rental are more regulated, the problem is availability more than affordability, and it is often solved by queuing—which does not feel good, either.","That is the first true affordability problem. The second is that though real wages have indeed risen, they have not gone up as fast as assets have. The wealth-to-GDP ratio is close to an all-time high in America. To think through the effects of this, picture two people who earn identical salaries that place them in the top 10% of earners. They have a standard of living that robber barons or monarchs of a bygone era would envy.","Then imagine one of these people also inherited $1m ten years ago. Had this lucky one put the money in the S&P 500, they would now be sitting on $4m. When these two people want to buy a car or a phone, this is not a problem. Ford or Apple can make an additional unit and sell it at the same price. When they want to buy positional goods, such as an apartment in San Francisco with a nice view, they are in competition. For one of them, this feels like an affordability crisis.","These are fundamentally problems of affluence, not of economic malaise. That makes them tough for policymakers to solve. To bring down the prices of housing and energy, for example, governments need to make it easier to build more homes and wind farms. Almost everyone favours this—but only in someone else’s backyard. Prices of services in America are inflated by absurd occupational-licensing rules—which licenced florists and hairdressers fiercely defend. Lowering tariffs would slow inflation, but firms protected by tariffs lobby strenuously for their preservation.","Enacting sensible policies is hard and even countercultural in a world that has, at America’s insistence, turned against free markets and international trade. The danger is that politicians reach for pseudo-fixes that make things worse, such as price controls. Also, in 2026 the American economy will see a fiscal boost from tax cuts, and the Fed will be under political pressure to cut interest rates. President Trump proposes sending out $2,000 cheques to taxpayers, funded by revenue from tariffs. It is hard to think of a combination of policies better designed to raise prices than to place new taxes on imports and then give people free money with which to buy them. It seems that the economic lessons that were learned in the 1970s, when Richard Nixon introduced price controls—and then abandoned them—must be relearned. That could be painful.","Once stories about the economy take hold they can be hard to shift. For the past decade America has told itself one about how blue-collar workers were left behind by coastal elites and then rose up in a populist rebellion. The data say this is not true: the real wages of non-college-educated workers were rising in 2016, when Mr Trump was first elected. They have kept rising since. Yet this tale has been used to justify an array of self-harming economic policies. The affordability crisis could become another story which, repeated often enough, is accepted as truthy—facts be damned. That makes it a trap. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2025/12/30/the-truth-about-affordability"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.01.05","day":null,"title":"What Zohran Mamdani Is Up Against","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.01.05","paragraphs":["When the thirty-four-year-old socialist is sworn in as mayor, he will have to navigate ICE raids, intransigent city power players, and twists of fate and nature.","By Eric Lach","Photo illustration by Cristiana Couceiro; Source photographs from Getty","According to the New York City Department of Records and Information Services, Zohran Mamdani will not actually be the city’s hundred-and-eleventh mayor, as many people have assumed. A historian named Paul Hortenstine recently came across references to a previously unrecorded mayoral term served in 1674, by one Matthias Nicolls. Consequently, on New Year’s Day, after Mamdani places his right hand on the Quran and is sworn in at City Hall, he will become our hundred-and-twelfth mayor—or possibly even our hundred-and-thirty-third, based on the department’s best estimates. “The numbering of New York City ‘Mayors’ has been somewhat arbitrary and inconsistent,” a department official disclosed in a blog post this month. “There may even be other missing Mayors.”","New York City has already had youthful mayors (John Purroy Mitchel, a.k.a. the Boy Mayor), ideological mayors (Bill de Blasio), celebrity mayors (Jimmy Walker, a.k.a. Beau James), idealistic mayors (John Lindsay), hard-charging mayors (Fiorello LaGuardia), mayors with little to no prior experience in elected office (Michael Bloomberg), immigrant mayors (Abe Beame), and even one who supported the Democratic Socialists of America. (That would be David Dinkins.) Whether Mamdani turns out to be a good or a bad mayor, he will also not be alone in either respect. He will, however, be the city’s first Muslim mayor, and the first with family roots in Asia. He is as avowedly of the left as any mayor in city history. And the velocity of his rise to power is the fastest that anyone in town can recall.","Since his general-election trouncing of the former governor Andrew Cuomo, Mamdani has been preparing for the sober realities of governing—appointments, negotiations, coalition management, policy development. Trying to preserve the movement energy he tapped during the campaign, he has also made an effort to continue the inventive outreach practices that brought him to broad public attention. Just last Sunday, for instance, he sat in a room in the Museum of the Moving Image, in Astoria (a few blocks from the rent-stabilized apartment he’s giving up to move into Gracie Mansion), for twelve hours, meeting with New Yorkers for three minutes at a time. It was a gesture to show that he could look his constituents in the eye, and that he could listen to them.","Mamdani ran a disciplined campaign, and he has run a disciplined transition. He didn’t take the bait when Mayor Eric Adams criticized him, told Jews to be afraid of him, and pulled other last-minute maneuvers seemingly designed to undermine him. Mamdani met with President Donald Trump in the Oval Office—and they startled everyone by having an outwardly productive meeting. (Trump happily told Mamdani that it was O.K. to call him a “fascist.”) Mamdani discouraged a young D.S.A. city-council member, Chi Ossé, from staging a primary challenge next year to the House Minority Leader, Hakeem Jeffries—a magnanimous move, considering Jeffries’s ongoing chilliness toward Mamdani. In rooms full of wealthy business leaders and in others filled with donors, he has tried to win over skeptics among New York’s élite. (“They are finding themselves, unexpectedly, charmed,” the Times reported recently.) It was a relief to the city’s political establishment when he asked Jessica Tisch, the current police commissioner, whom Adams appointed, to stay in the job. Last week, when a top appointee’s old antisemitic tweets surfaced, Mamdani accepted her resignation within hours.","Having rocketed, in a matter of months, from one per cent in the polls to mayor, Mamdani seems comfortable facing his doubters. But what he’s up against cannot be overstated. It’s been an open question for centuries as to whether New York is “governable” in a top-to-bottom, municipal, positive sense. For a long time, city government here was considered little more than a trough for Tammany Hall. In the past century, the city proved that it could (more or less) pick up its own garbage, get a handle on crime, and operate large school and hospital systems, even if sometimes just barely. It can do more than that, of course, but can it durably make life in New York better, and not just more tolerable, for the bulk of its residents? In his effort to answer affirmatively, Mamdani will have to navigate problems of management, budget, and bureaucracy inside City Hall, and also Trump (does anyone think their chumminess will last?), ICE raids, intransigent billionaires, public impatience with slips or inconsistencies, and twists of fate and nature. The billionaire exodus that was forecast during his campaign has shown no signs of materializing, but one bad blizzard in January could hamper Mamdani’s ambitious agenda for months.","His voters will expect him to make clear and steady progress toward the big-ticket items he promised. Interestingly, universal child care, the most operationally complex of his three core proposals, appears to be the most politically promising. The state’s moderate governor, Kathy Hochul, has expressed enthusiasm for it, and a new openness to raising corporate tax rates. Eliminating the fare on city buses, another key policy for Mamdani, is a much easier technical change. (New Yorkers barely pay for the bus right now—fare evasion is rampant.) But, in order to enact free buses as a policy, Mamdani will need the blessing of the Metropolitan Transportation Authority’s stern chairman, Janno Lieber, who has been making unhappy noises about the idea. (“We’re not treating New York like it’s Dr. Frankenstein’s laboratory,” Lieber recently said.) The bleeding heart of Mamdani’s campaign was his proposed rent freeze. He may succeed in having the members of the Rent Guidelines Board prohibit rent increases for the tenants of the city’s million or so rent-stabilized apartments for the next four years. But, even then, he’ll have to figure out what to do for the millions of other New Yorkers still exposed to the city’s historic housing crunch.","Last week, a moving truck was spotted outside City Hall. A treadmill that Adams liked to stroll on while watching “Jeopardy!” was carried out with great solemnity. Adams’s corrupt and chaotic four years are a mayoral term that history might well choose to forget, like Matthias Nicolls’s stint in 1674. Mamdani will now get his shot at retooling the city government, at trying to bring some democratic socialism to the world capital of capitalism. Few New Yorkers—of any political persuasion—would disagree with his assertion that the city needs a change. During his victory speech, in November, Mamdani vowed that “in this moment of political darkness, New York will be the light.” Can the city still blaze its own future, as it has since the days of the Dutch? In the Mamdani era, we will find out. ♦","By Patrick Berry","Loading game..."],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.01.10","day":null,"title":"In Donald Trump’s world, the strong take what they can","source":"The Economist","minutes":6,"tag":"Leaders","dek":"That will be bad for America—and everyone else","note":"2026.01.10","paragraphs":["FOR 12 years Nicolás Maduro terrorised Venezuela. He stole elections and, when people objected, his goons killed, raped or tortured them by suffocation with plastic bags. His comrades looted and mismanaged the economy so wantonly that GDP fell by 69%. A quarter of the population fled abroad. Both the economic collapse and the exodus have been worse than is typical during the bloodiest of civil wars.","Mr Maduro was also an international menace: colluding with drug gangs, threatening oil-rich Guyana and propping up Cuba’s communist tyranny with cheap fuel. He supported Hizbullah, helped Iran evade sanctions and gave Russia and China a foothold across the water from Florida. And then he was gone—snatched by US special forces on January 3rd.","This raid matters far beyond Venezuela. One reason is how it happened. It was a stunning display of hard power—and its limits. Another is why it happened. Rather than citing democracy or human rights, as American presidents once did, Donald Trump said he aimed to grab Venezuela’s oil and assert dominance over the western hemisphere. And a third is when it happened. Mr Trump is hastening the demise of the old order of UN resolutions, international law and universal values. The unfolding drama will help determine what takes its place.","First, consider the how. No other military force could have swooped in and seized a despot (and his wife) so surgically. It took less than three hours. Not a single American died, though a reported 32 Cuban spooks guarding the Maduros did. By January 5th the odious couple were in court in New York, facing drug charges and possibly life sentences. America’s adversaries have been warned.","Yet the story also illustrates the limits to military power. This was a raid, not an invasion. Scarred by failures in Afghanistan and Iraq, America is attempting, from afar, something much less than regime change. Mr Maduro is gone but his machinery of plunder and repression remains. His vice-president, Delcy Rodríguez, seems to have taken charge. The regime’s motorbike militias, the colectivos, are on the streets reasserting terror. With many gun-toting groups in Venezuela, an army with 2,400 generals and much paranoia at the top, a descent into conflict is also possible.","Mr Trump says he now “runs” Venezuela, by which he means that Ms Rodríguez has to do what he says—or else. Yet he will struggle to enforce his will. True, the US Navy still blocks the oil exports on which Venezuela depends. On January 7th American forces seized two tankers used to ship Venezuelan oil, one near Iceland and one in the Caribbean. But Mr Trump’s threats to station troops in Venezuela or to launch repeated raids, each months in the planning, are not credible.","The second lesson from Venezuela is the why. The snatching of Mr Maduro is a worked example of the “Donroe doctrine”—Mr Trump’s vision of how America should assert itself in its region. “American dominance in the western hemisphere will never be questioned again,” he crowed. “Won’t happen.”","The doctrine is about power and natural resources, not values. Venezuela’s most popular politician is a democrat: the Nobel-prizewinning María Corina Machado. Mr Trump dismissed her as lacking “support”. Yet she is so popular that Mr Maduro barred her from the presidential election he stole in 2024. Mr Trump means she does not control the army. He prefers to back the people with guns instead. They have no interest in fair elections, which would mean losing power and risking jail. Venezuelans still hope Mr Trump can broker a transition to democracy, but he shows little inclination to try.","His national-security strategy, published in late 2025, spoke of enlisting friends and expanding alliances in the Americas. It is now clear that this invitation comes at the barrel of a gun. Within hours of announcing Mr Maduro’s capture, Mr Trump had also threatened Colombia, Cuba, Greenland and Mexico.","He makes clear he craves natural resources—mostly for America. Mr Trump has laid claim to Venezuela’s underexploited oil reserves—the world’s largest—and says that the United States will receive 30m-50m barrels straight away. Venezuela’s oil industry has been so badly managed that, with American help, raising output by a little should be possible. Yet Mr Trump’s boast that he can rapidly and profitably restore production to previous levels is deluded. Demand is weak and the country is short of skills and capital. And oil companies are wary of taking costly, decades-long, multi-billion-dollar bets that Venezuela will be safe.","Third is what this means for the Americas and the world. Smaller countries close to the United States may feel they have no choice but to submit to Mr Trump’s bullying. Yet in the years to come, many leaders will seek to reclaim their sovereignty. And many countries will quietly seek closer ties with other powers, including China. Unless coercion is balanced by attraction, Mr Trump’s hemispheric doctrine will eventually fail and, in doing so, weaken the United States.","In stating so brazenly that might makes right, Mr Trump has already undermined America’s alliances. Greenland is a self-governing part of Denmark, which is a member of NATO. Seizing it would destroy the alliance. America’s Pacific allies will also conclude that to depend on Mr Trump is to be vulnerable to his predations.","By contrast, China and Russia are experts in navigating a world where the strong impose their will on the weak. Mr Trump may believe that each will stick to its own sphere of influence, but where do those spheres begin and end? As countries everywhere feel emboldened to encroach on their neighbours, the dismal prospect is of an aggressive, border-shifting 19th-century world, but armed with 21st-century weapons.","America was a successful superpower because its self-interest and realpolitik were turbocharged by an avowed faith in universal values of democracy and human rights. Mr Trump believes that, far from being a unique strength in foreign affairs, that was a foolish indulgence. His raid on Venezuela is likely to show how wrong he is. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/01/08/in-donald-trumps-world-the-strong-take-what-they-can"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.01.12","day":null,"title":"What Will New York’s New Map Show Us?","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.01.12","paragraphs":["Voters voted for it, even if they weren’t sure what it was. But maps are the ideal metaphor for our models of what the world might be.","Easily missed on the back side of the November ballots that brought Zohran Mamdani to Gracie Mansion was a proposal for a new map of New York City. Proposal 5, as it was called, was among the least noticed initiatives that New Yorkers were asked to vote on—yet, as happens with most proposals that make it to the ballot, a majority of New Yorkers voted for it, probably without really knowing what it meant, but approving it, in the New York manner, mostly for having made it there at all. It’s the same spirit with which we duly tick off our approval of judges and assemblypersons whose names we barely know and whose positions we can only guess at.","Proposal 5 was actually a bit of skilled electoral craft on the part of the city’s map functionaries. (They exist.) There has been a digitized map of New York for nearly twenty-five years. The extended map, however, will add to its already rich inventory of features some street-specific ones that, for ancient and complicated reasons, have been jealously guarded on thousands of paper maps by the five borough presidents. Though no one in the know will say, exactly, that Proposal 5 was a way of using the electoral pressure of more than a million New Yorkers to get the borough presidents to release their maps, you do get the strong impression that Proposal 5 was a way of using the electoral pressure of more than a million New Yorkers to get the borough presidents to release their maps. Now street names, lines, and widths across the city will all be available on one consolidated official digital map.","The crazy spaghetti of subterranean New York—the cables and the water mains and the angles at which a sewer slants downward, as it must—will be there for the asking. If an asteroid strikes a street corner in the Bronx, emergency workers will be able to find out where the power lines run nearby, how close a passing subway might be, and the address of the nearest diner where they can get a coffee. Property lines will be more distinct, which may make it easier to build new housing; the potential degradation of the city’s shores by climate change will be more trackable and treatable. We will better know who we are by knowing where we are.","In truth, the mysteries and compromises of mapping New York are evident every day. Consider the new subway map, which recently replaced the one long familiar in train cars. (It is, in fact, a retro design, returning to the graphic premises of a short-lived but snazzy map from the nineteen-seventies.) The new map broadens the ribbons marking the routes, intending to show how the lines run, instead of giving, as the previous map did, a clear sense of where they go on the city’s grid. On the old map, you could tell that the B and the F trains ran along Sixth Avenue without easily seeing which stops the F served that the B skipped.","On the new map, you can readily see where each train stops, but with less of a sense of where you are on the grid. Central Park, for instance, has been reduced to a small, deformed square. This change is not as helpful to tourists as it is meant to be, but, then, locals secretly think that, if you don’t know where the B train runs, you shouldn’t be on it. (Anyway, locals and tourists alike, seeking some new destination, will ultimately turn to their phones, on which the cooing G.P.S. lady will tell them how to get there.)","Maps become less perfect, even as they attempt to become more perfect. In Lewis Carroll’s “Sylvie and Bruno Concluded,” we learn of a map, described by an ambitious philosopher, that increases in scale bit by bit until it’s the same size as the terrain it represents. Unable to roll the map out, its creators cheerfully realize that the country itself can serve as its own map. Perhaps the most beloved map in recent decades was Saul Steinberg’s view of New York, initially a cover for this magazine. In the guise of a map, it captured a mentality: New Yorkers see anything beyond Eleventh Avenue as blank, uncharted wilderness. Steinberg’s point was not that his fellow New Yorkers were provincial but that all maps record a state of mind. (Indeed, on the Steinbergian map of today’s New York state of mind, many Brooklyn neighborhoods would loom as large as his West Side avenues did.)","Even the current redistricting battle reveals the constant paradox: we draw firm lines around a fluctuating reality. The intention in Texas, recently green-lighted by the Supreme Court, was to redraw the congressional map to make it easier for Republicans to win more districts, however absurd the boundaries. But the shifting allegiances of the people within those boundaries may thwart the designers’ aim. The Latinos grouped together who were expected to vote Republican may, after the mass mobilization of ICE and the implementation of other anti-immigrant policies, no longer do so. The map itsel
