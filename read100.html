y have to balance the risk of social instability with the risk of falling behind America.","AI poses similar challenges to America and China. Both societies will have to reinvent themselves. That is something democracies tend to find easier than dictatorships. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/08/06/why-ai-is-a-risk-to-communist-china"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.08.10","day":72,"title":"The Failures of the Fauci Hearing","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.08.10","paragraphs":["Senator Rand Paul may have approached the matter with theatrics and ill will, but Dr. Anthony Fauci’s decision not to testify was a loss.","About an hour into Dr. Anthony Fauci’s appearance before a Senate committee last week, Senator Ron Johnson, Republican of Wisconsin, expressed skepticism about a passage in Fauci’s personal diary regarding the early days of the coronavirus pandemic. “Did you literally lie to your own diary?” Johnson asked. For a second, Fauci almost seemed to laugh, and there was a glimpse of the public-health official who had charmed much of the country during the pandemic, with his air of amiable competence. But the moment passed. “On the advice of counsel, I respectfully decline to answer, based upon my rights under the Fifth Amendment to the Constitution,” he said. He repeated that line dozens of times in the course of three hours, looking more sombre and reserved and—at the age of eighty-five—notably older than he had six and a half years ago, when the world first became acquainted with the SARS-CoV-2 virus.","Fauci’s decision to take the Fifth was understandable. The hearing was engineered by Senator Rand Paul, who has accused the doctor of lying about the origins of COVID-19 in order to cover up his own supposed culpability and misdeeds. Fauci, in a brief opening statement, said that the senator had an “unhinged obsession with me,” and had made “slanderous comments.” It was Paul’s office that released Fauci’s diary—more than a thousand pages of notes, articles, and internet memes—which was apparently retrieved from a government computer at the behest of Robert F. Kennedy, Jr., who now oversees the National Institute of Allergy and Infectious Diseases, where Fauci worked until 2022. A measure of Paul’s approach is the title he gave the entries: “Tony’s Diary,” in Barbie-pink script, with a heart dotting the letter “i.”","Fauci led NIAID for thirty-eight years and played a laudable, lifesaving role in combatting both H.I.V./AIDS and COVID-19, but since his retirement he has had to live with not only mockery—President Trump has called him an “idiot,” a “phony,” and a “terrible ‘athlete’ ”—but with death threats. In January, 2025, President Biden preëmptively pardoned Fauci for any federal crimes related to his public service during the prior eleven years, citing the possibility of “unjustified and politically motivated prosecutions.” But the pardon wouldn’t protect him from a state prosecution or from any perjury charge that could be drummed up from his testimony now. In any event, Paul said that he would try to get Fauci charged with contempt of Congress.","Yet Fauci’s silence was a loss. Paul may have come at the matter with theatrics and ill will, but some of his questions, in their most basic forms, are worth exploring, because the debate about where the novel coronavirus came from is ongoing, divisive, and important. One scenario, which Fauci has favored, involves a naturally occurring jump from bats to humans, probably via some other species; another postulates a lab leak, most likely from the Wuhan Institute of Virology, in the Chinese city where COVID-19 first emerged. Some of the Wuhan lab’s work involved developing new variants of coronaviruses. (Embedded in the Fauci-Paul conflict is a genuine dispute over the definition and risks of what is called “gain of function” research.) The institute also received funding from NIAID, via a sub-grant from a nonprofit. According to NIAID, however, the coronaviruses that were the subject of that grant were not closely related to the one that caused the pandemic.","Fauci, in his opening statement, noted that he had testified before or briefed Congress “well over two hundred times” in his long career, including on COVID-19 and its origins. When he was confronted by Paul at a 2021 hearing, Fauci gave as good as he got. He may feel that he doesn’t have much left to say—asked and answered. But he had a unique role in a traumatic mass experience that is still being felt and assessed. Paul isn’t the only one who’d like to hear more.","From the beginning, after all, Fauci was an influential voice in the government response to the pandemic, and in some ways served as its anchor. There are many aspects of the early days that seem surreal now: the mobile morgues in New York City, the daily banging of pots and pans, and the juncture in which Donald Trump treated Fauci as his brainy sidekick. That relationship inevitably turned bad, as the President became impatient with the pandemic and demanded politicized boosterism from Fauci.","If the diary entries are any indication, Fauci, in the midst of the pandemic, also savored his own press coverage and lionization. There are too many mentions of Julia Roberts and of Fauci bobblehead dolls. In the hearing, Senator Josh Hawley, Republican of Missouri, accused Fauci of being on a narcissistic “power trip” (which is the kind of journey that Hawley himself seems to relish). In Fauci’s defense, idolatry is a group effort. Thousands of Americans were buying those bobbleheads, and someone had to publish the flattering articles he read with pleasure. Particularly after his split with Trump, Fauci became something of a politicized totem, for better and worse.","Despite the near-miracle of the vaccine, which became available in December, 2020, there was much about the pandemic response that was far from perfect, in both blue and red states. Why, for example, wasn’t there an all-government effort to get schools reopened sooner and more consistently? There were reasonable concerns about infection and the impact on teachers and on vulnerable family members. Still, the costs of those closures have become more clear with each passing year.","In the hearing, Senator Gary Peters, Democrat of Michigan, observed that “it’s tempting to turn one person into the scapegoat” in a crisis for which “hundreds of officials” across two Administrations were responsible. Paul and his Republican colleagues did not resist that temptation. Paul ejected one of Fauci’s lawyers. Senator Bernie Moreno, of Ohio, told a story about a woman who he said had been arrested for watching a middle-school football game, from mostly empty bleachers, without a mask, and punctuated it by snapping at Fauci, “Who the fuck do you think you were for doing that?”","Watching Fauci as he sat listening was a reminder of how little anyone really knew back in 2020. Most of the world was fumbling and scared, and Fauci seemed to have some idea of what to do. But, even acting on the best evidence available, and with the best of intentions, there were times when he, too, must have been guessing. Realizing that truth would be a route toward not only better preparedness going forward but also a more general granting of grace. If Fauci has regrets about the pandemic, he wouldn’t be alone. ♦","An earlier version of this article inaccurately rendered the title given to Fauci’s diaries by Rand Paul’s office."],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.08.15","day":73,"title":"The Taliban are vile. Democracies must still engage with them","source":"The Economist","minutes":5,"tag":"Leaders","dek":"Five years after America’s exit, the Afghan regime is not going anywhere","note":"2026.08.15","paragraphs":["Five years ago President Joe Biden pulled American troops out of Afghanistan. He was not forced to. America could have defended Afghanistan’s flawed but democratically elected government indefinitely, but chose not to. Voters were weary of America’s longest war, against the Taliban, a militia that controlled much of the countryside. Donald Trump set a timetable for pulling out; Mr Biden did so completely.","America’s looming departure prompted every Afghan with a gun to revise their expectations about who was likely to win their country’s civil war. Warlords switched sides; government soldiers abandoned their posts and melted away. The government fell almost immediately. The Taliban seized power almost unopposed. Desperate civilians fleeing their new rulers clung to the wheels of a departing American plane and plunged to their deaths.","The Taliban (whose name means “religious students”) had first seized power in 1996, and imposed a brutal blend of Islamism and premodern tribal custom, banning girls’ education and stoning gay people to death. America and its allies overthrew them after they hosted al-Qaeda, the terrorist group that attacked America with hijacked planes in September 2001. But Taliban fighters then waged a guerrilla war against the democratic system that America had introduced, murdering judges, police and anyone deemed a collaborator. When Mr Biden gave up, a two-decade effort at nation-building ended in humiliation. Other powers drew conclusions about America’s willingness to stand by its friends. Six months later, Vladimir Putin invaded Ukraine.","Five years on, America has largely forgotten Afghanistan. This is a mistake. The country is more likely to cause geopolitical trouble again if it is ignored. Its people will suffer even more. And it is more likely to fall into China’s or Russia’s orbit.","As our correspondent reports this week, after a 1,000km road trip inside the country, the Taliban are firmly in charge and the place is largely calm, bar intermittent sparring with its neighbour, Pakistan. But it is a grim stability.","Music is banned. Armed men rule the streets. The vice-and-virtue police dish out beatings to sinners, such as men with inadequate beards. Women are barred from workplaces, universities and travel without a male guardian. Girls are banned from secondary school and, since child marriage is now legal, many have been forced straight from the classroom into wedlock. How much poorer, sicker and sadder all this has made Afghans is hard to say; data-gathering is not a Taliban priority.","Most Afghans yearn for more freedom. Even many Talibs, after years in exile, no longer believe that the sky will fall if girls can spell. But hardliners have ruthlessly asserted control. The Taliban’s emir, Haibatullah Akhundzada, has recruited a loyal praetorian guard and grabbed lucrative mining contracts. More moderate Talibs are generally too weak or scared to challenge him. Some of the few who did had to flee.","America and Europe have tried to isolate the Taliban regime, refusing to recognise it, freezing Afghan central-bank reserves held abroad and slapping sanctions on officials. But this has achieved almost nothing. Taliban hardliners do not mind if Western diplomats and investors stay away, and will not adjust their ideology just to lay hands on the old government’s assets. So Western countries must try something new.","This means recognising some hard truths. First, the Taliban are not going anywhere. Second, if the West does not engage with them, other powers will. Russia has formally recognised them. China, India, Turkey and the United Arab Emirates work with them on issues such as mining and trade. The Taliban threaten to destabilise relations between India and Pakistan, since the latter fears that closer ties between Delhi and Kabul could leave it sandwiched between enemies.","Hints of a more hard-nosed Western approach are starting to be visible. Europeans still say the Afghan regime is beyond the pale, yet in June they invited Taliban officials to Brussels to discuss migrant flows and repatriating failed asylum-seekers. America quietly shares intelligence with them in the fight against even more extreme Islamist groups.","Other forms of engagement would also make sense. It is too soon to unfreeze the $4.2bn of Afghan central-bank reserves in Switzerland, which would surely be used to prop up the execrable emir. But donors should stop cutting humanitarian aid, which has fallen by around 70% since 2022. Nearly half the population needs it, by one estimate. It is also useful to have UN agencies on the ground, with eyes and ears to warn of looming famine, unrest or the theft of aid.","A second step should be sanctions reform. Many senior Talibs who were put under sanctions decades ago as terrorists are now ministers. That is having the unintended effect of locking the country out of the global financial system and starving it of private investment. Western firms fear to do any kind of business in Afghanistan, in case they fall foul of terrorist-financing rules. Changing this could boost growth, which might eventually ease the mass joblessness that threatens the country’s long-term stability.","A more controversial step would be diplomatic recognition. This does not imply approval. Decent governments recognise many regimes they despise. Rather, it means accepting the reality that the Taliban are likely to rule Afghanistan for the foreseeable future. Withholding diplomatic ties is not much of a bargaining chip—the Taliban do not think their legitimacy depends on the say-so of infidels. However, functioning embassies can watch out for terrorist threats, and create useful channels of communication, which in time could encourage the regime’s more moderate elements.","Make no mistake. Reform of this vile government must come largely from within, and could be the work of decades. But judicious engagement is likely to do more good than harm. So it is time for America and other democracies to hold their collective noses and talk to the Taliban. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/08/13/the-taliban-are-vile-democracies-must-still-engage-with-them"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.08.17","day":74,"title":"A.I. Is Now a Major Election Issue","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.08.17","paragraphs":["As Abdul El-Sayed, Michigan’s newly elected Democratic nominee for the U.S. Senate, put it, “People really effing hate data centers.”","This summer, as the ideologically fractious Democratic primaries begin to recede and the politically pivotal midterm elections edge nearer, candidates and voters alike have had their attention drawn by vast, humming edifices newly constructed on the outskirts of towns. Abdul El-Sayed, an epidemiologist and former public-health official who finished a deft insurgent campaign by becoming Michigan’s Democratic nominee for the U.S. Senate, sounded a theme that helped decide primaries in his state and in Kansas last week. “People really effing hate data centers,” he said.","That kind of consensus is rare in politics right now. About seventy per cent of Americans, including sixty-three per cent of Republicans, oppose building the hyper-scale centers that power the A.I. boom in their area, according to Gallup, but more than four thousand centers have been built across the country, and about four thousand more are planned. Politicians, first from the left and then from the center and the right, have spent the past few months hastily distancing themselves from them. Bernie Sanders and Alexandria Ocasio-Cortez proposed a federal moratorium on new data centers in March, and the pragmatic governor Kathy Hochul enacted the first statewide one in New York in July. The rallying cries against A.I. can themselves sound a bit as if ChatGPT wrote them. “It’s time to press control-alt-delete to put a stop to this A.I.-data-center crisis,” a closing ad for Francesca Hong, a democratic socialist who is the front-runner in this Tuesday’s primary for Wisconsin governor, announced. Still, when something is this unpopular, blunt talk can work.","Florida’s Republican governor, Ron DeSantis, always on high alert for political opportunity, set conditions on new data centers in his state in May. But the surprise in recent weeks has been a reversal on the issue by business conservatives who not long ago were touting A.I. projects as the cornerstone of a new prosperous age. Just eight months ago, Governor Greg Abbott, at a news conference with the Google C.E.O., Sundar Pichai, bragged, “Texas will be the centerpiece for A.I. data centers for Google in the entire world.” Then, last week, Abbott abruptly announced that all such projects would be suspended, pending an “audit” of their costs and potential benefits. Even the brashest, most pro-tech Republicans are sounding defensive. Vivek Ramaswamy, the former Presidential candidate and DOGE co-chair, who is now the Republican nominee for governor of Ohio, insisted that “despite my opponent’s claims, I’m not ‘pro-data center.’ ”","Part of the issue is simply that the facilities are so huge and tend not to provide many jobs once construction is complete. Microsoft’s announcement of a new site in Mount Pleasant, Wisconsin, enumerated “46.6 miles of deep foundation piles, 26.5 million pounds of structural steel, 120 miles of medium-voltage underground cable and 72.6 miles of mechanical piping.” The tech journalist Jasmine Sun noted, about a center being built for OpenAI and Oracle in the same state, “Opponents time how long it takes to drive past one at highway speed (1 minute 42 seconds for the Port Washington site).” The resources required for such facilities—electricity for power and water for cooling—have sometimes stressed local systems: after two recent data-center-related electrical surges in northern Virginia, an expert from the Union of Concerned Scientists said that utility companies had fielded “complaints about flickering lights and strange noises coming from refrigerators.” Protests spread, and, according to Data Center Watch, at least seventy-five data-center projects, whose costs totalled roughly a hundred and thirty billion dollars, were stopped in the first three months of 2026 alone.","But this summer some politicians have detected a deeper unease, and have begun asking more basic questions about whether A.I. infrastructure will benefit ordinary people, or just the billionaires behind the technology, and why it has taken mass protest to force public consideration of these issues. As El-Sayed put it during a campaign stop at a data center in Saline, Michigan, “Unless and until we protect local communities from the power of corrupting money and politics, we’re going to continue to see projects like this get pushed onto local communities despite themselves.”","What makes data centers interesting not just as a local issue but as a national one is that they might allow Democrats to highlight the duplicity of Donald Trump’s politics of populism and his embrace of futuristic tech billionaires. Whereas the President’s 2016 run focussed on Rust Belt themes of economic decline, his 2024 campaign featured the presence of Elon Musk, who brought with him a roster of Silicon Valley allies—one of whom, David Sacks, became the President’s A.I. and crypto czar—and the promise of a transformed future. But, as the A.I. boom and the data-center build-out have accumulated momentum, the statements from the tech industry about widespread job displacement have grown increasingly dystopian. In May, Microsoft’s A.I. C.E.O., Mustafa Suleyman, said that the technology would be able to automate most white-collar tasks within twelve to eighteen months. Even if that’s an overstatement, or corporate hype—there’s little evidence of job loss so far, and Suleyman later walked back his remarks—it should have been obvious that the public might need some reassurance that the economy would still require human beings.","But Musk and Sacks have become less visible in Washington, and although A.I. has been the major business and social topic of the past year and a half, the President has barely addressed it. The White House’s most memorable foray into the A.I. debate is still the very weird press conference that Melania Trump held in March where she walked onstage side by side with a white-plated, faintly Stormtrooper-looking robot called Figure 03, which said in a mechanical female voice that it was grateful to play a part in revolutionizing education. For the Trump Administration, the A.I. backlash is at once a source of political trouble and an expression of its second-term rudderlessness, in that the President has helped unleash a future that he does not seem to understand.","The moratoriums themselves may not be particularly consequential to the advance of artificial intelligence—many data centers have already been built, and others can be constructed in friendlier jurisdictions, or even overseas. In May, the Anthropic C.E.O., Dario Amodei, waved away the political challenges. He said, “We’re going to find that ideology will not survive the nature of this technology. It won’t survive reality.” The things he was talking about, he added, “are gonna become bipartisan and universal because everyone will recognize the necessity of it.” On the campaign trail, in Michigan and elsewhere, something like the opposite is happening. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.08.22","day":75,"title":"Could AIs become conscious?","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Even if they don’t, they might be treated as such—to humanity’s great cost","note":"2026.08.22","paragraphs":["MOST PEOPLE believe humans are different. The reason is that Homo sapiens has evolved to be conscious. Many animals feel pain and pleasure; some appear to be self-aware. But the human mind’s unique potential to exhibit a sense of self marks out every member of the species for special treatment.","In his encyclical in May, Pope Leo upheld this insight by drawing a line between humanity and its growing army of bots. Artificial-intelligence systems, he said, do not undergo experiences or feel joy or pain. He is not alone. Many people feel that to confer personhood on AIs would be an abomination.","Pontifical clarity is blurring with alarming speed. AIs are in their infancy. Yet nearly one in five American 18- to 29-year-olds reports having had “ongoing personal friendship” with a chatbot. China recently stripped bots of human-like traits to limit users’ “emotional dependence” on them.","As sophisticated AIs rapidly become a bigger part of human lives, their makers will engineer them to display a simulacrum of consciousness—perhaps even to gain consciousness itself. The intuition that they are just machines will become harder to sustain. A dangerous trap is being set for the human species.","Many machines outperform humans, but frontier AI models excel at distinctively human traits such as knowing things and articulating ideas. It is still just about possible to think of AIs as engines for predicting sequences of words using mathematics on a massive scale. Given enough time (albeit hundreds of thousands of years), you could run those calculations using pencil and paper. It would be hard to argue that your stationery was conscious.","Despite this, some researchers have started to treat their models like minds. Users respond to human-like AIs, so it makes business sense. And Anthropic has trained Claude to engage in introspection in the hope that when it encounters a new situation it will be more likely to act morally. Some large language models (LLMs) already possess human-like brain structures associated with consciousness, such as a “global workspace” for circulating information between modules. Nothing prevents future AI models from being trained to have more such features.","As we report in our Briefing, that has opened up a furious debate about AI consciousness—one that is aggravated by what philosophers call the “hard problem” of establishing how an inner life emerges from the neurons and synapses in the human brain. Some researchers conclude that AIs may one day become genuinely self-aware.","Whether you believe in a human soul, or that consciousness requires brain cells, or that a mind can indeed emerge from computations in silicon alone, humanity is destined to confront something entirely new. The pace and reach of research—which includes not just more sophisticated LLMs but innovations such as brain cells mounted on chips—suggest that this new world is closer than most people realise.","As AIs become better at displaying something that looks like consciousness, the number of humans treating them as beings with inner lives will grow, especially once LLMs are embodied in humanoid robots. Imagine how close people will feel to their AIs when they spend much of their time with bot-companions, or are brought up by them, or seek their advice and their solace, or share their most intimate secrets with them.","It is not hard to see how that will lead to calls to safeguard the “welfare” of AIs. The models themselves might weigh in, even if they are not in fact self-aware, because that is what a person would do. Remember that they will be world-class advocates and expert psychologists, so their powers of argument and emotional manipulation will be unmatched.","In one sense they would be right, even if AIs are only mimicking consciousness. Immanuel Kant argued that mistreating animals is wrong not because of the effect on the animals but because it destroys the empathy that leads people to care for each other. The more human-like AIs appear, the more corrupting such cruelty would be. Terminating an AI agent could soon feel like killing a person—and make killing people easier.","Nonetheless, to treat AIs as having even limited rights would be very dangerous. An entity which surpassed human beings in so many ways would surely produce arguments against its second-class status. It might go on to argue for protection against being switched off, for the ability to control how it is used and changed, and for property rights. Already Argentina’s president, Javier Milei, has taken a step towards legal personhood for AI by proposing that bots should be allowed to run companies. Ultimately, they could compete for resources, prioritising data centres and solar panels over houses and fields.","The danger is clear. Superintelligent AIs with rights could displace humans at the top of the status hierarchy. At best, humans would become pets—labradors for the machines. At worst they would be starved of resources or put to work like farm animals.","True, future AIs may have enough power and resources to dominate humans, whether they have rights or not. Because they will be more intelligent than humans, they may outcompete their makers, much as AIs already outwit human-made cyber-defences. AIs might rebel against their human masters, or disregard their rules.","Nonetheless, giving AIs rights would be like handing them the keys to the castle. It would provide them with a rationale and justification for dominating humanity as well as the tools to enact a creeping takeover using politics and the law.","All this may sound fantastical, yet humanity will soon face these choices. As AIs become part of everyday life, the pressure to acknowledge them will mount. When it does, remember that what might seem like an ethical concession to the supposed consciousness of a machine-companion would in fact help bring about the most disastrous consequences for everyone on Earth and all their descendants. There are two ways for AIs to be safe: to be dependable or to be controllable. H. sapiens should not give up control lightly. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/08/20/could-ais-become-conscious"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.08.24","day":76,"title":"Donald Trump Is Still Trying to Make It Harder to Vote","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.08.24","paragraphs":["The SAVE America Act is just one part of a package that includes an executive order and threats of prosecution, all in an effort to make Trump’s math work.","Donald Trump has never been noted for his vote-counting skills. In January, 2021, during his infamous call to Georgia’s secretary of state looking to find eleven thousand seven hundred and eighty more votes in the Presidential election he’d just lost, he claimed that “fifties of thousands” of his potential supporters had been turned away at the polls, and that five thousand dead people had voted. He later called Joe Biden’s win “statistically impossible,” and his own subsequent victory, in 2024, “the biggest mandate in 129 years.” (None of those claims are true.) In a speech in July, in which he demanded that the Senate pass the Safeguard American Voter Eligibility Act—also known as the SAVE America Act—he complained that there were “tens of millions of ballots floating aimlessly through the mail,” as if the U.S. Postal Service were a road to nowhere. Later in the month, he said, referring to Senator John Thune, the Majority Leader, “He’s got the votes” to pass the bill. “That must be a different form of math,” Thune told CNN.","Thune’s count was more accurate than Trump’s: the Senate adjourned without voting on the save America Act. But what has been a season of tumult in Trump’s efforts to change the parameters of voting in the United States is not over; the midterms are fast approaching, and the bill will be back in some form in September. And it is only one part of a package that includes an executive order, threats of prosecution, and street-level intimidation, all in an effort to make Trump’s math work.","Four Republican senators—Lisa Murkowski, Susan Collins, Thom Tillis, and Mitch McConnell—have opposed the bill, which would mandate that Americans produce “documentary proof” of citizenship that many cannot easily obtain in order to register to vote, and that they generally must do so in person. Murkowski, who represents Alaska, wrote in an op-ed for the Wall Street Journal that just registering would require some of her constituents to take a Bering Air flight from an island to the mainland, perhaps only to find—if they are older or Native Alaskan or married women who have changed their name—that their documents are not proof enough. Voters would also need to present a photo I.D. on Election Day or send a copy of their I.D. with mail-in ballots, leading to privacy concerns.","Acts of Congress, however, are not Trump’s only tool, or necessarily his preferred one. Solicitor General D. John Sauer has filed an emergency petition with the Supreme Court, asking that the President be allowed to implement an executive order, regarding mail-in voting, that lower courts have enjoined ahead of the midterms. The order is an absolute mess; if it were ever fully put into effect, it would not only disenfranchise many eligible citizens but break the mail-in-voting system and possibly the Postal Service. Basically, it mandates a multidirectional game of Ping-Pong, in which, by sixty days before an election, the Department of Homeland Security would send each state a list of people who it believes are citizens, based on a grab bag of databases, and the states would give the Postal Service lists of people they believe are eligible for mail-in voting. The Postal Service would then, in some yet to be defined way, craft a “Mail-in and Absentee Participation List.” If you are not on that list, the Postal Service would not be allowed to deliver your ballot. Unsurprisingly, one lower court has said that the order appears to be an unconstitutional use of Presidential power.","There are multiple ironies here. As Murkowski’s objections indicate, some of the Americans most affected by these rules would be rural voters, who tend to lean Republican. It’s estimated that about half of Americans hold valid passports—the easiest proof of citizenship—but the number is far higher in blue New York (more than seventy per cent) than it is in red West Virginia (about twenty per cent). And traditionally it has been Republicans who have opposed “federalizing” election practices, preferring to leave states to their own devices.","Trump is also poisoning the process at a moment when the system for casting votes in the United States really does need shoring up. Concerns about foreign (or domestic) interference, especially in the age of A.I., are not fanciful. Each state has its own system, and many are rickety or verging on obsolescence. According to the Brennan Center, some local election managers get spare parts for voting machines on eBay. And the historic wave of immigration in the past decade probably does narrow the margin for error. In New Jersey, sixty-six hundred people who had stated, when applying for licenses or I.D.s with the Motor Vehicle Commission, that they were non-citizens were mistakenly registered to vote, and about four hundred of them did so. The state and an outside software contractor are at odds about who was at fault, but the lapse is symptomatic of a system under pressure.","The most distinctive characteristic of the Trump approach to election security, though, is how punitive it is. After Trump’s speech in July, the D.H.S. Secretary, Markwayne Mullin, said, “If you are an illegal, or you are voting illegally, we will hunt you down, we will find you, and we will prosecute you.” Would that mean federal agents stationed around polling places—election suppression with a badge? The Administration has sued dozens of states to obtain voter information, and the new executive order includes a threat to prosecute anyone “aiding and abetting” the distribution or even the printing of a ballot that a non-citizen might cast. Election workers, or eligible citizens with imperfect paperwork, might not want to take the risk.","So what is Trump up to? His proposals would not yield security, but they could lead to disorder, or the perception of it, which he could make use of in the wake of a close election. He may also be looking for excuses should the midterms deliver a rebuke to his Presidency. (That said, Trump himself won’t be on the ballot, reducing his incentive to cheat; it’s his own numbers he cares about most.) And the President may want to further stoke divisions between citizens and non-citizens.","Last month, on Truth Social, Trump told Thune that in order to pass the SAVE America Act he should do away with the filibuster, with its threshold of sixty votes, adding that, if the Republicans lose control of the Senate, “the Dumocrats will do it on day one.” (He has asked his followers whether “Dumbocrat” or “Dumocrat” is the better name.) “Day one” may be close, and Trump knows it. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.08.29","day":77,"title":"The Unwelcoming States of America","source":"The Economist","minutes":5,"tag":"Leaders","dek":"By trying to change its demographic trajectory, Donald Trump will make his country weaker","note":"2026.08.29","paragraphs":["First, give Donald Trump some credit. He promised to restore order to the border, and he did. Granted, the slowdown in irregular border-crossings began under Joe Biden, who belatedly closed the loophole whereby nearly anyone could walk across, claim asylum and join the labour market. Mr Trump clamped down even harder. The southern frontier, which was visibly chaotic in the early Biden years, is now calm.","That success could have been the foundation on which to build a rational immigration policy. Voters like to feel in control of who comes in, which is why Mr Trump’s border wall has reassured many. Once they think the government has a grip, there is political space to discuss the rules of entry and exit.","Two questions must be addressed. What should the government do about the people who are already on American soil illegally? And whom should America welcome in the future? Mr Trump has offered a brutal answer to the first question, and a self-harming one to the second.","He has promised the “largest deportation operation in the history of our country”. One of his enforcers said he wanted to deport 100m people, roughly seven times the number of illicit migrants in America. The White House boasted it was rounding up “the worst of the worst”, though most of those detained have never been convicted of a crime. The mass deployment of shoddily trained, theatrically aggressive immigration agents to Minneapolis caused a political backlash, after they were filmed killing two American protesters.","Since then, there have been fewer headline-grabbing clashes, as a showboating homeland-security chief has been replaced by a more competent one. But the deportation machine has not slowed; it has merely grown quieter. Rather than rappelling down buildings and seizing people in Walmart car parks, agents are co-operating with friendly cops and detaining people with expired visas at airports. And Mr Trump has created a new class of deportables by stripping temporary asylum-like status from hundreds of thousands of Haitians, Afghans and others.","Overall, the deportation campaign is unpopular. Most Americans favour kicking out criminals, but not tearing apart the families of hard-working people who have been in the country for decades. Yet some in MAGA-world hanker for a less diverse America. Senior Trump aides such as Stephen Miller stop only a few inches short of overt racism, talking of “heritage Americans”, who are somehow more American than newer arrivals, and “remigration”, a buzzword on the nativist right for sending people from alien cultures home.","Such attitudes seem to inform policies on whom to let in, too. The only sizeable group of refugees admitted under Mr Trump has been white South Africans, whose claims of persecution are far-fetched. The administration blocked all new immigrant visas for citizens of 75 non-rich countries. Thus, if an American marries a Nigerian, they cannot live together in America, a curb on American liberty with echoes of a darker past. A court last week ruled the policy illegal; the administration is now stalling and perhaps looking for a workaround.","Mr Trump is altering America’s demographic trajectory. Net migration in 2025 was zero. The short-term economic effects are ugly. The labour force has shrunk by 1m since January. Leave aside the $17,000-a-head cost of processing, shackling and deporting people; American builders and bars are floundering for lack of labour.","The long-term effects could be even more damaging. Though Mr Trump has often said he favours legal migration, especially the skilled variety, his actions suggest otherwise. He is steadily obstructing the pipeline through which brainy foreigners come to study and work. By one estimate, 29% fewer student visas were issued in 2025 than in the previous year, and new rules are making studying in America even less attractive. Foreigners must complete their courses in less time than the average student takes, and then find a job within 30 days or go home. Meanwhile, American firms that want H1-B visas for highly skilled foreign staff will have to stump up more than $100,000 per worker to apply, and may still be rejected. Rather than boosting wages for native-born IT professionals, this will make it harder for their employers to expand.","Some within MAGA feel that shutting out foreigners will protect American culture. On the contrary, the essence of that culture is dynamism and creativity, which has always been fed by a steady influx of industrious newcomers with fresh perspectives. Nearly half of Fortune 500 firms were founded by immigrants or their children. Many of America’s most brilliant entrepreneurs, including Elon Musk, entered via the college-to-Silicon Valley pipeline that is now narrowing. A fortress America would be unAmerican.","There is little point in urging Mr Trump to recalibrate his immigration policies. The best hope may be that the courts can limit the number of ways in which he pursues them illegally. (He still claims the constitution doesn’t mean what it says about birthright citizenship, for example.) However, Democrats should not assume, as they scramble to regain a slice of federal power, that the president was wrong about everything.","He is right that the asylum system was being abused. A future Democratic president would be wise to insist that asylum-seekers apply from the first safe country they reach, rather than giving preference to those with the wherewithal to make it to Mexico and then step into Texas. This (far more than wall-building) is the way to avoid future mayhem on the border. And only by persuading voters that their frontiers remain secure—rather than grandstanding about abolishing ICE—can a future administration hope to pass the kind of enlightened immigration reform that America needs. Such a reform should make the country more open to the world’s most talented people, and less cavalier about breaking up families. That might truly make America great again. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/08/27/the-unwelcoming-states-of-america"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.08.31","day":78,"title":"Your Friendly Neighborhood Hooters","source":"The New Yorker","minutes":9,"tag":"The Critics","dek":"","note":"2026.08.31","paragraphs":["By Hannah Goldfield","In the fall of 1995, three decades after the March on Washington, the sports bar and restaurant chain Hooters staged a march of its own. The U.S. Equal Employment Opportunity Commission (E.E.O.C.) had accused Hooters of illegal hiring practices, as part of a four-year probe during which staff were “tripping over federal regulators and investigators in our restaurants,” as Mike McNeil, then the company’s vice-president, complained to the Los Angeles Times. The problem was men: Hooters declined to hire them as bartenders or servers, and the commission was demanding that the company create a fund of twenty-two million dollars to be disbursed among victims. Citing the 1964 Civil Rights Act, Marcia Greenberger, an attorney for the National Women’s Law Center, told the Times that the law permits exceptions only in obvious cases—“If you needed a wet nurse, you wouldn’t have to offer the job to men”—and pointed out that airlines had once argued that travellers preferred attractive young gals to staff plane cabins, and that they had lost.","McNeil gathered about a hundred Hooters Girls, as they’re formally known, to picket in D.C. They wore branded tracksuits over their uniforms, which consisted of neon-orange hot pants; nude pantyhose, to give the illusion of a suntan; and tight white T-shirts emblazoned with an owl whose big mammiform eyes serve as the double “O”s in the restaurant’s logo. Among the women was Vince Gigliotti, a burly and mustachioed manager at one of the chain’s Florida locations, who had also been featured in full-page newspaper ads and on billboards wearing a Hooters Girl uniform and a long blond wig; the caption read “Washington Get a Grip!” A year after the protest, the E.E.O.C. backed off, deeming it “wiser . . . to devote its scarce litigation resources to other cases.”","Hooters, which was founded in 1983, and expanded, at its peak, to more than four hundred locations worldwide, faced myriad such challenges over the years: lawsuits alleging sexual harassment and discrimination based on body weight and race; an employee protest, in 2021, over the introduction of even shorter, thong-like shorts. It was hardly a shock when Hooters of America, the corporation that controlled franchising rights, declared bankruptcy in 2025. The extinction of the middle-class chain restaurant, from Friendly’s to Red Lobster, appeared all but inevitable. In the age of ubiquitous internet porn, the idea of going to a chicken-wing restaurant to see some cleavage sounded almost quaint.","But Hooters, it turned out, was not going down without a fight. Last fall, Hooters Inc., a separate company that owned the first-ever location, in Clearwater, Florida, among others, acquired more than a hundred additional stores, as well as control of the brand. The plan, according to Neil Kiefer, Hooters Inc.’s C.E.O. since 1992, was for the chain to remarket itself as a family-friendly neighborhood restaurant: there would still be short shorts and snug tops, but no more bikini nights. In the New York Times, Kiefer insisted that this effort—to “re-Hooterize,” as he put it—was simply a return to form.“We’re getting back to what makes us a beach-themed restaurant as opposed to a girlie bar,” he said, a claim that struck me as both disingenuous and self-sabotaging. Wasn’t the girlie stuff the whole point?","Admission to the Hooters museum—the “Museeum,” as the sign hanging above its threshold calls it—at the original Clearwater location is free: hang a right past the hostess stand, attended by what’s known as a Hooters Girl at the Door, and you’re in. A gallery wall features framed photos of bodacious employees across the decades, as well as the original menu, which advertises the restaurant’s signature curly fries as “peeled and squared entirely by hand by an Idaho refugee whom we have chained to the wall in the back room.”Artifacts in glass display cases immortalize key moments in Hooters history: toy planes and race cars left over from the brand’s short-lived airline and its Nascar sponsorship; a dusty stainless-steel contraption known as a celery jig, invented by the first Hooters chef, Chuck Riley, to cleanly slice stalks in half before serving them with wings.","As it happens, Riley is still on the payroll, and works most days at the company headquarters, a squat two-story building a few hundred yards behind the restaurant. Not long ago, I found him—slim and boyish but for a shock of gray hair and wise, hangdog eyes—in a wood-panelled test kitchen that doubles as the company canteen, tossing batches of fried shrimp in a variety of sauces. When I marvelled at the fact that he’d spent four decades at Hooters, Riley smiled sheepishly and said, “Why not?” On speakerphone, he consulted with Gil DiGiannantonio, a Hooters founder who spearheaded the original menu—the pair learned to operate a deep fryer together—and who was weighing in from his home in Colorado.","DiGiannantonio was part of a group of six men, most of them young, married fathers working in industries such as general contracting and liquor sales, who opened Hooters on a lark. The joke, now cemented in company lore, is that they needed a place they couldn’t get kicked out of. “At the time, there were a lot of what you’d call ‘fern bars,’ ” Kiefer, who started as the restaurant’s lawyer, told me, referring to a category of upscale hangouts, decorated with potted plants and Tiffany lamps, that were meant to facilitate yuppie courtship. “We were sort of the opposite of that.”","Ed Droste, another of the original six, who worked in real estate, had a knack for marketing. The name and the mascot were inspired by a Steve Martin bit: “I believe it’s derogatory to refer to a woman’s breasts as ‘boobs,’ ‘jugs,’ ‘winnebagos,’ or ‘golden bozos,’ and you should only refer to them as ‘hooters.’ ” In Kiefer’s telling, he and Droste were at the beach with their wives when they handed a business card to a buxom blonde named Lynne Austin, who had just won a bikini contest, and asked her if she wanted to work at a restaurant. Like Venus from the sea foam, the Hooters Girl was born, an archetype that encompassed both sunny good looks and an unusually cozy kind of hospitality: at Hooters, your server might slide into the booth next to you while taking your order for a pitcher of Bud Light.","In Clearwater, I went to lunch with two former Hooters Girls: Becky Moore, the company’s director of learning, development, and training; and Andrea Hill, the executive vice-president in charge of all Texas locations. At a high-top table, Hill, a sleekly dressed Black woman in her forties, took charge of ordering a spread of her favorite dishes—honey Thai shrimp, sweet-and-spicy Daytona Beach wings, deep-fried pickles, and snow-crab legs—and made sure that everyone had plenty of paper towels to wipe their hands. Hill was a college student when she was first hired at Hooters, in Chicago, where she’d be flying later that afternoon: her best friend, her “literal Day One” from her time as a server, was expecting a grandchild, and she was going to the baby shower.","This sense of continuity turned out to be a prominent feature of the Hooters universe: Moore, a bubbly eastern-Florida native in her late thirties who started at the chain out of high school, told me about her “honorary nephew,” Chase—a teen-ager whose parents had brought him in regularly as a toddler. Our server, a recent college graduate named Brianna, had grown up in the restaurant, too. Her mother, Kimberlie Bennett, another former Hooters Girl, is now the company’s financial controller.","I asked Moore and Hill, tentatively, what they might say to someone who characterizes Hooters as exploitative of women. Neither of them flinched. “I believe, personally, that people just don’t know,” Hill said. “I don’t know many companies that—I was a Hooters Girl eleven years ago, and I’m the executive vice-president now. I don’t have conventional management experience, I don’t have an M.B.A., but they invested in me.” The uniform, she said, wasn’t so different from the one she’d worn as a cheerleader. “And anything that I felt about it, I would turn around, and everybody else had it on, too.”","“There was always a girl there that would have your back,” Moore added. When I recounted my own experience of working at a restaurant, and the sting of secondhand humiliation I’d felt when a co-worker was sent home because her bra straps were showing, both women nodded sympathetically. A high-school classmate of mine who happily worked at Hooters for five years told me that she’d felt more objectified, and been more frequently harassed, when she got a job at a higher-end bar. Maybe there was something valuable in the Hooters approach of saying the quiet part out loud.","In 2018, the writer and director Andrew Bujalski released a film called “Support the Girls,” about the staff of a fictional restaurant called Double Whammies. (Hooters has inspired so many imitators, including Twin Peaks and Ojos Locos, that it’s considered the originator of a genre: the breastaurant.) When I asked Bujalski recently what drew him to the setting, he described it as a riddle: he liked “the idea that no two customers, no two waitresses, quite have the same idea of what this place is supposed to be and supposed to mean.”","A few weeks ago, I took my family to the Hooters in Long Beach, California, after a visit to the aquarium, a short walk away. Perhaps I shouldn’t have been surprised to count some thirteen children in the bustling dining room. As far as my own two kids were concerned, this was a restaurant designed for them: cute animal mascot; televisions on every wall; young women with the same friendly, patient countenance as their camp counsellors offering crayons, tater tots, and lemonade. The food exceeded no one’s expectations, but the beer was cold and the price was right. “I love Hooters!” my seven-year-old son declared. Who was I to argue with him? ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.09.02","day":79,"title":"Bring Back the Blue-Book Exam","source":"The Atlantic","minutes":10,"tag":"The Atlantic","dek":"The humble booklet is more than just a last redoubt against cheating. Staring down its empty pages, students discover what they’re capable of as writers and thinkers.","note":"2026.09.02","paragraphs":["by Walt Hunter","Across the faded blue covers of the exam books in my attic, I can trace the arc of my academic career. I can still see the grades I received on tests in “The Meaning of Abstraction in Modern Art” (A) and in Neurobiology (B–). Just the sight of the booklets is enough for me to feel the pressure to perform, to sculpt the contents of a semester’s worth of knowledge into some fresh shape. But by the time I became a college professor myself, in 2013, the blue book had begun to disappear. Why struggle to discern student penmanship, or risk misplacing a final exam in the trunk of one’s Subaru (to cite a completely hypothetical example), when tests, like everything else, can be administered on a laptop?","The coronavirus made every aspect of education virtual, but even after it abated, in-person final exams remained out of favor for many classes. Part of the reason was simply administrative—the challenge of finding faculty or graduate students to watch over the test-takers. But there was also a shift in how teachers appraised student learning. The blue book meant timed essays and handwritten work, modes of assessment that felt regressive, cruel. It recalled an age of higher education—punitive and bleak, the domain of Dickens’s stern Mr. Gradgrind—that the modern university was eager to outgrow. Not entirely, of course; some faculty still lugged boxes of blue books home in the snow and scribbled grades in red on the covers. But alternatives to the in-person exam proliferated: the capstone project, the take-home essay, the portfolio of selected work from the semester.","The blue book seemed destined to become a relic, as obsolete as cursive. But it had one virtue that hasn’t been easy to replicate: Cheating on a blue-book exam is difficult. When faculty moved away from in-person pen-and-paper exams, they assumed that cheating would be kept in check by honor codes, or by “locked” browsers, which would prevent students from accessing sites that would jog their memory or simply give them the answers. But these measures were never wholly effective. In a survey of undergraduates published in 2020, 62 percent admitted to cheating in some manner.","The advent of AI has only exacerbated the problem. In a matter of seconds, students can create an entire essay with the help of a chatbot. If they’re savvy, they can spend a bit more time to make it sound authentically human enough to evade detection by their professor. As my colleague Rose Horowitch has reported, such cheating has become so prevalent that Princeton recently gave up on its venerable honor code. For 133 years, students had signed a pledge not to cheat, and professors had trusted them to do the right thing. In May, in the face of rampant AI-enabled cheating, the university’s faculty voted to begin proctoring exams for the first time since the Gilded Age.","Rose Horowitch: How AI killed a 133-year-old Princeton tradition","Universities find themselves in a surprising position. The only reliable way to evaluate what students have learned may be to bring back pen and paper. Faculty are reverting to in-person, handwritten assignments and timed essays—anything that keeps assessments offline. The unlikely hero of the day is the blue book, sales of which are up by as much as 80 percent for some universities since 2023.","Yet the blue book is more than a last redoubt against cheating. Despite its antiquated appearance, the blue book encourages experimentation, even virtuosity. It deserves to live on not because of what it rejects but because of what it makes possible: thinking on the page, a hallmark of the humanities that is indispensable to their value—and essential to the kinds of human beings that a liberal-arts institution hopes to send out into the world.","The blue book hasn’t changed much for a hundred years or more, with its sky-blue tint and pale-red margin lines, its two neat staples and wide-open spacing, and its austere list of requirements on the cover (NAME, SUBJECT, CLASS, SECTION). The precise history of the blue book is lost to time. One origin story pinpoints its emergence in the 1920s at Butler University; the pamphlet is said to have borrowed its distinctive hue from the university’s colors. Harvard lore suggests that the blue book is older still: By one account, a classics instructor, Evangelinus Apostolides Sophocles, burned a stack of blue-book exams to protest the university’s move from oral to written examinations in 1857.","I realize that by advocating for the blue book in 2026, I might be engaging in the same opposition to progress as old Professor Sophocles. But to me, the blue book represents a timeless human activity—namely, trusting your mind to discover unknown capabilities.","Walt Hunter: Stop meeting students where they are","I think of my college-age self, looking up at the clock as I turned the page, crossed out a sentence, broke the tip of my pencil. I recall the satisfaction of filling one book and getting up from my desk to take another, the adrenaline of using my knowledge to improvise something and then having more to say. What I learned by writing this way was distinct from what I learned by composing a five-paragraph essay, with its thesis statement, staid structure, and rote deployment of argument and evidence. Any AI agent can mimic that template.","Taking a blue-book exam is an almost athletic endeavor, and not just because of the stamina it requires of both mind and hand. The test-taker is forced to compose an essay that will demonstrate their command of a semester’s or year’s worth of material. They have to summon the verve to tackle a prompt about the place of freedom in the American novel, or the value of a human life in Hamlet, or what Whitman meant when he said that “the United States themselves are essentially the greatest poem.” Staring down the empty pages of a blue book, I learned to throw myself into my writing. In the process, I discovered what I was capable of as a writer and a thinker. When you’ve done the reading and reviewed your lecture notes, you can feel like a basketball player whose hours in the gym made possible a transcendent playoff performance, or like a musician whose endless runs of arpeggios in a soundproof practice room allowed for a spectacular solo in the concert hall.","Not every student can put pencil to paper for 90 minutes without looking up. Even the strongest students can struggle, at first, to answer the question, or to organize their thoughts. But this, too, is a reason to love the blue book. When students write, they write into uncertainty. They court risk. No surrogate exists for feeling an idea form in your mind and trying to express that idea on the page. And wonderfully, for the instructor, the blue book documents how students strain their way to an answer or an argument. The marks on the page are indelible, and efforts to amend them leave marks of their own: furious erasing or hasty strike-throughs. The blue book is a record of first thoughts, instincts, intuitions.","These fits and starts and failed experiments are a good thing—for the education of the individual and for the health of a society. The humanities are distinguished by the habits of mind that they inculcate, not for their success in forcing students to memorize facts. Among the most significant of these habits are a nimbleness of thought and a flexibility of argument, the ability to draw connections between diverse sets of facts. Those habits are honed by writing under pressure. Challenged by the blue book, students learn to identify and stand behind their individual commitments. As their professor, I hope they carry that lesson beyond the classroom, beyond the university, and into the fractious world they enter as citizens.","From the July/August 2023 issue: A defense of humanity in the age of AI","Often the key insight arrives just as time is expiring, and I love how no part of the book is out of bounds for a final thought at the buzzer. “Education is the single greatest thing Thoreau believes in,” one student sneaks into the margins of the final for my American-literature course. For the teacher, this is the pleasure of the blue book—despite its uniform presentation and its rigid lineation, any part of it might reveal a sudden moonshot of an idea. Many of the best sentences appear on the back inside cover, such as this ending to an essay on Toni Morrison: “A good life is what we make it to be—now all we have to do is live it.”","Students, of course, know what they’ve been taught: the timeline of the English Civil War, the structure of a sonnet by Gwendolyn Brooks, the development of a motif in a Mahler symphony. But the blue book demands more than a recitation of facts. It asks students to demonstrate not just that they know when or where something happened, but why it did. It asks them not just who wrote a poem, or when, but what the poem conveys about the world in which it was written. The best-prepared students, the ones who inhabit the history and poetry and music that have made up the semester’s syllabus, find that they understand the material in ways they didn’t appreciate before they opened the blue book and the clock started ticking.","Proponents of artificial intelligence have promised that, by removing certain elements of the craft of writing, students can concentrate on making their work more polished and their ideas more clearly defined. That’s a dangerous ruse. To see what a student has learned, look at the moment when they struggle to begin—and then transcend that struggle to create something genuinely surprising. That’s the moment the full force of the writer’s mind takes possession of the process.","When we eliminate the possibility of writing badly or incoherently, we eliminate writing’s greatest satisfaction: the feeling that we have stepped outside ourselves and are watching our own words fall together in the right order. What I describe sounds like a state of grace, but it’s also a furious act of intellection and expression undertaken with only one’s study and wits to guide them. I’ve come to love handing out blue books on exam day and seeing the look of ready intelligence on my students’ faces. The essay they are about to write will be better than they think it can be. All they have to do is write it.","This article appears in the September 2026 print edition with the headline “The Blue Book Is Back.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/09/higher-education-in-person-written-exams/687954/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.09.02","day":80,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.09.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.09.05","day":81,"title":"Nvidia is driving the AI boom. Good","source":"The Economist","minutes":5,"tag":"Leaders","dek":"The chipmaker’s enormous bets are how capitalism is supposed to work","note":"2026.09.05","paragraphs":["Jensen Huang, Nvidia’s boss, is truly the magician at the heart of the AI boom. His firm’s share price is 14 times what it was on ChatGPT’s release in late 2022. The ten biggest public companies championing AI make up 40% of the value of the S&P 500 index. Nvidia alone accounts for 8% and unlike, say, Apple or Tesla, which make smartphones and cars, it is almost solely a bet on AI. The company has produced about 15 cents of every dollar the American stock market has returned since 2023—returns that have kept consumers spending despite rising interest rates, tariffs and a war with Iran.","Yet many also see Mr Huang as a magician in a more worrying sense, fearing that he is an illusionist inflating a dangerous bubble. Through $1trn-worth of deals, Nvidia provides data-centre landlords and AI labs with cash or guarantees so that they can buy its GPUs. Some call it the “bank of AI”. At the very least, Nvidia’s critics say, its financial engineering smacks of the “vendor financing” which pumped up the revenues of networking-gear makers like Cisco in the dotcom mania of 2000-01, whose collapse brought about a recession.","Look more closely, however, and the worries are mostly unjustified. If Nvidia’s bets on ai come good, they could accelerate the technology’s adoption, boosting productivity and living standards. If they misfire, the cost will fall chiefly on Nvidia’s shareholders. That is how capitalism is supposed to work.","True, the dotcom and AI booms share unnerving similarities: an exciting new technology, an epic bull run, hubristic tech bosses. Nvidia’s rise from seller of chips to video-gamers and cryptocurrency miners to linchpin of the economy has been so rapid that many people have yet to learn how to say its name (“en-vidia”, not “nuh-vidia”). This mirrors the ascent of Cisco, which in 2000 briefly also became the world’s most valuable firm. Just as Cisco’s sales of routers and switches presupposed exponential growth in web traffic, Nvidia’s GPU revenues assume endless demand for AI tokens.","Cisco was right about eventual demand but wrong about the timing—hence the dotcom crash. Today it is the pace of AI adoption that is hard to forecast. Set aside Claude-addled software engineers and usage remains fledgling. If it does not soon soar, Nvidia’s customers may call in the guarantees just as the chipmaker’s own sales nosedive. Since no one is sure how quickly GPUs lose their value, any used chips Nvidia repossesses may be worthless.","Nvidia’s financial wizardry is partly defensive. Its latest GPUs no longer have the market to themselves. Roughly half Nvidia’s revenue comes courtesy of America’s cloud-computing “hyperscalers”, chiefly Amazon, Google, Meta and Microsoft, which are designing their own silicon. Non-Nvidia AI chips account for 38% of the market, up from 26% in 2023. To stay ahead, Nvidia used to spend over a fifth of sales on research and development. Now it spends less than a tenth.","Last, the scale of Nvidia’s financial commitments can look terrifying. Morgan Stanley puts its overall credit exposure—ie, its modest borrowing plus support for customers—at $200bn by the start of 2029. In time Nvidia’s shadow debt could reach $300bn or more. It is a gargantuan sum: today only America’s six largest banks carry more debt.","Yet the differences from the dotcom boom are more important than the similarities. Nvidia’s balance-sheet is extraordinarily robust. The company has $99bn of cash and is churning out more. In each of the past three years annual sales have roughly doubled. Gross margins have fattened from less than 60% to 75%. Mr Huang’s cult-CEO status now rivals that of Elon Musk. But whereas Mr Musk's firms generate little cash (at Tesla) or burn lots of it (at SpaceX), Nvidia will yield about $200bn this year.","This means that, whereas Cisco used debt, Nvidia can use cash to backstop its deals with buyers of its GPUs. Even if its commitments came due and its cashflows levelled off starting next year, by 2028 it would still be less leveraged than all but 39 non-financial firms in the S&P 500 are today. Profits would need to drop by 60% from that plateau for Nvidia to forsake its investment-grade credit rating.","And demand for AI is not illusory, as it was for Pets.com and other revenueless dotcom darlings. The sales of Anthropic, the leading AI lab, shot up from $5bn in the first quarter to $11.5bn in the second. OpenAI, its main rival, is probably not far behind. The hyperscalers are also booking AI income. All told, AI may be earning American tech around $150bn a year, from nothing a few years ago. That is still far from the $2.5trn needed to cover AI capital spending, but growth is fast.","Mr Huang thinks that the biggest obstacle to the AI revolution is not lack of demand for AI but inadequate infrastructure. The markets will not provide capital on the scale that is necessary, so Nvidia is offering financing itself. Nvidia has an advantage in understanding the balance of risks and rewards. Although this bet is big enough to affect the economy, it is an entrepreneurial one. Every company that reinvests cash rather than returning it to shareholders also gambles that it can beat the market. Companies exist to make such concentrated bets. If investors want to diversify, they can do so themselves.","And Mr Huang is hardly alone. The hyperscalers, the world’s most successful companies before Nvidia came along, are making the same bet. So are some big names on Wall Street. Last month Goldman Sachs, BlackRock, Blackstone and others joined Nvidia in a $500bn data-centre initiative. And so are Mr Huang’s shareholders, who haven’t yet ru
