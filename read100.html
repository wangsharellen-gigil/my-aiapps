at the mission was “nearing completion,” and that the U.S. military would soon be pulling back. But if Tehran did not accept a deal, he added, “we are going to hit them extremely hard over the next two to three weeks. We’re going to bring them back to the Stone Ages, where they belong.”","Big talk. But the announcement also sounded like a concession, since two to three weeks probably isn’t enough time for Trump to follow through on some of his prior threats: an armed invasion of the oil ports of Kharg Island, or an even more ambitious raid to extract uranium likely stored in tunnels near nuclear facilities. The morning of Trump’s address, media reports had suggested that he was considering withdrawing the United States from NATO. Instead, the President taunted America’s allies, some of whom had been pleading for a settlement over Hormuz. “Build up some delayed courage,” he told them. If they want the oil to flow again, they should “go to the strait and just take it.”","It has been a central conviction of Trump’s second term that the nations of the world now operate on self-interest and brute force, rather than on principle or alliance, and the White House has been eager to spread the news. The mockery that the Administration directed at its own, less warlike allies this week (“Last time I checked, there was supposed to be a big, bad Royal Navy,” the Secretary of Defense, Pete Hegseth, said on Tuesday) recalled its jeering of Volodymyr Zelensky in February, 2025. “You’re buried there,” Trump told the Ukrainian President about his nation’s battlefield prospects.","This penchant for what Saul Bellow called reality instruction—the cynical delight taken in explaining to idealists how the rough-and-tumble world really works—extends from Trump throughout the Administration. But perhaps the most eager reality instructor has been Hegseth, one of the Administration’s more politically fragile figures, who, when he’d been picked to join Trump’s Cabinet, was a co-host of “Fox & Friends Weekend.” Hegseth is so committed to a vision of the world defined by winners and losers that he once wrote that Joan of Arc was a “loser” because her last battle “ended disastrously and eventually with her execution.”","Hegseth came out of his own service, in Iraq and Afghanistan, with the seeming conviction that what had stood in the way of a fuller victory in those wars had been the restraints supposedly placed on how soldiers could kill. (In 2019, he successfully lobbied Trump to pardon two soldiers charged with or convicted of alleged war crimes.) “We unleash overwhelming and punishing violence on the enemy,” Hegseth told a large gathering of senior military officials, whom he had summoned to Quantico, in September. “We also don’t fight with stupid rules of engagement . . . just common sense, maximum lethality, and authority for warfighters,” he said. “You kill people and break things for a living.”","On Iran, Hegseth has led the Administration’s periodic press briefings, at which he has called on Americans to pray to Jesus Christ for the military’s success; his slogan has been “maximum lethality.” But even in the first hours of the war it was clear that this approach could backfire. The initial strikes, which began on February 28th, killed the Supreme Leader, Ayatollah Ali Khamenei, but were so indiscriminate that, as President Trump noted, they also killed many of the political figures who the White House had hoped would form a new, more amenable cadre of leaders. “Most of the people we had in mind are dead,” he said a few days later. The ones remaining, even if Trump didn’t want to acknowledge it, were generally described as more hard-line. One of the President’s stated aims has been to inspire a popular uprising among those Iranian citizens sick of the repression and the autocracy enforced by the Revolutionary Guard. Yet that requires taking care to distinguish between the regime and its civilians, and to avoid collateral damage. But, according to a preliminary investigation, on the same day that U.S. forces assassinated Khamenei, they also dropped a bomb in the wrong place, inadvertently killing nearly two hundred people in an elementary school.","Trump and Hegseth might wish that they lived in a world where whoever dropped the most bombs got whatever he wanted. But the Iran war has shown that this isn’t true. The old liberal institutions may be teetering, but that doesn’t mean that all that’s left is the law of the jungle. The fact that the President is now signalling a messy retreat has nothing to do with insufficient lethality and everything to do with politics—in particular, the alarm in the global oil markets and the American public’s widespread opposition to the war. One tragedy of Trump’s war is that, in January, the Iranian regime was under extreme pressure from protests, which it quelled by murdering thousands. The right kind of coördinated push might have toppled it. Instead, the White House offered frequently shifting rationales for its war and little outreach to the Iranian resistance. It treated the military operation as something to brag about to its political base—a way to show exactly how unrestrained it was willing to be.","The day before the President’s address, Hegseth gave a press conference in which he recounted a recent visit he’d made to bases in the region. “It was the American warrior, unleashed,” he said. He seemed to view the trip as a parable. “As the sun was going down and a chill was setting on the tarmac,” he encountered an airwoman and asked her what the troops needed: “She simply looked at me with a sly smile on her face and said, ‘More bombs, sir. And bigger bombs.’ ” That might have been what the airwoman asked for. But what Trump and Hegseth really owed her, the nation they lead, and the Iranians whose country they bombed was a plan—a real solution to the disaster that they have created. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.04.18","day":31,"title":"America wakes up to AI’s dangerous power","source":"The Economist","minutes":6,"tag":"Leaders","dek":"After Mythos, a laissez-faire approach is no longer politically tenable or strategically wise","note":"2026.04.18","paragraphs":["SHOULD A HANDFUL of men be entrusted with the world’s most potent new technology? Five geeks so famous that they can be identified by their first names—Dario, Demis, Elon, Mark and Sam—exercise almost godlike command over the artificial-intelligence models that will shape the future. The Trump administration has stood aside even as those models have gained jaw-dropping capabilities, convinced that unfettered competition between private firms is the best way to ensure America wins the AI race against China.","Until now. Suddenly, America’s free-wheeling treatment of AI looks as if it is coming to an end. The reason is that the models’ dizzying progress also poses a threat to America’s own national security, unnerving members of the Trump administration previously more inclined to worry about overregulation. At the same time, growing resentment among American voters is turning AI into a political lightning-rod. A laissez-faire approach is no longer politically tenable or strategically wise.","The watershed was Anthropic’s announcement of Claude Mythos on April 7th. The model-maker’s latest creation is so startlingly good at finding software vulnerabilities that, in the wrong hands, it would threaten critical infrastructure, from banks to hospitals. AI models increasingly pose other risks, too, from biosecurity hazards to industrial-scale scamming.","Anthropic’s boss, Dario Amodei, wisely thought Mythos too dangerous for general release. Instead he has reserved it for use by around 50 big firms, in computing, software and finance, so that they can boost their own defences. America’s treasury secretary, Scott Bessent, was so unnerved that he summoned the biggest banks for urgent talks.","It was not the first time the administration had acted. Only weeks ago the Pentagon stepped in after Mr Amodei refused to allow Anthropic’s model to be used in fully autonomous weapons or for mass domestic surveillance. Then, too, the Trump administration was alarmed—because of the power a single firm wielded over a technology central to national security.","A backlash among voters will add to the pressure on the administration to intervene. Opinion polls are leading ever more politicians to think that AI will be one of the big issues in elections in 2028. Americans are far more sceptical of AI than people in other countries. Seven out of ten think AI will hurt job opportunities, a sharp rise from a year ago (and well before they have good evidence). Grassroots opposition to data centres is surging, even though AI has little or nothing to do with rising electricity prices. In a sign of the times, the house of Sam Altman, the head of OpenAI, has been attacked twice in recent days.","History suggests that, with a technology as world-changing as AI, a Mythos moment was inevitable. From John D. Rockefeller to Henry Ford, America’s great industrial innovations were led by a small number of men who grew immensely powerful. Eventually, 20th-century governments stepped in to tame over-powerful industries, from the trust-busting that broke up Standard Oil to the creation of the Federal Reserve and the breakup of AT&T. Those times were at least as polarised and febrile as today’s are. And our calculations suggest that the AI gods are not yet any more dominant than their historical predecessors were.","But history also suggests that controlling AI will be fraught. That is partly because the stakes if things go wrong are so high. It is also because AI is evolving at warp speed.","The trade-offs are acute. Economic growth will benefit from rapidly diffusing AI’s benefits, but the potential backlash could easily lead to overregulation. Doing nothing could leave America vulnerable to malevolent AI-induced chaos, but regulatory overkill would ensure that China wins the AI race. That makes this a perilous moment.","Time is short. Two years ago, during the Biden administration, discussions about regulation were largely about AI’s potential risks. Today its capabilities are already alarmingly powerful and growing more so with every release. The pace of innovation means that debates over the proper role of government, which played out over years, even decades, in the past, now need to be resolved in months.","And the technical hurdles to a more interventionist approach are daunting. Tools of government control, such as nationalisation, are ineffective because talented engineers can move freely between companies and computing power is a commodity. Worse, the leading model-builders are only months ahead of their open-source competitors, including those in China. Sooner or later the capabilities of their models will be available to all.","Even so the Mythos moment could be when a workable scheme to control AI starts to take shape. Trusted users would get early access to the most powerful new models: OpenAI is following Anthropic by rolling out its latest tool to a limited group of vetted cyber-security professionals. Before allowing these models to be broadly commercialised, the government could demand certification from industry-led bodies that have tested them for different uses.","This idea has advantages for the big model-builders and the government alike. It avoids the lengthy process of creating a new regulator. By allowing only a few premium users, it enables the model-makers to charge higher prices and limit the use of scarce computing power. Meanwhile, the government can restrict who can use the most powerful models, reducing the risk that China can copy them and catch up faster.","But it also suffers from grave problems. Limited release will reduce competition and increase the clout of entrenched AI companies. It will slow the diffusion of AI’s benefits and create a two-tier system within America’s economy, disadvantaging the many firms that are repeatedly deprived of privileged early access to powerful new models. What if making AI defences takes a long time or is impossible? What about open-source models? How can you insist that they also follow these rules?","A regulatory system built on these foundations could prove unjust. Insiders could secure themselves against frontier threats; outsiders would have to hope for the best. The opportunities for lobbying and outsize profits would be immense. That would test the honesty and competence of the most openly corrupt administration of America’s modern political era. And a fix that concentrates power and wealth yet further among the handful of AI gods risks aggravating the very political backlash that is starting to worry Washington.","Moreover, the Mythos approach can be only half the solution. AI safety cannot be secured nationally. Eventually it will demand international co-operation, starting with China. The new focus on cyber-security also needs to be matched by urgent thinking about the economic and social effects of AI. Dealing with the disruption to jobs and designing an AI-adapted tax system that favours labour are huge problems for which no one yet has good answers. This needs to change. The Mythos moment is a wake-up call for AI safety. It demands hard thinking in other areas, too. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/04/16/america-wakes-up-to-ais-dangerous-power"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.04.20","day":32,"title":"Trump’s Strategic and Moral Failure in Iran","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.04.20","paragraphs":["From the first day of his Presidency, Trump has posed an emergency to both his country and the world.","Not many years ago, a ruthless man with an uneasy mind took power in his country and created a cult of personality. In the center of the capital, he erected a gold statue of himself that rotated with the sun. He stashed billions in a foreign bank. He closed the academy of sciences, the ballet, the philharmonic, the circus, and all provincial libraries. His autobiography became the nation’s spiritual guide. He banned dogs from the capital for their “unappealing odor.” He renamed the months: January for himself, April for his mother. He was fond of melons. The second Sunday of August became National Melon Day. Such was the world of Saparmurat Niyazov, Turkmenistan’s leader from 1985 until his death, by cardiac arrest, in 2006. For the Turkmen people, there was nothing comical about life under his dictatorship. He barred dissent and packed his jails with prisoners of conscience. The only consolation was that he could not impose his grandiosity on the globe.","Donald Trump, by contrast, has, from the first day of his Presidency, posed an emergency to both his country and the world, even as he has ceaselessly invoked the language of “emergency” to inflate threats, suspend norms, and expand his own power. A decade ago, he was already making statements that flouted the ordinary standards of adult behavior. When it came to North Korea, for example, he alternated between cooing words of affection for Kim Jong Un and issuing taunts that mixed nuclear brinkmanship with masculine insecurity: “I too have a Nuclear Button, but it is a much bigger & more powerful one than his, and my Button works!”","Trump embodies the notion that, with age, you become what you always were, only more so. In the final days of the 2024 campaign, he met with the Wall Street Journal’s editorial board. When asked whether he would deploy the U.S. military if China, under Xi Jinping, were to blockade Taiwan, Trump replied, “I wouldn’t have to, because he respects me, and he knows I’m fucking crazy.”","The MAGA coalition has long countenanced Trump’s bigotry and cruelty. But now, with the repeated violations of an America First foreign policy, his poll numbers have plummeted. Since returning to office, Trump has ordered military strikes on Iraq, Nigeria, Somalia, Syria, Yemen, Venezuela, and Iran, and has felt little need to provide a coherent rationale for any of them. According to reporting by Maggie Haberman and Jonathan Swan, of the Times, Trump and his national-security advisers gathered in the Situation Room on February 11th to listen to the Israeli Prime Minister, Benjamin Netanyahu, argue for a coördinated attack on Iran. Even though the Secretary of State, Marco Rubio, the C.I.A. director, John Ratcliffe, and the chairman of the Joint Chiefs of Staff, Dan Caine, made their reservations plain—Rubio called Netanyahu’s talk of regime change “bullshit”—Trump blundered ahead. And, as in the days of the Turkmen dictator, everyone fell into line.","But when the Iranian regime failed to collapse or capitulate, when Netanyahu’s prediction of a national uprising failed to materialize, Trump turned to threats of war crimes and genocide against the very people he claimed to be helping liberate:","A whole civilization will die tonight, never to be brought back again. I don’t want that to happen, but it probably will. However, now that we have Complete and Total Regime Change, where different, smarter, and less radicalized minds prevail, maybe something revolutionarily wonderful can happen, WHO KNOWS?","These were not the words of a strategist. They were the words of a maniac. And they had a galvanizing effect, though hardly in the way Trump might have intended. Some of his erstwhile acolytes—Marjorie Taylor Greene, Tucker Carlson, Alex Jones—seem to have woken up to how dangerous he has always been. Yet around the Cabinet table, at Mar-a-Lago, and in the Republican caucus on Capitol Hill, it is gospel that his deranged threats forced a ceasefire and scored a major victory. The President’s war, though, seems poised to achieve little that was not already available through prewar diplomacy, or through some renewed version of the Joint Comprehensive Plan of Action, or J.C.P.O.A., the Iran nuclear deal secured by the Obama Administration.","In fact, the original sin of this disaster was Trump’s abandonment of that deal, in 2018. For all its limits, it had stalled Iran’s march toward an atomic weapon. But Netanyahu, long eager for a full-scale war against Iran—aimed not only at its nuclear program but at its proxies, such as Hezbollah—shrewdly played on Trump’s vanity and his contempt for Barack Obama. Trump destroyed the J.C.P.O.A. with nothing to replace it.","So the war stands as a strategic failure and a moral calamity. The ceasefire is already fragile. “The whole point of this exercise was supposedly to advance the cause of freedom in Iran,” Karim Sadjadpour, a Washington-based specialist on the country, said. “To go from ‘help is on the way’ to ‘we are going to wipe out your civilization’ is strategic malpractice.” According to Danny Citrinowicz, an Iran expert who formerly worked in Israeli intelligence, Trump’s principal envoys to the region, Steve Witkoff and Jared Kushner, almost certainly misread Iran’s capabilities and intentions. “This is a colossal disaster and should never have happened,” Citrinowicz said, noting that it will “haunt the region and world for many years to come.”","In the opening days of the war, the United States and Israel killed Ayatollah Ali Khamenei and wiped out much of Iran’s defense and intelligence leadership, apparently believing that the regime would somehow give way to “moderates” and “pragmatists.” Instead, the theocracy and the Islamic Revolutionary Guard Corps remain in place, equally radical, equally repressive, and more determined than ever to acquire the ultimate deterrent: a nuclear weapon. Why give up that pursuit, as Libya did, and leave yourself exposed, when you can, like North Korea, achieve it and deter attack?","Trump has gone far toward shattering what’s left of America’s global stature. His preposterous bluster about Greenland, Cuba, and NATO has undermined the postwar alliance. He has humiliated and betrayed the Ukrainian President, Volodymyr Zelensky. And all the while Vladimir Putin, who aims to press Ukraine for still more territory, and Xi Jinping, who keeps Taiwan in view, watch the spectacle of Donald Trump for what it reveals about both his instability and the cratering credibility of American leadership.","In the midst of the war, Trump released plans for his Presidential library. Its centerpiece will be an auditorium with an immense gold statue of himself. Whether it will turn with the sun is not yet known. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.04.25","day":33,"title":"America is vulnerable to electoral vandalism","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Too many no longer believe elections are fair","note":"2026.04.25","paragraphs":["Largely because Donald Trump is so unpopular, his party will be trounced in the midterm elections in November. That is what The Economist’s new forecasting model currently says. Democrats are almost certain to win the House of Representatives. They could even flip the Senate—a surprise for election nerds, because the map in this cycle strongly favours Republicans. Yet although the outlook for Democrats is good, for America’s democracy it is alarming.","Each party has come to see the other lot as cheats. Repeated meddling in election machinery by the president and his party, and their false claim that victory was stolen from them in 2020, have undermined voters’ belief that elections are fair. The degrading contest to gerrymander congressional seats, the most intense in memory, further tells Americans that their politicians want to rig outcomes rather than compete.","Some Democrats worry that Mr Trump will steal the midterms. That is unlikely. But you don’t have to expect the worst to fear the trend. Elections are not just about voters picking a winner; they are also a device for persuading the losers to accept the legitimacy of their opponents’ claim on office. Sooner or later, the losers’ loss of faith will cause a crisis.","Midterm worriers can point to motive and opportunity. Losing the Senate as well as the House would sting Mr Trump. The closeness of the Senate contest gives him a chance to meddle again. The midterms could also be a dry run for an attempt to steal the presidential election in 2028. Mr Trump’s constant efforts to weaponise the courts against his domestic enemies suggest he believes more than ever that rules are for losers.","The worriers can also point to the president’s behaviour. He has issued executive orders to take bits of election administration away from the states and put the federal government in charge, supposedly to make the system more trustworthy. That is a familiar Trump move: first, identify a real flaw (a lack of trust he helped engender), then propose a plan that makes the problem worse (grabbing more power for himself). His scheme is unconstitutional and will probably fail. But it reveals his intent: if he could seize the running of elections, he surely would.","If Mr Trump cannot change the rules, he could still try to interfere on election day. In some places conspiracy theorists will be in charge of ballot boxes; some may believe the election in 2020 was stolen. Some MAGA loyalists have suggested he should dispatch ICE agents to polling stations to stop foreigners from voting illegally (which almost never happens). That would be illegal and the courts would swiftly say so. The administration has been ambiguous. But, should the temptation arise, it would not be hard to work out where to direct them: Democratic areas of Alaska, Maine or Ohio, where control of the Senate will be decided, and where scaring minorities into staying at home could help Republicans. Even if this did not change the result, it would sow distrust, which could provide a platform for post-electoral mischief.","After the votes are counted, the president’s party could once again file lawsuits, as it did the last time he lost. In 2020 judges threw them all out, a reminder that Americans can have confidence in their courts. But MAGA World is litigious and has plenty of money. Never conceding defeat has become its organising principle. The cases could drag on well past November 3rd. A loss in the courts is likely eventually, but the idea that someone, somewhere, has stolen the election may grow.","Given such a litany of risks, you can understand the predictions of imminent doom. So it is worth underlining that, although America’s electoral system is untidy and frequently confusing, with rules that vary from place to place, it still works. The constitution says that elections will be administered by the states, not the federal government. That limits any president’s ability to mess with them. Even within states, election administration is decentralised, relying on county officials who take their jobs seriously, and on the sort of doughty volunteers usually found at bake sales. Across the country, officials committed to the integrity of the vote are preparing to repel attempts to undermine it.","Instead, the damage is more likely to be further vandalism rather than outright theft. The world’s democratic superpower, whose idealistic system of government was long admired elsewhere, is now also a cautionary tale about how fragile trust is. Only 25% of voters say they are confident the midterms will not suffer interference. A majority in both parties think the other side is too extreme. Only 10% say both parties are honest and ethical. In a recent poll, more than half of Americans reckoned their fellow citizens were morally bad; only 17% of Britons and 7% of Canadians did so. That is a gloomy way for America to celebrate its 250th birthday this summer.","This mistrust is not all the president’s doing. Polarisation predates him; changes in media and technology matter. But a lot of it is. Trust in elections dipped after the Supreme Court decided Bush v Gore after the vote in 2000. Then it recovered, until Mr Trump came along. He has relentlessly sought advantage by casting doubt on the good faith and honesty of anyone who opposes him, from whichever party. Politicians like to claim that the election they are competing in is the most important of their lifetime, but Mr Trump raises the stakes by framing each contest in existential if not apocalyptic terms.","That may turn out to be this president’s most enduring domestic legacy. Although he probably cannot steal the midterms, he may well further damage democracy. Dangerous ideas are taking root. If the other side are thieves and traitors, as he often suggests, partisans may once again feel that rising up after an election is their patriotic duty. If the result is close, they may reason that treachery is what got the other side over the line. If the other lot stole the election, to impose their policies on all Americans would be wrong. By taking away Americans’ trust in each other, Mr Trump is making it easier for future would-be strongmen to exploit their loathing. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/04/23/america-is-vulnerable-to-electoral-vandalism"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.04.27","day":34,"title":"J. D. Vance’s Bumpy Ride","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.04.27","paragraphs":["It wasn’t the first time that Trump had debased someone who serves him. It wasn’t even the first time that Vance had had to downplay a blasphemy-themed A.I. image.","As recently as a week or two ago, Vice-President J. D. Vance was talking like a man who felt that the odds were in his favor. He’d flown to Hungary to attend a campaign rally for Prime Minister Viktor Orbán, the most Trumpian of European leaders, and, before leaving, he told reporters at the airport how kind the Hungarian people had been to him. Asked about the war in Iran—the day before, Donald Trump had threatened to destroy the country’s “whole civilization”—Vance suggested that Iran’s insistence on its “right” to enrich uranium might actually represent an opening for a deal. As he put it, “I thought to myself, you know what? My wife has the right to skydive, but she doesn’t jump out of an airplane, because she and I have an agreement that she’s not going to do that, because I don’t want my wife jumping out of an airplane.”","The days that followed were a bleak reminder that whatever rights Vance may think he has—to his dignity, to his faith, or to his position as the MAGA heir apparent—are contingent on the agreement he made to subordinate himself to Trump. And the President doesn’t seem to mind if Vance humiliates himself running errands. Indeed, Trump has treated a new ballroom as more important to his legacy than his Vice-President is.","Vance had barely wrapped up in Hungary before Trump dispatched him to Pakistan to negotiate with the Iranians. Vance, an Iraq veteran, had reportedly opposed the war, and Trump had not been subtle about wanting to implicate him in its progress. That round of talks fell apart after twenty-one hours, an event that was followed, in quick succession, by Orbán’s defeat; Trump’s attack on Pope Leo XIV, who had condemned civilization-destroying (“WEAK on Crime”); and the President’s posting of a now notorious A.I.-generated image of himself as a robed Christ figure.","Trump deleted that post, claiming that he’d thought the image showed him as a doctor. Vance told Fox News that the President had taken it down because “a lot of people weren’t understanding his humor.” Was an element of the President’s humor insulting the Pope right after Vance had announced that his new book, “Communion: Finding My Way Back to Faith,” would be out in June? Vance converted to Catholicism in 2019, after the success of his first book, “Hillbilly Elegy”; in that period, he was pursuing a venture-capital career, backed by Peter Thiel. (In 2022, Vance was elected to the Senate, from Ohio.) Vance has said that his faith was inspired by St. Augustine, but, again, his pact is with Trump. He was promptly put to work telling Leo to stay out of Trump’s way and to be careful when he spoke about “matters of theology.”","Vance, whose wife, Usha, is expecting their fourth child, might have seen this coming. The plight of Vice-Presidents, with their ill-defined role, is well known, and it is not the first time that Trump has debased someone who serves him. It’s not even the first time that Vance has been deployed to downplay a blasphemy-themed A.I. image. Last May, soon after Pope Francis died, Trump posted a portrait of himself as an enthroned Pope. At the time, Vance said, “As a general rule, I’m fine with people telling jokes and not fine with people starting stupid wars that kill thousands of my countrymen”—a reminder of how the Administration’s goals have morphed. Trump, who once demanded a Nobel Peace Prize, started a war of choice in Iran, inflicting damage that a deal can’t undo.","The American right, too, is in a shifting, querulous state. Last week, at an event in Athens, Georgia, for Turning Point USA, the organization that Charlie Kirk led before his assassination last September, Vance acknowledged that “this Iran thing” had been divisive. Republican opponents of the war, still a minority in their party, according to polls, are a heterogeneous group. Some regret Trump’s bypassing Congress. Many working-class red-state voters—for whom Vance’s right-populist brand is designed—seem dismayed by the spike in gas prices and the neglect of problems at home. There are manosphere anti-interventionists (Joe Rogan, Theo Von). Meanwhile, in a very loud corner of MAGA world, inhabited by Tucker Carlson and Marjorie Taylor Greene, the pressing question is how the “Epstein class” managed to corrupt Trump, bending him to its will and Israel’s. And there is talk, apparently in earnest, about the Antichrist. The situation is one of ideological ferment, rather than a reversion to some Romneyite center.","The Turning Point event was meant to feature Vance and Erika Kirk, Charlie’s widow. She cancelled at the last minute, citing unspecified threats to her safety. Onstage, Vance spent ten minutes complaining that certain people doubted Erika’s grief; he decried them as “full of shit” and insufficiently focussed on “left-wing networks of violence and terrorism.” Many in the audience would have guessed that he was referring to Candace Owens, a podcaster with nearly six million YouTube subscribers, who was once a key figure at Turning Point. She has been pushing cartoonish claims groundlessly linking Erika to a supposed vast conspiracy related to her husband’s murder. For what it’s worth, Owens is against the Iran war. (She has also raised doubts about Vance, in part because of his ties to Thiel.)","Trump reportedly enjoys asking associates whom they see as his heir: Vance or the Secretary of State, Marco Rubio? But, if Vance’s bumpy ride is any indication, the G.O.P. field may get both wider and weirder, with a primary that puts the Party’s internal resentments on full display. Still, it would be wrong to view Vance as simply an object of scorn or even pity—devout J.D., an ideas man who just wanted peace and maybe a promotion. He is the same opportunistically malleable demagogic provocateur who, during the campaign, got Trump worked up about migrants allegedly eating cats and dogs. He hasn’t shed his affinity for the Viktor Orbáns of the world. Trump recently named Vance “fraud czar,” with a focus on “CROOKED DEMOCRAT POLITICIANS.” He is building a network of big donors. He may yet be President.","Vance does have a noteworthy power as Vice-President: only he can initiate the process, under the Twenty-fifth Amendment, for removing a President deemed unable to discharge his duties. (The Cabinet and Congress also play a role.) The idea that he might do so is, for now, a fantasy. But another aspect of his constitutional role is that the President can’t fire him. So Trump will still have Vance to kick around, whether either of them likes it or not. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.05.02","day":35,"title":"Oil markets are still in La La land","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Prices have risen sharply. Unfortunately, they still have further to go","note":"2026.05.02","paragraphs":["SoMEONE WAS sniffing the butane. Energy experts have long warned that the war in Iran was causing the biggest oil-supply shock in history. The closure of the Strait of Hormuz shut in 14m barrels a day of oil. To destroy that much demand, they said, the price of Brent crude should be more than double its pre-war level, at well over $150 a barrel. But oil traders were in a stupor. As recently as April 17th prices were below $90 a barrel. Over the past week, on talk of renewed fighting, they have been waking up. On April 30th prices spiked above $125.","Unfortunately, as bad as things are, the disconnect with reality endures. Not only may spot prices have further to climb, but the oil-futures market, in which speculators bet on where the oil price is going, says prices will fall every month for the rest of the year, ending 2026 at about $88. That implies most of this shock will soon be reversed. If so, traders must believe three things are true: that America and Iran will soon strike a peace deal; that their agreement will reopen Hormuz; and that, soon after the strait is clear, petrol and jet fuel will once again be plentiful. All those are in doubt.","One thing everybody should be able to agree on is that for the strait to stay shut would be a disaster. At the start of the war, lots of oil was in stocks or tankers at sea. But the ships that passed through Hormuz before the conflict had all docked by April 20th. Oil stocks will soon be at their lowest since satellite tracking began in 2018. Volumes of petrol, diesel and jet fuel at sea are already so low that gaps in supply will be inevitable. And in America petrol demand is about to surge, as the summer tempts people to get in their cars and drive.","Everybody should also acknowledge the stakes. Asia’s petrochemical industry has already idled capacity. Since the war prices of diesel and jet fuel have doubled in Asia and more than doubled in Europe. Unlike stockmarkets, where bubbles can be sustained by animal spirits alone, the price of oil is tethered to the economy at petrol pumps, docks and airports. If supply falls short of demand, prices must rise to bring about balance. There are already reports of barrels of diesel selling for $600. Good cheer cannot supplant reality.","The case for optimism is obvious. Donald Trump’s wild posting signals not just that he is rudderless, but also that he will step in whenever oil prices rise too high. Iran’s economy is broken: it urgently needs cash, which means it, too, will want a deal. If an impasse brings ruin to both sides, it will end.","The Economist is loth to second-guess those who have the facts to hand and billions of dollars at stake. However, markets have a poor record of pricing geopolitical risk. And with oil, they struggle to assess the complexities of the physical trade.","Even if a deal is in both countries’ interest, it could be hard to nail down. Each side may be underestimating the other. Mr Trump seems to think he holds all the cards. But Iran has endured long disruptions to its oil exports before, at the onset of Mr Trump’s “maximum pressure” sanctions campaign in 2018. Iran is not a democracy and the regime can survive while its people suffer. It has an incentive to hold out in the hope of a good offer for as long as it can. Mr Trump can resume the bombing, but that is as likely to delay a deal as catalyse one.","Likewise, with midterm elections looming in America, Iran’s leaders may think that Mr Trump cannot tolerate a high oil price. Yet Mr Trump is selfish. He may try to constrain price rises at home by limiting exports of refined products. The midterms are already lost, in the House at least, he may think. He is surely less bothered about the careers of Republican politicians than his own humiliation if he strikes a nuclear deal with Iran that looks worse than Barack Obama’s in 2015. His latest signal to Iran is that he is hunkering down for a long blockade.","Even if a deal is struck, the strait may not completely re-open. For one thing, the fearsome details of a nuclear pact will take months to negotiate. Now that Iran has discovered that it has leverage, it may be tempted to apply pressure with threats to close the strait again. And threats can lead to attacks. Perhaps Mr Trump will put the eradication of the nuclear programme before the complete re-opening of the strait—after all, America is an energy exporter. Supposing that America agreed to let Iran treat Hormuz as a tollgate, what then?","And even if the strait is open in principle, getting fuel into fuel tanks in practice will remain vulnerable to many unknowable delays. You can expect a rush of oil as waiting tankers escape fully laden into the Indian Ocean. But for empty tankers to return to the Persian Gulf will be more complicated. Many will have taken up bookings on other routes. The strait will need demining, which could take months. Insurance rates could be prohibitive, so governments may need to organise a scheme to cover extreme risks. Shutting down production could have damaged oil wells. Restoring output will also take time. Partially mothballed refineries won’t immediately return to full capacity.","The world is only starting to get to grips with what may lie ahead. Central banks may soon face the second inflationary shock of the decade, after the covid-19 pandemic. In Asia many governments have already taken drastic measures, such as shortening the working week. Europe’s governments will also have to change gear. So far they have focused on supporting consumer demand. They may have to deal with demand destruction—and, given the possibility of shortages of diesel and jet fuel, plan to protect food-delivery and vital services.","Bullish investors could be in for a nasty shock, too. The recovery from covid, Europe’s adaptation to the loss of most Russian gas and Mr Trump’s moderation of his tariffs have all led traders to trust that things always work themselves out. Amid strong corporate profits in America it may seem as if the world economy can bear any shock—and that Mr Trump will obviously back down before a catastrophe. The pain of a scenario that oil analysts have feared for decades is approaching. It will not be pretty. Get ready. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/04/30/oil-markets-are-still-in-la-la-land"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.05.02","day":36,"title":"Have Accommodations Become an Unfair Advantage in Higher Education?","source":"The Atlantic","minutes":8,"tag":"The Atlantic","dek":"Readers respond to “Accommodation Nation”","note":"2026.05.02","paragraphs":["Accommodation Nation","In the January 2026 issue, Rose Horowitch reported on American colleges’ extra-time-on-tests problem.","As a teacher and an administrator with more than 40 years of experience providing special-education services in public schools, I have watched the evolution of awareness and support that Rose Horowitch describes. The Americans With Disabilities Act was meant to level the playing field by removing obstacles to publicly funded services for anyone identified as disabled. It was not enacted to provide advantages. But that has begun to change.","The root of the abuses, I think, is in the language of the law. The vagueness of crucial terms allows for easy manipulation of the eligibility process. The determination of a disability has become more subjective. Compassionate educators and invested parents can easily over-identify disabilities. I have seen students who perform extremely well on psychoeducational assessments and meet or exceed all grade-level standards put on an accommodation plan based on mild distractibility or slow written output.","Thanks to the ADA, many students who need support are seeing futures that otherwise would not have been possible. Yet the disproportionate number of “disabled” but high-achieving students at secondary schools reflects the pressure that students and their anxious parents feel to find any edge in a society where young adults face shrinking opportunities for gainful employment, secure incomes, and stable communities. These circumstances have turned a well-intentioned law into a ticket for advantages.","Patty Bell Deerfield, Mass.","I recently graduated from law school in Canada, where the accommodations framework is very similar to that of the United States. I can confirm that the issue is quietly but frequently discussed among students. Because many law schools apply a curved grading system, students without time-based accommodations sometimes feel that attaining an A is virtually impossible. Numerous students conveyed to me a sense of disillusionment: No matter how diligently they prepare, they may still receive a B+ simply because the A-range grades have been taken by those who had twice the time to complete the assessment.","In response, some of my peers sought accommodations themselves—sometimes out of legitimate need, but sometimes because of the competitive pressure created by the system. This situation warrants careful reexamination. Short of eliminating accommodations—which would be contrary to human-rights principles and entirely inappropriate—the most constructive solution may be to reconsider the role of time limits in assessments altogether. Providing all students with a reasonable and uniform timeframe in which to demonstrate their knowledge, without excessive time pressure, may help restore both fairness and clarity in evaluation.","David Kantrovitz Maple, Ontario, Canada","I am a former college disability-services professional who worked for more than 24 years in both two- and four-year institutions. Before entering the field professionally, I myself was a student who used accommodations in the early and mid-1990s. Although it is absolutely correct that the 2008 ADA amendments, the expanded assessment guidance, and the dramatic rise in ADHD, anxiety, and depression diagnoses among young people have all contributed to the increase in students receiving accommodations, so, too, has the corporatization of higher education.","Today, universities treat their students as customers. Rising tuition costs have forced administrators to adopt a customer-service model, which in turn has heightened pressure on staff to keep students and their families satisfied. Academic accommodations are often folded into the model, and disability-services providers are encouraged to waive or dilute documentation standards. This can improve access for students who lack financial resources, but my experience has been that the students who benefit the most are those with means. Demanding parents expect institutions to remove every obstacle to their children’s ideal college experience. This environment makes it extremely difficult for disability-services professionals to apply consistent standards or to make thoughtful, evidence-based decisions about which academic adjustments are genuinely warranted and which are simply desired.","Chris Kinney Crozet, Va.","I was born with optic atrophy and am just blind enough to be designated “legally blind.” In 1961, I was completing a master’s degree at the University of Chicago; I needed only to pass a language exam to graduate. These exams were given in a huge room in an old stone building with little windows up near high ceilings. I didn’t have enough light to read. I failed. I went from one office to another requesting permission to take the test again with a lamp. No one seemed to have the authority to grant my “outrageous” request. I finally found a dean who laughed with me at the absurdity. He arranged for me to retake the exam with a good reading lamp. I thanked him. I took the exam again, and I passed.","Naomi Woronov New York, N.Y.","I am a professor at a nonselective public university who attended an elite university with accommodations for both physical and learning disabilities. I have students who would really benefit from accommodations but do not seek them. Many of these students have been raised in households and communities that stigmatize disability or seeking help.","The Americans With Disabilities Act exists in an inequitable context—so of course economic inequality can hamper its application. But making accommodations harder to obtain is the wrong solution. Perhaps we ought to consider a more radical approach: rethinking pedagogies to be more inclusive so that accommodations are rendered moot. Unless the learning objective of a course is specifically to do something quickly, wouldn’t it be better if everyone had the time and means to demonstrate their mastery of a new concept or skill? We don’t lower academic rigor by making accommodations universal—we give students the ability to fully demonstrate what they’ve learned.","Miranda Worthen Professor, San José State University San José, Calif.","Why not allow extended time for all students? In a world where AI encourages quick fixes and discourages independent thinking, aren’t critical and deep thinking exactly what we want to cultivate at a university? My guess is that most students will not stay one minute more than they have to in an exam room.","Julie F. Skolnick Potomac, Md.","Rose Horowitch replies:","Thank you for engaging with my article so thoughtfully. A perfect structure would allow accommodations for every student who needs them while preventing students who don’t from gaining an unfair advantage. But I understand that the same factors that allow more privileged students to access accommodations—wealth, cultural capital—can prevent others from getting the support they need. The suggestion to remove time limits is an interesting one. Some professors I spoke with said that they, too, favored this solution—they didn’t see any pedagogical need for their students to complete tests in a certain amount of time. The idea would create new demands at universities for physical space and proctors, but it could be worth exploring.","Behind the Cover","In this month’s cover story, “I Found It: The Best Free Restaurant Bread in America,” Caity Weaver travels across the country to determine which establishment—from strip-mall chains to upscale brasseries—offers its customers the greatest complimentary bread. Armed with more than 500 nominations, Weaver eventually crowned just one loaf champion. To accompany the story, we gathered 18 of the breads Weaver sampled for a photo shoot. On the cover are slices of a rustic country loaf from the three-Michelin-star Joël Robuchon at the MGM Grand in Las Vegas. (This is not the best free restaurant bread in America.)","— Bifen Xu, Senior Photo Editor","Corrections:","“The Women of Avenger Field” (April) stated that Patricia Perry moved two hours southeast to study political science at UC Berkeley and that she arrived in Sweetwater, Texas, on July 5, 1943. In fact, she moved two hours southwest, and she began training in Sweetwater on that date. The article also included a quote attributed to a base commander that was in fact a quote from another source paraphrasing his remarks, and used an incorrect verb tense in a quote from Pete Hegseth. “The Secrets of Indigenous Art” (March) stated that a traveling exhibition of Native abstraction was organized by Jeffrey Gibson. In fact, it was co-organized by Gibson and Jenelle Porter. “How America Got So Sick” (March) implied that tuberculosis was among the diseases covered by the national vaccine schedule for which cases are surging. In fact, the United States does not routinely vaccinate for tuberculosis.","This article appears in the May 2026 print edition with the headline “The Commons.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/05/the-commons/686584/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.05.02","day":37,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.05.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.05.04","day":38,"title":"Donald Trump’s Spring Cleaning","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.05.04","paragraphs":["The exact reasons are often left vague and the successors to be determined, but people are leaving the Administration—including three Cabinet secretaries.","In the midst of a war, Donald Trump has started to get rid of his senior officials. The exact reasons are often left vague, and the successors to be determined, but people are leaving. On March 5th, Trump fired Homeland Security Secretary Kristi Noem; on April 2nd, it was Attorney General Pam Bondi, and, on April 20th, Labor Secretary Lori Chavez-DeRemer stepped down under pressure—three Cabinet secretaries, all women, gone in less than two months. By last week, the F.B.I. director, Kash Patel, seemed to be headed for trouble, too.","The President is also reportedly annoyed with his National Intelligence director, Tulsi Gabbard, and with his Commerce Secretary and friend, Howard Lutnick, about, as Politico put it, “how much Lutnick’s family has been profiting off their association with the President’s brand.” The atmosphere is one of discontent and distraction. A month into the Iran war, Defense Secretary Pete Hegseth fired the Army chief of staff, Randy George. Then, after reciting a prayer that Hegseth said was inspired by Scripture but seemed directly lifted from “Pulp Fiction,” last week he ended a vaccine mandate for soldiers—a protocol initiated by General George Washington, in 1777—and fired the Secretary of the Navy, John Phelan, during a naval blockade.","When a group of senior figures in an Administration depart, it’s natural to suspect political dark arts—that one faction has forced the exit of another. But there is no such obvious distinction now: those who have been pushed out and those who so far remain are all hard-line MAGA. Instead, scandals have provided rolling revelations of a general unseriousness. Noem was fired after a scorched-earth immigration-enforcement regime had alienated much of the public, and amid reports that she had spent nearly two hundred million dollars of department funds to purchase two luxury jets, and two hundred million to create an ad campaign, largely starring herself. Chavez-DeRemer is the subject of an internal investigation based on a whistle-blower complaint accusing her of having an affair with a member of her security detail, of using government funds for personal travel, and of drinking on the job; her husband was banned from department headquarters following allegations of sexual misconduct toward staffers, which he has denied. (A lawyer representing Chavez-DeRemer said that she disputed all of the allegations, and no charges have been filed against her husband.) Patel, who earlier this year was found to have assigned F.B.I. officers to protect his girlfriend, a country singer, last week sued The Atlantic for defamation after it reported that his security detail has often had trouble rousing him for work following nights out drinking, and on one occasion called for “breaching equipment” to break down a door and wake him.","That these staffing changes and scandals involve figures from such disparate parts of the Administration, and are coming just months ahead of the midterm elections, suggests a more generalized crisis. Sixty-seven per cent of Americans disapprove of the job that Trump is doing, according to an A.P.-NORC poll published last week, and part of the story of both his plummeting numbers and the chaos in the Administration is the ongoing crisis of conservative expertise. Trump’s first term was marked—and, in the view of those closest to him, limited—by its dependence on Administration officials who were, at best, skeptical of his aims. This time around, Trump has gone for loyalty. Bondi, for instance, was very willing to carry out his imperative to punish civil servants who had helped President Biden to “weaponize” the government against him; the problem was that she couldn’t make it happen. “Part of the reason the weaponization work has been difficult is that you need people who are MAGA and who are really competent,” Chad Mizelle, who was Bondi’s chief of staff, told CNN recently. “Many career prosecutors are not interested in this kind of work. It’s a very small group of people.”","It appears that the whole government is now being run by a very small group of people. When Trump swept back into office, the sense of right-wing momentum hinged on two sources of strength: the dedication of the conservative lawyers behind Project 2025, who seemed to have planned out in exhilarating detail the transformation of a liberal state into a Trumpist one, and the commitment of a cadre of Silicon Valley investors and executives surrounding Elon Musk, who, even if they didn’t know much (or anything) about government, had theories about how to deliver dramatic organizational change.","But what they produced was hype—promises of transformation far too expansive to deliver. Musk initially pledged two trillion dollars in savings from DOGE; when Politico surveyed the effects last August, it found about $1.4 billion in spending cuts, which, though devastating to a number of programs, were less than a tenth of one per cent of the original target. Trump said on the campaign trail that he would deport between fifteen million and twenty million people, and the former Border Patrol official Gregory Bovino told the Times that he’d drawn up plans to deport a hundred million people—which would be nearly a third of the nation’s population. The government actually deported more than six hundred and seventy-five thousand people, but getting just to that number involved broad and violent sweeps and the expulsion of people who were in the country legally, actions that led to widespread protests. On top of that, for all Hegseth’s boasts of “maximum lethality” and the President’s promises of a speedy resolution, the war has been a cascading mess.","Meanwhile, in Washington, the Administration is paying out refunds for tariffs that it could not convince even a very friendly Supreme Court it had the legal authority to enforce, and has spent much of the past year entangled in revelations from the Jeffrey Epstein case, the political consequences of which were another reason, apparently, that Trump turned on Bondi. Contained within all these fiascoes is a subtly different conservative movement. The theme of the first Trump Administration was an outsider revolt against the establishment; the theme of the second is its own entitlement. That perhaps explains the sordid atmosphere around the departures and the scandals—the sex, the booze—and also the disinterest in expertise and the corrosive self-certainty. The President got what he most wanted, a White House filled with loyalists. But that has turned out to be not at all what he needed. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.05.09","day":39,"title":"The Trump-Xi summit will expose a dysfunctional duo","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Mutual vulnerability is no substitute for global leadership","note":"2026.05.09","paragraphs":["IT IS SOMETIMES said, not least by President Donald Trump, that America and China are now the G2, a duo of superpowers leading the world. That is a grim thought. One has a leader who treats allies like patsies and is ripping apart the institutions that underpinned global stability for decades. The other has an authoritarian regime that bullies its neighbours and is quietly stoking foreign conflicts it could help defuse.","Worse, the two countries treat their mutual entanglements on technology and trade as security risks. So the stakes will be huge when Mr Trump visits Xi Jinping, China’s paramount leader, in Beijing on May 14th and 15th, the first of four expected meetings before the end of 2026. The coming six months could shape ties for years, with consequences from artificial intelligence (AI) to supply chains and Taiwan to Iran.","Tensions between the two governments run so deep that it would be naive to expect a breakthrough. Had they more skill and humility, Mr Trump and Mr Xi could head off the most harmful conflicts and find areas where they could work together for everyone’s benefit. It is unsettling that so much will come down to Mr Trump, who has veered between calling Mr Xi a dear friend and a foe. Mr Xi’s views are more settled, which is its own problem: he is convinced America is declining and that the world should bend to a rising China.","The talks in Beijing will focus on trade. For nearly a decade the countries have been locked in an on-again, off-again trade war. At the start of 2025 a full-blown rupture seemed inevitable as they jacked up tariffs on each other to more than 100%. Since then, they have lowered tariffs in what some call a truce, but is really a stalemate of mutual vulnerability. China can throttle global industry by choking off rare earths; America can wield devastating sanctions on high-tech goods and financial flows.","This stalemate is unstable. As America vies to break China’s grip on rare earths, China is backing semiconductor production and trying to free itself from the dollar. For now, a good result from the summit would be for the two to promise to be predictable. Mr Trump’s misplaced faith in tariffs makes cuts unrealistic, but holding them at current levels would at least let firms get on with business. The Americans want a Board of Trade to manage commerce between the two countries. That would be unwieldy and would do little to re-industrialise America. A mechanism for regular dialogue would be better.","An obvious risk is miscalculation. American trade officials are investigating industrial overcapacity and forced labour in China, which may be an excuse to impose higher tariffs within months. On May 2nd China deployed a “blocking measure” that threatens financial punishment against firms that comply with certain American sanctions. China has also threatened to go after companies that shift supply chains to other countries, precisely what America is urging. Beijing is thus setting up a test of compliance grounded not in law but power. Global executives must choose which government they fear more.","American negotiators have kept the summit’s lead-up focused on trade, not security. But the Chinese spot an opportunity in the American president’s unpredictability. They may be right. Just as Chinese advisers are afraid to contradict Mr Xi, so officials in the White House defer to Mr Trump on all things China, including Taiwan.","And it is there Mr Trump may think he can lower the temperature by going soft. Chinese officials hint that the more he bends on Taiwan, the more China will give on trade. They hope he might cut arms sales to the island or say he is against Taiwanese independence. He should not take the bait. It would be wrong to sell out a democratic partner and reckless to endanger the world’s essential chipmaker. Besides, the current arrangement works, even if Mr Xi would never admit it: Taiwan is prosperous, China ascendant, Asia mostly peaceful.","Moreover, the world faces other pressing security concerns. For America to attack Iran was a strategic blunder, and China has been content to let it reap what it has sown. China has now begun to dabble in diplomacy, meeting Iran’s foreign minister this week. It should press the Iranian regime to negotiate; or tempt it to give up its nuclear programme with the offer of security guarantees, but its allergy to foreign messes holds it back. And whatever moral high ground China thinks it holds on Iran is undercut by its role enabling Vladimir Putin to fight in Ukraine, by buying Russia’s gas and selling dual-use technology. Mr Trump should press Mr Xi to use his weight in Moscow to help end the Ukraine war. Instead, it will barely figure in their discussions.","True statesmen would also find much else to deal with. American and Chinese companies are at the frontier of AI. Their governments should therefore be leading on its risks, such as biosecurity. Climate, once a rare area of co-operation, will be a blind spot because the Trump administration shuns all policy on global warming. And joint work on pandemic prevention, once routine, has become fraught because China dislikes questions about whether the covid-19 virus leaked from a Wuhan laboratory.","The superpowers need not be friends to talk about all this. At the height of the cold war, America and the Soviet Union hammered out deals over nuclear arms, science in space, borders in Europe and cancer research. America’s commercial ties to China are far tighter than its ties to the Soviets ever were. Alas, the two leaders both think that co-operation is a trap in which rules could be foisted on them by the other side. That logic makes dominance the priority, not global public goods.","So the summit will probably yield little besides forced smiles. Such a lack of ambition is troubling. Advisers on both sides argue that at least they are talking, yet to sustain co-operation beyond the Trump administration, they need results. Instead, the only thing keeping America and China at the table is fear of the economic damage each can inflict on the other. The G2 is not leading the world so much as holding it to ransom. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/05/07/the-trump-xi-summit-will-expose-a-dysfunctional-duo"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.05.11","day":40,"title":"Two Hundred and Fifty Years of Complicated Commemorations","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.05.11","paragraphs":["Donald Trump’s aversion to admitting fault suggests that we will not likely see events that grapple with the nuanced nature of the nation’s history this July 4th.","Commemorations often tell us as much about the times in which they are being held as they do about the events they are commemorating. The two-hundred-and-fiftieth anniversary of the adoption of the Declaration of Independence, this July 4th, falls at a moment when the nation is being led by a twice-impeached President amid a widely recognized crisis of democracy—last Wednesday, the Supreme Court’s ruling in Louisiana v. Callais further weakened an already enfeebled Voting Rights Act—and in a social climate whose volatility might be measured by acts of political violence. The most dramatic recent example came with the frantic apprehension of an armed man in the hotel where the White House Correspondents’ Association dinner was being held. The alleged gunman fortunately did not reach the ballroom where the President and the other attendees were gathered, but he has been charged with an assassination attempt—the third made against Donald Trump in two years. This is the backdrop against which our recollections of the nation’s origins are taking place.","Commemoration has been a complicated undertaking in this country from the start. On July 4, 1826, President John Quincy Adams decided to forgo making a major speech and instead rode by carriage in a parade to the Capitol, where he listened to celebratory remarks and a reading of the Declaration. He would later find out that two of his predecessors—his father, John Adams, and Thomas Jefferson—had died that day. Once fierce rivals, the two men were responsible for the country’s first peaceful transfer of power between parties, after Jefferson and his Democratic-Republican Party defeated Adams and the Federalists in the election of 1800.","The nation’s centennial, in 1876, arrived in the wake of a civil war that had left some seven hundred thousand Americans dead. The Declaration’s insurrectionist contention—that people, when unjustly provoked, have the right to dissolve their government—hung heavily in a country that had just witnessed the eleven states of the Confederacy make the same argument. That year, President Ulysses S. Grant, who had commanded the Union forces, spoke in his annual address to Congress of the great economic and social progress that the United States had made during its first hundred years. But, though the guns of war were a decade in the past, the nation had not escaped the spectre of conflict. The Presidential election of 1876 pitted the Democrat Samuel J. Tilden against the Republican Rutherford B. Hayes, but disputed returns from Florida, Louisiana, and South Carolina, where there had been violence directed at Black voters, cast the results into doubt. With neither candidate gaining a clear majority in the Electoral College, the election was turned over to a special commission, which declared Hayes the winner. A compromise was then struck, insuring that Hayes could take office in exchange for the Republicans’ promising to cease the federal occupation of the former Confederate states—thereby ending the period known as Reconstruction. Grant was compelled to celebrate the nation’s hundredth anniversary just as its boldest experiment in democracy to date was being dismantled.","The nation’s bicentennial, the only major commemoration in living memory, was framed by the exigencies of the Cold War and by the scarcely healed scars of the Vietnam War, as well as by Watergate and President Richard Nixon’s consequent resignation. President Gerald Ford’s Fourth of July address hit the boilerplate notes of progress and enduring values in a speech so anodyne that his audience might have overlooked the fact that the national festivities were being led by a man who had been elected to neither the Vice-Presidency (Nixon appointed him, in 1973) nor the Presidency (he assumed that office when Nixon resigned).
