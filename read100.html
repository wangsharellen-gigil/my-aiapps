<style>
:root{
  --bg:#0f1420; --bg2:#161d2e; --card:#1b2336; --card2:#222c44;
  --tx:#e8ecf4; --tx2:#9aa6bd; --tx3:#66718a;
  --ac:#4f8cff; --ac2:#7aa8ff; --ok:#34c77b; --warn:#ffb454; --err:#ff6b6b;
  --hl:#ffd66e; --hlbg:rgba(255,214,110,.16); --line:#2a3450;
  --sheet:#1b2336; --radius:16px;
}
html[data-theme="light"]{
  --bg:#f5f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#f0f2f6;
  --tx:#1c2333; --tx2:#5a6478; --tx3:#98a1b3;
  --ac:#2f6fe4; --ac2:#4f8cff; --ok:#1fa564; --warn:#e8940a; --err:#e05252;
  --hl:#b07d00; --hlbg:rgba(240,180,40,.22); --line:#e2e6ee;
  --sheet:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--tx);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
#app{max-width:640px;margin:0 auto;padding:0 16px}
/* ---------- 顶栏 ---------- */
.top{padding:calc(14px + env(safe-area-inset-top)) 4px 6px;display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:22px;letter-spacing:.5px}
.top h1 span{color:var(--ac)}
.top .sub{font-size:12px;color:var(--tx3);margin-top:2px}
/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-top:14px;border:1px solid var(--line)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.muted{color:var(--tx2);font-size:13px;line-height:1.7}
/* ---------- 进度环 ---------- */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:108px;height:108px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:26px}
.ring .num i{font-style:normal;font-size:10px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{font-size:20px;display:block}
.stat span{font-size:11px;color:var(--tx3)}
/* ---------- 日历 ---------- */
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:6px}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx3);position:relative}
.cal .d.done{background:var(--ok);color:#fff}
.cal .d.today{outline:2px solid var(--ac);color:var(--tx);font-weight:700}
.cal .d.none{opacity:.35}
/* ---------- 今日页 ---------- */
.hero{background:linear-gradient(135deg,var(--ac) 0%,#7b5cff 100%);border-radius:20px;padding:22px;margin-top:14px;color:#fff}
.hero .dayno{font-size:12px;opacity:.85;letter-spacing:1px}
.hero h2{font-size:21px;margin:8px 0 6px;line-height:1.35}
.hero p{font-size:13px;opacity:.9;line-height:1.6}
.hero .btnrow{margin-top:16px;display:flex;gap:10px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:rgba(255,255,255,.18);color:#fff;font-family:inherit}
.btn.pri{background:#fff;color:var(--ac)}
.btn.block{display:block;width:100%;text-align:center}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.small{padding:8px 14px;font-size:13px;border-radius:10px}
.btn:active{opacity:.8}
/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;color:var(--tx3);font-size:10px;padding:9px 0 7px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ico{font-size:20px;line-height:1}
.tabbar button.on{color:var(--ac)}
.badge{position:absolute;top:4px;right:22%;background:var(--err);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px}
.tabwrap{position:relative;flex:1;display:flex;flex-direction:column;align-items:center}
/* ---------- 阅读器 ---------- */
#reader{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#reader.open{display:flex}
.rhead{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--bg2)}
.rhead .t{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:var(--card2);border:none;color:var(--tx);width:34px;height:34px;border-radius:10px;font-size:15px;font-family:inherit;flex-shrink:0}
.iconbtn.on{background:var(--ac);color:#fff}
.rbody{flex:1;overflow-y:auto;padding:20px 18px 140px;-webkit-overflow-scrolling:touch}
.rbody .meta{font-size:12px;color:var(--tx3);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.rbody h2{font-size:23px;line-height:1.35;margin:6px 0 10px}
.rbody .dek{font-size:14px;color:var(--tx2);line-height:1.7;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.para{font-size:var(--fs,17px);line-height:1.95;margin-bottom:1.1em;color:var(--tx);font-family:Georgia,"Times New Roman",serif}
.w{cursor:pointer;border-radius:3px}
.w.hv{color:var(--hl);background:var(--hlbg);padding:0 1px}
.sent{cursor:pointer;border-radius:4px;transition:background .15s}
.mode-sent .sent:hover,.sent.gx{box-shadow:inset 0 -2px 0 rgba(79,140,255,.55)}
.mode-sent .sent{background:rgba(79,140,255,.04)}
.rfoot{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pbar{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--ac);width:0%;transition:width .2s}
.rfoot .row{display:flex;gap:8px;align-items:center}
/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--sheet);border-radius:20px 20px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:72vh;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet h4{font-size:18px;margin-bottom:4px}
.sheet .phon{color:var(--ac2);font-size:14px;margin-bottom:8px}
.sheet .def{font-size:14px;line-height:1.7;color:var(--tx2);margin-bottom:6px}
.sheet .def b{color:var(--tx);font-weight:600}
.tagzh{display:inline-block;background:var(--hlbg);color:var(--hl);font-size:13px;border-radius:8px;padding:4px 10px;margin:4px 4px 8px 0}
.sheet .btns{display:flex;gap:8px;margin-top:12px}
.sheet .btns .btn{flex:1;padding:11px 0;font-size:14px}
.gram{background:var(--card2);border-radius:12px;padding:12px;margin:8px 0}
.gram .lbl{font-size:11px;color:var(--ac2);font-weight:700;letter-spacing:1px;margin-bottom:3px}
.gram .txt{font-size:13.5px;line-height:1.7;color:var(--tx2)}
.gram .txt em{color:var(--hl);font-style:normal;font-family:Georgia,serif}
/* ---------- 生词本 ---------- */
.vitem{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:10px;border:1px solid var(--line)}
.vitem .vw{font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.vitem .vw .del{color:var(--tx3);font-size:12px;background:none;border:none;font-family:inherit}
.vitem .vp{font-size:12px;color:var(--ac2);margin-top:2px}
.vitem .vd{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.6}
.vitem .vm{font-size:11px;color:var(--tx3);margin-top:6px}
.flip{background:var(--card);border-radius:18px;border:1px solid var(--line);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin-top:14px}
.flip .fw{font-size:30px;font-weight:700;font-family:Georgia,serif}
.flip .fb{font-size:15px;color:var(--tx2);line-height:1.8;margin-top:10px}
/* ---------- 表单 ---------- */
input,textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:15px;width:100%;font-family:inherit;outline:none}
textarea{min-height:160px;line-height:1.6;resize:vertical}
label.fl{display:block;font-size:12px;color:var(--tx3);margin:12px 0 6px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-80px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;z-index:500;transition:transform .25s;font-weight:600;max-width:80vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.onboard{text-align:center;padding-top:12vh}
.onboard .big{font-size:64px;margin-bottom:10px}
.onboard h2{font-size:24px;margin-bottom:10px}
.onboard p{color:var(--tx2);font-size:14px;line-height:1.8;padding:0 12px}
.list{margin-top:10px}
.list .li{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
.list .li .r{color:var(--tx3)}
.empty{text-align:center;color:var(--tx3);padding:40px 0;font-size:13px}
</style>
</head>

const ARTICLES = [
{
  id:"a1", day:1, source:"原创示范 · 财经科技评论", minutes:16, tag:"工作与AI",
  title:"The Quiet Rewiring of Work",
  dek:"人工智能没有以戏剧性的方式夺走工作，而是以一种更安静的方式重新定义了「胜任」二字。",
  paragraphs:[
  "For most of the past decade, the public debate about automation has been framed as a catastrophe that has not yet arrived. Pundits warned of driverless fleets emptying our roads of jobs, of algorithms swallowing whole professions, of a near future in which human labour would be rendered obsolete. The rhetoric was apocalyptic, and the predictions were confident. Yet the transformation that is actually unfolding looks nothing like the scenario. It is quieter, slower and far more intimate than the promised revolution, and it is happening not to workers but within them.",
  "Consider what has changed inside a typical office. The junior analyst who once spent two days assembling a market report now produces a rough draft in twenty minutes and spends the rest of her time questioning its assumptions. The paralegal no longer reads four hundred pages of discovery documents; he reads the thirty pages a model has flagged as significant, and he is judged by whether his judgement is sound. In case after case, the machinery has absorbed the routine portion of the job while leaving the accountable portion — the part where someone must be right, and must be seen to be right — stubbornly, inevitably human.",
  "This distinction between routine execution and accountable judgement is the hinge on which the new workplace turns, and it explains a paradox that has confused economists. Productivity in knowledge-intensive sectors has crept upward, yet headline unemployment has not exploded. The reason is that firms are not eliminating roles so much as thinning them. A team of six becomes a team of four. An entry-level position that once trained newcomers slowly disappears, because the tasks it existed to teach have been automated away. The danger, then, is not mass redundancy but a hollowing out of the ladder by which people once climbed.",
  "The hollowing of the entry rung deserves more anxiety than it currently receives. Professions reproduce themselves through apprenticeship: juniors learn by performing the humble work that seniors have outgrown. If drafting, summarising and collating are delegated to machines, where will the next generation acquire the tacit knowledge on which expertise depends? A senior surgeon who has never sutured without robotic assistance, or an editor who has never corrected a clumsy first draft, may discover too late that fluency in the tool is no substitute for fluency in the craft beneath it.",
  "Some firms have glimpsed the problem and are improvising responses. A handful of consultancies now require their youngest staff to complete portions of every assignment unassisted, deliberately forgoing the efficiency gains of automation as a form of professional tuition. Others have restructured progression so that promotion depends on demonstrated judgement in ambiguous situations — the one competency machines reliably lack — rather than on throughput, which machines increasingly dominate. Such experiments are speculative, and their cost is real, but the alternative is a workforce trained entirely on simulation.",
  "There is also a subtler shift under way in what employers mean by talent. Recruiters who once screened for speed and polish now probe for the qualities that complement machine output: the scepticism to distrust a fluent answer, the patience to verify what looks plausible, the imagination to ask a question the model would not pose. In interviews, candidates are handed AI-generated analyses containing deliberate errors and asked to find them. The exercise is revealing. The most impressive performers are rarely those who produce the most; they are those who notice the most.",
  "None of this is to deny that disruption is coming for particular occupations, or that the transition will be unjustly distributed, as transitions always are. But the honest description of the present is neither utopia nor apocalypse. It is a renegotiation of the terms on which human attention is worth paying for. The workers who thrive will be those who understand what their attention is for — and who have the discipline to spend it on the parts of the job that no machine can be trusted to hold."
  ],
  vocab:{
    "pundits":{p:"ˈpʌndɪts",zh:"n. 权威人士；评论员",note:"媒体常用词，略带调侃意味"},
    "obsolete":{p:"ˈɒbsəliːt",zh:"adj. 过时的；被淘汰的"},
    "apocalyptic":{p:"əˌpɒkəˈlɪptɪk",zh:"adj. 如世界末日般的"},
    "intimate":{p:"ˈɪntɪmət",zh:"adj. 亲密的；此处指「深入个人层面的」"},
    "paralegal":{p:"ˌpærəˈliːɡl",zh:"n. 律师助理"},
    "flagged":{p:"flæɡd",zh:"v. 标记；标出（重点关注）"},
    "accountable":{p:"əˈkaʊntəbl",zh:"adj. 负有责任的；需担责的"},
    "stubbornly":{p:"ˈstʌbənli",zh:"adv. 顽固地；难以消除地"},
    "hinge":{p:"hɪndʒ",zh:"n. 铰链；关键转折点"},
    "paradox":{p:"ˈpærədɒks",zh:"n. 悖论；矛盾的现象"},
    "crept":{p:"krept",zh:"v. (creep的过去式) 缓慢移动；悄悄上升"},
    "redundancy":{p:"rɪˈdʌndənsi",zh:"n. 裁员；冗余"},
    "hollowing":{p:"ˈhɒləʊɪŋ",zh:"n. 掏空；空心化"},
    "apprenticeship":{p:"əˈprentɪsʃɪp",zh:"n. 学徒制；见习期"},
    "tacit":{p:"ˈtæsɪt",zh:"adj. 心照不宣的；默会的（tacit knowledge 默会知识）"},
    "forgoing":{p:"fɔːˈɡəʊɪŋ",zh:"v. 放弃；摒绝"},
    "tuition":{p:"tjuːˈɪʃn",zh:"n. 学费；教学（此处为引申义）"},
    "throughput":{p:"ˈθruːpʊt",zh:"n. 产出量；吞吐量"},
    "scepticism":{p:"ˈskeptɪsɪzəm",zh:"n. 怀疑态度（美式拼写skepticism）"},
    "plausible":{p:"ˈplɔːzəbl",zh:"adj. 貌似合理的"},
    "renegotiation":{p:"ˌriːnɪˌɡəʊʃiˈeɪʃn",zh:"n. 重新协商"}
  },
  grammar:{
    "yet the transformation that is actually unfolding looks nothing like the scenario":{
      t:"本句为主系表结构 + 定语从句嵌套",
      b:[
        ["主干","The transformation ... looks nothing like the scenario（这种变革与预言的情景毫无相似之处）"],
        ["定语从句","that is actually unfolding 修饰 transformation，that 在从句中作主语，从句用现在进行时强调「正在发生」"],
        ["让步转折","Yet 承接上文的末日论调，形成「预言 vs 现实」的对比"]
      ]
    },
    "in case after case, the machinery has absorbed the routine portion of the job while leaving the accountable portion":{
      t:"while 引导的伴随/对比结构 + 破折号插入语",
      b:[
        ["主干","the machinery has absorbed the routine portion（机器吸收了工作中程式化的部分）"],
        ["while 结构","while leaving... 是 while + 现在分词，表伴随对比：一边吸收……一边留下……"],
        ["插入语","破折号内 the part where someone must be right 是对 accountable portion 的同位解释，where 引导定语从句"]
      ]
    },
    "the reason is that firms are not eliminating roles so much as thinning them":{
      t:"not so much A as B 比较结构（表语从句内）",
      b:[
        ["主干","The reason is that ...（that 引导表语从句）"],
        ["核心结构","not eliminating roles so much as thinning them：与其说是消灭岗位，不如说是稀释岗位。not so much...as... 意为「与其说……不如说……」"],
        ["翻译","原因在于，企业与其说是在裁撤岗位，不如说是在把岗位「变薄」。"]
      ]
    },
    "if drafting, summarising and collating are delegated to machines, where will the next generation acquire the tacit knowledge on which expertise depends":{
      t:"if 条件状语从句 + 介词 + 关系代词定语从句",
      b:[
        ["主干（疑问句）","where will the next generation acquire the tacit knowledge（下一代将从哪里习得默会知识？）"],
        ["条件从句","if drafting, summarising and collating are delegated to machines：三个动名词并列作主语，被动语态 are delegated"],
        ["定语从句","on which expertise depends = expertise depends on the tacit knowledge，介词 on 提前至关系代词 which 之前，为正式书面语"]
      ]
    },
    "the most impressive performers are rarely those who produce the most; they are those who notice the most":{
      t:"分号连接的平行对偶句",
      b:[
        ["结构","两个分句完全平行：X are those who... / they are those who..."],
        ["定语从句","两个 who 从句分别修饰 those，produce the most（产出最多）与 notice the most（察觉最多）形成语义反差"],
        ["修辞","对偶 + 反差，是外刊结尾常用的点题句式，值得仿写"]
      ]
    }
  }
},
{
  id:"a2", day:2, source:"原创示范 · 城市观察", minutes:17, tag:"城市与设计",
  title:"Cities That Listen",
  dek:"当街道学会回应行人，城市规划者开始重新思考：城市究竟是为谁而建？",
  paragraphs:[
  "Walk down any street in a well-designed city and you will notice, if you pay attention, that the pavement seems to widen exactly where people tend to linger. The bench appears where the view opens. The shade falls where the queue forms. None of this is accidental. For a century, urban planners treated cities as problems of flow: vehicles in, vehicles out, pedestrians channelled like water through concrete arteries. The city of flow was efficient, legible and, to anyone who has ever waited at a six-lane crossing in the rain, quietly hostile.",
  "A newer school of designers argues that the city should not merely accommodate movement but respond to presence. Their guiding metaphor is the conversation. A responsive city notices that a plaza empties at noon and asks why; it observes that a subway exit produces a tide of pedestrians at 8:40 each morning and adjusts the crossing cycle before anyone files a complaint. The instruments are modest — footfall sensors, adaptive traffic lights, modest arrays of cheap cameras — but the philosophy behind them represents a genuine reversal: infrastructure that watches, waits and adapts, rather than infrastructure that dictates.",
  "Sceptics hear the word sensors and reach for their philosophical guard. The unease is warranted. Surveillance has historically entered cities through the front door, announced and debated, or through the back door, concealed and pervasive. A city that measures foot traffic to time its streetlights is not yet a city that tracks its dissidents, but the machinery is identical and the boundary is porous. The critical question is not whether cities should sense but who holds the data, how long it survives, and whether the citizen who generates it can see what it purchased. Cities that answer those questions publicly — publishing their data practices in plain language, defaulting to anonymous aggregation — have found residents surprisingly willing to cooperate. Trust, it turns out, is a design material.",
  "The economics are equally instructive. Traditional infrastructure is poured in decades and repaired in emergencies. Responsive infrastructure behaves more like a living system: small adjustments, continuously deployed. When one mid-sized city re-timed its pedestrian signals using real crowd data rather than forty-year-old assumptions, average waiting times fell by nearly a fifth without laying a single metre of new asphalt. The lesson generalises. Much of what cities lack is not concrete but attention, and attention is now cheap enough to spread generously.",
  "Yet the most persuasive argument for responsive design is not efficiency but dignity. Anyone who has pushed a stroller through a station built exclusively for the able-bodied commuter understands that infrastructure encodes assumptions, and that the people those assumptions exclude are never consulted. A city that listens — that notices who is actually struggling at the stairs, which bus stop shelters are too narrow for wheelchairs, which crossings the elderly never attempt — is performing a quiet act of political recognition. It says: you were counted, and what we built changed accordingly.",
  "There is a humbling historical footnote here. The pre-modern city, for all its filth and congestion, was arguably the original responsive environment: market squares swelled on market days, lanes formed where desire demanded, and the city itself was the accumulated residue of a thousand small negotiations between people and space. What the smart city promises, at its best, is not something new but a restoration — the return of the conversation that concrete once interrupted, conducted now at the speed of data."
  ],

{
  id:"a3", day:3, source:"原创示范 · 科学报道", minutes:15, tag:"海洋科学",
  title:"Into the Twilight Zone of the Ocean",
  dek:"在海面以下两百米到一千米处，藏着地球上最大的动物迁徙，和最多的未解之谜。",
  paragraphs:[
  "Every night, as the sun surrenders the surface of the ocean to darkness, an astonishing migration begins. Billions of creatures — fish, shrimp, squid, jellylike zooplankton — rise from the depths toward the lightless waters near the surface to feed. At dawn, they reverse the journey, sinking again into the safety of the deep. Scientists call this the diel vertical migration, and by sheer biomass it is the largest animal movement on the planet, dwarfing the celebrated marches of wildebeest and the looping flights of migratory birds. Most of it happens beyond the reach of human eyes.",
  "The theatre for this nightly commute is the ocean's twilight zone, the band of water between two hundred and one thousand metres, where sunlight fades to a blue murmur and then to nothing. It is a realm of extreme economy. Food is so scarce that many residents have evolved bodies of improbable delicacy — translucent flesh, paper-thin bones — because every gram of density costs energy that the deep does not repay. Predators here are patient and bizarre. Prey are transparent, or luminous, or both: some species wear colonies of glowing bacteria as camouflage, erasing their own silhouettes against the faint light above.",
  "For decades this layer of the ocean was known chiefly as a waypoint — a place fish passed through on their way from nursery to adult habitat — and commercial interest in it was negligible. That is changing. As shallower fisheries are exhausted and demand for protein climbs, fishing nations and start-ups are casting their nets, sometimes literally, into the twilight. The pitch is seductive: the zone teems with small, fast-reproducing species that could be processed into fishmeal and supplements. The caution is equally blunt. We do not know how many of these creatures exist, how quickly they replace themselves, or how many other animals — tuna, squid, whales — depend on them as the nightly delivery service of the deep.",
  "The twilight zone has also become unexpectedly relevant to the climate debate. Each dusk, the migrating biomass grazes on carbon-rich plankton near the surface and then hauls that carbon down into the darkness, where a portion is locked away for decades or centuries. In effect, the migration is a biological pump, and its scale is staggering: recent estimates suggest it moves carbon on a scale comparable to major national emissions budgets. Interfere with the pump — by trawling out the migrants, for instance — and the consequences could ripple far beyond the menu.",
  "Studying the zone is punishing work. Submersibles descend at the pace of a slow lift; pressure at a thousand metres crushes most instruments not built for the purpose; and the animals themselves, hauled up in nets, arrive as fragile ruins of their living selves, their delicate structures dissolved by the change in pressure. Researchers increasingly favour in-situ observation — cameras, robotic gliders, DNA fragments sifted from litres of seawater — which reveals the community without destroying it. Each expedition returns with species unfamiliar to science.",
  "There is a temptation, reviewing all this, to frame the twilight zone as the planet's last great blank space, a frontier awaiting conquest. The framing flatters us and misleads us. The zone is not blank; it is dense with lives ordered by rhythms we have barely begun to read. Whether it becomes the next extractive frontier or a first-rate laboratory of restraint will say a great deal about what kind of species we have become — and whether we are capable, finally, of valuing a wilderness we cannot see."

{
  id:"a4", day:4, source:"原创示范 · 社会文化", minutes:16, tag:"健康与文化",
  title:"Sleep, the Last Unhackable Status Symbol",
  dek:"曾经炫耀熬夜是荣耀，如今吹嘘早睡才是特权。睡眠如何成为这个时代最昂贵的奢侈品？",
  paragraphs:[
  "There was a time, not long ago, when boasting about exhaustion was a professional credential. Executives traded stories of four-hour nights the way athletes compare injuries. Email timestamps sent at 3am functioned as proof of devotion. To be tired was to be important; to sleep was to confess that your responsibilities could wait. That culture has not vanished — but a quiet counter-current has emerged among precisely the people who once celebrated sleeplessness. Today, in certain ambitious circles, the truly enviable schedule belongs not to the person who answers messages at midnight, but to the one who was asleep by ten.",
  "The reversal has several parents. The first is scientific: two decades of research have dismantled the romantic myth of the short-sleeping genius, replacing it with a grimmer picture in which chronic deprivation erodes memory, immunity, mood and judgement with a comprehensiveness that startles even the researchers conducting the studies. Sleep, one neuroscientist told me, is the only performance enhancer that is free, legal and universally effective — which is exactly why its absence has become so expensive to fake.",
  "The second parent is economic. As the knowledge economy shifted rewards from hours to insight, the arithmetic of burnout stopped working. An exhausted analyst produces nothing worth the salary by Thursday. Firms noticed. Sleep coaches now appear on executive-health menus alongside nutritionists; some companies have begun rating managers partly on whether their teams take vacations, on the theory that a rested team outperforms a heroic one. Whether this is humane management or merely optimised extraction is a fair question, but the direction of travel is unmistakable: rest has been reclassified from a private weakness to a productive asset.",
  "The third parent is the most ironic: technology itself. The same devices that colonised the night now police it. Wearables score our sleep with evangelical earnestness, and a generation that once measured status in streaks of late-night gaming now compares deep-sleep percentages with the same competitive relish. Critics call this the quantification of rest — one more domain of life surrendered to the dashboard — and the criticism is not frivolous. When sleep becomes a metric, it becomes a performance; when it becomes a performance, it becomes another source of the anxiety it was supposed to cure. There is a recognized clinical irony here: orthosomnia, the pursuit of perfect sleep, pursued so intensely that it ruins sleep.",
  "Meanwhile, the market has noticed the shift and moved to monetise it. The sleep economy — mattresses engineered like spacecraft, rings and headbands that track brainwaves, supplements promising deeper rest, hotels advertising the exact angle of their pillows — is now worth billions, and it sells back to us, at considerable expense, the one thing our grandparents obtained for free. There is something almost comic in this. A generation that could not be persuaded to switch off its devices is now paying four hundred dollars for a device whose sole function is to scold it into switching off. The merchant and the remedy, as usual, wear the same smile.",
  "What distinguishes sleep from other luxury goods, though, is its stubborn democracy. No fortune can purchase eight hours on behalf of someone else, and no algorithm has yet automated rest. The wealthy can buy quiet bedrooms, blackout curtains and freedom from a second job; they cannot buy the biology. In an economy where nearly everything desirable can be bought, rendered, delivered or streamed, the simplest remedy of all remains stubbornly manual. Perhaps that is the final irony, and the quiet hope: the most valuable commodity of the age is one that must still be made, night after night, by hand."
  ],

  dek:"你的注意力是这个时代被开采最严重的资源。而开采它的行业，从不休息。",
  paragraphs:[
  "Attention has always been a currency; what has changed is the efficiency of its extraction. A century ago, capturing a stranger's attention required a billboard on a busy street or a jingle on the radio — expensive, clumsy instruments that wasted most of their ammunition on people who would never buy. Today the billboard follows you into your pocket, knows your name, remembers what made you pause last Tuesday, and tests a thousand versions of itself to learn which one will hold you longest. The industry built on this capability does not experience fatigue, does not observe the Sabbath, and measures its success in a unit its customers never see: seconds of human attention, harvested at scale.",
  "The economic logic is elegantly simple and quietly ruthless. Platforms sell access to attention; advertisers bid for it; and the user — who pays nothing, and is therefore not the customer but the raw material — supplies the resource through an act as effortless as looking. Every design decision downstream follows from this structure. Autoplay exists because the cost of deciding whether to continue is a moment of friction, and friction is revenue lost. Notifications are red because red is urgent. Feeds are infinite because a page that ends invites departure, and departure is a small death in the ledger.",
  "What makes the present moment distinctive is not the existence of these techniques but their precision. Earlier media broadcast; the new media selects. The old advertising model interrupted a general audience with a general message; the current one tailors a specific message to a specific nervous system at a specific moment of susceptibility. The ethics of manipulation were debated for a century in the context of propaganda and subliminal advertising, and society arrived at a set of norms — imperfect but real. Those norms assumed an adversary that was visible and uniform. They did not anticipate an adversary that learns.",
  "It would be too simple, however, to cast users purely as victims. The devices are engineered to persuade, but they operate on appetites that are genuinely ours: the hunger for novelty, for social approval, for the small electric shock of being seen. The merchants did not invent our distractibility; they industrialised it. This distinction matters because it locates the remedy in more than one place. Regulation can constrain the machinery — several jurisdictions are experimenting with design requirements that ban the most coercive patterns, in the way building codes ban the most dangerous staircases. But the individual who expects to out-willpower a system staffed by thousands of engineers and tuned by billions of interactions is making a category error. Discipline is not designed to fight fire with fire; it is designed to remove the fuel.",
  "The fuel, in practice, is environmental. People who keep phones out of the bedroom are not weak-willed in a different way from people who do not; they have simply arranged their surroundings so that the default requires no decision. The most effective personal strategies are, on inspection, almost embarrassingly mechanical: greyscale screens, notification fasting, devices parked in another room, the deliberate purchase of boredom. None of this is inspiring. All of it works better than resolve.",
  "There remains the larger question, the one no feature or setting can answer: what is all this harvested attention for? Seconds are the industry's unit of account, but they are not ours. Attention is the raw material of every skill, every relationship and every act of memory; whatever we spend it on is, in the most literal sense, what our lives become. The merchants will keep mining — it is their business to. The interesting question, the one worth a moment of your increasingly contested notice, is whether we will resume the role of custodians of our own minds, or remain, contentedly, the quarry."
  ],

  id:"a6", day:6, source:"原创示范 · 饮食文化随笔", minutes:15, tag:"饮食与生活",
  title:"In Defence of Boring Food",
  dek:"在一个追逐味觉刺激的时代，「不好吃」的一日三餐可能恰恰是身体最需要的答案。",
  paragraphs:[
  "The most subversive thing you can say about food today is that a meal does not need to be exciting. We live amid a permanent carnival of the palate. Restaurant openings are covered like political events; a humble chicken is expected to arrive brined, smoked, glazed and confited, preferably with a narrative about the farm it came from; and the home cook, armed with a camera and an audience, plates lunch as though a stranger might judge it. Somewhere in this escalation, eating — the daily, unglamorous business of fuelling a body — acquired an obligation to be interesting, and the obligation is quietly exhausting us.",
  "Nutrition researchers have long observed a paradox they call the variety effect: the more flavours a meal offers, the more of it we eat. This made evolutionary sense in a world of scarcity, where sampling every food type protected against deficiencies, but it misfires in a world of engineered abundance. Food manufacturers understand the mechanism precisely. The snack aisle is a laboratory of hedonic calibration — salt, fat, sugar and crunch engineered into what the industry candidly calls the bliss point, the formulation that maximises intake before satiety can interfere. Boring food, by contrast, offers fewer levers to pull. A bowl of plain rice and vegetables does not beguile; it merely feeds. That is, arguably, its virtue.",
  "There is a related argument from habit. Behavioural studies suggest that dietary success depends less on willpower than on default: what happens when you are tired, hurried and unthinking. A repertoire of simple, repetitive meals removes thousands of small decisions from the day and makes the nutritious option the path of least resistance. Cultures with strong food traditions have always known this implicitly. The Japanese breakfast, the Scandinavian open sandwich, the South Asian dal-chawal rotation — these are not failures of imagination but systems of quiet reliability, refined over generations to be repeatable by ordinary people on ordinary days.",
  "The counter-argument deserves a hearing. Food is one of the great remaining domains of daily pleasure, and to advocate blandness can sound like a monk's advice on dancing. Culinary creativity carries real value: it binds families, anchors memory, expresses love where words fail, and, not incidentally, supports millions of livelihoods. The case here is not against pleasure but against the escalation that has colonised pleasure — the assumption, imported from an attention-hungry media economy, that every meal must be an experience, every dinner a statement. Between the bliss point and the bended knee of fine dining lies an unmapped middle country: food that is good, plain, nourishing and free of ambition.",
  "Perhaps the deepest argument for boring food is temporal. Exciting meals are, almost by definition, episodic; they punctuate life rather than sustain it. But most of eating is not punctuation. It is the long prose of ordinary days, and prose has different requirements: it must be sustainable, forgiving, repeatable. The body, which prefers regularity and resents surprise, votes accordingly. To eat boring food well — and to do so without apology — is to make a small but firm declaration that not every human appetite needs to be monetised, optimised or performed. Some appetites simply need to be fed."
  ],

{
  id:"a7", day:7, source:"原创示范 · 科技产业", minutes:16, tag:"商业与航天",
  title:"Small Rockets, Big Dreams",
  dek:"当发射成本以数量级下降，太空不再是超级大国的专属领地，而成了初创公司的跑马场。",
  paragraphs:[
  "For most of the space age, reaching orbit was the geopolitical equivalent of climbing Everest: possible only for state programmes willing to spend without counting. Rockets were built in national workshops, flown a handful of times, and retired into museums. The arithmetic was punishing — the vast majority of a launcher's mass was fuel and structure, expended once and discarded — and the discipline it produced was institutional conservatism. When your hardware is single-use and your budget is annual, caution ceases to be a virtue and becomes an identity.",
  "The past two decades have inverted that logic, and the mechanism was not primarily technological romance but ruthlessly applied accounting. Reusability — flying the same booster again and again — transformed the cost structure of launch the way containerisation transformed shipping: not by making the underlying activity glamorous, but by stripping out the waste embedded in treating each voyage as bespoke. Launch prices that once ran to tens of thousands of dollars per kilogram have, on some vehicles, fallen by a factor of ten or more. When a fundamental input becomes that cheap, industries that were previously theoretical start submitting business plans.",
  "The result is a launch market that looks less like the Apollo era than like early aviation: crowded, improvisational, and littered with failure. Hundreds of companies now compete to put small satellites into orbit, chasing markets that range from Earth imaging to broadband constellations to the deliciously speculative — orbital data centres, pharmaceutical manufacturing in microgravity, space burials. Most will not survive their funding cycles. The casualties are already accumulating: ventures that burned through capital chasing a vehicle that never flew, founders who mistook a launch window for a business model. This is not necessarily a failure of the ecosystem. Aviation went through the same attrition, and the argument runs that a market which bankrupts its weaker participants while lowering costs for everyone else is functioning exactly as intended.",
  "The satellites themselves tell a parallel story of shrinking. The laboratory-sized craft of the early space age have been succeeded by cubesats the size of a shoebox, assembled from off-the-shelf components and launched in batches. A university team can now fly a real mission for the price of a modest research grant, which has quietly democratised who gets to ask questions of the orbital environment. Planetary scientists, climate modellers and telecommunications engineers share the same queue for the same ride, an arrangement unthinkable when launch slots were diplomatic favours.",
  "Yet the democratisation has a shadow, and it is growing more visible each year. Low Earth orbit is acquiring the characteristics of a commons under pressure: collision-avoidance manoeuvres are now routine for operators of large constellations; the debris population grows with every fragmentation event; and the light pollution from thousands of new satellites has drawn protests from astronomers who find their long-exposure images streaked with the traffic. Orbit, like the atmosphere and the high seas, is a resource that belongs to no one precisely because it belongs to everyone, and the historical record of managing such commons is not encouraging.",
  "Still, it would be churlish to end on the shadow alone. Within a single generation, space has shifted from a spectacle performed by superpowers to an industry practised by start-ups, and the frontier that once required a national covenant now requires a pitch deck. The bottles are smaller, the corks cheaper, and the dreams — some grandiose, some grubby, some genuinely magnificent — are being uncorked at a rate the state-run era never imagined. Whether the commons survives the celebration is the question this generation of engineers, regulators and dreamers will answer, one launch at a time."
  ],

  paragraphs:[
  "I was reminded recently of a skill I have not practised in years: the art of being lost. It happened in an old hill town where the streets refuse to obey geometry — alleys doubling back on themselves, staircases descending into courtyards that had promised to be exits. My phone had no signal, and for the first ten minutes I felt the familiar twitch of anxiety, the sense that a fundamental service had been withdrawn. Then something shifted. Without a blue dot to obey, I started looking — really looking — at the town itself: the way locals glanced left at the bakery, the slope of the gutters hinting at the way downhill, the evening light that would, eventually, tell me where the west was. The map in my head, dormant for years, switched itself on with an almost audible click.",
  "It is worth asking what navigation apps have cost us, precisely because they have given so much. The gains are beyond dispute: no one misses the family quarrel over a folding map, and the lonely midnight arrival in an unfamiliar city is a safer experience than it has ever been. But the old ordeal had unexpected dividends. Getting lost imposed a state of heightened attention that psychologists might recognise as deep engagement with the environment — reading façades, memorising corners, building a model of the world and testing it against reality, street by street. It was effortful, occasionally frightening, and it deposited the geography into memory in a way no spoken instruction ever does. Ask anyone to retrace a route they were guided through and one they discovered themselves, and observe which one they remember.",
  "Cognitive science gives this intuition some structure. The brain maintains its internal maps in a region intimately involved with memory formation, and the mental labour of navigating — holding a destination in mind while tracking turns and distances — appears to exercise that system directly. The consequence of outsourcing every spatial problem to a friendly voice is that the muscle atrophies: we follow instructions flawlessly and arrive with no idea where we are. Researchers studying the phenomenon describe a quiet erosion of environmental competence, generation by generation. We are, quite literally, losing our sense of direction — not genetically, but behaviourally.",
  "There is a broader lesson folded inside the narrow one. The lostness I stumbled into in that hill town was not merely a navigational condition; it was a general posture toward the world — openness without a plan, attention without an agenda. Almost every domain of modern life now offers us the blue dot: the algorithm that knows the next article, the app that orders the next meal before hunger speaks, the schedule that converts the day into a list of optimal routes. Each one is a small mercy and a small amputation. We arrive everywhere more efficiently and experience less, because experience, it turns out, is largely manufactured by the friction along the way.",

function tokenize(s){
  const out=[];const re=/[A-Za-z][A-Za-z'\u2019-]*|\d[\d,.]*|\s+|[^\sA-Za-z\d]+/g;let m;
  while((m=re.exec(s))!==null)out.push(m[0]);
  return out;
}
function norm(w){return w.toLowerCase().replace(/^['\u2019-]+|['\u2019-]+$/g,"")}
function renderBody(){
  const b=document.getElementById("rbody");const a=curArt;
  const gv=a.vocab||{};
  let html='<div class="meta"><span>'+esc(a.source||"")+'</span><span>·</span><span>约 '+(a.minutes||15)+' min</span><span>·</span><span>'+esc(a.tag||"")+'</span></div>';
  html+='<h2 style="font-family:Georgia,serif">'+esc(a.title)+'</h2>';
  if(a.dek)html+='<div class="dek">'+esc(a.dek)+'</div>';
  html+='<div style="font-size:12px;color:var(--ac2);margin-bottom:14px">💡 '+(curMode==="sent"?"句子模式：点击任意句子查看语法解析（重点句人工精讲，其余规则引擎自动解析）":"点击单词查词 · 黄色为本文重点词汇")+'</div>';
  (a.paragraphs||[]).forEach((para,pi)=>{
    const sents=splitSentences(para);
    html+='<p class="para">';
    sents.forEach((s,si)=>{
      const gk=grammarKey(a,s);
      const sentHtml=renderSentence(s,gv,gk!==null,pi,si);
      html+='<span class="sent'+(gk!==null?" gx":"")+'" data-pi="'+pi+'" data-si="'+si+'">'+sentHtml+'</span> ';
    });
    html+='</p>';
  });
  if(a.imported)html+='<div class="muted" style="margin-top:20px;font-size:12px">— 自定义导入文章 · Day '+a.day+' —</div>';
  b.innerHTML=html;
}
function splitSentences(para){
  const parts=para.match(/[^.!?]+[.!?]+[\u201d\u2019"')\]]*\s*|[^.!?]+$/g)||[para];
  return parts.map(s=>s.trim()).filter(s=>s.length);
}
function grammarKey(a,s){
  if(!a.grammar)return null;
  const low=s.toLowerCase();
  const keys=Object.keys(a.grammar);
  for(const k of keys){if(low.includes(k.toLowerCase()))return k}
  return null;
}
function renderSentence(s,gv,hasGram,pi,si){
  const toks=tokenize(s);
  return toks.map(t=>{
    if(/^[A-Za-z][A-Za-z'\u2019-]*$/.test(t)){
      const n=norm(t);
      const hv=gv[n]?" hv":"";
      return '<span class="w'+hv+'" data-w="'+esc(n)+'">'+esc(t)+'</span>';
    }
    return esc(t);
  }).join("");
}

  const b=document.getElementById("rbody");
  const pct=b.scrollHeight-b.clientHeight<=0?100:Math.min(100,b.scrollTop/(b.scrollHeight-b.clientHeight)*100);

}

function lookupWord(w){
  if(!w)return;

  lastLookup={w:w,anno:anno||null};
  let html='<h4 style="font-family:Georgia,serif">'+esc(w)+'</h4>';

    if(anno.note)html+='<div class="def" style="font-size:13px">💬 '+esc(anno.note)+'</div>';
  }
  html+='<div class="def" id="apiDef" style="font-size:13px;color:var(--tx3)">'+(anno?"正在获取英文释义…":"正在查询词典…")+'</div>';
  html+='<div class="btns">'+
    '<button class="btn pri" onclick="addVocab()">+ 加入生词本</button>'+
    '<button class="btn ghost" onclick="copyText(\''+w+'\')">复制</button></div>'+

function fetchDef(w){
  const el=()=>document.getElementById("apiDef");
  const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=setTimeout(()=>ctrl&&ctrl.abort(),6000);
  fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w),ctrl?{signal:ctrl.signal}:{})
  .then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(d=>{
    clearTimeout(timer);if(!el())return;
    const e0=d[0]||{};const ph=e0.phonetic||(e0.phonetics||[]).map(p=>p.text).find(Boolean)||"";
    const defs=[];
    (e0.meanings||[]).slice(0,3).forEach(m=>{(m.definitions||[]).slice(0,2).forEach(x=>{defs.push("<b>"+esc(m.partOfSpeech||"")+"</b> "+esc(x.definition||""))})});
    if(lastLookup&&lastLookup.w===w)lastLookup.ph=ph;
    el().innerHTML='<div class="phon" style="margin-bottom:6px">'+esc(ph)+'</div>'+defs.slice(0,4).map(d2=>'<div class="def">'+d2+'</div>').join("");
    if(!defs.length)el().textContent="未找到释义";
  })
  .catch(()=>{clearTimeout(timer);if(el())el().textContent="网络不可用。可长按单词使用 iOS 系统「查询」词典，或直接加入生词本。"});
}

let _seen={urls:new Set(),titles:new Set()};
function seenInit(){
  _seen={urls:new Set(state.imported.map(a=>a.url).filter(Boolean)),titles:new Set(state.imported.map(a=>(a.title||"").toLowerCase()))};
}
function tryAdd(queue,o){
  if(!queue.length||fillAbort)return false;
  if(!o.title||!o.paras||o.paras.length<5)return false;
  if(o.url&&_seen.urls.has(o.url))return false;
  if(_seen.titles.has(o.title.toLowerCase()))return false;
  const wc=wcOf(o.paras);
  if(wc<550||wc>2000)return false;
  if(o.url)_seen.urls.add(o.url);
  _seen.titles.add(o.title.toLowerCase());
  const day=queue.shift();
  state.imported.push({id:"c"+Date.now()+"_"+Math.floor(Math.random()*100000),day:day,title:o.title,source:o.source,minutes:Math.max(8,Math.min(22,Math.round(wc/80))),tag:o.tag||"",dek:o.dek||"",paragraphs:o.paras,vocab:{},grammar:{},imported:true,url:o.url||""});
  return true;
}
function buildQueue(override,n){
  const used=new Set(ARTICLES.map(a=>a.day).concat(state.imported.map(a=>a.day)));
  let q=[];
  if(override){for(let i=1;i<=100;i++)q.push(i)}
  else{for(let i=1;i<=100;i++)if(!used.has(i))q.push(i)}
  if(n>0)q=q.slice(0,n);
  return q;
}
function openFillSheet(){
  openSheet("<h4>📡 正在抓取文章…</h4>"+
    '<div class="pbar" style="margin-top:12px"><i id="fillBar" style="width:0%"></i></div>'+
    '<div class="muted" id="fillLog">准备中…</div>'+
    '<div class="btns"><button class="btn pri" onclick="fillAbort=true">停止</button></div>');
}
function closeFillSheet(added,left){
  const bar=document.getElementById("fillBar");if(bar)bar.style.width="100%";
  const lg=document.getElementById("fillLog");if(lg)lg.textContent=fillAbort?("已停止：共添加 "+added+" 篇，剩余空日 "+left+" 天"):("完成：共添加 "+added+" 篇，剩余空日 "+left+" 天");
  save();
  return sleep(1500);
}
async function harvestGuardian(queue,secs,key,ui){
  let added=0,page=1;
  const fromDate=new Date(Date.now()-2*365*86400000).toISOString().slice(0,10);
  while(queue.length&&page<=14&&!fillAbort){
    try{
      ui.log("The Guardian：第 "+page+" 页…（剩余 "+queue.length+" 天待填充）");
      const r=await fetch("https://content.guardianapis.com/search?section="+secs.join(",")+"&page="+page+"&page-size=50&from-date="+fromDate+"&api-key="+encodeURIComponent(key)+"&show-fields=bodyText,wordcount,standfirst");
      if(r.status===401||r.status===403)throw new Error("API Key 无效（可到 open-platform.theguardian.com 免费注册）");
      if(r.status===429)throw new Error("限速（test Key：1次/秒、500次/天）");
      if(!r.ok)throw new Error("HTTP "+r.status);
      const res=(await r.json()).response||{};
      if(res.status!=="ok")throw new Error(res.message||"API 异常");
      const results=res.results||[];
      for(const it of results){
        if(!queue.length||fillAbort)break;
        const f=it.fields||{};
        const paras=(f.bodyText||"").split(/\n+/).map(s=>stripTags(s).trim()).filter(s=>s.length>40);
        if(tryAdd(queue,{title:(it.webTitle||"").trim(),source:"The Guardian · "+(it.sectionName||""),tag:it.sectionName||"",dek:stripTags(f.standfirst||""),paras:paras,url:it.webUrl}))added++;
      }
      ui.prog(1,1);
      if(res.pages&&page>=res.pages)break;
      if(!results.length)break;
    }catch(e){ui.log("⚠ The Guardian："+e.message);await sleep(2200);break}
    page++;
    await sleep(1200);
  }
  return added;
}
async function harvestGV(queue,ui){
  let added=0;
  const feeds=["https://globalvoices.org/feed/","https://globalvoices.org/-/world/feed/","https://globalvoices.org/-/technology/feed/"];
  for(const fu of feeds){
    if(!queue.length||fillAbort)break;
    try{
      ui.log("Global Voices：读取订阅源…（剩余 "+queue.length+" 天）");
      const r=await fetch(PROXY+encodeURIComponent(fu));
      if(!r.ok)throw new Error("HTTP "+r.status);
      const items=parseFeedItems(await r.text())||[];
      for(const it of items){
        if(!queue.length||fillAbort)break;
        const paras=it.encoded?htmlToParas(it.encoded):[];
        if(tryAdd(queue,{title:it.title,source:"Global Voices",tag:"全球之声",dek:it.desc.slice(0,160),paras:paras,url:it.link}))added++;
      }
      ui.prog(1,1);
    }catch(e){ui.log("⚠ Global Voices："+e.message);await sleep(2000)}
  }
  return added;
}
async function harvestConv(queue,ui){
  let added=0;
  const feeds=["https://theconversation.com/us/rss","https://theconversation.com/global/rss"];
  const links=[];
  for(const fu of feeds){
    if(fillAbort)break;
    try{
      ui.log("The Conversation：读取订阅源…");
      const r=await fetch(PROXY+encodeURIComponent(fu));
      if(!r.ok)throw new Error("HTTP "+r.status);
      const items=parseFeedItems(await r.text())||[];
      items.forEach(it=>{if(it.link&&it.title)links.push(it)});
    }catch(e){ui.log("⚠ The Conversation feed："+e.message);await sleep(1800)}
  }
  for(const it of links){
    if(!queue.length||fillAbort)break;
    try{
      ui.log("The Conversation：抓取正文…（剩余 "+queue.length+" 天）");
      const r=await fetch(PROXY+encodeURIComponent(it.link));
      if(!r.ok)throw new Error("HTTP "+r.status);
      const paras=extractParas(new DOMParser().parseFromString(await r.text(),"text/html"));
      if(tryAdd(queue,{title:it.title,source:"The Conversation",tag:"学术评论",dek:it.desc.slice(0,160),paras:paras,url:it.link}))added++;
      ui.prog(1,1);
    }catch(e){/* 跳过失败的单篇 */}
    await sleep(900);
  }
  return added;
}
async function multiFill(){
  const key=(document.getElementById("gKey").value.trim()||"test");
  const secs=[].map.call(document.querySelectorAll(".gsec:checked"),c=>c.value);
  if(!secs.length){toast("请至少选择一个板块");return}
  const override=document.getElementById("gOverride").checked;
  state.gKey=key;state.gSections=secs;save();
  fillAbort=false;
  const queue=buildQueue(override,0);
  if(!queue.length){toast("没有可填充的空闲日");return}
  const target=queue.length;
  openFillSheet();
  seenInit();
  const ui=fillUI();
  let added=0;
  ui.log("开始：共 "+target+" 个空日待填充");
  added+=await harvestGuardian(queue,secs,key,ui);
  if(queue.length&&!fillAbort){ui.log("Guardian 渠道用尽，切换 Global Voices…（已添加 "+added+" 篇）");added+=await harvestGV(queue,ui)}
  if(queue.length&&!fillAbort){ui.log("切换 The Conversation…（已添加 "+added+" 篇）");added+=await harvestConv(queue,ui)}
  await closeFillSheet(added,queue.length);
  closeSheet();renderTabs();renderTab();
  toast(added?("✓ 已排入 "+added+" 篇文章"+(queue.length?"，剩余空日 "+queue.length+" 天":"，100 天已排满")):"未添加文章（网络或渠道所限，可稍后重试）");
}

let _urlArt=null;
function urlImportUI(){
  _urlArt=null;
  openSheet("<h4>🔗 从链接抓取文章</h4>"+
  '<div class="muted">适用于 NPR、BBC、卫报网页版等免费新闻页面。抓取经公共代理（allorigins）转发，偶尔较慢或失败，可重试或改用粘贴导入。</div>'+

async function fetchUrlArticle(){
  const u=document.getElementById("artUrl").value.trim();
  const prev=document.getElementById("urlPrev");
  if(!/^https?:\/\//i.test(u)){toast("请输入有效链接");return}
  prev.innerHTML='<div class="muted">抓取中，请稍候…</div>';
  try{
    const r=await fetch(PROXY+encodeURIComponent(u));
    if(!r.ok)throw new Error("代理返回 HTTP "+r.status);
    const doc=new DOMParser().parseFromString(await r.text(),"text/html");
    const h1=doc.querySelector("h1");
    const title=(h1&&h1.textContent.trim())||(doc.title||"").split(/[|\u2013-]/)[0].trim()||"未命名文章";
    const paras=extractParas(doc);
    if(paras.length<4)throw new Error("未能提取到足够正文（可能遇到付费墙或动态渲染页面），请改用粘贴导入");
    _urlArt={title:title,paras:paras,url:u};
    const words=wcOf(paras);
    prev.innerHTML='<div style="margin-top:12px;background:var(--card2);border-radius:12px;padding:12px">'+
      '<b style="font-size:14px">'+esc(title)+'</b>'+
      '<div class="muted" style="margin-top:4px;font-size:12px">'+esc(paras[0].slice(0,120))+'…<br>约 '+words+' 词 · '+paras.length+' 段</div></div>'+
      '<div class="btns"><button class="btn pri" onclick="saveUrlArt()">保存并排入空闲日</button></div>';
  }catch(e){
    prev.innerHTML='<div class="muted" style="margin-top:10px;color:var(--err)">⚠ '+esc(e.message)+'</div>';
  }
}
function saveUrlArt(){
  if(!_urlArt){toast("请先抓取");return}
  const used=new Set(ARTICLES.map(a=>a.day).concat(state.imported.map(a=>a.day)));
  let day=null;for(let i=1;i<=100;i++)if(!used.has(i)){day=i;break}
  if(day===null){toast("100 天日程已满");return}
  const words=wcOf(_urlArt.paras);
  let host="网页导入";
  try{host=new URL(_urlArt.url).hostname.replace("www.","")}catch(e){}
  state.imported.push({id:"u"+Date.now(),day:day,title:_urlArt.title,source:host,minutes:Math.max(8,Math.min(22,Math.round(words/80))),tag:"网页导入",dek:"",paragraphs:_urlArt.paras,vocab:{},grammar:{},imported:true,url:_urlArt.url});
  _urlArt=null;save();closeSheet();renderTab();toast("✓ 已排入 Day "+day);
}

/* ---------------- 自动句法解析（规则引擎，覆盖所有文章的所有句子） ---------------- */
const CLAUSE_RULES=[
 [/^(even though|although|though)\b/,"让步状语从句","由 although/though 引导，表「尽管」，主句为其转折对象"],
 [/^(whereas|while)\b/,"对比/让步从句","while/whereas 表「然而/尽管」，对比前后两个分句"],
 [/^(because|since|now that|in that)\b/,"原因状语从句","表「因为」，解释主干动作的原因"],
 [/^(so that|in order that)\b/,"目的状语从句","表「以便/为了」"],
 [/^(if|unless|as long as|provided that|once)\b/,"条件状语从句","表「如果/除非/一旦」"],
 [/^(when|whenever|until|before|after|as soon as)\b/,"时间状语从句","说明主干动作发生的时间背景"],
 [/^(where)\b/,"地点状语从句","说明动作发生的地点或情境"],
 [/^(who|whom|whose|which)\b/,"定语从句","修饰前面的名词；翻译时先找到被修饰的先行词"],
 [/^(that)\b/,"that-从句","多为定语从句（修饰名词）或前面动词的宾语从句（如 say that...）"],
 [/^(rather than|instead of)\b/,"对比结构","「而不是」，引出被否定的替代选项"],
 [/^(despite|in spite of|regardless of)\b/,"让步介词短语","「尽管」，后接名词性成分，不接完整句子"],
 [/^(not only)\b/,"并列强调结构","not only...but also 前后并列，重心落在后者"],
 [/^(with|without)\s+\w+(ing|ed)\b/,"with 复合结构","with + 名词 + 分词，表伴随状况或原因"],
 [/^(to\s+\w+)\b/,"不定式短语","to do 结构，多表目的或结果"]
];
function autoGrammar(s){
  const parts=s.split(/,\s*|\s+[—]\s+|\s*;\s*/).map(function(x){return x.trim()}).filter(Boolean);
  if(parts.length>1){
    const b=[["主干",parts[0]+"（主句核心，先读懂这一段）"]];
    for(let i=1;i<parts.length;i++){
      const low=parts[i].toLowerCase();
      let hit=null;
      for(const rule of CLAUSE_RULES){if(rule[0].test(low)){hit=[rule[1],rule[2]];break}}
      if(!hit){
        if(/^(having\s+\w+ed|\w+ing)\b/.test(low))hit=["分词短语","现在分词/完成分词结构，表伴随、原因或对前面名词的后置修饰，逻辑主语与主句一致"];
        else if(/^\w+ed\b/.test(low))hit=["过去分词短语","表被动或伴随状态，修饰前面相关名词"];
        else hit=["修饰成分","插入语/补充说明，第一遍阅读可先跳过"];
      }
      const q=parts[i].length>90?parts[i].slice(0,90)+"…":parts[i];
      b.push([hit[0],"“"+q+"”——"+hit[1]]);
    }
    const skel=parts.map(function(p,i){return i===0?p:"[ … ]"}).join(", ");
    b.push(["括号阅读法","把每个从句/修饰成分暂时括起来只读主干："+skel.slice(0,140)+(skel.length>140?"…":"")]);
    return {t:"自动解析 · 识别到 "+(parts.length-1)+" 个从句/修饰成分",b:b};
  }
  return {t:"简单句（自动解析）",b:[["主干",s],["说明","本句为主谓（宾）结构的简单句，无嵌套从句；重点关注谓语动词及时态即可"]]};
}
