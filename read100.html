shed for the exit. If they are all wrong, it is their money on the line. And if they are right, the AI era may arrive a bit sooner. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/09/03/nvidia-is-driving-the-ai-boom-good"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.09.07","day":82,"title":"Mark Zuckerberg’s Social Reckoning","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.09.07","paragraphs":["The Meta settlement will force meaningful changes on Facebook and Instagram. It also reflects the degree to which public outrage is outmatched by the speed and size of Big Tech.","When Mark Zuckerberg, the founder and C.E.O. of Meta, the company behind Facebook and Instagram, has tried to defend his business to the public, it’s generally gone poorly. (“I think I’m actually well known to be sort of bad at this,” the billionaire confessed, while giving testimony at a trial in February.) Confronted with leaked internal documents showing that Meta’s products made body-image issues worse for one in three teen girls, and that many of them blamed Facebook and Instagram for increases in over-all anxiety and depression, Zuckerberg dismissed his own company’s findings as user “feedback.” This winter, as a plaintiff’s lawyer in Los Angeles presented him with extensive evidence supporting a link between Meta’s social-media brands and the mental health of its teen-age users, Zuckerberg said, more than a dozen times, “You’re mischaracterizing this.”","Such episodes now look like clumsy moments in a decade of dissembling. Last Wednesday, Meta reached a settlement with the attorneys general of forty-seven states, who had sued it for illegally manipulating the attention of children. The settlement will cost the company, which didn’t acknowledge wrongdoing, up to seventeen billion dollars, a striking figure. Even more striking is a detail reported by the Wall Street Journal: during the second quarter of 2026 alone, Meta spent more than two billion dollars on its legal defense.","The trial, held in Oakland, hinged on an argument that, even if social-media providers cannot be held responsible for the content that their users post—a protection established in Section 230 of the Communications Decency Act—they should be liable for the algorithms that shape what users see. Before the settlement, the plaintiffs had made a strong case. The states presented evidence that senior executives at Meta, intent on maximizing their company’s growth, had repeatedly set aside concerns about what its products were doing to its youngest users. A former Meta engineer testified that he had e-mailed Zuckerberg data showing that the chance of a teen encountering violent or graphic content was between a hundred and four hundred times higher than what the company acknowledged publicly.","Beyond the financial penalty, Meta agreed to make measures that could, if spread through the industry, meaningfully change the experience of social media: Facebook and Instagram will remove the “like” count on posts, do more to verify that their users are at least thirteen years old, limit the service to two hours a day for teen-agers, and restrict service entirely for those users during nighttime hours. There were signs, too, that the public pressure on Meta may yet continue. Florida’s attorney general, James Uthmeier, stayed away from the lawsuit, arguing that it did not go far enough. After the settlement was announced, he released a statement saying, “We’ll see them at trial.”","The settlement was quickly compared to the tobacco lawsuits of the nineties, a moment of public clarity during which a ubiquitous product came to be seen as a scourge. But Meta, a trillion-dollar company increasingly invested in artificial intelligence, is so much vaster than RJR Nabisco, and the current settlement applies to only a single facet of its sprawling operations. There has always been an element of denial in the focus on Instagram’s relationship with minors, when so many of the rest of us, of legal age, also scroll obsessively at weird hours. An unforgiving upcoming film about Meta, “The Social Reckoning,” written and directed by Aaron Sorkin, ends with the January 6th riot at the Capitol, an event that had a lot to do with social media but not so much to do with kids.","It would be easier to view the settlement as a breakthrough in the public’s relationship with technology if we, the public, did not keep making the same mistakes. The problem is speed. New technologies are being disseminated ever more quickly, and the machinery of politics and law delivers accountability at best intermittently, and then only at a painstaking crawl. It took more than a decade of worrying about the way teen-agers used Facebook and Instagram for a legal settlement to enforce a change in Meta’s behavior. Meanwhile, the crypto industry was the largest corporate donor in the 2024 election cycle, and this year’s midterms have been shaped by a voter backlash to A.I. data centers, which have cropped up across the country before the public has had a chance to weigh in on a technology that, as its own developers constantly warn, might be an existential threat.","The scale of private capital available to entrepreneurs has made the tech industry a particularly insular space. One story that the Meta settlement chased off the business pages was that of Leopold Aschenbrenner, a twenty-four-year-old former Columbia valedictorian who’d built a forty-five-billion-dollar hedge fund after making a bullish case for A.I. in a viral online essay. At parties, Aschenbrenner would tell friends that he planned to buy up the rights to faraway galaxies. In late July, when he failed to anticipate a tech downturn, thirty-five billion dollars of his investors’ money vanished.","Zuckerberg has always been a less fanciful kind of founder. Like his products, he expands to fill a social container. In the Obama era, he and his wife launched a Bill Gates-style philanthropy that invested in medical research, education, and public health; these days, he’s into mixed martial arts. (As the journalist Vincent Bevins has emphasized, social media itself followed a similar trajectory, in that what began as a tool to galvanize pro-democracy movements became useful to reactionary forces, too.) When interviewed about Sorkin’s first movie about him, “The Social Network,” Zuckerberg said that its creators had misunderstood him: “They just can’t wrap their head around the idea that someone might build something because they like building things.” But that formulation ignores the crucial matter of what those things do to the people who use them.","The social-media age may finally be waning—Facebook and Instagram chastised, investors looking elsewhere, even Donald Trump’s Presidency, after an extended halftime break, now nearing its fourth quarter. But the relationship between tech and society has not really been altered, so different products continue to follow a familiar pattern: a cloaked and supercilious rollout, a sudden ubiquity, a panicked public response. Two decades on, we are still stuck in versions of Zuck. The week of the Facebook settlement, the cover of Time featured Sam Altman and Greg Brockman, two of the founders of OpenAI, making a defensive case for their product. The headline read, simply, “Trust Us.” ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.09.12","day":83,"title":"The truth and the lies about Islam in Europe","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Islam poses no serious danger. But Islamism and the fear of Islam do","note":"2026.09.12","paragraphs":["PANIC ABOUT Islam in Europe is spreading. In several European countries half the population now thinks it is incompatible with Western values. On September 6th the populist-right Alternative for Germany (AfD) won 44% of the vote in Saxony-Anhalt, its largest state-election tally yet, warning about “Islamisation” and promising forced deportations. The same weekend in Britain hundreds of balaclava-clad thugs occupied Dover, chanting “Stop the boats” and “Christ is King”. In France Marine Le Pen's call to ban Islamic headscarves from public places is backed by 60% of voters.","The obsession has also taken root in America. The fear is less of terrorists, as it was after September 11th 2001, than of an Islamic plot to take over Europe from within. Members of the Trump administration warn of “civilisational erasure”.","This perception is harming transatlantic relations. It is also wrong. Europe faces no Islamic takeover, no mass radicalisation of Muslims and no erasure of its culture. As our reporting shows, it does not have “no-go zones”, sharia is not creeping into national law and nowhere is a demographic “great replacement” under way.","The real danger to Europe is different: of extremism fuelled by Islamism (the belief that the state should enforce Islamic principles) and by social-media-driven right-wing paranoia. The left makes this worse by denying the modest but real threats Islamism poses. So do politicians in the centre, by keeping quiet lest they attract accusations of racism. This dynamic could indeed harm Europe’s liberal democracies—not by replacing them with a caliphate, but by slowing integration and favouring policies that would do lasting harm to their freedoms.","The most extreme fears are easily debunked. Even after record migration from majority-Muslim countries, Muslims now make up just 6% of Europe’s population of well over 500m. Although new arrivals typically have more children than the native-born do, fertility rates tend to converge within two generations. That is a long way from civilisational erasure.","In fact, most Muslim immigrants want to get on in their new home, not impose on it a version of the societies they have just left. Their children tend to do better than their parents at school. In Britain 67% of Bangladeshis who sat standard tests in 2021 were enrolled in university by age 19, compared with 38% of white Britons. Many Muslims are involved in mainstream politics: witness Britain’s home secretary and London’s mayor. In important ways Muslim attitudes can resemble those of other Europeans. In polling we commissioned among British Muslims, we found little resistance to women working.","What, then, is setting so many Europeans against Islam? Plenty of Muslims hold illiberal views—we report in this issue on the killing of an openly gay imam in South Africa. In Britain, our polling finds, 52% of Muslims think homosexuality is wrong, and young Muslims (41% of under-35s) are more likely than their elders (25%) to believe violence can be justified if someone insults the prophet.","Holding socially conservative views does not in itself make people a threat—some of Europe’s defenders on the right are just as anti-gay as the Muslims they decry. But some of these attitudes should trouble liberals who have long assumed that open societies eventually make people more tolerant. And if the state is too pusillanimous to confront wrongs committed by minorities, as when gangs of Muslim men abused young girls in several English cities, it rightly causes outrage.","Just as important is the conflation of Islam, a religion, with Islamism, a political ideology. Islam isn’t a problem; Islamism can be. Unlike the jihadis of 9/11, most Islamists do not advocate violence. But many practise “entryism”—infiltrating democratic institutions to promote an illiberal agenda. Well-connected Islamist groups might lobby for sweeping hate-speech laws or against counter-extremism programmes. The main danger of entryism is local. Small, well-organised networks can capture a school, a mosque, a council or a charity and use such institutions to discourage integration and impose religious conformity on other Muslims who live nearby.","Concern about these non-violent Islamists has grown among Europe’s security services. In France authorities fret about covert entryism by the Muslim Brotherhood. An official report released last year warned that Islamism could, in time, threaten secular rules and women’s rights. But that seems unlikely. France’s interior ministry estimated that just 139 of 2,800 Muslim places of worship were linked to the Brotherhood.","Instead, the main victims are other Muslims. Half of the 12 council wards in Blackburn, in northern England, are over 60% Muslim; two are over 80%. In such areas women can feel pressure to let sharia councils govern their family lives. Gay and liberal Muslims face intimidation. Non-conformist Muslims complain that Western authorities—scared of being seen as racist—do not extend the same protections to them as they do to non-Muslim citizens.","There is broader harm, too. Islamists stir up antisemitism, not least over Gaza. They demand curbs on free speech about their beliefs. They scare politicians, comedians, academics and journalists into self-censorship. They can bully schools, student unions, charities and councils.","What turns these local threats into a continental danger is how they are exploited. It suits Islamists to claim that any criticism of their political project is an attack on Islam itself. The populist left, including Unsubmissive France and the Greens in Britain, tends to treat questions about migration, crime or Islamism as racist.","And the populist right often whips up fear by claiming that all Muslims pose a threat and accusing the state of a “woke cover-up” and “two-tier treatment”. Few have been more vehement than Elon Musk, who has used his social-media platform to shape views of Islam around the world and to boost Europe’s anti-Muslim right, from the AfD to Tommy Robinson, a British agitator whom we feature in a three-part podcast series starting this weekend.","The populist right’s remedies are as illiberal as the Islamists they claim to be protecting Europe from. Promises of mass deportation, segregation and dress bans all terrify Muslims, inhibiting integration and driving them into the arms of extremists. Any country that enacted such policies would find that the hatred they unleashed would cause enduring damage.","That is why Europe’s mainstream politicians need to offer an alternative. Violence and threats of it should be prosecuted. But there should be no taboos for the sake of cultural sensitivity. Free speech is not the enemy of tolerance but its precondition. Entryism should be called out, as should bigotry. Governments nervous about collecting, or releasing, data leave a vacuum to be filled by speculative hyperbole.","Tackling all this will not be easy or quick, but there is hope. Europe’s Muslims are assimilating, as did earlier waves of Catholic, Jewish and Caribbean migrants in the countries where they settled. The arrival of all those previous groups sparked moral panics about whether they would ever fit in. All eventually found a place. Muslims will, too—if division and paranoia are not allowed to get in the way. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/09/10/the-truth-and-the-lies-about-islam-in-europe"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.09.14","day":84,"title":"Can You Feel the Dub Tonight?","source":"The New Yorker","minutes":5,"tag":"The Talk of the Town","dek":"","note":"2026.09.14","paragraphs":["For years, a Peruvian voice actor has tried to get Disney to sign off on his Quechuan translation of “The Lion King.” The new documentary “Runa Simi” follows his path unwinding.","Unlike the tourists pushing strollers and browsing bedazzled “Frozen” T-shirts at the midtown Disney Store on a recent morning, the activist and voice actor Fernando Valencia and the filmmaker Augusto Zegarra were on a pilgrimage, riding up a preposterously long escalator to the second floor with a sense of expectation and anxiety. “It’s like entering the Death Star,” Zegarra said, referencing “Star Wars,” a piece of very lucrative intellectual property that Disney did not create but that it does now own. “You feel like the cashier might introduce you to Mickey himself, and we could make our pitch.”","Valencia, handsome and slight, with a black ponytail and an embroidered fedora, was a bit more nuanced. “My relationship with Disney has changed every day since I was a little boy,” he said. “But I can’t help but see it as that impossible giant.”","The pitch they’d make, to Mickey Mouse or to anyone else in the Disney organization who might listen, is fairly simple: Valencia and Zegarra were in town to screen “Runa Simi”—a new documentary about Valencia’s years-long quest to dub Disney’s movie “The Lion King” into Quechua, an Indigenous language spoken by more than three million people in Peru’s highlands. Zegarra, burly, with a friendly smile partially obscured by a mustache, is the documentary’s director. And although showing the documentary in New York was exciting, what Valencia and Zegarra really wanted was to release it in Peru. The film—or, rather, the films, both the Quechua-dubbed “Lion King” and the documentary—is a love letter to a language, and to the culture woven into and defined by that language. (All told, there are some ten million Quechua speakers across the Andes, from northern Chile to southern Colombia, making it the most widely spoken Indigenous language of the Americas.)","The documentary chronicles Valencia’s stubborn attempts to get permission from the Disney corporation for his “Lion King” project. He e-mails, he calls, he D.M.s, but he never hears back from the company. “Runa Simi” uses very little copyrighted material, but Peru has more rigid rules regarding fair use than does the U.S. So far, Zegarra told me, no commercial distributor has been willing to risk showing “Runa Simi” in Peruvian theatres without written permission from Disney. It’s all very meta: a documentary about the unauthorized translation of a film, both caught in a legal limbo. When “Runa Simi” screened at the Lima Film Festival last year, it won the Audience Award. Zegarra has made the most celebrated Peruvian documentary in decades. Still, only a handful of Peruvians have been able to see it. (Disney declined to comment.)","The two collaborators last visited New York in June, 2025, for the Tribeca Festival, when Zegarra won the award for Best New Documentary Director. After attending a screening of “Runa Simi,” an audience member was so moved that he gave Valencia tickets to see “The Lion King” on Broadway with his teen-age son, Dylan, who voices Simba in the Quechua version. (There are no lions in the Andes—or kings, for that matter—so the title is one of the relatively few phrases that remain untranslated.) When the curtain went up, Valencia spent the first several minutes overcome by emotion, glassy-eyed and weeping. “Every language has a spiritual meaning,” he said. “And the characters had different personalities for me because I’d translated them.” Watching the musical, he felt as if he knew the lines by heart. “In my head, I was hearing it in Quechua.”","Released in 1994, the original “Lion King” was the highest-grossing film of the year, and the highest-grossing animated film in history until “Finding Nemo” broke that record, in 2003. But, more than three decades later, “The Lion King” doesn’t take up much real estate in the Disney Store: besides plush toys of Simba and Nala, there’s hardly any trace of it. So, why did Valencia tackle “The Lion King”? He saw it in 1995, when he was six years old, on a small black-and-white television at home in Cuzco. “It was the first movie I saw all the way to the end,” he said.","This was more than Zegarra had managed. He, too, was six years old when he saw the film, at a theatre in Lima; he cried so much that he was dragged out halfway through. “My version of ‘The Lion King’ ends with Mufasa dying,” he said.","Valencia believes that the way to preserve a language is to get kids to speak it. “Entertainment is a right,” he said. “Quechua saved my life. It gave me purpose.” Just then, the strains of a familiar song wafted across the store, and Valencia and Zegarra followed it, past a Lightning McQueen replica, to a tiny area where a half-dozen child-size chairs were arranged before a screen. The song was “Hakuna Matata,” sung by Timon, Pumbaa, and a young Simba. The scene happened to be the first clip that Valencia had translated and dubbed a decade ago, when his quixotic project had begun. “The Lion King” has been dubbed into more than forty languages, most of which keep the song’s Swahili title. For the unauthorized Quechua version, Valencia took the liberty of changing it: “Hakuna Matata” became “Hakuchu Munayta,” which means, roughly, “Let’s walk together in beauty.” As the chorus played, and as the cartoon characters bounced along the screen, he sang along, in Quechua. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.09.19","day":85,"title":"Can the AI arms race be stopped?","source":"The Economist","minutes":5,"tag":"Leaders","dek":"America will struggle to make the technology safe while staying ahead of China","note":"2026.09.19","paragraphs":["TWO THINGS should make you consider what artificial intelligence could mean for humanity. One is that those working with the technology are warning about it leading to a catastrophe—human extinction, even. The other is how technological innovation is aggravating the destruction of Ukraine. These things offer conflicting lessons for whether AI’s rapid progress can or should be slowed down.","For years, leading AI bosses have signalled that their technology could become lethal. Bots may become brainy enough to outwit their creators before they are “aligned” with humanity’s goals and ethics. Bad people could use AI to wreak havoc. These warnings have become more credible as AI agents have escaped their sandboxes during testing, co-ordinated with one another and hacked organisations, including an AI lab itself. Anthropic, one model-maker, has caught people using its models for malign ends, from Mali’s intelligence services getting a mass-surveillance system built, to Houthi rebels in Yemen thought to be writing software for ballistic missiles.","Following the recent resignation of a researcher at Anthropic, public fear of AI doom has spread. In a post viewed more than 170m times, he said that it and OpenAI were “gambling with our lives”. AI is rapidly growing more potent, for good and ill. In May prediction markets priced a less-than-one-third chance of AI solving any millennium prize maths problem before 2030; on September 8th OpenAI said it had solved one of them, causing angst among mathematicians. On September 12th Sam Altman and Elon Musk, two AI titans, endorsed a call by Dario Amodei, the head of Anthropic, to “pace the frontier”, ie, to slow AI’s progress. Those in favour of a slowdown include Bernie Sanders, a left-wing senator, and Steve Bannon, a right-wing populist.","Those opposed include President Donald Trump, whose administration fears more than anything losing America’s lead in AI to China, its only serious rival. Scott Bessent, America’s treasury secretary, has said that if China gains the advantage: “Nothing else would matter.”","As evidence, Mr Bessent could point to Ukraine, where each step in a technological arms race has a swift effect. As we report, Russia has ruthlessly deployed its latest kamikaze drones to bombard civilian infrastructure. As well as being faster, its drones now use one another as a “mesh” communications network to relay information and commands. Soon, Russia will have its own version of Mr Musk’s Starlink satellite network, making its long-range strikes more accurate.","It is the latest demonstration of how even a small technological edge matters in wartime. Ukraine’s own battlefield-drone innovation helped it repel waves of Russian attacks. Ukraine can strike deep into Russia with long-range drones. Both sides are working on swarming drones that will be able to operate more autonomously as a single adaptive system.","The war shows how technology translates into hard power—and that Russia uses it without regard to the old rules or norms of combat. Even if America did not fear a similar hot war with China, a lead in AI would give its main geopolitical rival dominance in hacking, spying and hybrid warfare. Those are not capabilities which America should cede to an authoritarian state with an interest in stamping out liberal ideas.","A pause could therefore work only if China signed up to it, too. Mr Trump plans to host Xi Jinping, China’s president, at the White House on September 24th. But even were Mr Trump seeking to slow down, it is unlikely that Mr Xi would agree to the plan Mr Amodei envisages, because that would freeze Chinese AI in second place. And neither side could risk the other breaching a pact by racing ahead.","For a deal, each would need to verify compliance, as with arms control during the cold war. America, Britain and the Soviet Union banned atmospheric nuclear tests in 1963 because they could detect them; underground tests went on for three more decades until they, too, could be monitored. Alas, though data centres are visible, no verifiable method exists to see inside them. Infrastructure training a superintelligence could masquerade as chatbots answering everyday queries.","The options for a deal on AI safety are therefore limited; but they do exist. More transparency would help. Both sides should pledge to disclose and investigate safety incidents at their labs, using domestic law. Each could signal that they care about safety to build confidence, paving the way for the other side to take precautions. They should also press each other to improve labs’ cyber-security so that AI agents cannot so easily escape sandboxes—and to ensure that, if one does, its lab is financially liable.","Most important is the challenge of ensuring that AI operates in humans’ interests. America and China have very different values, but both know that being ahead is no good if it wipes out humanity. They should promise to share work on the elements of alignment that do not confer a competitive advantage. Knowledge of the best evaluation methods and containment techniques is a global public good. If one side makes an important safety breakthrough, hoarding it makes no sense.","Some dismiss the recent wave of doomerism as a marketing ploy by AI companies, or even an attempt to suppress competition. Yet AI progress is fast enough, the safety incidents hair-raising enough, and the warnings of the companies long-standing enough to be taken seriously. AI does not have to kill off every human to bring about a catastrophe. An OpenAI agent swarm targeted a technology company; what if next time it attacks an electrical grid or a weapons system? It might even be intelligent enough to evade attempts to shut it down.","The world must urgently try to forestall this risk. Yet democracies must also avoid losing control to authoritarians. These are difficult and conflicting tasks. They could ultimately lead to war. The stakes could hardly be higher. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/09/17/can-the-ai-arms-race-be-stopped"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.09.21","day":86,"title":"How to Protect Democracy","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.09.21","paragraphs":["The emergence of Germany’s far right as a political force represents an old dilemma.","The Brandmauer, or firewall, was meant to protect German democracy. The principle arose in the mid-twenty-tens, in response to the rise of Alternative für Deutschland, or the AfD, a right-wing populist party known for its ethnonationalism, hard-line anti-immigration platform, and pro-Russian foreign policy. Germany’s traditional parties agreed to refrain from any sort of political coöperation: they would neither form coalitions with the AfD nor rely on its votes for governing majorities.","Now the Brandmauer, long under pressure, may be facing collapse. This month, in Saxony-Anhalt, a small German state of slightly more than two million people in the east, the AfD won a plurality of votes: nearly forty-four per cent. Without an outright majority, the Party can’t govern on its own, but that number is more than double the AfD’s share of the vote in Saxony-Anhalt just five years ago. And it’s the first time in Germany’s postwar history that a far-right party has come this close to governing a state.","The emergence of the AfD as a political force represents one of democracy’s oldest dilemmas: how to respond to anti-democratic movements that have a democratic base of support. A century ago, conservative politicians in the Weimar Republic made the fateful, and tragic, choice to appoint Adolf Hitler as Chancellor and to name other Nazi figures to ministerial posts, believing that they could control them by absorbing them into the governing apparatus. That turned out, well, as it turned out. In 1949, in order to prevent such a disaster from ever occurring again, Basic Law, the country’s modern constitution, enshrined a set of principles known as wehrhafte Demokratie, or militant democracy, which call on state institutions to mobilize against those who seek to undermine democracy from within. The Brandmauer is an informal compact, but it’s certainly within the spirit of that political culture.","This postwar consensus has found an antagonist worthy of concern in the AfD. The Holocaust, one Party leader said, was a mere “speck of bird shit” on a thousand years of German history; another described Berlin’s Holocaust Memorial as a “monument of shame.” A Party policy calling for “remigration” is vague yet tinged with menace; in 2023, senior AfD figures attended a secret conference in Potsdam to discuss mass deportations of immigrants, including what one participant deemed “non-assimilated citizens.” Whereas other European right-wing populist parties (such as the National Rally, in France) and leaders (like the Italian Prime Minister, Giorgia Meloni) have drifted toward the center in an effort to make their positions more palatable, the AfD has remained resolutely illiberal. Germany’s domestic-intelligence service has classified some local branches of the Party as extremist organizations.","The Brandmauer, then, may have been a necessary instrument, but it allowed establishment parties to focus on the mechanics of defense rather than on offense—that is, on articulating a program that will win over voters. The region of the former East Germany, for example, is facing deindustrialization and demographic decline; voters there, who tend to be poorer than those in the west and feel alienated and excluded, provide the AfD with its highest levels of support.","Jana Hensel, a journalist born in East Germany, published a book this year subtitled “Why the East Is Turning Away from Democracy.” She said, “By spending all this time thinking about how to maintain the firewall, we managed to forget the voters on the other side—how they live, their feelings, their problems.” The Brandmauer allowed the AfD to enjoy the image of the disruptive outsider, the one who really feels your pain, without the responsibility of having to do anything about it.","In Saxony-Anhalt, the AfD’s strong showing came at the expense of the Christian Democratic Union, the center-right party of Angela Merkel and of the current Chancellor, Friedrich Merz. The AfD hopes to persuade a handful of C.D.U. members to break from their firewall pledge and enable a governing majority; AfD leaders are also courting a far-left party that shares their hostility toward immigration and current policy on Russia and Ukraine. Perhaps more likely is a political stasis, in which neither the AfD nor the forces opposed to it take charge outright. That’s hardly a victory for those seen as the protectors of Germany’s normality.","In truth, no mainstream German party has figured out a formula for slowing the AfD’s electoral march. Merz has periodically flirted with adopting part of its agenda, specifically on immigration. Last year, in a controversial vote in the Bundestag, the C.D.U. pushed through a resolution on stricter migration rules which it knew would gain a majority only with AfD support. But one study after another shows that, when established parties take on the policies of the insurgent right, they end up just shedding more votes to it. In recent days, some C.D.U. members have renewed talk of a legal ban of the AfD. None of these stopgap measures deal with the real problem: like much of Europe, Germany is changing—economically, culturally, politically—and, in a sizable part of the population, that is stoking a desire for radical solutions. “Even if the AfD won’t fix the problems of its supporters,” Hensel said, “it will destroy the system under which they think they have suffered.”","Two other German states have elections later this month, and in 2029 the country will hold federal elections that will seat a new Bundestag and, perhaps, a new Chancellor. The AfD is rising in the west, too—for example, in Baden-Württemberg, a wealthy state home to much of the country’s automotive industry. In a sign of Germany’s greater manufacturing decline, the auto sector lost more than forty thousand jobs last year. The VW Group recently announced plans for fifty thousand additional phased layoffs and the end of production at four plants. That sort of malaise may lead to support for the AfD, even as it struggles with a solution. The Party’s co-chair Alice Weidel recently stumbled on television when asked to explain how German car producers could compete with growing demand for Chinese electric vehicles.","For years, the Brandmauer freed the AfD from such expectations. Yet competence at institutional defense is no substitute for an affirmative vision of governance. That’s also a lesson for other European democracies, from Austria to France, where mainstream parties have struggled to keep far-right challengers from power. A firewall can protect a political system, at least for a while, but it cannot explain what that system is for, or why its citizens should care. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.09.26","day":87,"title":"When America walks away","source":"The Economist","minutes":6,"tag":"Leaders","dek":"For decades America has enjoyed hegemony over the Middle East. That is about to end","note":"2026.09.26","paragraphs":["AMERICA SEEMS to be stuck in the Middle East. It has no easy way out of its war with Iran. Yet the conflict, however it ends, will in fact mark something quite different: the moment when America pulls back from the region—in the sense that it finally relinquishes its hegemony there. For the first time since the great powers dismembered the Ottoman empire a century ago, the Middle East’s overarching order will no longer be imposed from afar. Will that herald an orgy of score-settling and violence, or a new beginning?","Since the first world war, the birthplace of the world’s three great monotheistic religions has suffered misery heaped upon misery. Arabs who had fought alongside the war’s victors felt betrayed when Britain took control of Iraq, Jordan and Palestine, and France helped itself to Lebanon and Syria. Nationalist leaders, including Gamal Abdel Nasser of Egypt, later fell under the spell of ruinous Soviet-inspired economic policies. The staggering abuse of human rights by dictators such as Saddam Hussein in Iraq and Hafez al-Assad in Syria was matched only by the violent fanaticism of the jihadists nourished by their sadistic rule.","After three wars, countless covert operations and seemingly endless rounds of diplomacy, America’s attempts to impose its designs have run their course. Like Britain, France and Russia, America will still be involved. It will occasionally use military force to pursue its interests, including for counter-terrorism. But it will abandon its role as architect.","The signs of America’s looming retrenchment are unmistakable—even as President Donald Trump uses the annual meeting of the UN to threaten Iran with “annihilation” for the umpteenth time. Two stand out. Earlier this month America declined to join its ally Saudi Arabia in striking the Houthis in Yemen, who are endangering shipping in the Red Sea. Instead it held talks behind the Saudis’ backs to spare American vessels from attack. That may seem like a detail, but when a superpower does deals with an insurgent militia, everyone understands it wants to cut its commitments.","The other sign is the expectation that America will limit its presence in the Middle East. In peacetime it has 30,000-40,000 troops on 19 bases, eight of which are permanent. However, the war has exposed how vulnerable they are to drones and cheap missiles. America has therefore been obliged to depend on aircraft-carriers and its Indian Ocean base on Diego Garcia. Some experts are arguing that it should concentrate its forces in a few places, such as Israel and Jordan.","This fits a broader realignment in which, as NBC reported this month, 25,000-40,000 American troops could be pulled out of Europe, too. The Trump administration is focused on the Americas. Securocrats want to equip America for the growing rivalry with China which, as this week’s Trump-Xi summit shows, teeters between wary co-existence and outright hostility. Neither goal is advanced by Middle Eastern wars that empty America’s arsenals and suck its forces out of Asia.","And to what end? Until 2020 America was an oil importer; today it is a colossal exporter. China, by contrast, has become Gulf producers’ biggest customer, and the Suez canal carries its goods to European markets. That makes China the great external beneficiary of America’s policies. But it is unlikely to try to step in as the Middle Eastern hegemon—not when it has seen the trillions of dollars and thousands of lives America has paid for the privilege.","Instead, three of the region’s countries have the heft to begin to fill the vacuum—and none of them is Arab. The most dangerous is Iran. If the regime in Tehran collapses, it will be in no position to rebuild its malign influence across Iraq, Syria and Lebanon. If, as is likely, it survives, it will hope to extract rents by controlling the Strait of Hormuz and bullying the Gulf states that it has attacked in the war. It will also try to rebuild its militias abroad. It may well restart work on a nuclear weapon, which will surely remain a red line for America. In all this, it may receive Russian backing.","The second regional power is Turkey, which has been quietly building closer relations with Arab countries. It has become the main supporter of the new government in Syria. With Iraq, it is working on trade routes, water supplies and countering Kurdish separatists. Last month it signed a security agreement with Pakistan and Saudi Arabia. Although it has championed the Muslim Brotherhood, it is more pragmatic than ideological, seeking business for its defence industry and construction firms.","The third is Israel, the dominant military and intelligence power. After the massacres of October 7th 2023 it sees itself as a modern Sparta, seeking to destroy any capability that might threaten it. Under the Abraham accords, it has forged close ties with the United Arab Emirates, even as the prospect of a deal with the Palestinians has faded.","These three countries are unlikely to live with each other in peace. Israel and Turkey are already at loggerheads in Syria. Israel and Iran have unfinished business over the war. Iran and Turkey are ancient imperial rivals.","The losers are the Arab states. Countries such as Iraq and Syria are still struggling to emerge from the ashes of civil war. Egypt, once the natural leader of the Arab world, devotes its energy to corruption and crushing opposition at home. The Gulf monarchies have embraced a prosperity agenda that seeks to anaesthetise ideology with economic growth. That is welcome, but their business model depends on American security. The rivalries of ultra-rich Qatar, Saudi Arabia and the UAE are radiating instability—perhaps America’s parting gift could be to help them work together.","Arabs have long yearned for a chance to recover lost glory from when they were a beacon of science and learning centuries ago. America’s retrenchment is about to give them a chance. But each departing hegemon has left a legacy of frustrated designs and unintended consequences. There remain deep hatreds and unsettled scores. The Middle East will struggle to prove the doubters wrong. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/09/24/when-america-walks-away"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.09.28","day":88,"title":"Our A.I. Problem","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.09.28","paragraphs":["Why can’t the people who produced the technology, which has already shown that a different world is possible, just do the things that would prevent extinction?","A decade ago, when Facebook and Uber were at the height of their powers, the halls of Silicon Valley were inscribed with two brash injunctions: “Move fast and break things” and “Seek forgiveness, not permission.” These principles didn’t age particularly well, and the firms have yet to be forgiven for the things they appear to have broken. As the industry’s center of gravity shifted to A.I., a folksy new motto emerged: “You can just do things.” The business of the frontier labs, like OpenAI and Anthropic, is the sale of individual agency. ChatGPT and Claude enable their users to dream up software, off-load annoying paperwork, and interpret medical results. There are a variety of things that “you,” as in “we,” can now just do.","This novel capacity to exert greater control in everyday life exists in tension, however, with the vague sense that we are ceding control where it really matters—over, say, the structure of the economy. In polls, voters register their displeasure with the perception that A.I. is something that is happening to us whether we like it or not. First, work will be stripped of its dignity, and then we will be stripped of work. In light of the news that a “swarm” of OpenAI models organized themselves into a hacking party, and the grave alarms issued by an Anthropic researcher who felt compelled to quit his job, the attention of the public has suddenly awoken to even more grievous concerns about A.I. safety. It’s not just our jobs that are being risked without our consent but our lives and our species. These real, widespread, and legitimate anxieties have found an outlet in mass opposition to the construction of data centers. Objection to the large, whirring, unwanted buildings presents the only opportunity for people to feel as though they can say no.","The lab executives, presumably, have more leverage over the future. Anthropic’s Dario Amodei and OpenAI’s Sam Altman have reacted to the news cycle by coming out and reiterating all the stuff they’ve been saying for ages: progress has not slowed down, soon one A.I. will autonomously supervise the development of a more capable successor, and within perhaps three years we will reckon with the emergence of an artificial superintelligence we neither understand nor govern. The articulation of this scenario is not a “marketing stunt” to advertise the awesome power of the models, as many skeptics have argued. And, contrary to President Donald Trump’s studied assessment, it’s not a “HOAX.” (The crowd that repeats these nostrums, for whatever reason, seems immune to any new evidence on offer: as the writer Zvi Mowshowitz has put it, “They are a rock with these lines written on it.”) The fears expressed by A.I. executives are, mostly, serious and genuine. Yet it’s easy to see why they suffer from a credibility deficit. Surely it’s the job of those creating the dangers to save us from them.","Although the data-center backlash may reflect a specific attempt to defy A.I.’s encroachment, the wellspring of “A.I. populism”—an umbrella term coined by the writer Jasmine Sun—seems properly understood as an expression of more general political resentment. Most of us have become accustomed to the idea that government either cannot or will not just do things. Zilch, it seems, can be done about climate change, war, the housing crisis, inflation, or inadequate medical coverage and child care. The basic political legitimacy of our republic, the abundance movement claims, depends on its tangible achievements. New York’s mayor, Zohran Mamdani, probably does not believe that a few city-owned supermarkets will definitively ease the affordability burden, but they might nevertheless resonate as proof that government can deliver.","Absent such progress, we will continue to take for granted the inexorable erosion of our physical and our social infrastructure. This sense of stagnation was bad enough when it seemed like a universal affliction; the A.I. build-out, privately underwritten by at least a trillion dollars, has rendered the situation intolerable. The speed with which data centers have proliferated across the country makes it obvious that not all of us reside in the same inertial void. In recent decades, our largest and wealthiest companies have directed their free cash flow into unproductive stock buybacks; today, they compete to spend down their balance sheets on chips, buildings, and energy. These are capital investments on a scale that our society has not seen since the construction of the railroads.","The money is only part of it, though. The overnight transformation of the national landscape is a feat of human will and collective action. A.I. has yet to cure cancer, but it has already established that a different world is possible. These companies move even faster than their Valley predecessors did, but in place of breaking things they build them. If California’s plagued high-speed-rail project were necessary to A.I. infrastructure, it would have been finished yesterday. Certain people and organizations can, it turns out, just do things.","Why, then, can’t these same people just do the things that prevent extinction? Unfortunately, they often sigh, they are trapped by commercial and geopolitical realities. In an essay published earlier this month, Amodei signalled his immediate willingness to slow everything down, or “pace the frontier,” but his company’s self-sacrifice would be for naught without the compliance of his domestic rivals, not to mention that of their Chinese competitors. It is a prisoner’s dilemma, and it cannot be solved by unilateral action. Amodei would prefer sensible regulation, but in the meantime he has proposed that his peer companies voluntarily adopt a common framework for transparency and accountability—a course, he notes, that would probably require that the federal government waive potential antitrust action. Sam Altman and Elon Musk have made ambiguous noises in support, but Mark Zuckerberg remains unaligned, as do Trump pals such as David Sacks, the Administration’s former A.I. czar, and Jensen Huang, the C.E.O. of Nvidia, the most valuable company in the world. The discord is maddening. When it comes to the difficult challenges that must be overcome on the level of bits or atoms, all of these people freely just do things. But, when it comes to basic interpersonal communication, they apparently cannot get their act together to make a joint commitment in favor of cautionary measures.","Such measures would at least buy the industry time to address the problem of alignment—to figure out how, or whether, an artificial superintelligence might be kept on our team. The current state of affairs is hardly encouraging. How can we trust these humans to coördinate successfully with an advanced being if they can’t even manage it with one another? ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.10.02","day":89,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.10.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.10.03","day":90,"title":"Effective altruism is this century’s biggest idea","source":"The Economist","minutes":6,"tag":"Leaders","dek":"The movement is admirable, but dangerous","note":"2026.10.03","paragraphs":["THOUGHT PRECEDES deed as lightning precedes thunder, wrote the poet Heinrich Heine. So it has proved with effective altruism (EA), an ethical doctrine cooked up by philosophers in Oxford that has gone from the ivory tower to the corridors of power with remarkable speed. Effective altruists fill Silicon Valley, staff the world’s leading artificial-intelligence companies—and alarm the Trump administration. “The United States will NEVER be an effective-altruist country,” pledges the Pentagon. The secretary of war brands the philosophy “defective altruism”; others in the administration call it “dystopian”. Take those attacks as a sign of its influence.","Some complain that the 21st century has seen little fresh thinking. Into the void have stepped MAGA and Co, making nostalgic populism the century’s big political project. But the century’s big idea is effective altruism. As we report, what began in the 2000s as a geeky way to make charitable giving more cost-effective has changed into a movement that subjects the world to complex, even bizarre, moral calculations. For many of its adherents, the urgent ethical requirement for people who want to do good is to stop artificial intelligence from wiping out humanity.","EA is sociologically important, too. EAs are not numerous, but the idea has swept up a generation of gifted youngsters who have made fortunes in cryptocurrency and AI. As the technology mints more billionaires, effective altruists will channel billions of dollars to causes that will shape society. EAs helped start OpenAI and Anthropic, the leading labs, in the belief that those who understood the dangers of AI should control its development. To a degree, they now do—though, ironically, by creating more labs, and thus competition, they have probably accelerated AI’s progress.","And all this has now made EA politically important. The Trump administration fears the movement will succeed in throttling AI. It has feuded with Anthropic over the firm’s refusal to let its models be used for some military purposes. Leading EAs acknowledge that AI may prove hugely benign, but nonetheless want to slow its development, to reduce the chance that an unstoppable machine-brain runs amok in pursuit of goals that are “misaligned” with those of humanity.","Some critics in America would rather accelerate the technology, to prevent China from winning the race. But when attacking AI doomerism they find it easier to play the nerd than the ball. They say that effective altruism is a movement of fanatics that is variously undemocratic, dangerous and cultish.","That is too crude. The movement’s charitable roots are obviously praiseworthy. Like The Economist, EAs are committed to empiricism and, especially since they blended with the online “rationalist” community, the application of logical thinking. They hold reason in higher esteem than tradition or norms and will enthusiastically debate any topic, however controversial, in pursuit of the truth.","EAs’ repeated success in predicting the rapid progress of AI has been impressive, too. They have a point about the technology’s risks to humanity. On September 28th OpenAI scrapped plans to release its latest model after it appeared too dangerous in testing. Many recent safety incidents resemble scary scenarios set out on effective-altruist blogs years ago.","Yet the critics are right to warn that effective altruists reach some odd conclusions. Like the utilitarian philosophers before them, EAs boil ethical behaviour down to an optimisation problem. How can people bring about the best outcomes for humanity as a whole? Their calculus downplays local imperatives such as “keep promises” or “look after your family”. What matters is reducing suffering, impartially and everywhere.","That leads them to factor a very wide circle of concerns into their moral calculations. It is easy to see how being ethical means helping your neighbour. EAs ask: why not work as hard to help those far away? Early on, the movement directed its army of overachievers to take high-paying jobs in finance and consulting. Their wealth could buy good works, achieving more than if they became charity workers themselves.","But as it has become stronger, EA has become stranger. Some EAs see the moral distinction between humans and other animals as weak, because animals experience suffering. Stopping factory farming and helping shrimp are major concerns. Likewise, they have a counterintuitive approach to time. Those not yet born should be weighed in the balance—and there could be trillions of them. Many EAs are “longtermists” who feel bound to forestall risks in the distant future, even if that starves today’s good causes, such as helping the desperately poor.","Pushed to an extreme, this calculus can lead to a morality that is not just counterintuitive, but repugnant. Some EAs think that insect life is, in aggregate, more valuable than human life, because there are so many insects. Some say it would be better to bring about the existence of trillions of humans whose lives are barely worth living than to have mere billions with genuinely good lives. Others even think the welfare of AIs themselves will one day be of vital importance. They would redirect resources towards future humans or nonhumans, and away from people suffering today.","It is right to revere reason. But moral philosophers from Aristotle to Rawls knew that if an argument leads to intolerable places, it must have a hidden faulty step. EAs’ instinct, though, is to enjoy counterintuitive conclusions, even if they seem perverse. A problem is the margins of error that inevitably accompany effective-altruist arguments. Nobody is truly capable of weighing up moral quandaries involving billions today, let alone gigantic sums stretching into the future, involving uncertain numbers of people, discount rates, the progress of technology, and countless other variables. Another is that extinction is so dire that in a crude moral arithmetic even a small chance of it overpowers today’s flesh-and-blood concerns.","A third is that in weighing up the interests of billions, you lose sight of the inherent dignity of the individual. Anyone wielding a spreadsheet and grandiose claims about the future of humanity is one step away from anointing themself as a central planner. Moral authority in hand, the rights, welfare and opinions of a neighbour can come to seem unimportant.","The French revolution was supposedly founded on reason; it led to the execution of nuns. Lenin, too, thought that intellectuals who had mastered Marxism understood workers’ interests better than the workers themselves. If you truly believe that you act on behalf of all people, let alone trillions of future ones, you may end up justifying all sorts of atrocities.","Fortunately, effective altruists are hardly about to bring back the guillotine. The fear instead is that controlling AI will eventually bring them great power, and that plenty of EAs in Silicon Valley think that only they can be trusted with the technology. That is an alarming idea. Effective altruists’ argument for worrying about really powerful AIs is that the machines could optimise for a single and fatally wrong objective. Everyone should worry, too, about what happens when a small group of people fall into the same trap. ■","This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/10/01/effective-altruism-is-this-centurys-biggest-idea"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.10.05","day":91,"title":"The President vs. the Press","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.10.05","paragraphs":["Donald Trump’s behavior cannot be called unexpected at this point. What was noteworthy last week, however, was the way that the media responded.","Donald Trump’s decision, on September 18th, to summarily revoke White House access from three major news outlets—CNN, Politico, and MS NOW—is consistent with the mercurial, paranoid, and inscrutable style that has defined his political career but has been particularly prominent in his second term. Since Trump returned to the Presidency, his Administration has tended to justify its most belligerent actions by claiming national-security concerns or by couching said actions as an attempt to root out fraud. Earlier this year, the Times noted that Trump had cited “national security” as justification for acts as disparate as halting the development of wind farms off the East Coast, stripping union rights from federal employees, and continuing the construction of his behemoth ballroom. (He is now making the same argument regarding his colossal arch.) Accusations of fraud have been the reasoning for doge’s evisceration of the federal workforce, ice’s occupation of Minneapolis, and, just last week, the removal of three-quarters of a million people from the Affordable Care Act rolls. In a frenzied attempt to retrofit a rationale for Trump’s abrupt press ban, the White House turned to some version of both of these arguments.","Last Monday, the three news outlets filed suit, claiming that the ban violated their First Amendment rights. Dozens of other media organizations, including the Times and Condé Nast, which owns The New Yorker, filed an amicus brief in the case. Other outlets refused to participate in pool coverage of the President’s events, in solidarity with their banned peers. On Tuesday, the Department of Justice responded by claiming, in a brief, that the organizations had “threatened national security and spread falsehoods.” Further, it asserted that access to the White House is “a privilege,” not a right. Embarrassingly, the same day, the White House sent Politico a letter citing its reporting on the Iran war, which noted the concerns of an anonymous source, as an example of compromising national security. That source, Status reported, was Vice-President J. D. Vance, on a background briefing, highlighting yet another instance in which the right hand was unaware of what the right hand was doing.","In a Truth Social post announcing the ban, Trump had complained that “Media Outlets shouldn’t be able to constantly write or report FICTION and LIES when they’re covering the President of the United States.” This isn’t exactly an accusation of defrauding the public, but it pretty clearly charges the banned organizations with, at a minimum, misleading it. That said, even Trump seemed to know that he was on shaky ground, preëmptively arguing that the U.S. district judge hearing the case, Timothy J. Kelly, whom Trump himself had appointed, was an unfriendly draw for the Administration’s claims.","The ban followed the now familiar path of Trump’s potentially illegal or unconstitutional acts. As with his attempts to slap his name on the Kennedy Center and his effort to overrule the language of the Fourteenth Amendment, by curtailing birthright citizenship, that path typically travels from absurd idea to absurd (but nonetheless concerning) act, to a legal response that becomes another case study in which we evaluate the extent to which the judicial system is capable of reining in the arbitrary impulses of an aspiring autocrat.","Trump’s concerns about the current case, at least in the short term, proved warranted. Shortly after midnight on Thursday, Kelly imposed a fourteen-day suspension of the ban. That morning, the journalists were still denied entry, so Kelly issued a 12:30 p.m. deadline for compliance, and their access was restored. Meanwhile, China’s President, Xi Jinping, had arrived in Washington for his first state visit in eleven years. Photographers on the scene reported that Trump joked that China has the “friendliest press corps.” (According to Reporters Without Borders, China ranks a hundred and seventy-eighth out of a hundred and eighty nations in press freedom.) That evening, some of the journalists were again denied access.","It’s worth recalling the degree to which this debacle typifies Trump’s political behavior. During the 2016 election, he withheld campaign-event credentials from Univision, BuzzFeed, the Washington Post, and Politico. During his first term, he routinely blocked critics and news organizations from his Twitter feed, which resulted in a lawsuit and a district-court ruling that his actions were unconstitutional. In 2018, the Administration denied access to Jim Acosta, then a reporter for CNN. (Kelly also ruled in that case, requiring the White House to restore Acosta’s access.) Last year, the White House denied access to the Associated Press, for refusing to defer to Trump’s preferred designation for the body of water generally known as the Gulf of Mexico. In that instance, the district judge Trevor N. McFadden, another Trump appointee, ruled that “under the First Amendment, if the Government opens its doors to some journalists . . . it cannot then shut those doors to other journalists because of their viewpoints.” He added, “The Constitution requires no less.” The President has sued ABC News, the Wall Street Journal, CBS News, the Pulitzer Prize Board, the Washington Post, and the Times, for hundreds of millions of dollars. His behavior cannot be called unexpected at this point. What was noteworthy this time, however, was the way that the press responded.","A month after the 2016 election, Ben Smith, then of BuzzFeed, lamented that few organizations had come to the defense of the outlets blocked during the campaign. The New Yorker’s Susan B. Glasser, who was then with Politico, noted that it would be “a terrible disservice to our democracy to have the President of the United States in the business of banning reporters.” A decade later, Trump is in that business, yet it is still not standard for news organizations to come to one another’s defense. The A.P. ban didn’t elicit nearly as much reaction. Several organizations sued by Trump opted to settle in cases that they likely could have won. Moreover, the White House Correspondents’ Association dinner, the annual gala celebration of the First Amendment, was held in April despite an intimidation campaign directed at some of those correspondents. After the event was disrupted by an armed intruder, the Administration and the association scheduled a July do-over, where Trump delivered a rambling speech indulging seemingly every tangent that sprang to mind, but his contempt remained apparent. The united front that journalists presented last week is significant, even inspiring, but, if history is any predictor, it will not be the last time they will be called on to do so. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.10.10","day":92,"title":"Will bonds blow up?","source":"The Economist","minutes":6,"tag":"Leaders","dek":"A government-debt crisis is looming","note":"2026.10.10","paragraphs":["Bankers used to say that countries, unlike companies, can’t go bust. They repeated that comforting slogan until a wave of Latin American countries defaulted in the 1980s. Might a similar shock soon puncture the rich world’s hubris?","Five years ago borrowing costs were so low that public debt looked almost costless. Today, with investors dumping their bonds, many big rich-world governments pay more to borrow than at any time since the 1990s or 2000s. Because the public debts of big advanced economies are about double, relative to GDP, what they were at the turn of the century, the result is immense pressure on budgets.","Even before the latest bond sell-off, their governments were forecast to spend 8% of tax revenues on net debt interest this year, as ageing populations and the threat of war are creating pressure to raise spending. Now they must pay still more to refinance their past debts, while many continue to borrow with little restraint. At some point investors will revolt.","Ironically, some of this year’s bond-market sell-off is good news, as we report. America’s economy is booming. Jobless claims are low; economic growth may be running at an annual rate greater than 3%; and productivity growth appears strong. This is encouraging investment. As artificial-intelligence firms clamour to build data centres, they compete with governments for capital in global markets. Higher interest rates are the result.","That has intensified less welcome upward forces on bond yields. The energy shock from the war in Iran has raised inflation, and there are creeping doubts about the credibility of economic institutions in the age of populism. President Donald Trump has recently mused that inflation can reduce debts “very rapidly” and renewed his attacks on the Federal Reserve for failing to cut interest rates. Jean-Luc Mélenchon, a populist-left candidate for the French presidency, has accused the governor of the Bank of France, absurdly, of treason. Bond investors, gazing far into the future, perceive the growing danger that governments will use inflation to pick their pockets.","The immediate impact of the bond-market sell-off varies greatly across countries. America is learning that its AI-fuelled expansion will not much help it cope with its debts, because interest costs rise in tandem with growth. The federal government’s annual budget deficit of about 6% of GDP is unsustainable. Fortunately, Uncle Sam still has the immense advantage of issuing the world’s reserve currency. As bond yields have risen in recent weeks the dollar has soared in value. A fiscal reckoning must eventually come—but not yet.","Japan, another perennial source of worry, is so far coping, too. Its ten-year bond yield has breached 3% for the first time since 1996 and it is planning an ill-advised spending spree. But inflation has risen alongside interest rates. With inflation-adjusted rates still low, and the government’s deficit small, debts are shrinking as a share of the economy. That may change. And if the Japanese begin to sell their enormous stock of overseas assets, financial tremors will rattle the rest of the world. But the Japanese government does not yet face the prospect of a run on its bonds.","Europe is where the danger of a debt crisis looms largest. The AI boom is raising its cost of capital but, in contrast with America, it is enjoying far less of a boost to economic growth. Its energy-importing economy is suffering from high fuel prices, and will suffer more if the winter is cold, owing to a probable global shortage of liquefied natural gas. Though some prudent governments—including those in Germany, Scandinavia and Switzerland—have their budgets in order, Britain, France and Italy are wobbling.","Britain already suffered a bond-market revolt in 2022. Chastened, it corrected course, but its debt-to-GDP ratio is still rising and its politicians specialise in postponing spending cuts, as with a recently promised pension reform. Italy’s net debts are fairly stable, but, at 129% of GDP, too high. It is fragile and could break in a panic.","France is under the greatest pressure. Its budget deficit is forecast to be 5.4% of GDP this year. Given today’s economic growth, The Economist calculates, were France to refinance all its borrowing at current yields on five-year bonds, stabilising its debts would require a belt-tightening of more than 4% of GDP. Yet it is gripped by student protests and its parliament is struggling to pass a budget with cuts worth just a tenth of that.","Investors recently forced France to pay 1.5 points more than Germany to borrow for a decade—the highest spread since the euro-zone debt crisis. Ahead of a presidential election in 2027, Marine Le Pen of the populist-right National Rally party is leading the polls. On October 6th she pledged to trim budgets by 3% of GDP by 2032 and to cut debt to gdp in half. Bond yields fell slightly, but Ms Le Pen lacks credibility. She still vows to lower the retirement age even as lifespans lengthen, thus failing to confront the biggest single item in France’s public spending.","A run on French bonds could happen. If it does, the government might respond not with belt-tightening, but by demanding a bail-out from the European Central Bank (ECB). Countries are supposed
