uTube offers content from every country, but its users gravitate towards clips from close to home: three-quarters of its “trending” videos manage to trend in only one country. Gaming on PCs and consoles remains dominated by a few worldwide franchises (including a football series formerly known as “FIFA”). But on mobile, which has a bigger and more diverse audience, regional variations are sharper. Across the five biggest gaming markets, no app features in every country’s top ten. While Americans play “Fortnite”, Asians have shifted to titles such as “Free Fire”.","Cheaper production and distribution have caused a boom in the supply of local entertainment. In the age of CDs, cinemas and game cartridges, there were huge economies of scale in pushing popular acts or products to go global. Today, producing and distributing new entertainment—whether songs, videos or games—is cheap enough for it to be profitable to target much smaller niches. In some places there is even evidence of a sub-national cultural boom: more than half the content posted on YouTube in India is in languages other than Hindi (mostly local ones). AI will enable ever more niche production.","The audience has also changed. A growing global middle class has made it worthwhile for Netflix to make big-budget shows tailored to Mexican subscribers, or for the developers of “Free Fire” to devise Bollywood themes for Indian gamers. And audiences’ discovery of new content is increasingly being led by algorithms rather than human tastemakers. Sometimes those algorithms send everyone to the same global hits—prepare for a blizzard of World Cup highlights on your social feeds—but they also divide them into niches. In one recent year, German songs made up only four of the 100 most-played tracks on national radio, but 44 of the country’s streaming top 100. People’s preferences have turned out to be more local than elite tastemakers thought.","Something will be lost if people’s cultural habits turn too far inward. A Britain that served only British food and “Carry On” films would be bleaker than purgatory. Yet it is cause for celebration that audiences now have so much more choice. Rather than a diet of entertainment from a country that had a historical advantage in its production and distribution, consumers can choose from a global menu of Danish hip-hop, Polish comedy or Chinese video games. Regulators should note that the turn towards local options has been brought about by technology, and not by rules of the sort imposed by Canada, where radio stations have to play unhealthy amounts of Justin Bieber to meet local quotas.","Governments will need to adapt to the changing dynamics of soft power. America’s century of dominance over global popular culture is over. It still controls much of entertainment’s distribution, via platforms such as YouTube and the app stores, and thus much of the industry’s profit. But it has lost its grip on content, and with it the cultural tractor-beam that has recruited millions of listeners, viewers and players to American values and ideas over the years. Other countries are rushing to fill the gap that America has left, from Brazil in music to South Korea in TV and China in gaming.","All eyes will be on America for the World Cup final next month. But it is a fading force in a new game of soft power that has only just kicked off.■","Subscribers to The Economist can sign up to our Opinion newsletter, which brings together the best of our leaders, columns, guest essays and reader correspondence.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/06/10/the-world-cup-paradox"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.06.15","day":52,"title":"For the Nation’s Birthday, Making It Harder to Become an American","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.06.15","paragraphs":["The Trump Administration has chosen to honor the Semiquincentennial of a nation of immigrants with a vision that sends the country back in time.","Shortly after taking office for the second time, Donald Trump created the White House Task Force on Celebrating America’s 250th Birthday, naming himself—“the man who some say is the Greatest President in History”—as its chair. The celebrations start this month, but the party planners seem to have faltered. Musical performers largely pulled out of a concert, so Trump is staging a rally, and a U.F.C. cage match will grace the South Lawn. It is a heady moment to be asking existential questions about what it means to be American. But, as it happens, another member of the task force has spent the past year and a half preparing a diligent and thorough answer on behalf of the President.","Stephen Miller, Trump’s top domestic-policy adviser, has presided over the most concerted effort in a century to recast citizenship as a tool of systematic exclusion. Under his direction, the Administration has chosen to honor the Semiquincentennial by keeping people from entering the United States, by restricting those who have already done so from becoming full citizens, and by trying to strip naturalized citizens of their legal status. It is a vision that sends the country back in time, to some of the lowest points of the past century.","Unlike so many iconic American fights, held in the halls of Congress or on the streets of major cities, this campaign is being waged for the most part in obscurity. Immigration policy gets to the core of the country’s identity, yet lawmakers haven’t passed legislation for comprehensive reform in more than thirty-five years. Drastic changes have instead come via executive orders, bureaucratic regulations, and technocratic maneuvers. It’s an ad-hoc form of policymaking that suits the President’s maximalist impulses and gives an ideologue like Miller a broad range of opportunities.","A case in point: between June and December of last year, Trump issued bans on travel from thirty-nine countries, including Afghanistan, Haiti, Nigeria, and Iran. The government went on to suspend virtually all immigration applications filed by people from those countries. In January, a press release from the State Department listed seventy-five countries subject to a similar suspension. (Some two dozen countries appear on both lists, perhaps as an insurance policy in the event of an adverse court ruling.) According to the Migration Policy Institute, immigrants from the countries on the second list received forty-six per cent of all visas issued in 2024. Halting the visas closes the path toward permanent residency for hundreds of thousands of people—in effect, remaking the composition of who can come to the U.S. lawfully. Permanent residents born in those countries who had been approved for citizenship saw their naturalization ceremonies cancelled. (On Friday, a federal judge blocked the suspension of applications by immigrants from the thirty-nine countries in the travel ban.)","Masked ICE agents using lethal force against immigrants and citizens have commanded the most attention and generated the greatest alarm. Now there’s cause for further concern: the Republican-controlled Senate just authorized another seventy billion dollars for immigration enforcement. But the agency at the center of the Administration’s ideological plans is the United States Citizenship and Immigration Services, or U.S.C.I.S., which runs the legal-immigration system. Late last month, the agency released a memo announcing plans to force most green-card applicants living in the U.S. with temporary status to leave the country for an extended period and submit their paperwork from an American consulate abroad. The impact of this would have been seismic. Of the 1.36 million green cards issued in 2024, fifty-eight per cent of them went to people who were already here. The move violated the agency’s preferred modus operandi: it drew widespread notice. Business groups and C.E.O.s warned the Administration about its effect on employment, according to the Washington Post. The U.S.C.I.S. backtracked, with the White House claiming that the memo was a housekeeping matter, rather than a change of strategy. But, according to a source with knowledge of the agency, the policy was prepared last fall.","If the reasoning in the memo struck immigration lawyers as dubious, this may have been because the agency’s office of chief counsel failed to properly vet it. According to the source, government attorneys have been reassigned to work with Assistant U.S. Attorneys in investigating people whose legal status the government might be able to strip. Earlier this year, U.S.C.I.S. created the Tactical Operations Division. Some eighty officials are tasked with finding citizens, green-card holders, and refugees to investigate on the ground that the status they lawfully obtained might have been granted either through fraud or in error.","Thousands of people living legally in the U.S. have already been identified, the Times has reported. By contrast, the U.S. averaged eleven denaturalizations a year between 1990 and 2017, and these were largely exceptional cases in which a person had deliberately misrepresented a serious criminal history, such as a Nazi past or links to war crimes. Denaturalizations were exceedingly rare in part because they’d once been common, used in response to disfavored political speech or ideology (as in the case of the Russian-born anarchist Emma Goldman) or identity (Germans and Japanese during the First and Second World Wars). The Supreme Court eventually interceded, with a series of rulings that made it far more difficult to remove someone’s citizenship for political reasons. Now U.S.C.I.S. has been instructed to refer one hundred to two hundred cases to prosecutors each month.","The Administration’s strategy seems to hinge on a fantasy of radical subtraction—removing people who would dilute the country’s white majority. “If you import the Third World, you become the Third World,” Miller has said. There’s a model for what the government is doing: the Immigration Act of 1924, which established racial quotas that restricted immigration from southern and eastern Europe and blocked it altogether from Asia. That bill’s sponsor, Senator David Reed, of Pennsylvania, promised that “America will cease to be a ‘melting pot.’ ” Nearly a century later, Miller wrote, “That is exactly what most Americans want.” At the very least, it’s what the White House wants, and the President is trying to go even further, attacking the most foundational terms underlying the country’s understanding of who belongs here. Revealingly, in this summer of lofty celebration, the Supreme Court is expected to issue a ruling on birthright citizenship, which Trump, by fiat, has tried to end.","The growth rate of the U.S. population is slowing, and it’s conceivable, even likely, that current immigration policies will tip the country toward a steadier population decline. If returning the U.S. to 1924 is the goal, the Trump Administration is succeeding. Two hundred and fifty years into the national experiment, however, this would mean that the future looks ever more like the distant past. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.06.20","day":53,"title":"AI has granted America vast new power","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Its government is now the gatekeeper to frontier models—and most compute","note":"2026.06.20","paragraphs":["THE NEWS is full of how an ignominious peace deal with Iran exemplifies a decline in American power. That conclusion could hardly be more wrong. On June 12th the Trump administration ordered Anthropic to block foreigners from Fable and Mythos, its latest and most capable frontier AI models. In an instant, everyone learned that the American government can decide who may use the world’s most important technology. You don’t get much more powerful than that.","The administration was responding to a supposed jailbreak for Fable, meaning a prompt that circumvents defences against uses such as hacking computers or making bioweapons. The chances are that it wanted Anthropic to switch off the models for everyone, and that targeting foreigners was a means to an end. Sure enough, that is what Anthropic did, while claiming that the concern about its model was overblown. The legal basis of the order remains unclear, and the ban seems unlikely to last.","What matters, though, is the demonstration that global access to the best AI may come down to a decision in the Oval Office. The administration showed in March that it is prepared to trample on the frontier AI companies, when it designated Anthropic a “supply-chain risk”. Now it has shown that it is prepared to trample on users, too.","America must decide how to wield this vast new power. The rest of the world must decide what to do about it. Even as it plans for an unreliable America in everything from defence to trade, it now has to cope with a new way of being captive to the world’s biggest economy.","This is not the first time America has tried to restrict access to frontier technologies. After the second world war it stopped helping Britain’s nuclear-weapons programme. When modern cryptography emerged in the 1970s, it blocked exports, before accepting the trade-off between having secure allies and using secrets to boost its own offensive capabilities. Uncle Sam still refuses to share its best military equipment, even with close allies. America kept the F-22 fighter for itself; allies got the F-35.","To control access to a technology, though, depends on its nature, and rivals’ ability to develop it independently. Nuclear co-operation with Britain resumed in the 1950s after it developed technology of its own; with other countries, America used the Nuclear Non-Proliferation Treaty of 1968. Cryptography methods could not be contained and eventually went public. Many countries are capable of cyber-attacks.","Frontier AI has echoes of all these examples. If the very best models can disable crucial infrastructure or help users create pandemic-ready pathogens then, like nuclear weapons, they are too dangerous for public hands. But as with cryptography algorithms, it will be hard to be sure that advanced proprietary capabilities will never be copied. Open-weight models, which anyone can download, could advance and proliferate. In cyber-security a small imbalance can bring big advantages: if an attacker has version 5 while the defender is stuck with version 4, and the better model uncovers just one more vulnerability, the weaker party will be compromised. As AI is embedded in military hardware, a similar logic may apply on the battlefield.","Yet America has a huge economic interest in leading in AI and selling its tech to foreigners. Many Anthropic staff are not American and so were hit by the ban; to freeze AI research at America’s best lab would be self-defeating. The firm also says that 80% of its consumer use is overseas. As American technology has boomed over the past decade, Europe’s payments to America for intellectual-property products have risen fivefold. America should not want to give the rest of the world a reason to team up with China, the second-ranking AI power.","This may lead to a hierarchy of access. The best capabilities will be closely guarded by America, to provide an edge in cyber-offence and military capability. The next-best alternatives may be available to allies—the equivalent of the F-35. And a sufficiently handicapped model may be sold to the world with the best safety precautions its makers can design.","Such a future would be uncomfortable for America’s allies, which are nowhere close to rivalling the likes of Anthropic. They are already vulnerable to Mr Trump’s bargaining on trade, alliances, the dollar system and more. AI could become the most important lever of the lot. True, some of the dependence is two-way: America needs Dutch lithography machines and Taiwanese fabs. And foreigners could always shun Anthropic or OpenAI in favour of good-enough open-weight alternatives.","Yet running models requires computing power, which America has perhaps 15 times more of than Europe, plus much more ongoing investment. If SpaceX, whose share price has surged after listing on June 12th, realises its vision of data centres in space, the gap is unlikely to close. “Europe 2031”, a gloomy essay about the future of AI, imagines vassal status for Europe as its cyber-security, defence and swathes of its economy come to depend on American models and compute .","Many countries will conclude they need America more than ever. They can still strengthen their bargaining positions. Compute is so lacking that it makes sense to build data centres almost anywhere, yet countries show no sense of what is at stake. In the seven months to June 2025 demand for new grid connections in Britain rose from 41GW to 125GW, more than twice peak power demand. OpenAI paused a data-centre project there in April, citing regulation and costly energy.","Throughout Europe more energy, easier planning and looser rules for modelmakers would help. In East Asia Taiwan, Japan and South Korea must integrate rather than duplicate their efforts. All should avoid the false promise of government attempts at steering investment. The goal should not be protectionism but ensuring that America is not the only economy where the AI ecosystem can thrive. As in trade and defence, the way to cope with Uncle Sam’s transactional turn is not to whine about alliances but to build strength. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/06/18/ai-has-granted-america-vast-new-power"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.06.22","day":54,"title":"Why Todd Blanche Should Not Be Attorney General","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.06.22","paragraphs":["In a Senate that took its constitutional role seriously, Blanche would not win confirmation a second time.","Shortly before midnight on April 27th, two days after a gunman disrupted the White House Correspondents’ dinner, the acting Attorney General, Todd Blanche, submitted an extraordinary petition to a federal court that had blocked the construction of the White House ballroom. Despite the late-night filing in the case, which had been brought by the National Trust for Historic Preservation, there was no actual emergency; rather, the Department of Justice seized on the moment to make its case that security required the construction to proceed. Attorneys General do not ordinarily put their names on such filings, as Blanche had. But more astonishing was the language of the document: the United States speaking in the unmistakable voice of Donald Trump.","The motion began mid-rant: “ ‘The National Trust for Historic Preservation’ is a beautiful name, but even their name is FAKE.” It said that those seeking to stop the ballroom “suffer from Trump Derangement Syndrome” and “are represented by the lawyer for Barack Hussein Obama, Gregory Craig.” Then it shifted to praising Trump’s brilliance—“a highly successful real estate developer, who has abilities that others don’t”—and to arguing that the ballroom was “being given FREE OF CHARGE AS A GIFT TO THE COUNTRY!” This claim was dubious; the President has unsuccessfully sought a billion dollars in government funding. Yet it was also unfiltered Trump, a Truth Social post in the guise of a legal document, and it was met with predictable failure. But although the document was submitted to Richard Leon, the U.S. district judge who had issued the injunction, Blanche was targeting a different audience of one.","In Trump’s Washington, subservience works. Last Monday, the President formally nominated Blanche to be the nation’s eighty-eighth Attorney General. Blanche, who had represented Trump in his criminal trials and was confirmed as Deputy Attorney General last March, has served in an acting capacity for more than eight weeks, since Pam Bondi was fired. He professed equanimity about getting the job permanently, announcing that, if Trump “chooses to nominate somebody else and asks me to go do something else, I will say, ‘Thank you very much. I love you, sir.’ ” But Blanche used the intervening weeks to engage in what has looked like a manic spree of auditioning for the top job.","Blanche has touted one flimsy indictment (of the former F.B.I. director James Comey, for posting on social media a photo of “86 47,” written in seashells) after another (criminal charges against the Southern Poverty Law Center, for allegedly defrauding its donors). He ramped up a seemingly stalled criminal investigation into the former C.I.A. director John Brennan, enlisting Joseph diGenova, who had represented the Trump campaign in challenging the 2020 election results, to lead it. And he presided over the creation of a nearly $1.8-billion “anti-weaponization” slush fund, supposedly to settle the Trump family’s lawsuit against the I.R.S., for a private contractor’s leak of tax records. This looting of the Treasury has apparently been averted, following a rare revolt by Republican lawmakers. But, for the Trumps, the most valuable benefit of the deal remains—a Blanche-signed addendum stating that the federal government is “FOREVER BARRED and PRECLUDED” from pursuing an I.R.S. audit that, according to the Times, could have cost the family some hundred million dollars. (Asked about Blanche’s tenure, a Justice Department spokeswoman offered a list of “key accomplishments,” including a decrease in the national murder rate, the arrest of numerous alleged cartel members, the filing of multiple fraud cases, and the hiring of additional immigration judges.)","The Senate vote on Blanche’s nomination to be Deputy Attorney General last year was 52–46, along party lines. But that was when his background offered the hope that he would stand up for the norms of Justice Department independence. He had been a registered Democrat until 2023, the Times reported, and had worked for years as a prosecutor in the Southern District of New York, the flagship U.S. Attorney’s office. He was, former colleagues have said, no superstar, but he was reasonably well regarded and even better liked. The optimism that Blanche would be a moderating force, though, seems to have underestimated the corrupting power of ambition. News reports suggest that Blanche has at times urged restraint; if so, his successes appear to have been few, if any. He tolerated the firing of a respected prosecutor, Maurene Comey, for no other reason than her last name. In March, at the Conservative Political Action Conference—not normally a venue for a Justice Department official—he boasted of the wholesale ouster of F.B.I. agents who had worked on Trump prosecutions, saying, “There isn’t a single man or woman with a gun, federal agent, still in that organization that had anything to do with the prosecution of President Trump.”","Last month, a federal judge in Tennessee, citing “Blanche’s vindictive motive,” ordered dismissal of the indictment of Kilmar Abrego Garcia, whom the Justice Department had prosecuted after it removed him to El Salvador, his home country, in violation of a court order, and was forced to return him to the U.S. This month, in a podcast interview with Sean Hannity, Blanche not only discussed ongoing grand-jury investigations into a supposed “grand conspiracy” among government officials to go after Trump but played along as Hannity named potential targets, from James Comey and John Brennan to the former director of National Intelligence James Clapper and President Joe Biden. “All those folks were certainly part of it,” Blanche said. This is the antithesis of how prosecutors are instructed to behave. On Wednesday, the conservative National Review came out against his nomination. “Todd Blanche has been everything President Trump wants in an attorney general, and that’s the problem,” the editors wrote.","A year ago, senators uncomfortable with the idea of Trump’s criminal-defense lawyer becoming the department’s No. 2 could point to Blanche’s testimony before the Judiciary Committee, where he said that “political prosecutions should never happen, period” and that, if pressed to bring a bogus case, “I will follow the law.” Now they have a record against which to judge those assurances. Will any of this matter to Republican senators—perhaps to members of the growing “wounded-bear caucus,” who have been the targets of Trump’s fury? A no vote from a single Republican on the committee could block the nomination. On the floor, just four Republican no votes could doom it. In a Senate that took its constitutional role seriously, Blanche would not win confirmation a second time. But, as John Thune, the Majority Leader, observed, “obviously most of our members are pretty deferential to who the President wants.” Like the nominee it will consider, this Senate is more inclined to consent to Trump than to advise him. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.06.27","day":55,"title":"The AI backlash is only getting started","source":"The Economist","minutes":5,"tag":"Leaders","dek":"Here is how to deal with it","note":"2026.06.27","paragraphs":["Advances in ARTIFICIAL intelligence have long terrified techies. Lately, voters are feeling the angst, too. AI is unpopular in the West and climbing up the political agenda. The fiercest fights so far have been in America, where protests against data centres have scuppered nearly $100bn-worth of projects, warring AI megadonors have just dumped tens of millions into a Manhattan congressional race and around 40% of voters tell pollsters that they want AI banned from most industries. But spats are breaking out elsewhere: after chipmaking profits soared recently, workers at Samsung in South Korea threatened a strike to secure special payouts.","The backlash is only just getting started, because the technology is only just getting started, too. Britain’s flimsy prime-minister-in-waiting, Andy Burnham, has barely said a word about AI. Even Americans still rank it 29th out of 39 election issues.","That is bound to change—and battles over data centres offer a hint of the struggles to come. The buildings summon a vitriol well beyond conventional nimbyism. More Americans say they would be happy with a nuclear reactor next door than a data centre. Even plans to build one in the Utah desert have met with passionate opposition.","Data centres can be ugly, it is true. But the opposition reflects the technology’s reputation. ai bosses have spent years warning of a looming job-pocalypse and the danger that an AI-engineered super-virus will make humans extinct. Opponents of data centres variously believe they are shielding the environment, protecting jobs and saving the species—and they are not entirely wrong.","Yet this backlash is itself dangerous. AI promises to change the world for the better, much as electricity or the steam engine did. Not long ago, the era-defining problem for the rich world was stagnant economic growth and the populism it unleashed. Now it has a technology that could power a surge in productivity and incomes, help find cures for untreatable diseases and improve everything from education to green tech.","All this could be lost if countries starve the technology of computing power or regulate it into uselessness. Look at mRNA vaccines research, which has been held back after a backlash during the covid-19 pandemic.","Scenarios in which some countries give in to popular rage but others forge ahead are also worrying. If America succumbs, it could cede the global ai frontier, and the attendant cyber and military capabilities, to authoritarian China. Europe and Canada are more risk-averse than America. If they choked off AI while the rest of the world kept pushing forward, their losses could be unrecoverable. More than two centuries after the Industrial Revolution, few countries have managed to catch up with the first movers.","So the stakes are high. Can governments do anything about it? Grand proclamations about the shape of a “social contract” for a post-AI world are good fodder for blog posts but offer little help today. Besides, the unknowns are still large enough to make the exercise almost futile.","Better to be incremental. While China’s economy was growing by 10% a year in the 1980s—faster than all but the most extreme forecasts for AI-driven growth—the mantra of its leader Deng Xiaoping was “crossing the river by feeling the stones”: pushing forward iteratively, planning for problems but staying flexible. Deftly handling the AI age will take a similar spirit.","To that end, here are four pointers for politicians and AI companies looking for policies. First, spread the benefits of AI as widely as possible. Blockers need to be shown that their local area will benefit if they get out of the way. Wisely, data-centre firms are beginning to offer funding to nearby towns. Gradually, this approach needs to be broadened to society at large, with mechanisms showing people that they have an economic stake in AI’s progress, and will be helped to adapt to disruption through policies such as wage insurance. Only a shared sense of prosperity can temper the toxic who-wins/who-loses politics that emerged in the era of globalisation.","Second, regulate hard when interventions are needed. The hair-raising prospect of AI-enabled cyber-attacks or bioterrorism is still not taken as seriously as it ought to be. Tackling those issues and others is essential in itself, but it would also weaken arguments to ban or hobble AI indiscriminately. Ideally, these efforts would involve international co-operation.","Third, measure everything. The common view that AI is already leading to lay-offs and raising electricity bills is probably wrong. But without better statistics it is hard to be sure. Data centres must contend with viral worries over water usage, a confected issue. (Modern ones drink up no more than other industries, and much less in total than America’s golf courses.) Facts won’t cure misinformation, but their absence worsens it. Britain’s AI Security Institute and new AI Economics Institute may offer models for other countries to follow.","Fourth, use AI to make the state better. It is not just the private sector that could use AI to lift productivity. Filing taxes should be a breeze; state-run health-care systems should link up data seamlessly and schools should experiment with ai-powered learning. AI may also make it easier for citizens to monitor what politicians are up to.","People are less likely to oppose a technology if it is behind their grandmother’s cancer treatment or helping their child’s education. And they are more likely to trust that the state can oversee it if they believe that government works.","Voters are right to take a close interest in how AI could change their lives. The future will be messy, odd and unpredictable. Persuading them that their interests are being served by disruption has become as important as making AI models better. Failure will bring out more pitchforks—and destroy vast opportunities for humanity. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/06/25/the-ai-backlash-is-only-getting-started"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.06.29","day":56,"title":"The Difference Between the Knicks and the White House Cage Fight","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.06.29","paragraphs":["Sports, spectacle, and what Juvenal would have made of this moment.","There are moments when a phrase, or a current of thought, that had seemed condemned to archival history is suddenly all anyone talks about. So it is right now with the chewy subject of breads, circuses, and cities. New York is alight with the joy of the Knickerbockers’ doggedly pursued N.B.A. championship title with, in this summer of celebrating our gloriously hybrid Americanness, the pleasing anomaly that a team of mostly Black and brown Americans bears the name of the town’s oldest, once most élite, and now obscure Dutch element. But the subject of bread and circuses arises out of the ancient observation—from the grouchy poet and satirist Juvenal, who witnessed it in first-century Rome—that, if people are supplied with food and entertainment by their oligarchs, they won’t care or even notice if the government they live under is changing from some sort of a democracy to a dictatorship right before their eyes.","The Knicks won a week ago Saturday, and New York affirmed that victory on Thursday, with a parade and a ceremony at which Mayor Zohran Mamdani presented the team with newly redesigned keys to the city, though what, exactly, the keys unlock these days is unclear. In between those civic thrills, an openly gladiatorial spectacle was staged on the White House South Lawn: a U.F.C. cage-fighting event overseen by Dana White, the combat-sports impresario and longtime friend of President Donald Trump. Meanwhile, athletes and supporters from many nations passed through our now suspicious borders to fight for the World Cup of what the rest of the world calls football. Inevitably, the question arises of whether we are each, in our way, being distracted from our own crisis by our own oligarchs, and by the circuses that they encourage. Indeed, some of our oligarchs actually own the circuses. It was James Dolan who invited his pal Trump to visit the Garden for the Knicks’ Game Three, and it is Dolan, not New York, who owns the team, just as it was FIFA’s president, Gianni Infantino, who showered praise and a faked-up peace prize on Trump ahead of the World Cup.","Violence, of course, hovers at the edges of even our favorite games, and we are not always aware of the risks that our heroes take on behalf of our entertainment. It has been pointed out that the N.B.A. final series was rougher—what is euphemistically called “more physical”—than the game used to be. A few years ago, there was a flurry of concern about the rise of concussions in the N.F.L., but that has largely subsided, as the league continues to bring in record-breaking revenues—more than twenty-five billion dollars are projected for next year. This month, as the Carolina Hurricanes won the Stanley Cup Finals, we saw sadly that the N.H.L. has become more physical, too—with a cruder version of the game, which some Canadians think was intended to be more easily accepted by the never-seen-a-winter Sunbelt cities that the league wants to thrive in. More sadly, the former player Claude Lemieux, a paladin of both the Montreal Canadiens and the New Jersey Devils, died by suicide just weeks ago, shortly after receiving the highest honor in Montreal hockey: carrying the team torch onto the ice before the opening face-off. His family, significantly, has donated his brain to Boston University for study.","Some historian will doubtless make a case that Trump’s cage fight was a Jacksonian gesture, pleasing to the people, and that only the snobbery of an élite would disdain it. But one had merely to watch the fight, and to see the fighters paraded out of the White House to the arena, to know that on the South Lawn we have moved beyond populism and entered Caligula country, where the emperor delights in vulgar cruelty for its own sake. There is a real distinction between a city unified by five fine starting players in a game that originally involved throwing a ball into a peach basket and that, however improbably, became the city game, and the bloody display in the nation’s capital. One is about civic commonality, the other about authoritarian cynicism; one is about a city pulling together around a common pleasure, the other about desecrating the decorum of democracy.","Given how easily sports can be turned sour, why do they continue to move us and unify us? One looks to the story of the Haitian World Cup team, appearing in the tournament for the first time in fifty years, which has gathered expatriate players from the Haitian diaspora to play for that beautiful and utterly despoiled country, where many of them have never lived. Coming from elsewhere, they managed to make a Haitian essence in the absence of a functional Haiti to play for. “For a few hours, geography will matter less than identity,” one writer noted. Surely it is, rather, that for a few hours the players will reveal that identity depends less on geography than on self-perception, less on where you were born or even raised and more on how you choose to feel.","Identity politics, so-called, are often condemned for making what you are more important than what you do, but the other side of them is that they make what you want to be as important as what you’re supposed to be, allowing people to choose the identity they desire even in the face of the identity they were told they ought to have. In the country’s two-hundred-and-fiftieth year, OG Anunoby, a British-born Knicks forward, tips in a shot, with 1.2 seconds remaining, to win Game Four. Jalen Brunson, of New Brunswick, New Jersey, is now as much a necessary New Yorker as Joe DiMaggio, who was of North Beach, in San Francisco, before and after his Bronx sojourn. For that matter, a very, very tall Frenchman is now an essential Texan.","Pastimes and people are oddly matched. Some pastimes are distractions, some are distortions, and some few are true distillations—refining a city or a place or a community to its essence, deliciously sipped by all. In reminding us about the artifactual nature of teams, sports remind us that all identities are largely fictive—things we choose to embrace because we like them, and they like us. We pick a team and make it ours. Juvenal’s satire about the narcotizing effect of all that bread, all those circuses, also contains his equally classic counsel: to pray for both a healthy body and a healthy mind and for a spirit that counts long life among nature’s smaller gifts, making the brutal domination of others less important than the serenity of the self. Whether we’re watching or playing, it’s still sound advice. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_atlantic_2026.07.02","day":57,"title":"The ‘Consumer Socialism’ Trap","source":"The Atlantic","minutes":10,"tag":"The Atlantic","dek":"The wrong way to solve the affordability crisis","note":"2026.07.02","paragraphs":["by Idrees Kahloon","This past January, in his inaugural address, Zohran Mamdani memorably promised to “replace the frigidity of rugged individualism with the warmth of collectivism.” In the parlance of the Democratic Socialists of America, of which Mamdani is a member, collectivism is a good thing. It is not meant to recall Stalin’s seizure of farms, which resulted in mass famine, or Mao’s Great Leap Forward, which also resulted in mass famine. American socialism today is different. The DSA still formally aspires to “popular control of resources and production,” otherwise known as seizing the means of production. Yet the New York City mayor’s attention-grabbing policy proposals—to freeze rents, establish city-run grocery stores, and pay for universal child care—are aimed at a more modest goal: socializing the cost of consumption.","“Consumer socialism” does not liberate workers from the exploitation of owners; it liberates consumers from the burden of prices. Although its advocates may claim inspiration from both the Great Society tradition of the Democratic Party and Nordic-style democratic socialism, consumer socialism is really a muddle of the two. The Great Society emphasized poverty reduction through means-tested programs such as Medicaid and Head Start; consumer socialism is meant for all. And unlike the Nordic welfare states, which are supported by high levels of taxation for all workers, Mamdani’s approach aims to raise sufficient revenue from corporations and the rich. Consumer socialism tries to have it all: universal social provisions without universally steep taxes. It retains, like other forms of socialism, a supreme optimism in the ability of state planners to shape markets. Where the old central planners failed, the new ones think they will succeed.","Mamdani is only one of consumer socialism’s proponents. The newly elected mayor of Seattle, Katie Wilson, is a former transit organizer who campaigned on both universal child care and spending $1 billion to pay for union-built public housing. The leading candidate for mayor of Washington, D.C., is DSA-backed Janeese Lewis George, who also calls for universal child care and massive production of below-market-rate housing. (She is open to the idea of government-run grocery stores as well.) Mamdani, Wilson, and Lewis George have claimed the mantle not of Stalinists or Maoists, but of a different subspecies of socialist—the “sewer socialists” who ran Milwaukee for decades starting in 1910. They made peace with the capitalist superstructure and devoted themselves to good, incorruptible governance and reliable public infrastructure—sewage systems, yes, but also parks, libraries, and fire departments. In their time, they were skewered for practicing “slowcialism.” In a speech he gave to mark his 100th day in office, Mamdani labeled “our 2026 answer to sewer socialism” as “pothole politics”—doing mundane jobs, such as filling more than 100,000 potholes, because “government is not too busy, not too self-important, not too mired in paperwork to fix the problems of this city.”","Sewer socialism is attracting renewed interest in America because it is too boring to threaten capitalism. Lenin despised its predecessor, municipal socialism, for much the same reason. In the late 19th century in English and German cities, socialist administrators operated public utilities such as gasworks, electric trams, and even city-owned slaughterhouses. This variation of socialism aimed to blunt the rapacity of capitalism rather than sharpen its contradictions and hasten the coming revolution. Under municipal socialism, Lenin wrote in 1907, “attention is diverted to the sphere of minor local questions, being directed not to the question of the class rule of the bourgeoisie, nor to the question of the chief instruments of that rule, but to the question of distributing the crumbs thrown by the rich bourgeoisie for the ‘needs of the population.’ ”","Lenin’s ghost would be similarly unimpressed with contemporary American socialism—too much democracy, too little murder. Still, there’s nothing small-bore about consumer socialists’ desire to overhaul the economy. In their view, high prices are not market failures but moral ones, the result of greed and corruption, which can be vanquished with the right intention. The ideal state is a kind of Lake Wobegon, where every price is below average.","Michael Powell: What Mamdani doesn’t know about tenants","One irony of consumer socialism is that it is better tailored to the laptop classes—which now form the backbone of the Democratic Party—than to the American left’s traditional working-class base. The upper classes disproportionately use child-care centers, while lower-income households rely more on stay-at-home parents and relatives. This is partly because wealthier people can more easily afford formal care services. But not every community may even want to send their kids to a child-care center. Some evidence suggests that Latina mothers prefer to have a relative look after their children, even when cost is no issue. Rent stabilization and controls apply to units, not occupants—which in New York has sometimes meant showering benefits on celebrities and on politicians, such as former Governor David Paterson and the late Representative Charles Rangel. Upper-middle-class meritocrats are generally not exhausted by capitalism. They are exhausted by the costs of rent and child care in desirable neighborhoods—bills that the preexisting means-tested welfare state would never have covered.","Mamdani will probably fall short of implementing his vision: Budget constraints mean that buses are unlikely to be free, as he promised; his child-care proposal received funds to last for just two years so far; and New York, a city of more than 8 million people, will have, at most, five city-run grocery stores by the end of his first term. Despite his pledges to tax the rich, he is limited in his ability to do so, and although his recently passed pied-à-terre tax might raise $500 million a year, universal child care would, according to his own campaign, cost $6 billion a year.","The natural habitat of consumer socialism—solidly left-wing American cities—imposes serious limits on its ambitions. Unlike the federal government, cities typically cannot run huge deficits year after year, and must quickly reckon with promises that cannot be paid for. In 2018, New York City officials rolled out a voucher program with an unwieldy name, CityFHEPS, and the laudable goal of decreasing homelessness by subsidizing housing. In 2019, the annual cost of the program was budgeted at $25 million; its projected cost last fiscal year reached $1.7 billion, as the number of recipients and the cost per voucher increased simultaneously. Faced with the city’s daunting budget deficit, Mamdani reversed his campaign pledge to expand CityFHEPS and has instead scrambled for ways to hold costs down.","Many risks lurk in consumer socialism’s promises of cheap goods and services. If New York City or Washington, D.C., rapidly increases subsidies for child care, for instance, without expanding the number of approved providers, the existing ones will charge more to meet excessive demand. Another complication is that the more generous any city benefits are, the more people will move across municipal limits to use them—creating a cost spiral.","The sewer socialists chose their targets carefully. Milwaukee’s mayors had a strong economic rationale for pursuing public ownership of utilities: avoiding the massive, duplicative costs of rival water networks without letting a private monopoly gouge consumers. In contrast, publicly run grocery stores are interventions in a low-margin, highly competitive industry. In his 100-days speech, Mamdani pledged, “At our stores, eggs will be cheaper. Bread will be cheaper. Grocery shopping will no longer be an unsolvable equation.” But the mathematics of running retail outlets might prove more flummoxing than he realizes. Many aspects of life in the Soviet Union have come to be retroactively romanticized; its grocery stores are not among them.","Optimists think—or hope—that Mamdani-style socialists have a greater awareness of economic constraints than they let on. My colleague Derek Thompson recently said that Mamdani may be sporting “the abundance mullet, which is to say, economic populism in the front and abundance in the back.” Abundance is a term that Thompson coined in this magazine to describe policies that expand supply through public and private investment and deregulation—essentially supply-side economics for liberals. The idea is that Mamdani would win popular support by freezing rents—an idea almost unanimously derided by economists—while simultaneously boosting home-building. But the second half of this bargain may never materialize. Although New York’s Rent Guidelines Board has approved a promised freeze for nearly 1 million rent-stabilized apartments, Mamdani’s efforts to permit more home-building have been plodding by comparison. Absent new supply, restrictions on rent increases will limit mobility for those who receive the benefit, and increase costs for those who do not.","Derek Thompson: A simple plan to solve all of America’s problems","Plans are already afoot to scale consumer socialism across America. National Democrats have realized that the high cost of living makes for a powerful midterm-election theme, and some in the party prefer to address it with subsidies and price controls rather than measures that increase personal incomes and economic growth. The Congressional Progressive Caucus recently released its “New Affordability Agenda,” which includes plans to make child care a nationwide entitlement—staffed by day-care workers paid as much as teachers—and to create a new set of housing subsidies for rent and down payments. Progressives also argue that this can be financed without tax hikes on ordinary people, but through targeted taxes on plutocrats and corporations. Enacting any such changes nationwide would require many more votes than the caucus currently has. And the problem with implementing such plans at the local level is that the rich can always decamp to Austin or Miami, as some of California’s billionaires are threatening to do over a ballot measure that would take 5 percent of their wealth.","Perhaps cities like New York will refine a functional version of consumer socialism, in which subsidies are balanced with enormous supply-side expansions in the number of homes and child-care centers, leaving everyone better off. Perhaps capitalism can be appropriately fettered within the confines of a select few cities, inspiring a nonviolent, nationwide socialist revolution. That would be a remarkable triumph for Mamdani’s consumerist ideology, which wears the transgressive label of socialism but is born primarily out of anger over prices (and an innate American antipathy toward taxes). American collectivism may be, as Mamdani promised, warmer than rugged individualism. It will certainly be warmer than Soviet or Maoist collectivism. It could also be just as unworkable. And it will certainly be extraordinarily expensive.","This article appears in the August 2026 print edition with the headline “The ‘Consumer Socialism’ Trap.”","This article was downloaded by calibre from https://www.theatlantic.com/magazine/2026/08/mamdani-affordability-crisis-consumer-socialism/687603/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_wired_2026.07.02","day":58,"title":"15 Design-Forward DIY Tools Worth Upgrading to This Year","source":"Wired","minutes":10,"tag":"Wired","dek":"","note":"2026.07.02","paragraphs":["The tape measure and the drill you inherited from your folks will only take you so far. Fortunately, the tools driving this boom have never been smarter, and better hardware should mean, hopefully, better results. Whether you're building furniture, finishing a deck, or just finally hanging that TV straight, the tools available right now are genuinely more precise than anything a generation ago could have imagined. From a miniaturized soldering station to a kid-safe desktop cardboard router, these are WIRED’s 15 picks worth making room for in your toolbox this year.","And no matter how good your tools are, never forget: measure twice, cut once.","Courtesy of DremelSave to wishlistSave to wishlistDremel","Amazon","Walmart","The Home Depot","This intimidation-free power tool is perfect for people looking to conquer the multitude of household tasks that don’t require a massive hammer drill. Dremel’s neatly balanced 12-volt tool is made for fixing, tightening, and assembling. The detachable laser level and clever electronic stud finder hidden in the front of the handle make it ideal for hanging pictures, shelves, and 4K TVs. Comes with nine drivers and three drill bits, covering most household fixes without the need for a complete toolbox overhaul.","Courtesy of SoldrSave to wishlistSave to wishlistSoldr","Soldr","A compact, open-source soldering workstation that condenses a full electronics bench into a single portable unit. The battery-powered soldering iron offers precise temperature control from 212 to 842 degrees Fahrenheit (100 to 450 Celsius), making it suitable for delicate PCB work as well as more robust tasks. Integrated fume extraction pulls harmful vapors away at the source, while built-in magnification and adjustable LED lighting improve visibility. The clincher is that by being open-source, Soldr positively welcomes hardware tweaks and firmware upgrades, making it as appealing to hobbyists as it is to serious prototypers.","Courtesy of FestoolSave to wishlistSave to wishlistFestool","Festool","It is well known in the trades that if someone’s workshop is full of Festool gear, you can bet they take their craft seriously. And with its new 18 V cordless sander, the brand has made the possibility of achieving perfection just that bit faster. The triangular pad reaches deep into corners and tight edges, while variable speed control allows for fine-tuning between aggressive stock removal and ultrasmooth finishing. Weighing just over 2.4 lbs without the battery, the sander is designed for controlled, one-handed operation, while the integrated LED casts low-angle illumination across your work surface to highlight even the slightest imperfections. Connect it to a vacuum hose to keep the work table clean, or snap on the included dust collection bag and go fully mobile.","Courtesy of HozoSave to wishlistSave to wishlistHozo","Amazon","Hozo","Put the trundle wheel down; this modular, stackable touch screen measuring system combines laser distance, level, and rolling scale modules in one, measuring up to 164 feet of distance at a 1/16-inch accuracy. The system captures measurements in real time and syncs instantly to the app, allowing users to generate floor plans or mark up dimensions without manual note-taking. Compact enough to fit in a pocket yet precise enough for professional use, it’s a seriously smart upgrade for anyone still juggling tape measures and spirit levels.","Courtesy of HusqvarnaSave to wishlistSave to wishlistHusqvarna","Singer","Sewing Machines Plus","While it might be overkill if you’ve not yet mastered the art of sewing buttons back on, this pro-grade smart sewing machine can do seriously impressive things with a needle and thread. It offers more than 680 stitch patterns through an 8-inch color touch screen for intuitive control, alongside automatic thread tension and sensor-based foot adjustments. The extended sewing surface allows for large quilting projects, while the powerful motor ensures consistent stitch quality across thick fabrics. Built-in connectivity and access to the mySewnet Library give you access to a continuously growing collection of embroidery designs, plus the ability to craft and implement your own.","Courtesy of CRKTSave to wishlistSave to wishlistCRKT","CRKT","Designed by noted knife maker Richard Rogers, the Box Key applies his clean, minimalist approach to a tiny everyday cutter. The 1.24-inch drop point blade is made from Sandvik 12C27 steel with a stone-wash finish, which helps disguise scuffs from daily use while improving corrosion resistance. The stainless steel handle with a hole keeps the profile slim enough to attach to a key ring, and at 1 ounce, it adds barely any weight to your daily carry. A smart, indispensable little tool for opening boxes, trimming cord, and other light-duty jobs.","Courtesy of NiwakiSave to wishlistSave to wishlistNiwaki","Niwaki","Japanese-inspired, UK-based Niwaki (translates as “garden tree”) produces seriously desirable and practical tools for home and garden. With the ST-Type Toolbox, however, the brand has created a vintage design that wouldn’t look out of place perched on a girder in the famous “Lunch Atop a Skyscraper” photo. Built from powder-coated steel with a traditional cantilever design, it measures 14.2 inches wide and opens to reveal tiered compartments that keep hand tools organized and visible. The metal dividers in the top trays can be rearranged to hold screws, nails, and bits, or removed entirely to fit even more tools.","Courtesy of Pit ViperSave to wishlistSave to wishlistPit Viper","Pit Viper","Pit Viper may be famous for its right-wing-baiting anarchic approach to eyewear, but we bet you didn’t know it also does a fantastic range of equally irreverent-looking, but highly practical safety glasses. (This model will launch on April 13.) Certified to ANSI Z87+ standards, they have impact-resistant lenses, 100 percent UV protection, antifog coatings, plus adjustable arms and nose pieces for a super-secure fit. Available with standard- or high-contrast polarized lenses, the side shields can be removed when not needed.","Courtesy of GerberSave to wishlistSave to wishlistGerber","Amazon","Gerber","A good value, highly practical camp saw that folds small, but still cuts the mustard. The 12-inch blade is mounted on a four-pivot frame that maximizes usable cutting length and keeps tension consistent through each stroke. Then, when you’re done, it folds flat without disassembly, fully enclosing the blade for safe transport. Weighing 15.3 ounces, it is light enough for any expedition, but still feels reassuringly robust in use. That grippy rubberized textured handle works well in wet conditions, while thankfully, the design accepts standard 12-inch replacement blades.","Courtesy of FlsunSave to wishlistSave to wishlistFlsun","Flsun","This high-speed 3D printer is built for rapid prototyping, and so is aimed at designers who are tired of overnight prints for simple parts. It spits out building material at speeds of up to 1,200 millimeters per second, driven by a lightweight and accurate delta motion system. The enclosed cylindrical build chamber (12.6 x 16.9 inches) improves temperature stability for materials such as ABS and PETG, while auto-leveling and smart calibration should reduce setup time. A direct-drive extruder with an all-metal nozzle capable of reaching 350 Celsius supports a wide range of filaments. Wi-Fi, an onboard camera, and AI-assisted monitoring all help keep prints on track.","Courtesy of CircuitMessSave to wishlistSave to wishlistCircuitMess","CircuitMess","The 1972 NASA Moon Buggy is one of only a handful of “products” WIRED has ever awarded a coveted 10/10 score to. It’s a shame you’ll never be able to get your hands on one, but you can always scratch that interstellar itch with this fantastic build-it-yourself Mars Perseverance Rover electronics kit. Designed for STEM learning, it combines more than 200 parts with coding, robotics, and mechanical assembly into a single project. Users can program movement, sensors, and basic autonomy through an included microcontroller, gaining hands-on experience with real-world engineering concepts. As intricate and detailed as it is, the whole model is remarkably smaller than the family cat.","Courtesy of HotoSave to wishlistSave to wishlistHoto","Amazon","Hoto","Bringing some much-needed sci-fi chic to yard work with this cordless 20-volt blower that pushes 720 cubic feet of air per minute at 120 mph from a lightweight body. The compact 3.7-pound design (without battery) makes it easy to use with one hand, even if you’re coping with trees post-leaf-peeping season. A brushless motor improves efficiency and extends the blower’s lifespan, while stepless speed control allows precise adjustment to give you just enough wind to clear light debris all the way up to a full-force clearing. The lithium-ion battery lasts up to 30 minutes, and it’s removable, so you can buy extra batteries to quickly swap in and keep on blowing.","Courtesy of MilwaukeeSave to wishlistSave to wishlistMilwaukee","Amazon","The Home Depot","Walmart","Stackable with Milwaukee storage systems, this sound system has a classic rock-ready 10-speaker array capable of blasting The Boss to every corner of a construction site. Built tough and powered either by plugging it in or using the standard M18 battery, it has Bluetooth connectivity and an AM-FM radio. It also doubles as a battery and USB charger for smartphones and power tools. A reinforced housing protects it against drops, dust, and moisture.","Courtesy of TinkrSave to wishlistSave to wishlistTinkr","The Home Depot","Tinkr","A compact, battery-powered cutter designed to remove the effort and improve the precision of a host of cutting tasks. The motorized blade uses SK5 high-carbon steel slicers, delivering clean, controlled cuts through everything from cardboard and fabric to leather and even some plastics. Weighing 10.5 ounces, it is easy to guide with one hand, while the 4V rechargeable lithium battery should let you slice for hours on a single charge. A guarded cutting-edge and trigger activation improve control further, as well as keeping your fingers safe.","Courtesy of BeaverBotSave to wishlistSave to wishlistBeaverBot","BeaverBot","This kid-safe router-style cutter is a perfect antidote to the usual screen time. Using a digitally controlled blunt cutting head rather than exposed blades, it lets children (big and small) cut cardboard, card, foam, felt, thin fabrics, and light plastics at either 1,500 rpm for faster cuts or 800 rpm for more controlled work. The standard head can handle materials up to 3 mm thick, but an optional upgrade to a 5 mm “ProCut” head lets you go thicker. The compact 11.8 x 11.8-inch desktop unit comes in pink or green (go pink!) and connects over USB or Wi-Fi to bundled software that can generate cutting templates from simple project designs you upload. The Cutter 2 serves up fun and engaging activities for little ones as young as four.","This article was downloaded by calibre from https://www.wired.com/story/15-diy-tools-worth-upgrading-to-this-year/"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.07.04","day":59,"title":"America is anxious, and awesomely powerful","source":"The Economist","minutes":6,"tag":"Leaders","dek":"Restlessness is what prevents the republic from sinking into stagnation","note":"2026.07.04","paragraphs":["FROM THE start, 250 years ago, America’s founders believed that their republic would shine out as an example to all humanity. But the republic was also an experiment, and they feared that it could soon collapse into disorder or tyranny. Such has been the dance throughout America’s extraordinary history. Slavery and xenophobia, corruption and robber barons, civil war and world war have all jostled the republic even as America rose to become the beacon of the free world.","On July 4th Americans are celebrating their semiquincentennial. All those syllables rebut the founders’ gloom. Far from succumbing to tyranny, America saved the world from tyrants three times over. Glorious disorder created a dynamism that has long sustained America as a superpower. Dominance comes with temptations, but the United States has by and large held out republican virtues as the salvation of people everywhere.","Yet this birthday comes at another anxious moment in America’s story. Virtue is under threat and talk of decline is in the air. Even as citizens celebrate together, public life is scarred by division. America is demolishing the world order that it created after the defeat of fascism in 1945. The restless republic is opening a new chapter, but does that signal retreat, as some Americans worry, or instead herald a renewal?","To understand this moment, and to mark the 250th anniversary, The Economist retraced the footsteps of Alexis de Tocqueville, a French aristocrat whose tour of the country in the early 1830s furnished the material for “Democracy in America”, a trove of enduring insights into the republic. If you listen to our podcast, you will discover that many Americans today echo the founders’ fears.","They worry that the separation of powers is degenerating into a White House-takes-all world. Congress was meant to be the leading branch of government, but it is gripped by a vicious partisanship in which “we” are right and “they” are bad. To pass laws requires give and take, but the parties punish compromise and gerrymandering rewards extreme views. The Supreme Court is adding to the might of the executive. This week, though it struck down one of the president’s schemes, over birthright citizenship, it also expanded his power by ruling that he can sack officials in federal agencies.","A nation of immigrants, the United States has at its best treated the people flocking to its shores as a source of vitality and a validation of the American dream. China has a dream, too, but foreigners are excluded by the unalterable fact that they were not born Chinese. By contrast, people of any race or faith can become American. Their welcome is the promise that what they and their children can accomplish is limited only by their imagination and capacity for hard work.","But the American dream has soured. Bits of the MAGA movement want to shut down legal immigration, not just the illegal sort. This year net migration could be zero. As the share of Americans who call themselves “white” sinks towards 50%, some on the right want to give a special status to “heritage Americans”, whose forebears have been in the country for generations. This is an ugly throwback to the racism that Americans rejected as part of the moral and material progress that best define the republic’s success.","Abroad, America is also retreating from its values. As our essay this week describes, Donald Trump is leading a Wrecking-ball revolution to smash the institutions and alliances that the postwar generation set up to keep the world safe from despotism. He and many Americans on the right and left feel contempt for a global system that they blame—misguidedly, in the view of The Economist—for aiding China, punishing America’s workers and sending its young soldiers to spill their blood in far-off countries.","Accordingly, America is throwing its weight around like any other country chasing wealth and power. Freedom and democracy for foreigners are off the agenda. Trade used to be a system of mutual benefit; it has become a tool for extracting concessions. Shared values once united America and its allies; now allies are seen as dependants to be exploited.","Many people conclude that America is in decline. That strikes this newspaper as a grave misreading. America’s power is immense—and it could be about to grow beyond all recognition. For evidence of the country’s unabated dynamism, look outside its dysfunctional politics.","America’s artificial-intelligence companies have rapidly mobilised hundreds of billions of dollars to finance the pursuit of a technological lead. If, as they predict, AI changes everything, then America and its AI stack may become utterly dominant—for a time, at least. Some of that is bound to rub off on America’s businesses and its formidable armed forces. Its allies, however much they have been antagonised by Mr Trump, would face a bleak choice between submitting to America or siding with authoritarian China.","As America amasses awesome power, the great experiment could go disastrously wrong. Mr Trump has tainted public life with an ugly cynicism that always sees the worst in everyone. Boosted by AI-enhanced agencies, executive power could become overwhelming. The concentration of wealth and political power could foster a predatory elite. Partisanship, fanned by social media, gerrymandering and party primaries dominated by zealots, could become further entrenched. Politicians might prove unable to deal with the economic and social upheaval that lies ahead.","As domestic politics grows dirtier and nastier, America could also become more predatory abroad. Imagine that its abandonment of the project to promote liberty is permanent. Other countries will copy it. Violent, ambitious leaders will feel emboldened to conquer or coerce their neighbours. The world will descend into chaos.","However, as the founders would attest, that dark future is not certain—or even likely. The corollary of America’s dynamism is its capacity for reinvention. Episodes that set the republic back—Pearl Harbour, Sputnik, Watergate—spurred it to recover and charge ahead. Roused, Americans set about making sure that next time they would do better and be better.","One way or another, change is coming to America, because too much today is unsustainable. The social contract, which is financed by borrowing, is fiscally unsustainable. Mr Trump’s generation is biologically unsustainable: his successor will belong to a new, younger group of Americans. The hope must be that voters will decide that the two parties’ sterile mutual contempt has become politically unsustainable, too.","As celebratory fireworks light up cities and towns across America, remember that restlessness is precisely what prevents the republic from sinking into stagnation. All those arguments and fights are a precondition for the creative destruction that precedes the nation’s renewal.","Naturally, the founders would be worried today, just as they were 250 years ago. Yet their revolutionary insight was to build their great experiment on the wisdom of the people. Time and again, that faith has been richly rewarded. ■","For subscribers only: to see how we design each week’s cover, sign up to our weekly Cover Story newsletter.","This article was downloaded by zlibrary from https://www.economist.com//leaders/2026/07/02/america-is-anxious-and-awesomely-powerful"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_new_yorker_2026.07.06","day":60,"title":"Chronicle of a Disaster Foretold","source":"The New Yorker","minutes":6,"tag":"The Talk of the Town","dek":"","note":"2026.07.06","paragraphs":["Maggie Haberman and Jonathan Swan’s “Regime Change” is packed with news about the Trump White House that will stay news.","In 1996, Joan Didion unholstered the X-Acto knife that was her pen and went to work on Bob Woodward. In a register of pitiless irony, she quoted Woodward’s earnest explanations of his journalistic methods—the difference between “background” and “deep background,” his “eight file drawers” of documents for a book on the Supreme Court. She was unimpressed. “These are books in which measurable cerebral activity is virtually absent,” Didion wrote. In the end, she determined that Woodward was engaged in the writing of “political pornography.”","This was unfair, at best a category error. What Didion failed to note was that Woodward was a reporter, not a scholar or a belletrist, and that before he was thirty he, with his Washington Post partner, Carl Bernstein, had unearthed the predations of the Watergate scandal—hardly the work of stenographers in thrall to power. It brought down the Presidency of Richard Nixon. Journalism is a first rough draft of history, as they say, and scholarship, which feeds on journalism and so much more, plays by another clock. Robert A. Caro began the research for his multivolume biography of Lyndon B. Johnson half a century ago.","Maggie Haberman, a reporter of impressive energy, began her career at the New York tabloids and joined the Times in 2015. She has been on the Trump beat since the Donald was a real-estate guy hustling for attention in the columns of Liz Smith and Cindy Adams. As “Confidence Man,” Haberman’s first book about Trump, from 2022, made clear, he is a man of immutable character. “He has had only a handful of moves throughout his entire adult life,” she wrote. The “quick lie,” the “shift of blame,” the “outburst of rage,” the abuse of loyalists, a “raft of old grievances,” a “refusal to be shamed.”","Trump’s political reflexes could have been anticipated. Talking to Playboy, in 1990, he praised the Chinese leaders who ordered troops to slaughter pro-democracy demonstrators in Tiananmen Square. “They were vicious, they were horrible, but they put it down with strength,” he said. “That shows you the power of strength. Our country is right now perceived as weak.” This is the same guy who, thirty years later, asked the chairman of the Joint Chiefs of Staff, Mark Milley, why he couldn’t confront street protesters with force and “shoot them in the legs or something.”","Now, as the country lurches glumly toward its two-hundred-and-fiftieth anniversary, Haberman has collaborated with another Times reporter, Jonathan Swan, on “Regime Change,” a vivid, rigorous, and unavoidably depressing chronicle of the first year of Trump’s second term in the White House. Part of the high-wire act of such books is that the authors and their publishers work at unaccustomed speed to provide the end product with a history-as-it-is-happening varnish. The results are usually as perishable as week-old bananas.","“Regime Change” is exceptional. It transcends its genre. Although some of the material is familiar from the Times and other sources and from Trump’s relentless self-exposure, the book is packed with news that will stay news. One late-breaking example among many: Haberman and Swan provide an astonishing account of Benjamin Netanyahu’s trip, just four months ago, to the White House Situation Room, where the Israeli Prime Minister persuaded Trump to join him in what would be a strategic catastrophe. Netanyahu assured the President that together they would topple the Iranian regime and end its nuclear ambitions before it ever had a chance to close the Strait of Hormuz. Haberman and Swan report that the Secretary of State called Netanyahu’s plan “bullshit.” The C.I.A. director declared it “farcical.” Whatever. “Sounds good to me, the President told the Prime Minister.” Everyone fell into line. Well played, sir!","This is reporting of consequence, and it puts to rest the knowing online critique of these beat reporters that to get their scoops they engage in “bothsidesism” or dampen their coverage in exchange for access. “Regime Change” is particularly strong on the Administration’s colossal financial corruption, its heedless destruction of invaluable agencies such as U.S.A.I.D., and the sordid and unhinged nature of Trump and the culture over which he presides. Haberman and Swan contend that Trump ran in 2024 for one reason above all: “This was about staying out of prison.” After facing multiple indictments, impeachments, and criminal convictions, Trump returned to the White House with retribution on his mind: “I was the hunted, and now I’m the hunter.”","The atmosphere in Trump’s White House is reminiscent of the Kremlin in Armando Iannucci’s 2017 movie, “The Death of Stalin.” The autocrat delights in humiliating so many people, not least tech billionaires, including Jeff Bezos and Mark Zuckerberg, who once opposed him. The description of Trump’s White House is of a decadent court and a king addicted to vengeance and flattery. Trump employs one aide, a young woman named Natalie Harp, who follows him around all day, handing him glowing notices from the right-wing press and occasionally sending him adoring letters (“You are all that matters to me”). Even this brings him no joy. When Elon Musk, who raised some three hundred million dollars for Trump’s campaign, blasts the President over his budget bill, Trump says, “They always leave me. They always do this. This is why I can’t have friends.” He instructs Harp to bring him his phone. He calls Musk twice. Both times, he gets voice mail.","We have always known that Trump is a narcissist. Haberman and Swan make clear the dimensions of his malady. During Trump’s hush-money trial in New York, he heard that a mentally ill man, “consumed by conspiracy theories,” had set himself on fire in a park nearby. “Do you think he did it for me?” Trump asked an aide. “Let’s tell people that he did it for me.” In an interview with the authors, Trump says that he was pleased to learn from an unnamed historian that, considering the reach of his arsenal and armed forces, he is far more powerful than Genghis Khan, Alexander the Great, or Joseph Stalin. The historian in question, the authors discover, is Gary Player’s caddy. Trump is a damaged man unleashing daily damage on the country. He spends his nights alone, rage-posting on Truth Social. His wastebasket overflows with “empty potato chip bags, Starburst wrappers, and ice cream cartons.”","As July 4th approaches, the water in the Reflecting Pool—refurbished by Trump’s “pool guy” with a no-bid contract—turns green with algae. It is a dismal time in the capital. Haberman and Swan have done admirable work, but one reads the final pages of “Regime Change” hoping that their next book is the story of transition, from the era of Trump to one of democratic renewal. That chapter cannot come soon enough. ♦"],"vocab":{},"grammar":{},"imported":true},{"id":"bee_economist_2026.07.11","day":61,"title":"The man who would change Russia","source":"The Economist","minutes":6,"tag":"Leaders","dek":"A leading oligarch speaks out, warning of the looming disaster facing his country","note":"2026.07.11","paragraphs":["WHEN ENOUGH Russians feel the endless fighting in Ukraine is futile and that they are paying the price, their president, Vladimir Putin, will be forced to do something spectacular to break the deadlock. This is why it pays to watch Russia for warnings of fatigue or discontent. Our cover this week features the most stunning such warning so far.","It comes from Andrey Melnichenko, the world’s fertiliser king and Russia’s biggest industrialist. Mr Melnichenko is hardly a member of the anti-Putin opposition. Far from criticising the invasion, he is an insider whose factories have supported the war economy. Nor is he being high-minded. Having run his companies outside Russia, Mr Melnichenko returned in 2023 as the scope for global business shrank. Like most oligarchs, he has lived by Mr Putin’s rules—make money, but keep your nose out of politics. He is talking now because he and his fellow tycoons can no longer afford to ignore the rot in a country they watched descend into tyranny.","Mr Melnichenko issued his warning over nearly 60 hours of interviews with The Economist and more guardedly in an essay we are publishing online. It is the first time an oligarch in Russia has spoken out at such length. We are giving him space not because we agree with all his views or because he is a champion of democracy and human rights. Instead, he is a pragmatist who wants his firms to thrive. That is why his call could resonate in a country where wars gone wrong, including the defeat to Japan in 1905, have led to campaigns by industrialists for political change.","Mr Melnichenko’s words go far beyond the war, to the bleak outlook for Russia and its neighbours. He warns the West not to wish for Russia to descend into chaos, brutal autarky or a sullen, dangerous dependency. Although he does not say that Mr Putin must be removed from power, the change he wants would amount to an end to one-man rule.","What makes Mr Melnichenko’s intervention so striking is that the Ukraine war has come home to Russia. After Ukrainian attacks on its energy industry, the country is witnessing queues for fuel and fistfights at filling stations. The annexation of Crimea in 2014 boosted Mr Putin’s popularity; today the peninsula is being isolated by Ukrainian drone strikes. Forced military enlistment is feeding resentment. Influencers’ complaints about the war are going viral on social media.","This reality belies Mr Putin’s repeated promises that the special military operation is on track and a breakthrough is at hand. Although the Russian economy is not about to collapse and people are not about to rise up, Russians increasingly feel that their country has reached a dead end.","Mr Putin may well try to reassert his authority by escalating the war and repressing people at home. Some Western intelligence services have recently reported that Russia is about to intensify its confrontation with NATO. At his darkest, Mr Melnichenko fears the use of a tactical nuclear weapon in an attempt to terrorise Ukraine’s European backers—though Western analysts still discount that.","Mr Melnichenko argues that escalation would not lead to a lasting peace between
